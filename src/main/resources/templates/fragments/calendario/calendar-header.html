<div th:fragment="header" class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-6">
    <div class="flex flex-wrap justify-between items-center gap-4">
        <!-- Navegación -->
        <div class="flex items-center gap-4">
            <button id="btnPrev" class="p-2 hover:bg-gray-100 rounded-full transition-colors">
                <i class="fas fa-chevron-left text-gob-guinda"></i>
            </button>
            <h2 id="currentPeriod" class="text-2xl font-bold text-gob-guinda min-w-[200px] text-center">---</h2>
            <button id="btnNext" class="p-2 hover:bg-gray-100 rounded-full transition-colors">
                <i class="fas fa-chevron-right text-gob-guinda"></i>
            </button>
        </div>
        
        <!-- Selector de vistas -->
        <div class="flex bg-gray-100 p-1 rounded-lg">
            <button data-view="day" class="view-btn px-6 py-2 text-sm font-semibold rounded-md transition-all">Día</button>
            <button data-view="week" class="view-btn px-6 py-2 text-sm font-semibold rounded-md transition-all">Semana</button>
            <button data-view="month" class="view-btn px-6 py-2 text-sm font-semibold rounded-md bg-white shadow-sm">Mes</button>
        </div>
    </div>
    
    <!-- Filtro por Tipo -->
    <div class="mt-4 pt-4 border-t border-gray-100">
        <div class="flex flex-wrap gap-4 items-end">
            <div class="flex-1 min-w-[200px] max-w-[300px]">
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Tipo de Evento</label>
                <select id="filterTipo" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-gob-guinda focus:border-transparent">
                    <option value="todos">Todos los eventos</option>
                    <option value="audiencia">Audiencias</option>
                    <option value="termino">Términos</option>
                    <option value="recordatorio">Recordatorios</option>
                </select>
            </div>
            
            <!-- Botón aplicar filtros -->
            <div class="min-w-[100px]">
                <button id="btnApplyFilters" class="w-full bg-gob-guinda text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-gob-guindaDark transition-colors">
                    <i class="fas fa-filter mr-2"></i>Filtrar
                </button>
            </div>
            
            <!-- Botón limpiar filtros -->
            <div class="min-w-[100px]">
                <button id="btnClearFilters" class="w-full bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-gray-300 transition-colors">
                    <i class="fas fa-times mr-2"></i>Limpiar
                </button>
            </div>
        </div>
    </div>
</div>
