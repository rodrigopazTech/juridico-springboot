<div th:fragment="header"
     id="calendarToolbar"
     class="calendar-toolbar bg-white rounded-xl shadow-sm border border-gray-200 mb-4"
     th:attr="data-user-role=${userRole},
              data-current-user-name=${usuarioGlobal != null ? usuarioGlobal.nombreCompleto : ''},
              data-current-gerencia-name=${usuarioGlobal != null && usuarioGlobal.gerencia != null ? usuarioGlobal.gerencia.nombre : ''}">
    <div class="calendar-toolbar-main">
        <div class="calendar-period-control" aria-label="Navegacion del calendario">
            <button id="btnPrev" class="calendar-icon-button" aria-label="Periodo anterior">
                <i class="fas fa-chevron-left"></i>
            </button>
            <div>
                <p class="calendar-kicker">Calendario juridico</p>
                <h2 id="currentPeriod" class="calendar-period-title">---</h2>
            </div>
            <button id="btnNext" class="calendar-icon-button" aria-label="Periodo siguiente">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>

        <div class="calendar-view-switch" aria-label="Cambiar vista">
            <button data-view="day" class="view-btn">Dia</button>
            <button data-view="week" class="view-btn">Semana</button>
            <button data-view="month" class="view-btn active">Mes</button>
        </div>
    </div>

    <div class="calendar-control-line" aria-live="polite">
        <div class="calendar-scope-inline">
            <span class="calendar-scope-icon"><i class="fas fa-users-viewfinder"></i></span>
            <span class="calendar-scope-prefix">Viendo:</span>
            <span id="calendarScopeSummary" class="calendar-scope-summary">Alcance disponible</span>
            <span id="calendarEventCount" class="calendar-count-pill">0 eventos</span>
        </div>

        <div class="calendar-inline-filters">
            <div class="calendar-filter-field">
                <label>Tipo</label>
            <select id="filterTipo">
                <option th:each="tipo : ${listaTiposEvento}"
                        th:value="${tipo[0]}"
                        th:text="${tipo[1]}"></option>
            </select>
            </div>

            <div th:if="${puedeVerFiltroGerencia}" class="calendar-filter-field calendar-filter-wide">
                <label>Gerencia</label>
                <select id="filterGerencia"
                        th:disabled="${userRole == 'GERENTE'}">
                    <option value="todos" th:if="${userRole != 'GERENTE'}">Todas las gerencias</option>
                    <option th:each="ger : ${listaGerencias}"
                            th:value="${ger.id}"
                            th:text="${ger.nombre}"
                            th:selected="${userRole == 'GERENTE' && ger.id == usuarioGlobal.gerencia?.id}"></option>
                </select>
            </div>

            <div th:if="${puedeVerFiltroUsuario}" class="calendar-filter-field calendar-filter-wide">
                <label>Usuario</label>
                <select id="filterUsuario">
                    <option value="todos" th:text="${puedeVerFiltroGerencia} ? 'Seleccione gerencia' : 'Todos los usuarios'">Todos los usuarios</option>
                    <option th:each="usu : ${listaUsuarios}"
                            th:value="${usu.id}"
                            th:text="${usu.nombreCompleto} + ' (' + ${usu.rol} + ')'"></option>
                </select>
            </div>

            <div th:if="${puedeVerFiltroMateria}" class="calendar-filter-field">
                <label>Materia</label>
                <select id="filterMateria">
                    <option value="todos">Todas las materias</option>
                    <option th:each="materia : ${listaMaterias}"
                            th:value="${materia.id}"
                            th:text="${materia.nombre}"></option>
                </select>
            </div>

            <label class="calendar-own-toggle">
                <input type="checkbox" id="chkMisAsuntos">
                <span>Mis asuntos</span>
            </label>

            <button id="btnClearFilters" class="calendar-secondary-button calendar-clear-button hidden" type="button">
                <i class="fas fa-rotate-left"></i> Limpiar
            </button>
        </div>

        <div th:replace="~{fragments/calendario/outlook-status :: outlookStatus}"></div>
    </div>
</div>
