<div th:fragment="detailModal" id="modalEventDetail" class="fixed inset-0 z-50 hidden overflow-y-auto bg-black bg-opacity-50 transition-opacity">
    <div class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all scale-95 opacity-0 duration-300" id="modalContent">
            <div id="modalHeader" class="p-4 flex justify-between items-center text-white bg-gob-guinda">
                <h3 id="modalTitle" class="text-xl font-bold">Detalle del Evento</h3>
                <button onclick="window.calendarioModule.closeModal()" class="text-white hover:bg-black/10 rounded-full p-2">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div class="flex items-start gap-3">
                    <i class="fas fa-clock mt-1 text-gray-400"></i>
                    <div>
                        <p id="modalDate" class="font-bold text-gray-800"></p>
                        <p id="modalTime" class="text-gray-600 text-sm"></p>
                    </div>
                </div>
                <div class="flex items-start gap-3">
                    <i class="fas fa-info-circle mt-1 text-gray-400"></i>
                    <div>
                        <p class="text-xs uppercase text-gray-400 font-bold">Tipo</p>
                        <span id="modalType" class="px-2 py-1 rounded text-xs font-bold uppercase"></span>
                    </div>
                </div>
                <div id="modalExtraInfo" class="space-y-3 pt-2 border-t border-gray-100">
                    </div>
            </div>
        </div>
    </div>
</div>
