<div th:fragment="modal" id="modal-subir-acuse" class="modal fixed inset-0 bg-gray-900/50 backdrop-blur-sm z-50 overflow-y-auto hidden">
    <div class="flex items-center justify-center min-h-screen p-4 w-full">
        <div class="relative bg-white rounded-lg shadow-xl w-full max-w-lg animate-fade-in-down">
            
            <div class="flex justify-between items-center p-5 border-b border-gray-200 bg-gob-guinda rounded-t-lg">
                <h3 class="text-xl font-bold text-white">
                    <i class="fas fa-check-circle mr-2"></i> Concluir Término
                </h3>
                <button onclick="document.getElementById('modal-subir-acuse').classList.add('hidden')" class="text-white hover:text-gray-200 transition-colors">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <form th:action="@{/terminos/subir-acuse}" method="post" enctype="multipart/form-data" class="p-6">
                <input type="hidden" name="id" id="input-acuse-id">
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Archivo de Acuse (PDF/Imagen) *</label>
                        <input type="file" name="archivoAcuse" required
                               class="block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 focus:outline-none p-2">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Observaciones / Comentarios *</label>
                        <textarea name="observaciones" rows="3" required
                                  placeholder="Escribe detalles importantes sobre la presentación..."
                                  class="w-full p-2 border border-gray-300 rounded-md focus:ring-gob-oro focus:border-gob-oro text-sm"></textarea>
                    </div>

                    <div class="bg-yellow-50 p-3 rounded text-xs text-yellow-800 border border-yellow-200">
                        <i class="fas fa-info-circle mr-1"></i> Al subir este acuse, el término pasará a estado <strong>CONCLUIDO</strong> y las observaciones se reflejarán en la Agenda General.
                    </div>
                </div>

                <div class="mt-6 flex justify-end gap-3">
                    <button type="button" onclick="document.getElementById('modal-subir-acuse').classList.add('hidden')" 
                            class="px-4 py-2 border border-gray-300 text-gray-700 rounded hover:bg-gray-50">
                        Cancelar
                    </button>
                    <button type="submit" class="px-4 py-2 bg-gob-guinda text-white rounded hover:bg-gob-guinda-claro shadow-md transition-colors">
                        Subir y Concluir
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
