<div th:fragment="mini-calendar" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 sticky top-24">
    <!-- Header: Mes y Navegación -->
    <div class="flex justify-between items-center mb-6">
        <h3 id="miniCalendarMonth" class="text-base font-bold text-gob-guinda font-headings">
            <!-- Cargado por JS -->
            Octubre 2024
        </h3>
        <div class="flex gap-1">
            <button id="miniPrev" class="p-1.5 hover:bg-gray-50 rounded-lg text-gob-guinda transition-colors">
                <i class="fas fa-chevron-left text-xs"></i>
            </button>
            <button id="miniNext" class="p-1.5 hover:bg-gray-100 rounded-lg text-gob-guinda transition-colors">
                <i class="fas fa-chevron-right text-xs"></i>
            </button>
        </div>
    </div>

    <!-- Días de la semana -->
    <div class="grid grid-cols-7 mb-2">
        <div th:each="dia : ${#strings.arraySplit('D,L,M,M,J,V,S', ',')}"
            class="text-center text-[10px] font-bold text-gray-400 uppercase tracking-widest py-2" th:text="${dia}">
        </div>
    </div>

    <!-- Grid de días -->
    <div id="miniCalendarGrid" class="grid grid-cols-7 gap-y-1 text-center">
        <!-- Generado por JS -->
    </div>

    <!-- Leyenda rápida (Opcional) -->
    <div class="mt-6 pt-4 border-t border-gray-50 flex items-center justify-center gap-4">
        <div class="flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-gob-guinda"></span>
            <span class="text-[10px] font-medium text-gray-500 uppercase">Términos</span>
        </div>
        <div class="flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-gob-oro"></span>
            <span class="text-[10px] font-medium text-gray-400 uppercase">Hoy</span>
        </div>
    </div>
</div>
