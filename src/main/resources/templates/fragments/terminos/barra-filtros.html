<div th:fragment="filtros" class="pt-3 border-t border-gray-100">
    <form id="form-filtros" th:action="@{/terminos}" method="get"
        class="flex flex-col lg:flex-row gap-2 items-end lg:items-center">
        <input type="hidden" name="keyword" th:value="${keyword}">

        <div class="flex justify-between items-center mb-3">
            <h3 class="text-xs font-bold text-gob-oro uppercase">
                <i class="fas fa-filter mr-1"></i> Filtros de Términos
            </h3>
            
            <div class="flex gap-2">
                <a th:href="@{/terminos}" class="text-xs text-gray-400 hover:text-gray-600 underline flex items-center">Limpiar</a>
                <button type="submit" class="bg-gob-guinda text-white text-xs px-3 py-1 rounded hover:bg-gob-guinda-claro font-bold transition-colors">
                    Aplicar Filtros
                </button>
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-2 w-full">
            
            <select name="periodo" class="w-full border border-gray-300 rounded p-2 text-sm focus:border-gob-guinda outline-none bg-white text-gray-700 font-medium">
                <option value="">Periodo: Todos</option>
                <option value="HOY" th:selected="${paramPeriodo == 'HOY'}" class="text-red-600 font-bold">Hoy</option>
                <option value="MANANA" th:selected="${paramPeriodo == 'MANANA'}" class="text-orange-600">Mañana</option>
                <option value="SEMANA" th:selected="${paramPeriodo == 'SEMANA'}">Próx. 7 Días</option>
                <option value="MES" th:selected="${paramPeriodo == 'MES'}">Este Mes</option>
            </select>
            
            <select name="estatus"
                class="w-full border border-gray-300 rounded p-2 text-sm focus:border-gob-guinda outline-none bg-white text-gray-700">
                <option value="">Estatus: Todos</option>
                <option th:each="st : ${listaEstatus}" th:value="${st}" th:text="${st}"
                    th:selected="${paramEstatus == st}"></option>
            </select>

            <select name="prioridadId"
                class="w-full border border-gray-300 rounded p-2 text-sm focus:border-gob-guinda outline-none bg-white text-gray-700">
                <option value="">Prioridad: Todas</option>
                <option th:each="p : ${listaPrioridades}" th:value="${p.id}" th:text="${p.nombre}"
                    th:selected="${paramPrioridadId != null and paramPrioridadId.toString() == p.id.toString()}">
                </option>
            </select>

            <select sec:authorize="hasAnyAuthority('DIRECCION', 'SUBDIRECCION', 'GERENTE', 'JEFE_DEPTO')"
                name="abogadoId"
                class="w-full border border-gray-300 rounded p-2 text-sm focus:border-gob-guinda outline-none bg-white text-gray-700">
                <option value="">Abogado: Todos</option>
                <option th:each="a : ${listaAbogados}" th:value="${a.id}" th:text="${a.nombreCompleto}"
                    th:selected="${paramAbogadoId != null and paramAbogadoId.toString() == a.id.toString()}"></option>
            </select>

            <select sec:authorize="hasAnyAuthority('DIRECCION', 'SUBDIRECCION', 'GERENTE', 'JEFE_DEPTO')"
                name="materiaId"
                class="w-full border border-gray-300 rounded p-2 text-sm focus:border-gob-guinda outline-none bg-white text-gray-700">
                <option value="">Materia: Todas</option>
                <option th:each="m : ${listaMaterias}" th:value="${m.id}" th:text="${m.nombre}"
                    th:selected="${paramMateriaId != null and paramMateriaId.toString() == m.id.toString()}"></option>
            </select>

            <select sec:authorize="hasAnyAuthority('DIRECCION', 'SUBDIRECCION')" name="gerenciaId"
                class="w-full border border-gray-300 rounded p-2 text-sm focus:border-gob-guinda outline-none bg-white text-gray-700">
                <option value="">Gerencia: Todas</option>
                <option th:each="g : ${listaGerencias}" th:value="${g.id}" th:text="${g.nombre}"
                    th:selected="${paramGerenciaId != null and paramGerenciaId.toString() == g.id.toString()}"></option>
            </select>
        </div>
    </form>
</div>
