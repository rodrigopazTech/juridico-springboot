<div th:fragment="filtros" class="space-y-4">
    <form id="form-filtros" th:action="@{/terminos}" method="get" class="space-y-4">
        <input type="hidden" name="keyword" th:value="${keyword}">
        <!-- Preservar contexto de fecha (ROD-186) -->
        <input type="hidden" name="mes" th:value="${mesActual}">
        <input type="hidden" name="anio" th:value="${anioActual}">

        <!-- Encabezado de Filtros en Sidebar -->
        <div class="flex justify-between items-center pb-3 border-b border-white/10">
            <h3 class="text-[11px] font-bold text-gob-oro uppercase tracking-widest flex items-center">
                FILTROS DE TÉRMINOS
            </h3>
            <button type="button" id="btn-limpiar-filtros-ter"
                class="px-3 py-1.5 rounded-xl bg-white/10 hover:bg-gob-oro hover:text-gob-guinda text-[9px] font-bold text-gob-oro transition-all border border-white/20 shadow-sm">
                LIMPIAR FILTROS
            </button>
        </div>

        <div class="space-y-3">
            <!-- Periodo -->
            <div class="space-y-1">
                <label class="text-[9px] font-bold text-white/50 uppercase ml-1">Periodo</label>
                <select name="periodo"
                    class="w-full bg-white/10 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none focus:bg-white/20 transition-all font-medium appearance-none cursor-pointer">
                    <option value="" class="text-gray-800">Todos los periodos</option>
                    <option value="HOY" th:selected="${paramPeriodo == 'HOY'}" class="text-gray-800">Hoy</option>
                    <option value="MANANA" th:selected="${paramPeriodo == 'MANANA'}" class="text-gray-800">Mañana
                    </option>
                    <option value="SEMANA" th:selected="${paramPeriodo == 'SEMANA'}" class="text-gray-800">Próx. 7 Días
                    </option>
                    <option value="MES" th:selected="${paramPeriodo == 'MES'}" class="text-gray-800">Este Mes</option>
                </select>
            </div>

            <!-- Estatus -->
            <div class="space-y-1">
                <label class="text-[9px] font-bold text-white/50 uppercase ml-1">ESTATUS</label>
                <select name="estatus"
                    class="w-full bg-white/10 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none focus:bg-white/20 transition-all font-medium appearance-none cursor-pointer">
                    <option value="" class="text-gray-800">Todos los estatus</option>
                    <option th:each="st : ${listaEstatus}" th:value="${st}" th:text="${st}"
                        th:selected="${paramEstatus == st}" class="text-gray-800"></option>
                </select>
            </div>

            <!-- Prioridad -->
            <div class="space-y-1">
                <label class="text-[9px] font-bold text-white/50 uppercase ml-1">Prioridad</label>
                <select name="prioridadId"
                    class="w-full bg-white/10 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none focus:bg-white/20 transition-all font-medium appearance-none cursor-pointer">
                    <option value="" class="text-gray-800">Todas las prioridades</option>
                    <option th:each="p : ${listaPrioridades}" th:value="${p.id}" th:text="${p.nombre}"
                        th:selected="${paramPrioridadId != null and paramPrioridadId.toString() == p.id.toString()}"
                        class="text-gray-800">
                    </option>
                </select>
            </div>

            <!-- Abogado (Condicional) -->
            <div sec:authorize="hasAnyAuthority('ADMIN', 'DIRECCION', 'SUBDIRECCION', 'GERENTE', 'JEFE_DEPTO')"
                class="space-y-1">
                <label class="text-[9px] font-bold text-white/50 uppercase ml-1">Abogado</label>
                <select name="abogadoId"
                    class="w-full bg-white/10 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none focus:bg-white/20 transition-all font-medium appearance-none cursor-pointer">
                    <option value="" class="text-gray-800">Todos los abogados</option>
                    <option th:each="a : ${listaAbogados}" th:value="${a.id}" th:text="${a.nombreCompleto}"
                        th:selected="${paramAbogadoId != null and paramAbogadoId.toString() == a.id.toString()}"
                        class="text-gray-800"></option>
                </select>
            </div>

            <!-- Materia (Condicional) -->
            <div sec:authorize="hasAnyAuthority('ADMIN', 'DIRECCION', 'SUBDIRECCION', 'GERENTE', 'JEFE_DEPTO')"
                class="space-y-1">
                <label class="text-[9px] font-bold text-white/50 uppercase ml-1">Materia</label>
                <select name="materiaId"
                    class="w-full bg-white/10 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none focus:bg-white/20 transition-all font-medium appearance-none cursor-pointer">
                    <option value="" class="text-gray-800">Todas las materias</option>
                    <option th:each="m : ${listaMaterias}" th:value="${m.id}" th:text="${m.nombre}"
                        th:selected="${paramMateriaId != null and paramMateriaId.toString() == m.id.toString()}"
                        class="text-gray-800"></option>
                </select>
            </div>

            <!-- Gerencia (Condicional) -->
            <div sec:authorize="hasAnyAuthority('ADMIN', 'DIRECCION', 'SUBDIRECCION')" class="space-y-1">
                <label class="text-[9px] font-bold text-white/50 uppercase ml-1">Gerencia</label>
                <select name="gerenciaId"
                    class="w-full bg-white/10 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none focus:bg-white/20 transition-all font-medium appearance-none cursor-pointer">
                    <option value="" class="text-gray-800">Todas las gerencias</option>
                    <option th:each="g : ${listaGerencias}" th:value="${g.id}" th:text="${g.nombre}"
                        th:selected="${paramGerenciaId != null and paramGerenciaId.toString() == g.id.toString()}"
                        class="text-gray-800"></option>
                </select>
            </div>
        </div>
    </form>
</div>
