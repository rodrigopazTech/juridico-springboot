<div id="modal-concluir-final" class="modal fixed inset-0 bg-gray-900/50 backdrop-blur-sm z-50 hidden">
    <div class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-lg">
            <div class="p-5 border-b bg-green-600 rounded-t-lg text-white font-bold">
                <i class="fas fa-check-double mr-2"></i> Finalizar Trámite
            </div>
            <form th:action="@{/terminos/concluir}" method="post" class="p-6">
                <input type="hidden" name="id" id="input-concluir-id">
                <label class="block text-sm font-medium text-gray-700 mb-2">Observaciones Finales *</label>
                <textarea name="observaciones" rows="3" required class="w-full p-2 border rounded-md mb-4"></textarea>
                <div class="flex justify-end gap-3">
                    <button type="button" onclick="this.closest('.modal').classList.add('hidden')" class="px-4 py-2 border rounded">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded">Concluir y Archivar</button>
                </div>
            </form>
        </div>
    </div>
</div>
