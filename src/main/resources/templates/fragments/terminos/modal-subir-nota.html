<div th:fragment="modal" id="modal-subir-nota" class="modal fixed inset-0 bg-gray-900/50 backdrop-blur-sm z-50 overflow-y-auto hidden items-center justify-center">
  <div class="flex items-center justify-center min-h-screen p-4 w-full">
    <div class="relative bg-white rounded-xl shadow-xl w-full max-w-lg">
      <div class="flex justify-between items-center p-5 border-b bg-gob-guinda rounded-t-xl">
        <h3 class="text-xl font-bold text-white"><i class="fas fa-file-circle-exclamation mr-2"></i>Subir Nota Informativa</h3>
        <button type="button" onclick="cerrarModal('modal-subir-nota')" class="text-white"><i class="fas fa-times text-xl"></i></button>
      </div>
      <form th:action="@{/terminos/subir-nota-informativa}" method="post" enctype="multipart/form-data" class="p-6">
        <input type="hidden" name="id" id="input-nota-id">
        <div class="rounded-lg border border-amber-200 bg-amber-50 p-4 text-sm text-amber-950 mb-4"><strong>¿Cuándo usarla?</strong> Adjunta una Nota Informativa cuando el término no se presentó o ocurrió una situación que debe justificarse. Esta nota sustituye al Acuse y el término pasará a <strong>Presentado</strong>.</div>
        <label class="block text-sm font-bold text-gray-700">Nota Informativa (PDF/imagen) *<input type="file" name="archivoNota" id="input-nota-file" required accept=".pdf,image/*" class="mt-1 block w-full text-sm border border-gray-300 rounded-lg p-2 bg-gray-50"></label>
        <label class="block text-sm font-bold text-gray-700 mt-4">Observaciones<textarea name="observaciones" rows="3" class="mt-1 block w-full rounded-lg border-gray-300" placeholder="Describe brevemente la situación"></textarea></label>
        <div class="mt-6 flex justify-end gap-3"><button type="button" onclick="cerrarModal('modal-subir-nota')" class="px-4 py-2 border rounded-lg">Cancelar</button><button class="px-4 py-2 bg-gob-guinda text-white font-bold rounded-lg">Subir Nota Informativa</button></div>
      </form>
    </div>
  </div>
</div>
