<div th:fragment="modal" id="modal-nuevo-termino" class="fixed inset-0 z-50 hidden" aria-labelledby="modal-titulo"
    role="dialog" aria-modal="true">
    <div class="fixed inset-0 bg-gray-900 bg-opacity-60 backdrop-blur-sm transition-opacity"></div>

    <div class="fixed inset-0 z-10 overflow-y-auto">
        <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
            <div
                class="relative transform overflow-hidden rounded-xl bg-white text-left shadow-2xl transition-all sm:my-8 sm:w-full sm:max-w-2xl border border-gray-200">

                <div
                    class="flex justify-between items-center px-6 py-4 border-b border-gob-guinda bg-gob-guinda text-white rounded-t-xl shadow-sm">
                    <h3 class="text-lg font-bold flex items-center gap-2 font-headings" id="modal-titulo">
                        <i class="fas fa-plus-circle"></i> Nuevo Término
                    </h3>
                    <button type="button"
                        onclick="cerrarModal('modal-nuevo-termino')"
                        class="text-white/80 hover:text-white transition-colors p-1.5 rounded-full hover:bg-white/10 focus:outline-none">
                        <span class="sr-only">Cerrar</span>
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>

                <form th:action="@{/terminos/guardar}" method="post" class="p-6 space-y-5 bg-gray-50/50">
                    <input type="hidden" name="id" id="input-termino-id">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Expediente *</label>
                        <div class="relative">
                            <div
                                class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                <i class="fas fa-folder-open"></i>
                            </div>
                            <select name="expedienteId" id="select-expediente-termino" required
                                onchange="vincularAbogadoTermino()"
                                class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gob-oro focus:border-gob-oro sm:text-sm bg-white shadow-sm transition-all">
                                <option value="" disabled selected>Seleccione un expediente...</option>
                                <option th:each="e : ${expedientesList}" th:value="${e.id}"
                                    th:text="${e.numero + ' - ' + (e.materia != null ? e.materia.nombre : '')}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">Actuación / Asunto *</label>
                            <input type="text" name="asunto" id="input-asunto" required
                                placeholder="Ej. Contestación de demanda"
                                class="block w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-gob-oro focus:border-gob-oro sm:text-sm shadow-sm transition-all">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">Fecha de Vencimiento *</label>
                            <input type="date" name="fechaVencimiento" id="input-vencimiento" required
                                class="block w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-gob-oro focus:border-gob-oro sm:text-sm shadow-sm transition-all">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">Prioridad</label>
                            <select name="prioridad.id" id="select-prioridad"
                                class="block w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-gob-oro focus:border-gob-oro sm:text-sm shadow-sm">
                                <option th:each="p : ${listaPrioridades}" th:value="${p.id}" th:text="${p.nombre}">
                                </option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">Abogado Responsable *</label>
                            <div class="relative">
                                <div
                                    class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                    <i class="fas fa-user-tie"></i>
                                </div>
                                <select name="abogadoId" id="select-abogado-termino" required
                                    class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gob-oro focus:border-gob-oro sm:text-sm bg-gray-50 shadow-sm transition-all cursor-not-allowed"
                                    readonly>
                                    <option value="">Seleccione expediente primero...</option>
                                </select>
                            </div>
                            <p class="mt-1 text-xs text-gray-500">
                                <i class="fas fa-lock text-xs"></i> Vinculado automáticamente al expediente.
                            </p>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Notas / Observaciones</label>
                        <textarea name="observaciones" id="input-observaciones-termino" rows="3"
                            class="block w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-gob-oro focus:border-gob-oro sm:text-sm shadow-sm transition-all resize-none"
                            placeholder="Añada notas o comentarios internos sobre esta actuación..."></textarea>
                    </div>

                    <div
                        class="mt-8 flex flex-col-reverse sm:flex-row sm:justify-end gap-3 pt-4 border-t border-gray-200">
                        <button type="button"
                            onclick="cerrarModal('modal-nuevo-termino')"
                            class="w-full sm:w-auto inline-flex justify-center items-center px-4 py-2.5 border border-gray-300 shadow-sm text-sm font-bold rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none transition-colors">
                            Cancelar
                        </button>
                        <button type="submit"
                            class="w-full sm:w-auto inline-flex justify-center items-center px-4 py-2.5 border border-transparent shadow-sm text-sm font-bold rounded-md text-white bg-gob-guinda hover:bg-gob-guindaDark focus:outline-none transition-colors">
                            <i class="fas fa-save mr-2"></i> Guardar Término
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>
</div>
