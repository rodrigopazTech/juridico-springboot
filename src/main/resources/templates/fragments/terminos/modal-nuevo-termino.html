<div th:fragment="modal" id="modal-nuevo-termino" class="fixed inset-0 z-50 hidden" aria-labelledby="modal-titulo" role="dialog" aria-modal="true">
    <div class="fixed inset-0 bg-gray-900 bg-opacity-60 backdrop-blur-sm transition-opacity"></div>

    <div class="fixed inset-0 z-10 overflow-y-auto">
        <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
            <div class="relative transform overflow-hidden rounded-xl bg-white text-left shadow-2xl transition-all sm:my-8 sm:w-full sm:max-w-2xl border border-gray-200">
                
                <div class="flex justify-between items-center px-6 py-4 border-b border-gob-guinda bg-gob-guinda text-white rounded-t-xl shadow-sm">
                    <h3 class="text-lg font-bold flex items-center gap-2 font-headings" id="modal-titulo">
                        <i class="fas fa-plus-circle"></i> Nuevo Término
                    </h3>
                    <button type="button" onclick="document.getElementById('modal-nuevo-termino').classList.add('hidden')" 
                            class="text-white/80 hover:text-white transition-colors p-1.5 rounded-full hover:bg-white/10 focus:outline-none">
                        <span class="sr-only">Cerrar</span>
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>

                <form id="form-termino" th:action="@{/terminos/guardar}" method="post" class="p-6">
                    <input type="hidden" name="id" id="input-termino-id">
                    
                    <input type="hidden" name="diasAlerta" value="3">

                    <div class="space-y-6">
                        
                        <div>
                            <label class="block text-sm font-bold text-gob-gris mb-1">Vincular a Expediente *</label>
                            <div class="relative">
                                <select name="expedienteId" id="input-expediente" required
                                        class="block w-full pl-3 pr-10 py-2.5 text-sm border-gray-300 focus:outline-none focus:ring-gob-oro focus:border-gob-oro rounded-md shadow-sm appearance-none bg-white">
                                    <option value="">-- Seleccione un expediente --</option>
                                    <option th:each="exp : ${expedientesList}" 
                                            th:value="${exp.id}" 
                                            th:text="${#strings.abbreviate(exp.numero + ' - ' + exp.partes, 80)}"
                                            th:title="${exp.numero + ' - ' + exp.partes}">
                                    </option>
                                </select>
                                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-400">
                                    <i class="fas fa-chevron-down text-xs"></i>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            
                            <div class="md:col-span-2">
                                <label class="block text-sm font-bold text-gob-gris mb-1">Asunto / Actuación *</label>
                                <div class="relative">
                                    <input type="text" name="actuacion" id="input-actuacion" required
                                           class="block w-full pl-10 pr-3 py-2.5 text-sm border-gray-300 focus:outline-none focus:ring-gob-oro focus:border-gob-oro rounded-md shadow-sm placeholder-gray-400"
                                           placeholder="Ej: Presentar alegatos finales...">
                                    <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center px-3 text-gray-400">
                                        <i class="fas fa-pen-nib"></i>
                                    </div>
                                </div>
                            </div>

                            <div class="md:col-span-2">
                                <label class="block text-sm font-bold text-gob-gris mb-1">Fecha de Vencimiento *</label>
                                <div class="relative">
                                    <input type="date" name="fechaVencimiento" id="input-fecha" required
                                           class="block w-full pl-10 pr-3 py-2.5 text-sm border-gray-300 focus:outline-none focus:ring-gob-oro focus:border-gob-oro rounded-md shadow-sm">
                                    <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center px-3 text-gray-400">
                                        <i class="far fa-calendar-times text-red-400"></i>
                                    </div>
                                </div>
                            </div>

                            <div class="md:col-span-2">
                                <label class="block text-sm font-bold text-gob-gris mb-1">Abogado Responsable</label>
                                <div class="relative">
                                    <select name="abogadoResponsable.id" id="input-abogado" 
                                            class="block w-full pl-10 pr-10 py-2.5 text-sm border-gray-300 focus:outline-none focus:ring-gob-oro focus:border-gob-oro rounded-md shadow-sm appearance-none bg-white">
                                        <option value="">-- Asignar abogado (Opcional) --</option>
                                        <option th:each="abg : ${abogados}" 
                                                th:value="${abg.id}" 
                                                th:text="${abg.nombreCompleto}">
                                        </option>
                                    </select>
                                    <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center px-3 text-gray-400">
                                        <i class="fas fa-user-shield"></i>
                                    </div>
                                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-400">
                                        <i class="fas fa-chevron-down text-xs"></i>
                                    </div>
                                </div>
                                <p class="mt-1 text-xs text-gray-500">
                                    <i class="fas fa-info-circle"></i> Si se deja vacío, será visible para toda la gerencia.
                                </p>
                            </div>
                        </div>
                    </div>

                    <div class="mt-8 flex flex-col-reverse sm:flex-row sm:justify-end gap-3 pt-4 border-t border-gray-200">
                        <button type="button" onclick="document.getElementById('modal-nuevo-termino').classList.add('hidden')" 
                                class="w-full sm:w-auto inline-flex justify-center items-center px-4 py-2.5 border border-gray-300 shadow-sm text-sm font-bold rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gob-oro transition-colors">
                            Cancelar
                        </button>
                        <button type="submit" class="w-full sm:w-auto inline-flex justify-center items-center px-4 py-2.5 border border-transparent shadow-sm text-sm font-bold rounded-md text-white bg-gob-guinda hover:bg-gob-guinda-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gob-guinda transition-colors">
                            <i class="fas fa-save mr-2"></i> Guardar Término
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
