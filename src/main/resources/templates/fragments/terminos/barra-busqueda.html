<div th:fragment="barra" class="flex flex-col md:flex-row gap-2 justify-between items-center mb-3">

    <!-- Buscador -->
    <form th:action="@{/terminos}" method="get" class="relative w-full md:w-80" onsubmit="return false;">
        <input type="hidden" name="estatus" th:value="${paramEstatus}">
        <input type="hidden" name="prioridad" th:value="${paramPrioridad}">
        <input type="hidden" name="abogadoId" th:value="${paramAbogadoId}">

        <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
            <i class="fas fa-search text-gray-400"></i>
        </div>
        <input type="text" id="input-search-terminos" th:value="${keyword}"
            class="bg-white border border-gray-200 text-gray-900 text-sm rounded-lg focus:border-gob-oro focus:ring-2 focus:ring-gob-oro/10 block w-full ps-10 p-2.5 outline-none transition-all font-medium"
            placeholder="Buscar asunto, expediente...">
    </form>

    <!-- Acciones -->
    <div class="flex items-center gap-2 w-full md:w-auto">
        <a th:href="@{/terminos}" class="text-sm text-gray-400 hover:text-gray-600 underline px-2">Limpiar</a>

        <a th:href="@{/terminos/exportar-excel(keyword=${keyword}, estatus=${paramEstatus}, prioridad=${paramPrioridad}, abogadoId=${paramAbogadoId})}"
            class="text-gob-gris bg-white border border-gray-300 hover:bg-gray-50 font-bold rounded-lg text-sm px-4 py-2.5 shadow-sm transition-colors flex items-center decoration-0"
            title="Descargar Excel">
            <i class="fas fa-file-excel text-green-600 mr-1.5"></i> Exportar
        </a>

        <button onclick="abrirModalNuevo()"
            class="text-white bg-gob-guinda hover:bg-gob-guindaDark font-bold rounded-lg text-sm px-5 py-2.5 shadow-sm transition-colors flex items-center gap-1.5">
            <i class="fas fa-plus"></i> Nuevo
        </button>
    </div>
</div>
