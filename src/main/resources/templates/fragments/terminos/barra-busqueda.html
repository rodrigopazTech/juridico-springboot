<div th:fragment="barra" class="flex flex-col lg:flex-row gap-4 items-center flex-1 justify-start w-full">

    <!-- Buscador -->
    <form id="form-search-terminos" th:action="@{/terminos}" method="get" class="relative w-full lg:flex-1 lg:max-w-xl">
        <input type="hidden" name="estatus" th:value="${paramEstatus}">
        <input type="hidden" name="prioridadId" th:value="${paramPrioridadId}">
        <input type="hidden" name="abogadoId" th:value="${paramAbogadoId}">
        <input type="hidden" name="materiaId" th:value="${paramMateriaId}">
        <input type="hidden" name="gerenciaId" th:value="${paramGerenciaId}">
        <input type="hidden" name="periodo" th:value="${paramPeriodo}">

        <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
            <i class="fas fa-search text-gray-400"></i>
        </div>
        <input type="text" id="input-search-terminos" name="keyword" th:value="${keyword}"
            class="bg-white border border-gray-200 text-gray-900 text-sm rounded-lg focus:border-gob-oro focus:ring-2 focus:ring-gob-oro/10 block w-full ps-10 pe-10 p-2.5 outline-none transition-all font-medium"
            placeholder="Buscar por asunto, expediente...">

        <!-- Botón para limpiar (Solo visible si hay texto) -->
        <button type="button" id="btn-clear-search-terminos"
            th:classappend="${keyword == null || keyword == '' ? 'hidden' : ''}"
            class="absolute inset-y-0 end-0 flex items-center pe-3 text-gray-400 hover:text-gray-600">
            <i class="fas fa-times-circle"></i>
        </button>
    </form>

    <!-- Acciones -->
    <div id="acciones-barra-terminos" class="flex flex-wrap items-center gap-2 w-full lg:w-auto lg:ml-auto justify-end">
        <a th:href="@{/terminos}"
            class="text-xs px-3 py-2 rounded-lg transition-all flex items-center gap-1.5 no-underline border"
            th:classappend="${#strings.isEmpty(keyword) && #strings.isEmpty(param.estatus) && #strings.isEmpty(param.prioridadId) && #strings.isEmpty(param.abogadoId) && #strings.isEmpty(param.materiaId) && #strings.isEmpty(param.gerenciaId) && #strings.isEmpty(param.periodo) && #strings.isEmpty(param.mes) ? 
            'text-gray-400 border-transparent hover:bg-gray-100' : 
            'bg-gob-guinda text-white border-gob-guinda shadow-md font-bold hover:bg-gob-guinda/90'}">
            <i class="fas fa-list-ul"></i> VerTodos
        </a>

        <a th:href="@{/terminos/exportar-excel(
                keyword=${keyword}, 
                estatus=${paramEstatus}, 
                prioridadId=${paramPrioridadId}, 
                abogadoId=${paramAbogadoId},
                materiaId=${paramMateriaId},
                gerenciaId=${paramGerenciaId},
                periodo=${paramPeriodo}
            )}"
            class="text-gob-gris bg-white border border-gray-300 hover:bg-gray-50 font-bold rounded-lg text-xs sm:text-sm px-3 sm:px-4 py-2 sm:py-2.5 shadow-sm transition-colors flex items-center decoration-0"
            title="Descargar Excel">
            <i class="fas fa-file-excel text-green-600 mr-1.5"></i> Exportar
        </a>

        <button onclick="abrirModalNuevo()"
            class="text-white bg-gob-guinda hover:bg-gob-guindaDark font-bold rounded-lg text-xs sm:text-sm px-3 sm:px-5 py-2 sm:py-2.5 shadow-sm transition-colors flex items-center gap-1.5 whitespace-nowrap">
            <i class="fas fa-plus"></i> Nuevo Término
        </button>
    </div>
</div>
