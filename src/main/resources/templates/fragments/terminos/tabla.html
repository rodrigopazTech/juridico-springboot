<div th:fragment="tabla-resultados">
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
        <div class="max-h-[600px] overflow-y-auto scrollbar-thin rounded-t-lg">
            <table class="w-full text-sm text-left text-gray-600 border-collapse">
                <thead
                    class="text-xs text-gray-700 uppercase bg-gray-50 border-b border-gray-200 sticky top-0 z-10 shadow-sm">
                    <tr>
                        <th class="px-4 py-3 bg-gray-50">Vencimiento</th>
                        <th class="px-4 py-3 bg-gray-50">Expediente</th>
                        <th class="px-4 py-3 bg-gray-50">Prioridad</th>
                        <th class="px-4 py-3 bg-gray-50">Actuación</th>
                        <th class="px-4 py-3 bg-gray-50">Abogado</th>
                        <th class="px-4 py-3 bg-gray-50">Estatus</th>
                        <th class="px-4 py-3 text-right bg-gray-50">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-terminos-body">
                    <tr th:if="${terminos.empty}">
                        <td colspan="8" class="px-4 py-6 text-center text-gray-400">No hay términos registrados.</td>
                    </tr>

                    <th:block th:each="t : ${terminos}">
                        <tr class="border-b hover:bg-gray-50 transition relative">

                            <td class="px-4 py-3 font-bold text-gray-800">
                                <div class="flex items-center gap-2" th:title="${t.diasRestantesTexto}">
                                    <div class="w-3 h-3 rounded-full shadow-sm border border-gray-200"
                                        th:classappend="${t.semaforoColor}">
                                    </div>
                                    <span th:text="${#temporals.format(t.fechaVencimiento, 'dd/MM/yyyy')}"
                                        th:classappend="${t.semaforoColor == 'bg-red-800' || t.semaforoColor == 'bg-red-500' ? 'text-red-600' : ''}">
                                        01/01/2026
                                    </span>
                                    </span>
                                </div>
                            </td>

                            <td class="px-4 py-3">
                                <div class="flex flex-col max-w-[180px]">
                                    <a th:if="${t.expediente != null}"
                                        th:href="@{/expedientes/{id}(id=${t.expediente?.id})}"
                                        class="font-bold text-gob-guinda hover:underline text-sm truncate"
                                        th:title="'Ver expediente: ' + ${t.expediente?.numero}"
                                        th:text="${t.expediente?.numero}">EXP-001</a>

                                    <span class="text-xs text-gray-400 truncate cursor-help"
                                        th:if="${t.expediente != null}" th:title="${t.expediente?.partes}"
                                        th:text="${t.expediente?.partes}">Partes</span>

                                    <span class="text-xs text-gray-300 italic" th:if="${t.expediente == null}">Sin
                                        Asignar</span>
                                </div>
                            </td>

                            <td class="px-4 py-3">
                                <div class="flex items-center gap-1.5 inline-flex px-2 py-0.5 rounded-md border text-[10px] font-bold uppercase tracking-tight"
                                    th:classappend="${t.prioridad != null ? t.prioridad.color : 'bg-gray-100 text-gray-800'}">
                                    <i class="fas fa-circle text-[8px] opacity-70"></i>
                                    <span th:text="${t.prioridad != null ? t.prioridad.nombre : 'MEDIA'}">
                                        MEDIA
                                    </span>
                                </div>
                            </td>

                            <td class="px-4 py-3 max-w-xs truncate" th:text="${t.asunto}" th:title="${t.asunto}">
                                Actuación</td>

                            <td class="px-4 py-3"
                                th:text="${t.abogadoResponsable?.nombreCompleto ?: (t.expediente?.abogadoResponsable?.nombreCompleto ?: 'Sin Asignar')}">
                            </td>

                            <td class="px-4 py-3">
                                <span class="px-2 py-1 rounded text-xs font-bold border"
                                    th:text="${t.estatusTermino?.descripcion}"
                                    th:classappend="${t.estatusTermino?.name() == 'CONCLUIDO' ? 'bg-green-100 text-green-800 border-green-200' : 'bg-blue-50 text-blue-800 border-blue-200'}">
                                    Proyectista
                                </span>
                            </td>

                            <td class="px-4 py-3 text-right relative">
                                <button
                                    th:if="${t.estatusTermino?.name() != 'LIBERADO' && t.estatusTermino?.name() != 'PRESENTADO' && t.estatusTermino?.name() != 'CONCLUIDO'}"
                                    th:onclick="editarTermino([[${t.id}]], [[${t.asunto}]], [[${t.fechaVencimiento}]], [[${t.expediente?.id ?: ''}]], [[${t.expediente?.numero ?: 'Sin Número'}]], [[${t.abogadoResponsable?.id ?: ''}]], [[${t.prioridad?.id ?: ''}]], [[${t.observaciones != null ? #strings.escapeJavaScript(t.observaciones) : ''}]])"
                                    class="text-gray-400 hover:text-gob-oro mr-2" title="Editar">
                                    <i class="fas fa-edit"></i>
                                </button>

                                <button
                                    th:unless="${t.estatusTermino?.name() != 'LIBERADO' && t.estatusTermino?.name() != 'PRESENTADO' && t.estatusTermino?.name() != 'CONCLUIDO'}"
                                    class="text-gray-200 cursor-not-allowed mr-2"
                                    title="Edición Bloqueada (El término ya fue liberado, presentado o concluido)">
                                    <i class="fas fa-edit"></i>
                                </button>

                                <button th:onclick="'toggleMenu(' + ${t.id} + ')'"
                                    class="text-gray-400 hover:text-gob-guinda px-2">
                                    <i class="fas fa-ellipsis-v"></i>
                                </button>

                                <div th:id="'menu-' + ${t.id}"
                                    class="hidden absolute right-0 mt-2 w-64 bg-white rounded-md shadow-xl z-50 border border-gray-100 text-left overflow-hidden ring-1 ring-black ring-opacity-5">

                                    <a th:if="${t.expediente != null}"
                                        th:href="@{/expedientes/{id}(id=${t.expediente?.id})}"
                                        class="block px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 hover:text-gob-guinda transition border-l-4 border-transparent hover:border-gob-guinda">
                                        <i class="fas fa-folder-open mr-3 w-4 text-center text-gray-400"></i> Ver
                                        Expediente
                                    </a>

                                    <div class="border-t border-gray-100"></div>

                                    <button
                                        th:if="${(t.estatusTermino?.name() == 'PROYECTISTA' and (rolActual.name() == 'ABOGADO' or rolActual.name() == 'ADMIN')) or
                                                (t.estatusTermino?.name() == 'REVISION' and (rolActual.name() == 'JEFE_DEPTO' or rolActual.name() == 'ADMIN')) or
                                                (t.estatusTermino?.name() == 'GERENCIA' and (rolActual.name() == 'GERENTE' or rolActual.name() == 'ADMIN')) or
                                                (t.estatusTermino?.name() == 'DIRECCION' and (rolActual.name() == 'DIRECCION' or rolActual.name() == 'SUBDIRECCION' or rolActual.name() == 'ADMIN'))}"
                                        th:onclick="'activarSubida(' + ${t.id} + ')'"
                                        class="w-full text-left px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 hover:text-gob-oro transition flex items-center border-l-4 border-transparent hover:border-gob-oro">
                                        <i
                                            th:class="${t.acuse != null ? 'fas fa-sync-alt mr-3 w-4 text-center text-orange-400' : 'fas fa-cloud-upload-alt mr-3 w-4 text-center text-gray-400'}"></i>
                                        <span
                                            th:text="${t.acuse != null ? 'Reemplazar Borrador' : 'Subir Borrador'}">Subir
                                            Borrador</span>
                                    </button>

                                    <a th:if="${t.acuse != null}" th:href="@{/terminos/descargar/{id}(id=${t.id})}"
                                        class="block w-full text-left px-4 py-3 text-sm text-blue-600 hover:bg-blue-50 transition flex items-center border-l-4 border-transparent hover:border-blue-500">
                                        <i class="fas fa-file-word mr-3 w-4 text-center"></i>
                                        <span class="truncate font-medium" th:text="${t.acuse}">Archivo.docx</span>
                                    </a>

                                    <button
                                        th:if="${t.estatusTermino?.name() == 'LIBERADO' and mapaPermisos.get(t.estatusTermino)?.contains(rolActual)}"
                                        th:onclick="'activarSubidaAcuse(' + ${t.id} + ')'"
                                        class="w-full text-left px-4 py-3 text-sm text-purple-700 hover:bg-purple-50 transition flex items-center border-l-4 border-transparent hover:border-purple-500 font-bold bg-purple-50/50">
                                        <i class="fas fa-file-signature mr-3 w-4 text-center text-purple-600"></i>
                                        Subir Acuse
                                    </button>

                                    <button
                                        th:if="${t.estatusTermino?.name() == 'PRESENTADO' and mapaPermisos.get(t.estatusTermino)?.contains(rolActual)}"
                                        th:onclick="'abrirModalConcluir(' + ${t.id} + ')'"
                                        class="w-full text-left px-4 py-3 text-sm text-green-700 hover:bg-green-50 transition flex items-center border-l-4 border-transparent hover:border-green-500 font-bold bg-green-50/50">
                                        <i class="fas fa-check-circle mr-3 w-4 text-center text-green-600"></i>
                                        Finalizar Término
                                    </button>

                                    <div class="border-t border-gray-100"></div>

                                    <a th:if="${((t.estatusTermino?.name() == 'PROYECTISTA' and t.acuse != null) or 
                                             (t.estatusTermino?.name() == 'LIBERADO' and t.acuseNombre != null) or 
                                             (t.estatusTermino?.name() != 'PROYECTISTA' and t.estatusTermino?.name() != 'LIBERADO' and 
                                              t.estatusTermino?.name() != 'PRESENTADO' and t.estatusTermino?.name() != 'CONCLUIDO')) 
                                            and mapaPermisos.get(t.estatusTermino)?.contains(rolActual)}"
                                        th:href="@{/terminos/avanzar/{id}(id=${t.id})}"
                                        class="block px-4 py-3 text-sm text-green-700 hover:bg-green-50 transition border-l-4 border-transparent hover:border-green-500">
                                        <i class="fas fa-arrow-right mr-3 w-4 text-center text-green-500"></i> Avanzar
                                        Etapa
                                    </a>

                                    <div th:if="${t.estatusTermino?.name() == 'CONCLUIDO' || t.estatusTermino?.name() == 'PRESENTADO'}"
                                        class="bg-gray-50 border-l-4 border-gray-400">
                                        <a th:href="@{/terminos/descargar-acuse/{id}(id=${t.id})}"
                                            class="block w-full text-left px-4 py-2 text-sm text-purple-700 hover:bg-purple-100 transition flex items-center font-bold">
                                            <i class="fas fa-file-download mr-3 w-4 text-center"></i> Descargar Acuse
                                        </a>
                                    </div>

                                    <div class="border-t border-gray-100"></div>

                                    <button th:onclick="'confirmarEliminar(' + ${t.id} + ')'"
                                        class="w-full text-left px-4 py-3 text-sm text-red-600 hover:bg-red-50 transition font-medium border-l-4 border-transparent hover:border-red-500">
                                        <i class="fas fa-trash-alt mr-3 w-4 text-center text-red-400"></i> Eliminar
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </th:block>
                </tbody>
            </table>
        </div>
    </div>

    <div class="mt-4 flex flex-col sm:flex-row justify-between items-center text-sm text-gray-500"
        th:if="${!terminos.empty}">
        <span class="mb-2 sm:mb-0">
            Mostrando página <span th:text="${terminos.number + 1}" class="font-bold text-gray-700"></span> de <span
                th:text="${terminos.totalPages}" class="font-bold text-gray-700"></span>
        </span>

        <div class="flex gap-2">
            <a th:if="${terminos.hasPrevious()}"
                th:href="@{/terminos(page=${terminos.number - 1}, keyword=${keyword}, estatus=${paramEstatus}, prioridad=${paramPrioridad}, abogadoId=${paramAbogadoId})}"
                class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 bg-white shadow-sm transition-all flex items-center gap-1">
                <i class="fas fa-chevron-left text-xs"></i> Anterior
            </a>

            <a th:if="${terminos.hasNext()}"
                th:href="@{/terminos(page=${terminos.number + 1}, keyword=${keyword}, estatus=${paramEstatus}, prioridad=${paramPrioridad}, abogadoId=${paramAbogadoId})}"
                class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 bg-white shadow-sm transition-all flex items-center gap-1">
                Siguiente <i class="fas fa-chevron-right text-xs"></i>
            </a>
        </div>
    </div>
</div>
