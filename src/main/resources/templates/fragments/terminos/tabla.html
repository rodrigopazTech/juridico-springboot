<div th:fragment="tabla-resultados">
    
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-visible min-h-[400px]">
        <table class="w-full text-sm text-left text-gray-600">
            <thead class="text-xs text-gray-700 uppercase bg-gray-50 border-b border-gray-200">
                <tr>
                    <th class="px-4 py-3">Vencimiento</th>
                    <th class="px-4 py-3">Expediente</th>
                    <th class="px-4 py-3">Prioridad</th>
                    <th class="px-4 py-3">Actuación</th>
                    <th class="px-4 py-3">Abogado</th>
                    <th class="px-4 py-3">Estatus</th>
                    <th class="px-4 py-3 text-right">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${terminos.empty}">
                    <td colspan="7" class="px-4 py-6 text-center text-gray-400">No hay términos registrados.</td>
                </tr>

                <tr th:each="t : ${terminos}" class="border-b hover:bg-gray-50 transition relative">
                    
                    <td class="px-4 py-3 font-bold text-gray-800">
                        <div class="flex items-center gap-2" th:title="${t.diasRestantesTexto}">
                            <div class="w-3 h-3 rounded-full shadow-sm border border-gray-200"
                                th:classappend="${t.semaforoColor}">
                            </div>
                            <span th:text="${#temporals.format(t.fechaVencimiento, 'dd/MM/yyyy')}"
                                th:classappend="${t.semaforoColor == 'bg-red-800' || t.semaforoColor == 'bg-red-500' ? 'text-red-600' : ''}">
                                01/01/2026
                            </span>
                        </div>
                    </td>

                    <td class="px-4 py-3">
                        <div class="flex flex-col">
                            <a th:if="${t.expediente != null}" 
                            th:href="@{/expedientes/{id}(id=${t.expediente.id})}"
                            class="font-bold text-gob-guinda hover:underline" 
                            th:text="${t.expediente.numero}">EXP-001</a>
                            <span class="text-xs text-gray-400" 
                                th:text="${t.expediente != null ? t.expediente.partes : 'Sin Partes'}">Partes</span>
                        </div>
                    </td>

                    <td class="px-4 py-3">
                        <div class="flex items-center gap-1.5">
                            <span class="w-1.5 h-1.5 rounded-full"
                                th:classappend="${t.prioridad != null && t.prioridad.name() == 'ALTA' ? 'bg-red-500' : (t.prioridad != null && t.prioridad.name() == 'BAJA' ? 'bg-gray-400' : 'bg-orange-400')}">
                            </span>
                            <span class="text-[10px] font-bold uppercase tracking-tight"
                                th:classappend="${t.prioridad != null && t.prioridad.name() == 'ALTA' ? 'text-red-600' : (t.prioridad != null && t.prioridad.name() == 'BAJA' ? 'text-gray-500' : 'text-orange-600')}"
                                th:text="${t.prioridad != null ? t.prioridad : 'MEDIA'}">
                                MEDIA
                            </span>
                        </div>
                    </td>

                    <td class="px-4 py-3 max-w-xs truncate" th:text="${t.actuacion}" th:title="${t.actuacion}">Actuación</td>
                    
                    <td class="px-4 py-3" th:text="${t.abogadoResponsable != null ? t.abogadoResponsable.nombreCompleto : 'Sin Asignar'}"></td>

                    <td class="px-4 py-3">
                        <span class="px-2 py-1 rounded text-xs font-bold border"
                            th:text="${t.estatusTermino}"
                            th:classappend="${t.estatusTermino == 'Concluido' ? 'bg-green-100 text-green-800 border-green-200' : 'bg-blue-50 text-blue-800 border-blue-200'}">
                            Proyectista
                        </span>
                    </td>

                    <td class="px-4 py-3 text-right relative">
                        <button th:if="${t.estatusTermino == 'Liberado' || t.estatusTermino == 'Presentado' || t.estatusTermino == 'Concluido'}"
                            class="text-gray-300 cursor-not-allowed mr-2" title="Edición Bloqueada">
                            <i class="fas fa-edit"></i>
                        </button>

                        <button th:unless="${t.estatusTermino == 'Liberado' || t.estatusTermino == 'Presentado' || t.estatusTermino == 'Concluido'}"
                                th:onclick="editarTermino(
                                    [[${t.id}]], 
                                    [[${t.actuacion}]], 
                                    [[${t.fechaVencimiento}]], 
                                    [[${t.expediente != null ? t.expediente.id : ''}]], 
                                    [[${t.abogadoResponsable != null ? t.abogadoResponsable.id : ''}]]
                                )"
                                class="text-gray-400 hover:text-gob-oro mr-2" title="Editar">
                            <i class="fas fa-edit"></i>
                        </button>

                        <button th:onclick="'toggleMenu(' + ${t.id} + ')'" class="text-gray-400 hover:text-gob-guinda px-2">
                            <i class="fas fa-ellipsis-v"></i>
                        </button>

                        <div th:id="'menu-' + ${t.id}" class="hidden absolute right-0 mt-2 w-64 bg-white rounded-md shadow-xl z-50 border border-gray-100 text-left overflow-hidden ring-1 ring-black ring-opacity-5">
                            
                            <a th:if="${t.expediente != null}" 
                                th:href="@{/expedientes/{id}(id=${t.expediente.id})}"
                                class="block px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 hover:text-gob-guinda transition border-l-4 border-transparent hover:border-gob-guinda">
                                <i class="fas fa-folder-open mr-3 w-4 text-center text-gray-400"></i> Ver Expediente
                            </a>

                            <div class="border-t border-gray-100"></div>

                            <button th:unless="${t.estatusTermino == 'Liberado' || t.estatusTermino == 'Presentado' || t.estatusTermino == 'Concluido'}"
                                    th:onclick="'activarSubida(' + ${t.id} + ')'" 
                                    class="w-full text-left px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 hover:text-gob-oro transition flex items-center border-l-4 border-transparent hover:border-gob-oro">
                                <i th:class="${t.archivoWord != null ? 'fas fa-sync-alt mr-3 w-4 text-center text-orange-400' : 'fas fa-cloud-upload-alt mr-3 w-4 text-center text-gray-400'}"></i> 
                                <span th:text="${t.archivoWord != null ? 'Reemplazar Borrador' : 'Subir Borrador'}">Subir Borrador</span>
                            </button>
                            
                            <a th:if="${t.archivoWord != null}" 
                                th:href="@{/terminos/descargar/{id}(id=${t.id})}" 
                                class="block w-full text-left px-4 py-3 text-sm text-blue-600 hover:bg-blue-50 transition flex items-center border-l-4 border-transparent hover:border-blue-500">
                                <i class="fas fa-file-word mr-3 w-4 text-center"></i> 
                                <span class="truncate font-medium" th:text="${t.archivoWord}">Archivo.docx</span>
                            </a>

                            <button th:if="${t.estatusTermino == 'Presentado' and mapaPermisos.get('Presentado').contains(rolActual)}"
                                    th:onclick="'activarSubidaAcuse(' + ${t.id} + ')'" 
                                    class="w-full text-left px-4 py-3 text-sm text-purple-700 hover:bg-purple-50 transition flex items-center border-l-4 border-transparent hover:border-purple-500 font-bold bg-purple-50/50">
                                <i class="fas fa-file-signature mr-3 w-4 text-center text-purple-600"></i> 
                                Subir Acuse y Concluir
                            </button>
                            
                            <div class="border-t border-gray-100"></div>

                            <a th:if="${t.estatusTermino != 'Presentado' and t.estatusTermino != 'Concluido' and t.archivoWord != null and mapaPermisos.containsKey(t.estatusTermino) and mapaPermisos.get(t.estatusTermino).contains(rolActual)}"
                                th:href="@{/terminos/avanzar/{id}(id=${t.id})}"
                                class="block px-4 py-3 text-sm text-green-700 hover:bg-green-50 transition border-l-4 border-transparent hover:border-green-500">
                                <i class="fas fa-arrow-right mr-3 w-4 text-center text-green-500"></i> Avanzar Etapa
                            </a>
                            
                            <div th:if="${t.estatusTermino == 'Concluido'}" class="bg-gray-50 border-l-4 border-gray-400">        
                                <span class="block px-4 py-2 text-xs text-gray-500 italic">
                                    <i class="fas fa-check-double mr-1 text-green-500"></i> Proceso Finalizado
                                </span>
                                <a th:href="@{/terminos/descargar-acuse/{id}(id=${t.id})}" 
                                class="block w-full text-left px-4 py-2 text-sm text-purple-700 hover:bg-purple-100 transition flex items-center font-bold">
                                    <i class="fas fa-file-download mr-3 w-4 text-center"></i> Descargar Acuse
                                </a>
                            </div>

                            <div class="border-t border-gray-100"></div>

                            <button th:onclick="'confirmarEliminar(' + ${t.id} + ')'"
                                    class="w-full text-left px-4 py-3 text-sm text-red-600 hover:bg-red-50 transition font-medium border-l-4 border-transparent hover:border-red-500">
                                <i class="fas fa-trash-alt mr-3 w-4 text-center text-red-400"></i> Eliminar
                            </button>
                        </div>

                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-4 flex flex-col sm:flex-row justify-between items-center text-sm text-gray-500" th:if="${!terminos.empty}">
        <span class="mb-2 sm:mb-0">
            Mostrando página <span th:text="${terminos.number + 1}" class="font-bold text-gray-700"></span> de <span th:text="${terminos.totalPages}" class="font-bold text-gray-700"></span>
        </span>
        
        <div class="flex gap-2">
            <a th:if="${terminos.hasPrevious()}" 
            th:href="@{/terminos(page=${terminos.number - 1}, keyword=${keyword}, estatus=${paramEstatus}, prioridad=${paramPrioridad}, abogadoId=${paramAbogadoId})}" 
            class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 bg-white shadow-sm transition-all flex items-center gap-1">
                <i class="fas fa-chevron-left text-xs"></i> Anterior
            </a>
            
            <a th:if="${terminos.hasNext()}" 
            th:href="@{/terminos(page=${terminos.number + 1}, keyword=${keyword}, estatus=${paramEstatus}, prioridad=${paramPrioridad}, abogadoId=${paramAbogadoId})}" 
            class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 bg-white shadow-sm transition-all flex items-center gap-1">
                Siguiente <i class="fas fa-chevron-right text-xs"></i>
            </a>
        </div>
    </div>
</div>
