<div th:fragment="encabezado(exp)" class="bg-white rounded-lg shadow-sm border-t-4 border-gob-guinda p-6 mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
    
    <div>
        <div class="flex items-center gap-3 mb-1">
            <h2 class="text-2xl font-bold text-gob-guinda" th:text="${exp.numero}">EXP-000</h2>
            <span class="px-2 py-0.5 rounded text-xs font-bold border border-blue-200 bg-blue-50 text-blue-700 uppercase"
                  th:text="${exp.etapaProcesal}">TRAMITE</span>
        </div>
        <p class="text-gray-500 text-sm">Detalle general del asunto jurídico y seguimiento.</p>
    </div>

    <div class="flex flex-wrap gap-2">
        
        <a th:href="@{/expedientes}" class="px-4 py-2 bg-gray-100 text-gray-600 rounded-md hover:bg-gray-200 text-sm font-medium transition flex items-center gap-2">
            <i class="fas fa-arrow-left"></i> Volver
        </a>

        <button class="px-4 py-2 bg-white text-gob-guinda border border-gob-guinda rounded-md hover:bg-red-50 text-sm font-medium transition flex items-center gap-2 shadow-sm">
            <i class="fas fa-comment-dots"></i> Observaciones
        </button>

        <button onclick="document.getElementById('modal-editar-exp').classList.remove('hidden')" 
                class="px-4 py-2 bg-white text-gob-guinda border border-gob-guinda rounded-md hover:bg-red-50 text-sm font-medium transition flex items-center gap-2 shadow-sm">
            <i class="fas fa-edit"></i> Editar
        </button>

        <button class="px-4 py-2 bg-white text-gob-guinda border border-gob-guinda rounded-md hover:bg-red-50 text-sm font-medium transition flex items-center gap-2 shadow-sm">
            <i class="fas fa-step-forward"></i> Cambiar Etapa
        </button>

        <button class="px-4 py-2 bg-gob-guinda text-white rounded-md hover:bg-[#4a0d26] text-sm font-medium transition flex items-center gap-2 shadow-sm">
            <i class="fas fa-file-contract"></i> Gestor Documental
        </button>

    </div>
</div>
