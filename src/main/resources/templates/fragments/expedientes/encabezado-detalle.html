<div th:fragment="encabezado(expediente)" id="encabezado-detalle-container" class="bg-white border-b border-gray-200 shadow-sm p-6 mb-6">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">

        <div>
            <div class="flex items-center gap-3">
                <h2 class="text-2xl font-bold text-gob-guinda" th:text="${expediente.numero}">EXP-0000/2026</h2>
                <span class="px-2 py-1 rounded text-xs font-bold border"
                    th:text="${expediente.etapaCatalogo != null ? expediente.etapaCatalogo.nombreJerarquico : expediente.etapaProcesal}"
                    th:classappend="${expediente.etapaProcesal.name() == 'CONCLUIDO' ? 'bg-green-100 text-green-700 border-green-200' : 'bg-blue-50 text-blue-700 border-blue-200'}">
                    ETAPA
                </span>
            </div>
            <p class="text-gray-500 text-sm mt-1">Detalle general del asunto jurídico y seguimiento.</p>
        </div>

        <div class="flex flex-wrap gap-2">
            <a th:href="@{/expedientes}"
                class="px-3 sm:px-4 py-2 bg-gray-100 text-gray-600 rounded hover:bg-gray-200 text-sm font-medium transition inline-flex items-center gap-1">
                <i class="fas fa-arrow-left"></i>
                <span class="hidden sm:inline">Volver</span>
            </a>

            <button onclick="openObservaciones()"
                class="px-3 sm:px-4 py-2 border border-gob-guinda text-gob-guinda rounded hover:bg-red-50 text-sm font-medium transition inline-flex items-center gap-1">
                <i class="fas fa-comment-dots"></i>
                <span class="hidden sm:inline">Observaciones</span>
            </button>
            <a th:href="@{/expedientes/{id}/trazabilidad(id=${expediente.id})}"
                class="px-3 sm:px-4 py-2 border border-gob-oro text-gob-guinda rounded hover:bg-yellow-50 text-sm font-medium transition inline-flex items-center gap-1">
                <i class="fas fa-route"></i>
                <span class="hidden sm:inline">Trazabilidad</span>
            </a>
            <button onclick="openModal('modal-editar')"
                class="px-3 sm:px-4 py-2 border border-gob-guinda text-gob-guinda rounded hover:bg-red-50 text-sm font-medium transition inline-flex items-center gap-1">
                <i class="fas fa-edit"></i>
                <span class="hidden sm:inline">Editar</span>
            </button>

            <button th:data-expediente-id="${expediente.id}" 
                th:data-expediente-numero="${expediente.numero}"
                onclick="openGestorDocumental(this.dataset.expedienteId, this.dataset.expedienteNumero)"
                class="px-3 sm:px-4 py-2 bg-gob-guinda text-white rounded hover:bg-gob-guinda-claro text-sm font-medium transition shadow-sm inline-flex items-center gap-1">
                <i class="fas fa-file-archive"></i>
                <span class="hidden sm:inline">Gestor Documental</span>
            </button>
        </div>
    </div>
</div>
