<div th:fragment="barra" class="bg-white p-4 rounded-lg shadow-sm mb-6 flex flex-col md:flex-row gap-4 items-center justify-between">
    
    <form th:action="@{/expedientes}" method="get" id="searchForm" class="relative w-full md:w-2/3">
        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
            <i class="fas fa-search"></i>
        </span>
        
        <input type="text" name="keyword" id="searchInput"
               th:value="${keyword}"
               class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-gob-oro focus:border-transparent text-sm" 
               placeholder="Buscar por Expediente, Partes, Materia, Abogado, Órgano..."
               oninput="debouncedSearch()">
    </form>

    <button th:if="${rolActual.name() == 'DIRECCION' or rolActual.name() == 'SUBDIRECCION' or rolActual.name() == 'GERENTE'}"
            onclick="document.getElementById('modal-nuevo-exp').classList.remove('hidden')" 
            class="w-full md:w-auto bg-gob-guinda hover:bg-gob-guinda-claro text-white font-bold py-2 px-6 rounded shadow transition duration-300 flex items-center justify-center gap-2">
        <i class="fas fa-plus"></i> Nuevo Expediente
    </button>

    <script>
        let timeout = null;

        function debouncedSearch() {
            clearTimeout(timeout);
            timeout = setTimeout(function () {
                document.getElementById('searchForm').submit();
            }, 600);
        }
    </script>
</div>
