<div th:fragment="historial" class="bg-white rounded-lg shadow-sm border border-gray-200 p-5 h-fit">
    <h3 class="font-bold text-gray-700 mb-4 border-b pb-2 flex items-center gap-2">
        <i class="fas fa-history text-gob-oro"></i> Historial de Cambios
    </h3>

    <div id="historial-container" class="space-y-4 relative border-l-2 border-gray-100 ml-2">
        <div th:each="item : ${historial}" class="ml-4 relative">
            <!-- Punto en la línea de tiempo -->
            <div class="absolute -left-[21px] top-1 w-3 h-3 rounded-full border-2 border-white"
                th:classappend="${itemStat.first ? 'bg-gob-guinda' : 'bg-gray-300'}"></div>

            <p class="text-xs text-gray-400"
                th:text="${item.createdAt != null ? #temporals.format(item.createdAt, 'dd MMM yyyy, HH:mm') : 'Recientemente'}">
                Fecha</p>
            <p class="text-sm font-medium text-gray-800" th:text="${item.accion}">Acción</p>
            <p class="text-xs text-gray-500" th:text="${item.detalle}">Detalle de la acción...</p>
            <p class="text-[10px] text-gray-400 italic">Realizado por <span
                    th:text="${item.usuario != null ? item.usuario.nombreCompleto : 'Sistema'}">Nombre</span></p>
        </div>

        <div th:if="${#lists.isEmpty(historial)}" class="ml-4 py-4 text-center text-gray-400 text-xs italic">
            Sin actividad registrada aún.
        </div>
    </div>
</div>
