<div th:fragment="historial" class="bg-white rounded-lg shadow-sm border border-gray-200 p-5 h-fit">
    <h3 class="font-bold text-gray-700 mb-4 border-b pb-2 flex items-center gap-2">
        <i class="fas fa-history text-gob-oro"></i> Historial de Cambios
    </h3>

    <div class="space-y-4 relative border-l-2 border-gray-100 ml-2 max-h-[600px] overflow-y-auto pr-2 custom-scrollbar">
        <div th:each="act : ${actividades}" class="ml-4 relative">
            <!-- Icono dinámico según act.tipoIcono -->
            <div th:class="'absolute -left-[21px] top-1 w-3 h-3 rounded-full border-2 border-white ' + 
                 (${act.tipoIcono} == 'PLUS' ? 'bg-green-500' : 
                  (${act.tipoIcono} == 'EDIT' ? 'bg-gob-oro' : 
                   (${act.tipoIcono} == 'CHECK' ? 'bg-blue-600' : 'bg-gray-300')))"></div>

            <p class="text-[10px] text-gray-400" th:text="${#temporals.format(act.fechaRegistro, 'dd MMM, HH:mm')}">
                Fecha</p>
            <p class="text-xs font-bold text-gray-800" th:text="${act.titulo}">Título</p>
            <p class="text-[11px] text-gray-600 leading-tight" th:text="${act.descripcion}">Descripción</p>
            <p class="text-[9px] text-gray-400 italic" th:if="${act.usuario != null}">
                Por: <span th:text="${act.usuario.nombreCompleto}">Nombre</span>
            </p>
        </div>

        <div th:if="${#lists.isEmpty(actividades)}" class="ml-4 text-xs text-gray-400 italic">
            No hay registros de actividad aún.
        </div>
    </div>
</div>
