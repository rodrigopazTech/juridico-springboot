<div th:fragment="historial" class="bg-white rounded-lg shadow-sm border border-gray-200 p-5 h-fit sticky top-24">
    <h3 class="font-bold text-gray-700 mb-4 border-b pb-2 flex items-center gap-2">
        <i class="fas fa-history text-gob-oro"></i> Historial de Cambios
    </h3>
    
    <div class="space-y-6 relative border-l-2 border-gray-100 ml-2 pb-2 max-h-[500px] overflow-y-auto pr-3 custom-scrollbar">
        
        <div th:each="actividad : ${historial}" class="ml-4 relative group">
            
            <div class="absolute -left-[25px] top-1 w-3 h-3 rounded-full border-2 border-white shadow-sm"
                 th:classappend="${actividad.tipoIcono == 'EDIT' ? 'bg-blue-500' : (actividad.tipoIcono == 'CREATE' ? 'bg-green-500' : 'bg-gray-400')}">
            </div>

            <p class="text-[10px] text-gray-400 font-semibold mb-0.5">
                <i class="far fa-clock mr-1"></i>
                <span th:text="${#temporals.format(actividad.fechaRegistro, 'dd MMM yyyy HH:mm')}">Fecha</span>
            </p>

            <p class="text-sm font-bold text-gray-800 leading-tight" th:text="${actividad.titulo}">Título</p>
            
            <p class="text-xs text-gray-600 mt-1 italic border-l-2 border-gray-100 pl-2 bg-gray-50 rounded-r p-1" th:text="${actividad.descripcion}">
                Detalle del cambio...
            </p>

            <div class="flex items-center gap-1 mt-1">
                <div class="w-4 h-4 rounded-full bg-gob-gris flex items-center justify-center text-[8px] text-white">
                    <i class="fas fa-user"></i>
                </div>
                <p class="text-[10px] text-gray-500" 
                   th:text="${actividad.usuario != null ? actividad.usuario.nombreCompleto : 'Sistema'}">Usuario</p>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(historial)}" class="ml-4 text-xs text-gray-400 italic py-4">
            No hay actividad registrada aún.
        </div>
    </div>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #d4d4d4; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #a3a3a3; }
    </style>
</div>
