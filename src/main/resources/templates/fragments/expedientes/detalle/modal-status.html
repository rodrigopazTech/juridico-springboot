<div th:fragment="modal-status" id="modal-status-change" tabindex="-1" aria-hidden="true" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
    <div class="relative p-4 w-full max-w-md max-h-full">
        <div class="relative bg-white rounded-lg shadow-2xl border-t-4 border-gob-oro">
            
            <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t">
                <h3 class="text-lg font-bold text-gob-gris font-heading">
                    Actualizar Estado
                </h3>
                <button type="button" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center" data-modal-hide="modal-status-change">
                    <svg class="w-3 h-3" fill="none" viewBox="0 0 14 14"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/></svg>
                </button>
            </div>

            <form class="p-4 md:p-5">
                <div class="mb-4">
                    <label class="block mb-2 text-sm font-bold text-gob-gris">Nuevo Estado</label>
                    <select class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-gob-oro focus:border-gob-oro block w-full p-2.5">
                        <option value="activo">Activo</option>
                        <option value="espera">En espera de sentencia</option>
                        <option value="cerrado">Cerrado / Archivado</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block mb-2 text-sm font-bold text-gob-gris">Motivo del cambio</label>
                    <textarea rows="3" class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-gob-oro focus:border-gob-oro" placeholder="Explique brevemente..."></textarea>
                </div>
                <button type="submit" class="w-full text-white bg-gob-guinda hover:bg-gob-guindaDark focus:ring-4 focus:outline-none focus:ring-gob-guinda/30 font-medium rounded-lg text-sm px-5 py-2.5 text-center">
                    Confirmar Cambio
                </button>
            </form>
        </div>
    </div>
</div>
