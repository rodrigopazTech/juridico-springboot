<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="card(proximaAudiencia)" th:if="${proximaAudiencia != null}"
        class="mt-6 bg-orange-50 border border-orange-200 rounded-lg p-4 relative overflow-hidden">
        <div class="absolute top-0 right-0 w-16 h-16 bg-orange-100 rounded-bl-full -mr-8 -mt-8 z-0">
        </div>

        <div class="relative z-10 flex items-start gap-4">
            <div class="bg-white p-2 rounded-lg shadow-sm text-center min-w-[60px]">
                <span class="block text-xs text-gray-500 uppercase font-bold"
                    th:text="${proximaAudiencia.fechaAudiencia != null ? #strings.toUpperCase(#temporals.format(proximaAudiencia.fechaAudiencia, 'MMM')) : '-'}">ENE</span>
                <span class="block text-xl font-bold text-gob-guinda"
                    th:text="${proximaAudiencia.fechaAudiencia != null ? #temporals.format(proximaAudiencia.fechaAudiencia, 'dd') : '-'}">15</span>
            </div>

            <div class="flex-1">
                <h4 class="text-sm font-bold text-gob-guinda uppercase flex items-center gap-2">
                    <i class="fas fa-gavel"></i> Próxima Audiencia
                </h4>
                <p class="text-sm font-medium text-gray-800 mb-1"
                    th:text="${proximaAudiencia.tipoAudiencia != null ? proximaAudiencia.tipoAudiencia.nombre : 'Audiencia'}">
                    Audiencia</p>
                <div class="flex items-center gap-3">
                    <p
                        class="text-xs font-bold text-gob-oro bg-white px-2 py-0.5 rounded border border-gob-oro/20 shadow-sm flex items-center gap-1">
                        <i class="far fa-calendar-alt"></i>
                        <span
                            th:text="${proximaAudiencia.fechaAudiencia != null ? #temporals.format(proximaAudiencia.fechaAudiencia, 'dd MMM yyyy') : '-'}">15
                            ENE 2026</span>
                    </p>
                    <p
                        class="text-xs font-bold text-gray-600 bg-white px-2 py-0.5 rounded border border-gray-200 shadow-sm flex items-center gap-1">
                        <i class="far fa-clock"></i>
                        <span
                            th:text="${proximaAudiencia.horaAudiencia != null ? #temporals.format(proximaAudiencia.horaAudiencia, 'HH:mm') : '--:--'}">10:00</span>
                        hrs
                    </p>
                </div>
            </div>

            <div class="text-right">
                <p class="text-[10px] text-gray-400 uppercase font-bold mb-1">Comparece</p>

                <div class="flex items-center justify-end gap-2">

                    <span th:if="${proximaAudiencia.abogadoComparece == null}"
                        class="text-xs text-red-400 italic font-bold">
                        Por definir
                    </span>

                    <span th:if="${proximaAudiencia.abogadoComparece != null
                                   and expediente.abogadoResponsable != null
                                   and proximaAudiencia.abogadoComparece.id == expediente.abogadoResponsable.id}"
                        class="text-xs font-bold text-gray-600 bg-white px-2 py-1 rounded border border-gray-200 shadow-sm">
                        Titular
                    </span>

                    <div th:if="${proximaAudiencia.abogadoComparece != null
                                   and (expediente.abogadoResponsable == null
                                       or proximaAudiencia.abogadoComparece.id != expediente.abogadoResponsable.id)}"
                        class="flex items-center gap-2 bg-white px-2 py-1 rounded border border-gob-oro shadow-sm">
                        <div
                            class="w-5 h-5 rounded-full bg-gob-oro text-white flex items-center justify-center text-[10px]">
                            <i class="fas fa-user-shield"></i>
                        </div>
                        <span class="text-xs font-bold text-gob-guinda"
                            th:text="${proximaAudiencia.abogadoComparece.nombreCompleto}">
                            Lic. Sustituto
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
