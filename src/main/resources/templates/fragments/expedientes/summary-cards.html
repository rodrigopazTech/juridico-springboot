<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="cards" class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
        <!-- Total -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center">
            <div class="w-12 h-12 bg-blue-50 rounded-lg flex items-center justify-center text-blue-600 mr-4">
                <i class="fas fa-folder-open text-xl"></i>
            </div>
            <div>
                <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Total Expedientes</p>
                <h3 class="text-2xl font-black text-gray-800" th:text="${expedientes.totalElements}">0</h3>
            </div>
        </div>
        
        <!-- Alta Prioridad -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center">
            <div class="w-12 h-12 bg-red-50 rounded-lg flex items-center justify-center text-red-600 mr-4">
                <i class="fas fa-exclamation-triangle text-xl"></i>
            </div>
            <div>
                <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Prioridad Alta</p>
                <h3 class="text-2xl font-black text-gray-800" th:text="${totalAlta != null ? totalAlta : '---'}">0</h3>
            </div>
        </div>
        
        <!-- En Trámite -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center">
            <div class="w-12 h-12 bg-amber-50 rounded-lg flex items-center justify-center text-amber-600 mr-4">
                <i class="fas fa-clock text-xl"></i>
            </div>
            <div>
                <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">En Trámite</p>
                <h3 class="text-2xl font-black text-gray-800" th:text="${totalTramite != null ? totalTramite : '---'}">0</h3>
            </div>
        </div>
        
        <!-- Recientes -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center">
            <div class="w-12 h-12 bg-emerald-50 rounded-lg flex items-center justify-center text-emerald-600 mr-4">
                <i class="fas fa-calendar-plus text-xl"></i>
            </div>
            <div>
                <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Nuevos (Mes)</p>
                <h3 class="text-2xl font-black text-gray-800" th:text="${totalNuevos != null ? totalNuevos : '---'}">0</h3>
            </div>
        </div>
    </div>
</body>
</html>
