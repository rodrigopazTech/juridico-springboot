<div th:fragment="archivos" class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 mt-6">
    <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-gray-700 flex items-center gap-2">
            <i class="fas fa-paperclip text-gob-oro"></i> Archivos Recientes
        </h3>
        <span class="text-xs text-gray-400">Últimos 3 documentos cargados</span>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- Mostrar solo términos que tengan archivo adjunto -->
        <th:block th:each="ter : ${expediente.terminos}" th:if="${ter.archivoWord != null}">
            <div
                class="flex items-center gap-3 p-3 border border-gray-100 rounded hover:bg-gray-50 transition cursor-pointer">
                <div class="bg-blue-100 text-blue-600 w-10 h-10 flex items-center justify-center rounded">
                    <i class="fas fa-file-word"></i>
                </div>
                <div class="truncate">
                    <p class="text-sm font-bold text-gray-700 truncate" th:text="${ter.archivoWord}">Nombre del archivo
                    </p>
                    <p class="text-xs text-gray-400" th:text="${#temporals.format(ter.updatedAt, 'dd MMM yyyy')}">Fecha
                    </p>
                </div>
            </div>
        </th:block>

        <div th:if="${#lists.isEmpty(expediente.terminos)}"
            class="col-span-3 py-4 text-center text-gray-400 text-sm italic border border-dashed border-gray-200 rounded">
            No hay archivos recientes registrados.
        </div>
    </div>
</div>
