<!-- Fragmento de Modales para Detalle de Expediente -->
<div th:fragment="modales(expediente, gerencias, materias, usuarios, organos, prioridades, estados, etapas, tipos)">

    <!-- 1. MODAL OBSERVACIONES -->
    <div id="modal-observaciones"
        class="fixed inset-0 z-50 hidden items-center justify-center bg-gray-900/50 backdrop-blur-sm p-4">
        <div
            class="relative w-full max-w-2xl bg-white rounded-lg shadow-2xl border-t-4 border-blue-600 h-[80vh] flex flex-col">
            <div class="flex-none flex items-center justify-between p-4 border-b bg-gray-50 rounded-t-lg">
                <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                    <i class="fas fa-comments text-blue-600"></i> Observaciones y Notas
                </h3>
                <button onclick="closeModal('modal-observaciones')"
                    class="text-gray-400 hover:text-gray-900 transition-colors">
                    <i class="fas fa-times fa-lg"></i>
                </button>
            </div>

            <div id="lista-observaciones" class="flex-1 overflow-y-auto p-6 bg-gray-50 space-y-4">
                <div class="flex flex-col items-center justify-center h-full text-gray-400 opacity-60">
                    <i class="fas fa-spinner fa-spin text-3xl mb-2"></i>
                    <p>Cargando notas...</p>
                </div>
            </div>

            <div class="flex-none p-4 border-t bg-white rounded-b-lg">
                <div class="flex gap-2">
                    <textarea id="texto-nueva-nota" rows="2"
                        class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-blue-500 focus:border-blue-500 resize-none"
                        placeholder="Escribe una nota interna..."></textarea>
                    <button id="btn-guardar-nota"
                        class="px-5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold shadow-md transition-colors">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. MODAL EDITAR EXPEDIENTE -->
    <div id="modal-editar"
        class="fixed inset-0 z-50 hidden bg-gray-900 bg-opacity-50 backdrop-blur-sm flex items-center justify-center p-4">
        <div
            class="bg-white rounded-lg shadow-2xl w-full max-w-3xl border-t-4 border-gob-guinda transform transition-all max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center p-4 border-b border-gray-100 sticky top-0 bg-white z-10">
                <h3 class="text-xl font-bold text-gob-guinda flex items-center gap-2">
                    <i class="fas fa-edit"></i> Editar Expediente
                </h3>
                <button onclick="closeModal('modal-editar')" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <form id="form-editar-expediente" th:action="@{/expedientes/guardar}" method="post"
                class="p-6 space-y-4 text-sm">
                <input type="hidden" name="id" th:value="${expediente.id}">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-bold text-gray-600 mb-1">Número de Expediente*</label>
                        <input type="text" name="numero" th:value="${expediente.numero}" required
                            class="w-full border border-gray-300 rounded p-2 focus:border-gob-guinda focus:ring-1 focus:ring-gob-guinda outline-none">
                    </div>
                    <div>
                        <label class="block font-bold text-gray-600 mb-1">Prioridad*</label>
                        <select name="prioridad"
                            class="w-full border border-gray-300 rounded p-2 focus:border-gob-guinda outline-none bg-white">
                            <option th:each="p : ${prioridades}" th:value="${p}" th:text="${p}"
                                th:selected="${expediente.prioridad == p}"></option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-bold text-gray-600 mb-1">Gerencia*</label>
                        <select name="gerencia.id"
                            class="w-full border border-gray-300 rounded p-2 focus:border-gob-guinda outline-none bg-white"
                            required>
                            <option value="">Selecciona...</option>
                            <option th:each="g : ${gerencias}" th:value="${g.id}" th:text="${g.nombre}"
                                th:selected="${expediente.gerencia != null and expediente.gerencia.id == g.id}">
                            </option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold text-gray-600 mb-1">Estado / Sede*</label>
                        <select name="sede"
                            class="w-full border border-gray-300 rounded p-2 focus:border-gob-guinda outline-none bg-white"
                            required>
                            <option value="">Seleccione estado...</option>
                            <option th:each="est : ${estados}" th:value="${est.nombre}" th:text="${est.nombre}"
                                th:selected="${expediente.sede == est.nombre}"></option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-bold text-gray-600 mb-1">Materia*</label>
                        <select name="materia.id"
                            class="w-full border border-gray-300 rounded p-2 focus:border-gob-guinda outline-none bg-white"
                            required>
                            <option value="">Selecciona...</option>
                            <option th:each="m : ${materias}" th:value="${m.id}" th:text="${m.nombre}"
                                th:selected="${expediente.materia != null and expediente.materia.id == m.id}"></option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold text-gray-600 mb-1">Tipo Expediente*</label>
                        <select name="tipoExpediente.id"
                            class="w-full border border-gray-300 rounded p-2 focus:border-gob-guinda outline-none bg-white"
                            required>
                            <option value="">Selecciona...</option>
                            <option th:each="t : ${tipos}" th:value="${t.id}" th:text="${t.nombre}"
                                th:selected="${expediente.tipoExpediente != null and expediente.tipoExpediente.id == t.id}">
                            </option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-bold text-gray-600 mb-1">Órgano Jurisdiccional</label>
                        <select name="organoJurisdiccional.id"
                            class="w-full border border-gray-300 rounded p-2 focus:border-gob-guinda outline-none bg-white">
                            <option value="">Selecciona órgano...</option>
                            <option th:each="o : ${organos}" th:value="${o.id}" th:text="${o.nombre}"
                                th:selected="${expediente.organoJurisdiccional != null and expediente.organoJurisdiccional.id == o.id}">
                            </option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold text-gray-600 mb-1">Etapa Procesal*</label>
                        <select name="etapaProcesal"
                            class="w-full border border-gray-300 rounded p-2 focus:border-gob-guinda outline-none bg-white"
                            required>
                            <option th:each="e : ${etapas}" th:value="${e}" th:text="${e}"
                                th:selected="${expediente.etapaProcesal == e}"></option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block font-bold text-gray-600 mb-1">Abogado Responsable*</label>
                    <select name="abogadoResponsable.id"
                        class="w-full border border-gray-300 rounded p-2 focus:border-gob-guinda outline-none bg-white">
                        <option value="">Asignar abogado...</option>
                        <option th:each="a : ${usuarios}" th:value="${a.id}" th:text="${a.nombreCompleto}"
                            th:selected="${expediente.abogadoResponsable != null and expediente.abogadoResponsable.id == a.id}">
                        </option>
                    </select>
                </div>

                <div>
                    <label class="block font-bold text-gray-600 mb-1">Partes Procesales</label>
                    <input type="text" name="partes" th:value="${expediente.partes}"
                        placeholder="Ej: Juan Pérez vs Inmobiliaria S.A."
                        class="w-full border border-gray-300 rounded p-2 focus:border-gob-guinda outline-none">
                </div>

                <div class="col-span-1 md:col-span-2">
                    <label class="block font-bold text-gray-600 mb-1">Descripción</label>
                    <textarea name="descripcion" rows="4" required
                        placeholder="Escribe aquí todo el detalle del expediente. Esta información se verá en la vista detallada."
                        class="w-full border border-gray-300 rounded p-2 focus:border-gob-guinda outline-none resize-none"
                        th:text="${expediente.descripcion}"></textarea>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-gray-100 mt-4">
                    <button type="button" onclick="closeModal('modal-editar')"
                        class="px-4 py-2 border border-gray-300 text-gray-600 rounded hover:bg-gray-50 font-medium">
                        Cancelar
                    </button>
                    <button type="submit"
                        class="px-6 py-2 bg-gob-guinda text-white rounded hover:bg-gob-guinda-claro font-bold shadow flex items-center gap-2">
                        <i class="fas fa-save"></i> Guardar Cambios
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 3. MODAL CAMBIAR ETAPA -->
    <div id="modal-etapa"
        class="fixed inset-0 z-50 hidden items-center justify-center bg-gray-900/50 backdrop-blur-sm p-4">
        <div class="relative w-full max-w-md bg-white rounded-lg shadow-2xl border-t-4 border-green-600">
            <div class="p-4 border-b bg-gray-50 rounded-t-lg flex justify-between items-center">
                <h3 class="text-lg font-bold text-gray-800">
                    <i class="fas fa-step-forward text-green-600 mr-2"></i> Cambiar Etapa Procesal
                </h3>
                <button onclick="closeModal('modal-etapa')" class="text-gray-400 hover:text-gray-900">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-6">
                <p class="text-sm text-gray-600 mb-4">Seleccione la nueva etapa para este expediente:</p>
                <div class="space-y-2" id="lista-etapas">
                    <!-- Se llenará dinámicamente con JavaScript -->
                </div>
            </div>
        </div>
    </div>

</div>
