<div th:fragment="filtros" class="mb-10 bg-white p-4 rounded-lg shadow-sm border border-gray-100">
    <form th:action="@{/expedientes}" method="get" id="formFiltros" class="flex flex-col gap-4">
        <input type="hidden" name="keyword" th:value="${keyword}">

        <!-- Header row -->
        <div class="flex justify-between items-center pb-3 border-b border-gray-50 mb-1">
            <h3 class="text-xs font-extrabold text-gob-oro uppercase tracking-widest flex items-center gap-2">
                <i class="fas fa-filter text-[10px]"></i> Filtros de Expedientes
            </h3>


        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
            <!-- Gerencia -->
            <div th:if="${rolActual != null and (rolActual.name() == 'ADMIN' or rolActual.name() == 'DIRECCION' or rolActual.name() == 'SUBDIRECCION')}"
                class="w-full">
                <select name="gerenciaId" onchange="this.form.submit()"
                    class="w-full border border-gray-200 rounded p-2 text-sm focus:border-gob-guinda outline-none bg-gray-50/50 text-gray-700 font-medium transition-all hover:border-gray-300">
                    <option value="">Gerencia (Todas)</option>
                    <option th:each="g : ${listaGerencias}" th:value="${g.id}" th:text="${g.nombre}"
                        th:selected="${param.gerenciaId != null and #arrays.length(param.gerenciaId) > 0 and param.gerenciaId[0] == #strings.toString(g.id)}">
                    </option>
                </select>
            </div>

            <!-- Materia -->
            <div th:if="${rolActual != null and rolActual.name() != 'ABOGADO'}" class="w-full">
                <select name="materiaId" onchange="this.form.submit()"
                    class="w-full border border-gray-200 rounded p-2 text-sm focus:border-gob-guinda outline-none bg-gray-50/50 text-gray-700 font-medium transition-all hover:border-gray-300">
                    <option value="">Materia (Todas)</option>
                    <option th:each="m : ${listaMaterias}" th:value="${m.id}" th:text="${m.nombre}"
                        th:selected="${param.materiaId != null and #arrays.length(param.materiaId) > 0 and param.materiaId[0] == #strings.toString(m.id)}">
                    </option>
                </select>
            </div>

            <!-- Abogado -->
            <div th:if="${rolActual != null and rolActual.name() != 'ABOGADO'}" class="w-full">
                <select name="abogadoId" onchange="this.form.submit()"
                    class="w-full border border-gray-200 rounded p-2 text-sm focus:border-gob-guinda outline-none bg-gray-50/50 text-gray-700 font-medium transition-all hover:border-gray-300">
                    <option value="">Abogado (Todos)</option>
                    <option th:each="a : ${listaAbogados}" th:value="${a.id}" th:text="${a.nombreCompleto}"
                        th:selected="${param.abogadoId != null and #arrays.length(param.abogadoId) > 0 and param.abogadoId[0] == #strings.toString(a.id)}">
                    </option>
                </select>
            </div>

            <!-- Prioridad -->
            <div class="w-full">
                <select name="prioridadId" onchange="this.form.submit()"
                    class="w-full border border-gray-200 rounded p-2 text-sm focus:border-gob-guinda outline-none bg-gray-50/50 text-gray-700 font-medium transition-all hover:border-gray-300">
                    <option value="">Prioridad (Todas)</option>
                    <option th:each="p : ${listaPrioridades}" th:value="${p.id}" th:text="${p.nombre}"
                        th:selected="${param.prioridadId != null and #arrays.length(param.prioridadId) > 0 and param.prioridadId[0] == #strings.toString(p.id)}">
                    </option>
                </select>
            </div>
        </div>
    </form>
</div>
