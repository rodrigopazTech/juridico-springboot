<div th:fragment="filtros" class="mb-10">
    <form th:action="@{/expedientes}" method="get" id="formFiltros" class="flex flex-wrap items-center gap-4">
        <input type="hidden" name="keyword" th:value="${keyword}">

        <div class="flex items-center gap-2 text-gob-guinda/40 mr-2">
            <i class="fas fa-filter text-xs"></i>
            <span class="text-[10px] font-extrabold uppercase tracking-widest">Filtrar por:</span>
        </div>

        <!-- Gerencia chip -->
        <div th:if="${rolActual != null and (rolActual.name() == 'ADMIN' or rolActual.name() == 'DIRECCION' or rolActual.name() == 'SUBDIRECCION')}"
             class="filter-chip group">
            <i class="fas fa-building text-gob-oro/50 group-hover:text-gob-oro transition-colors"></i>
            <select name="gerenciaId" onchange="this.form.submit()">
                <option value="">Gerencia (Todas)</option>
                <option th:each="g : ${listaGerencias}" th:value="${g.id}" th:text="${g.nombre}"
                        th:selected="${param.gerenciaId != null and #arrays.length(param.gerenciaId) > 0 and param.gerenciaId[0] == #strings.toString(g.id)}"></option>
            </select>
            <i class="fas fa-chevron-down chip-icon"></i>
        </div>

        <!-- Materia chip -->
        <div th:if="${rolActual != null and rolActual.name() != 'ABOGADO'}" class="filter-chip group">
            <i class="fas fa-gavel text-gob-oro/50 group-hover:text-gob-oro transition-colors"></i>
            <select name="materiaId" onchange="this.form.submit()">
                <option value="">Materia (Todas)</option>
                <option th:each="m : ${listaMaterias}" th:value="${m.id}" th:text="${m.nombre}"
                        th:selected="${param.materiaId != null and #arrays.length(param.materiaId) > 0 and param.materiaId[0] == #strings.toString(m.id)}"></option>
            </select>
            <i class="fas fa-chevron-down chip-icon"></i>
        </div>

        <!-- Abogado chip -->
        <div th:if="${rolActual != null and rolActual.name() != 'ABOGADO'}" class="filter-chip group">
            <i class="fas fa-user-tie text-gob-oro/50 group-hover:text-gob-oro transition-colors"></i>
            <select name="abogadoId" onchange="this.form.submit()">
                <option value="">Abogado (Todos)</option>
                <option th:each="a : ${listaAbogados}" th:value="${a.id}" th:text="${a.nombreCompleto}"
                        th:selected="${param.abogadoId != null and #arrays.length(param.abogadoId) > 0 and param.abogadoId[0] == #strings.toString(a.id)}"></option>
            </select>
            <i class="fas fa-chevron-down chip-icon"></i>
        </div>

        <!-- Prioridad chip -->
        <div class="filter-chip group">
            <i class="fas fa-layer-group text-gob-oro/50 group-hover:text-gob-oro transition-colors"></i>
            <select name="prioridadId" onchange="this.form.submit()">
                <option value="">Prioridad (Todas)</option>
                <option th:each="p : ${listaPrioridades}" th:value="${p.id}" th:text="${p.nombre}"
                        th:selected="${param.prioridadId != null and #arrays.length(param.prioridadId) > 0 and param.prioridadId[0] == #strings.toString(p.id)}"></option>
            </select>
            <i class="fas fa-chevron-down chip-icon"></i>
        </div>

        <!-- Limpiar filtros -->
        <a th:href="@{/expedientes}"
           class="ml-auto text-[10px] text-gray-400 hover:text-gob-guinda font-bold uppercase tracking-widest transition-all p-2 hover:bg-gob-guinda/5 rounded-lg flex items-center gap-2">
            <i class="fas fa-redo-alt text-[9px]"></i>
            Limpiar Filtros
        </a>
    </form>
</div>
