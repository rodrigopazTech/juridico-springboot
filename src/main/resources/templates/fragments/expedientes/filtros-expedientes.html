<div th:fragment="filtros" class="bg-[#faf9f7] px-4 py-3 sm:px-5 border-b border-gray-100">
    <form th:action="@{/expedientes}" method="get" id="formFiltros" class="flex flex-col xl:flex-row xl:items-center gap-3">
        <input type="hidden" name="keyword" th:value="${param.keyword}">

        <!-- Header row -->
        <div class="flex justify-between items-center xl:w-44 gap-3">
            <h3 class="text-[11px] font-extrabold text-gob-oro uppercase tracking-wide flex items-center gap-2 whitespace-nowrap">
                <i class="fas fa-filter text-[10px]"></i> Filtros de Expedientes
            </h3>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-2 flex-1">
            <!-- Gerencia -->
            <div th:if="${rolActual != null and (rolActual.name() == 'ADMIN' or rolActual.name() == 'DIRECTOR' or rolActual.name() == 'DIRECTOR_PRINCIPAL' or rolActual.name() == 'SUBDIRECTOR')}"
                class="w-full">
                <select name="gerenciaId"
                    class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:border-gob-guinda outline-none bg-white text-gray-700 font-medium transition-all hover:border-gray-300">
                    <option value="">Gerencia (Todas)</option>
                    <option th:each="g : ${listaGerencias}" th:value="${g.id}" th:text="${g.nombre}"
                        th:selected="${param.gerenciaId != null and #arrays.length(param.gerenciaId) > 0 and param.gerenciaId[0] == #strings.toString(g.id)}">
                    </option>
                </select>
            </div>

            <!-- Materia -->
            <div th:if="${rolActual != null and rolActual.name() != 'ABOGADO'}" class="w-full">
                <select name="materiaId"
                    class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:border-gob-guinda outline-none bg-white text-gray-700 font-medium transition-all hover:border-gray-300">
                    <option value="">Materia (Todas)</option>
                    <option th:each="m : ${listaMaterias}" th:value="${m.id}" th:text="${m.nombre}"
                        th:selected="${param.materiaId != null and #arrays.length(param.materiaId) > 0 and param.materiaId[0] == #strings.toString(m.id)}">
                    </option>
                </select>
            </div>

            <!-- Abogado -->
            <div th:if="${rolActual != null and rolActual.name() != 'ABOGADO'}" class="w-full">
                <select name="abogadoId"
                    class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:border-gob-guinda outline-none bg-white text-gray-700 font-medium transition-all hover:border-gray-300">
                    <option value="">Abogado (Todos)</option>
                    <option th:each="a : ${listaAbogados}" th:value="${a.id}" th:text="${a.nombreCompleto}"
                        th:selected="${param.abogadoId != null and #arrays.length(param.abogadoId) > 0 and param.abogadoId[0] == #strings.toString(a.id)}">
                    </option>
                </select>
            </div>

            <!-- Prioridad -->
            <div class="w-full">
                <select name="prioridadId"
                    class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:border-gob-guinda outline-none bg-white text-gray-700 font-medium transition-all hover:border-gray-300">
                    <option value="">Prioridad (Todas)</option>
                    <option th:each="p : ${listaPrioridades}" th:value="${p.id}" th:text="${p.nombre}"
                        th:selected="${param.prioridadId != null and #arrays.length(param.prioridadId) > 0 and param.prioridadId[0] == #strings.toString(p.id)}">
                    </option>
                </select>
            </div>

            <!-- Etapa -->
            <div class="w-full">
                <select name="etapa"
                    class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:border-gob-guinda outline-none bg-white text-gray-700 font-medium transition-all hover:border-gray-300">
                    <option value="">Etapa (Todas)</option>
                    <option th:each="e : ${etapas}" th:value="${e.name()}" th:text="${e.name()}"
                        th:selected="${param.etapa != null and #arrays.length(param.etapa) > 0 and param.etapa[0] == e.name()}">
                    </option>
                </select>
            </div>
        </div>
    </form>
</div>
