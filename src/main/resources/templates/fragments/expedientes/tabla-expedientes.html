<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
</head>

<body>
    <div th:fragment="tabla" class="overflow-x-auto bg-white rounded-xl shadow-sm border border-gray-100">
        <table class="w-full text-sm text-left text-gray-500">
            <thead class="text-xs text-gray-700 uppercase bg-gray-50/50 border-b border-gray-100">
                <tr>
                    <th scope="col" class="px-6 py-4 font-bold">Expediente</th>
                    <th scope="col" class="px-6 py-4 font-bold">Partes / Descripción</th>
                    <th scope="col" class="px-6 py-4 font-bold">Materia</th>
                    <th scope="col" class="px-6 py-4 font-bold">Etapa</th>
                    <th scope="col" class="px-6 py-4 font-bold text-center">Prioridad</th>
                    <th scope="col" class="px-6 py-4 font-bold">Responsable</th>
                    <th scope="col" class="px-6 py-4 font-bold text-right">Acciones</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-50">
                <tr th:each="exp : ${expedientes.content}"
                    class="hover:bg-gray-50/80 transition-colors group cursor-pointer"
                    th:onclick="|window.location.href='/expedientes/' + '${exp.id}'|">

                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex flex-col">
                            <span class="text-gob-guinda font-bold text-base group-hover:underline"
                                th:text="${exp.numero}">EXP-000</span>
                            <span class="text-[10px] text-gray-400 font-medium pb-1"
                                th:text="${#temporals.format(exp.createdAt, 'dd/MM/yyyy')}">01/01/2023</span>

                        </div>
                    </td>

                    <td class="px-6 py-4">
                        <p class="text-gray-700 font-medium line-clamp-1 max-w-xs"
                            th:text="${exp.partes != null ? exp.partes : exp.descripcion}">
                            Descripción del expediente...
                        </p>
                        <span class="text-[10px] text-gray-400 italic truncate block max-w-xs"
                            th:text="${exp.organoJurisdiccional != null ? exp.organoJurisdiccional.nombre : 'Sin Órgano'}">
                            Órgano Jurisdiccional
                        </span>
                    </td>

                    <td class="px-6 py-4 whitespace-nowrap">
                        <span
                            class="px-2.5 py-1 rounded-md text-[11px] font-bold bg-gray-100 text-gray-600 border border-gray-200"
                            th:text="${exp.materia != null ? exp.materia.nombre : 'S/N'}">
                            MATERIA
                        </span>
                    </td>

                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2.5 py-1 rounded-md text-[11px] font-bold border"
                            th:text="${exp.etapaCatalogo != null ? exp.etapaCatalogo.nombreJerarquico : exp.etapaProcesal}"
                            th:classappend="${exp.etapaProcesal.name() == 'TRAMITE' ? 'badge-tramite' : 
                                               (exp.etapaProcesal.name() == 'LAUDO' ? 'badge-laudo' : 
                                               (exp.etapaProcesal.name() == 'FIRME' ? 'badge-firme' : 'badge-concluido'))}">
                            ETAPA
                        </span>
                    </td>

                    <td class="px-6 py-4 whitespace-nowrap text-center">
                        <span class="inline-flex items-center px-2.5 py-1 rounded-md text-[11px] font-bold border"
                            th:classappend="${exp.prioridad != null ? exp.prioridad.color : 'text-gray-500 bg-gray-100'}">
                            <i class="fas fa-circle text-[6px] mr-1.5 opacity-70"></i>
                            <span th:text="${exp.prioridad != null ? exp.prioridad.nombre : 'S/N'}">PRIORIDAD</span>
                        </span>
                    </td>

                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex items-center">
                            <div
                                class="w-7 h-7 rounded-full bg-gob-oro/20 flex items-center justify-center text-gob-guinda font-bold text-[10px] mr-2 border border-gob-oro/30">
                                <span
                                    th:text="${exp.abogadoResponsable != null ? #strings.substring(exp.abogadoResponsable.nombreCompleto, 0, 1) : '?'}">A</span>
                            </div>
                            <span class="text-xs text-gray-600 font-medium"
                                th:text="${exp.abogadoResponsable != null ? exp.abogadoResponsable.nombreCompleto : 'Sin Asignar'}">
                                Nombre Abogado
                            </span>
                        </div>
                    </td>

                    <td class="px-6 py-4 whitespace-nowrap text-right text-xs font-medium">
                        <a th:href="@{/expedientes/{id}(id=${exp.id})}"
                            class="text-gob-guinda hover:text-gob-guindaDark p-2 rounded-lg hover:bg-gray-100 transition-colors">
                            <i class="fas fa-eye text-base"></i>
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
