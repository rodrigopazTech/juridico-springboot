<div th:fragment="barra" class="flex flex-col md:flex-row gap-3 items-stretch md:items-center flex-1 justify-start">
    <form id="form-search-expedientes" th:action="@{/expedientes}" method="get" class="relative w-full md:flex-1 md:max-w-2xl">
        <input type="hidden" name="gerenciaId" th:value="${paramGerenciaId}">
        <input type="hidden" name="materiaId" th:value="${paramMateriaId}">
        <input type="hidden" name="abogadoId" th:value="${paramAbogadoId}">
        <input type="hidden" name="etapa" th:value="${paramEtapa}">

        <input type="hidden" name="prioridadId" th:value="${paramPrioridadId}">
        
        <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
            <i class="fas fa-search text-gray-400"></i>
        </div>
        <input type="text" id="input-search-expedientes" name="keyword" th:value="${keyword}"
            class="bg-white border border-gray-200 text-gray-900 text-sm rounded-md focus:border-gob-oro focus:ring-2 focus:ring-gob-oro/10 block w-full ps-10 pe-10 py-2.5 outline-none transition-all font-medium"
            placeholder="Buscar expediente o partes...">

        <!-- Botón para limpiar (Solo visible si hay texto) -->
        <button type="button" id="btn-clear-search-expedientes" th:classappend="${keyword == null || keyword == '' ? 'hidden' : ''}"
            class="absolute inset-y-0 end-0 flex items-center pe-3 text-gray-400 hover:text-gray-600">
            <i class="fas fa-times-circle"></i>
        </button>
    </form>

    <button type="button" id="btn-limpiar-filtros-expedientes"
        class="w-full md:w-auto inline-flex items-center justify-center gap-2 rounded-md border border-gray-300 bg-white px-4 py-2.5 text-sm font-semibold text-gob-gris shadow-sm transition-colors hover:border-gob-guinda/40 hover:bg-gob-guinda/5 hover:text-gob-guinda focus:outline-none focus:ring-2 focus:ring-gob-oro/30"
        aria-label="Limpiar filtro">
        <i class="fas fa-eraser text-xs" aria-hidden="true"></i>
        <span>Limpiar filtro</span>
    </button>

    <div class="flex gap-2 w-full md:w-auto md:ml-auto">
        <a th:href="@{/expedientes/exportar-excel(
                keyword=${keyword},
                gerenciaId=${paramGerenciaId},
                materiaId=${paramMateriaId},
                abogadoId=${paramAbogadoId},
                etapa=${paramEtapa},

                prioridadId=${paramPrioridadId}
           )}"
            class="flex-1 md:flex-none text-gob-gris bg-white border border-gray-300 hover:bg-gray-50 font-semibold rounded-md text-sm px-4 py-2.5 shadow-sm transition-colors flex items-center justify-center decoration-0"
            title="Descargar Reporte Excel">
            <i class="fas fa-file-excel text-green-600 mr-2"></i> Exportar
        </a>

        <button th:if="${rolActual != null}"
            onclick="document.getElementById('modal-nuevo-exp').classList.remove('hidden')"
            class="flex-1 md:flex-none text-white bg-gob-guinda hover:bg-gob-guindaDark font-bold rounded-md text-sm px-5 py-2.5 shadow-md transition-colors flex items-center justify-center gap-2 whitespace-nowrap">
            <i class="fas fa-plus"></i> Nuevo Expediente
        </button>
    </div>
</div>
