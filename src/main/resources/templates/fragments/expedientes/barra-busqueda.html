<div th:fragment="barra" class="flex flex-col md:flex-row gap-4 items-center flex-1 justify-start">
    <form id="form-search-expedientes" th:action="@{/expedientes}" method="get" class="relative w-full md:flex-1 md:max-w-xl">
        <input type="hidden" name="gerenciaId" th:value="${param.gerenciaId}">
        <input type="hidden" name="materiaId" th:value="${param.materiaId}">
        <input type="hidden" name="abogadoId" th:value="${param.abogadoId}">
        <input type="hidden" name="etapa" th:value="${param.etapa}">
        <input type="hidden" name="etiquetaId" th:value="${param.etiquetaId}">
        <input type="hidden" name="prioridadId" th:value="${param.prioridadId}">
        <input type="hidden" name="tipoId" th:value="${param.tipoId}">
        
        <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
            <i class="fas fa-search text-gray-400"></i>
        </div>
        <input type="text" id="input-search-expedientes" name="keyword" th:value="${keyword}"
            class="bg-white border border-gray-200 text-gray-900 text-sm rounded-lg focus:border-gob-oro focus:ring-2 focus:ring-gob-oro/10 block w-full ps-10 pe-10 p-2.5 outline-none transition-all font-medium"
            placeholder="Buscar expediente o partes...">

        <!-- Botón para limpiar (Solo visible si hay texto) -->
        <button type="button" id="btn-clear-search-expedientes" th:classappend="${keyword == null || keyword == '' ? 'hidden' : ''}"
            class="absolute inset-y-0 end-0 flex items-center pe-3 text-gray-400 hover:text-gray-600">
            <i class="fas fa-times-circle"></i>
        </button>
    </form>

    <div class="flex gap-2 w-full md:w-auto md:ml-auto">
        <a th:href="@{/expedientes/exportar-excel(
                keyword=${keyword},
                gerenciaId=${param.gerenciaId},
                materiaId=${param.materiaId},
                abogadoId=${param.abogadoId},
                etapa=${param.etapa},
                etiquetaId=${param.etiquetaId},
                prioridadId=${param.prioridadId},
                tipoId=${param.tipoId}
           )}"
            class="flex-1 md:flex-none text-gob-gris bg-white border border-gray-300 hover:bg-gray-50 font-medium rounded-lg text-sm px-4 py-2.5 shadow-sm transition-colors flex items-center justify-center decoration-0"
            title="Descargar Reporte Excel">
            <i class="fas fa-file-excel text-green-600 mr-2"></i> Exportar
        </a>

        <button th:if="${rolActual != null and (rolActual.name() == 'ADMIN' or rolActual.name() == 'DIRECCION' or rolActual.name() == 'SUBDIRECCION')}"
            onclick="document.getElementById('modal-nuevo-exp').classList.remove('hidden')"
            class="flex-1 md:flex-none text-white bg-gob-guinda hover:bg-gob-guindaDark font-bold rounded-lg text-sm px-5 py-2.5 shadow-md transition-colors flex items-center justify-center gap-2">
            <i class="fas fa-plus"></i> Nuevo Expediente
        </button>
    </div>
</div>
