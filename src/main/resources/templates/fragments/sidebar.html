<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
</head>

<body>

    <aside th:fragment="sidebar" id="logo-sidebar"
        class="fixed top-0 left-0 z-40 w-64 h-screen transition-transform -translate-x-full sm:translate-x-0 glass-sidebar"
        aria-label="Sidebar">

        <div class="h-full px-4 py-6 flex flex-col">

            <a th:href="@{/}" class="flex items-center mb-10 px-2 group">
                <div
                    class="p-2.5 bg-white/10 rounded-xl group-hover:bg-gob-oro/20 transition-all duration-500 shadow-inner">
                    <i
                        class="fas fa-balance-scale text-gob-oro text-2xl group-hover:rotate-12 transition-transform"></i>
                </div>
                <div class="ms-3">
                    <span class="block text-lg font-black text-white font-headings tracking-tighter leading-none">
                        LEGAL <span class="text-gob-oro">CORE</span>
                    </span>
                    <span class="text-[10px] text-gray-400 font-bold uppercase tracking-[0.2em]">Management
                        System</span>
                </div>
            </a>

            <ul class="space-y-1.5 flex-1">
                <li class="px-3 mb-2">
                    <span class="text-[10px] font-black text-gray-500 uppercase tracking-widest">General</span>
                </li>

                <li sec:authorize="hasAnyAuthority('ADMIN','DIRECCION', 'SUBDIRECCION', 'GERENTE', 'JEFE_DEPTO')">
                    <a th:href="@{/dashboard}"
                        class="flex items-center p-3 text-sm font-bold transition-all duration-300 rounded-xl group"
                        th:classappend="${activePage == 'dashboard' ? 'bg-gob-oro text-gob-verde shadow-lg shadow-gob-oro/10' : 'text-gray-400 hover:bg-white/5 hover:text-white'}">
                        <i class="fas fa-chart-line w-5 text-center"
                            th:classappend="${activePage == 'dashboard' ? 'text-gob-verde' : 'group-hover:text-gob-oro'}"></i>
                        <span class="ms-3">Panel de Control</span>
                    </a>
                </li>

                <li>
                    <a th:href="@{/calendario}"
                        class="flex items-center p-3 text-sm font-bold transition-all duration-300 rounded-xl group"
                        th:classappend="${activePage == 'calendario' ? 'bg-gob-oro text-gob-verde shadow-lg shadow-gob-oro/10' : 'text-gray-400 hover:bg-white/5 hover:text-white'}">
                        <i class="far fa-calendar-check w-5 text-center"
                            th:classappend="${activePage == 'calendario' ? 'text-gob-verde' : 'group-hover:text-gob-oro'}"></i>
                        <span class="ms-3">Calendario Legal</span>
                    </a>
                </li>

                <li class="px-3 mt-8 mb-2">
                    <span class="text-[10px] font-black text-gray-500 uppercase tracking-widest">Operaciones</span>
                </li>

                <li>
                    <a th:href="@{/expedientes}"
                        class="flex items-center p-3 text-sm font-bold transition-all duration-300 rounded-xl group"
                        th:classappend="${activePage == 'expedientes' ? 'bg-gob-oro text-gob-verde shadow-lg shadow-gob-oro/10' : 'text-gray-400 hover:bg-white/5 hover:text-white'}">
                        <i class="fas fa-briefcase w-5 text-center"
                            th:classappend="${activePage == 'expedientes' ? 'text-gob-verde' : 'group-hover:text-gob-oro'}"></i>
                        <span class="ms-3">Expedientes</span>
                    </a>
                </li>

                <li>
                    <a th:href="@{/audiencias}"
                        class="flex items-center p-3 text-sm font-bold transition-all duration-300 rounded-xl group"
                        th:classappend="${activePage == 'audiencias' ? 'bg-gob-oro text-gob-verde shadow-lg shadow-gob-oro/10' : 'text-gray-400 hover:bg-white/5 hover:text-white'}">
                        <i class="fas fa-gavel w-5 text-center"
                            th:classappend="${activePage == 'audiencias' ? 'text-gob-verde' : 'group-hover:text-gob-oro'}"></i>
                        <span class="ms-3">Audiencias</span>
                    </a>
                </li>
            </ul>

            <div class="mt-auto pt-6 border-t border-white/5">
                <div class="flex items-center p-3 mb-4 bg-white/5 rounded-2xl border border-white/5 shadow-inner">
                    <div class="flex-shrink-0 relative">
                        <div class="w-10 h-10 rounded-xl bg-gob-oro flex items-center justify-center text-gob-verde font-black text-lg shadow-lg"
                            th:text="${usuarioGlobal.nombreCompleto != null and !usuarioGlobal.nombreCompleto.isEmpty() ? #strings.substring(usuarioGlobal.nombreCompleto, 0, 1) : 'U'}">
                            U
                        </div>
                        <div
                            class="absolute -bottom-1 -right-1 w-4 h-4 bg-emerald-500 border-2 border-gob-verde rounded-full">
                        </div>
                    </div>
                    <div class="ms-3 overflow-hidden">
                        <p class="text-xs font-black text-white truncate font-headings"
                            th:text="${usuarioGlobal.nombreCompleto}">Usuario</p>
                        <p class="text-[10px] text-gray-500 font-bold uppercase tracking-tight"
                            th:text="${usuarioGlobal.rol}">Rol</p>
                    </div>
                </div>

                <a th:href="@{/logout}"
                    class="flex items-center p-3 text-xs font-black text-red-400 uppercase tracking-widest hover:bg-red-500/10 hover:text-red-300 rounded-xl transition-all duration-300 group">
                    <i class="fas fa-power-off w-5 text-center group-hover:scale-110 transition-transform"></i>
                    <span class="ms-3">Salir del Sistema</span>
                </a>
            </div>
        </div>
    </aside>

</body>

</html>
