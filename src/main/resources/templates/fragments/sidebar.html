<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
</head>
<body>

    <aside th:fragment="sidebar" id="logo-sidebar"
        class="fixed top-0 left-0 z-40 w-64 h-screen transition-transform -translate-x-full sm:translate-x-0 bg-gob-verde border-r border-gob-oro shadow-2xl"
        aria-label="Sidebar">

        <div class="h-full pt-0 pb-5 overflow-y-auto bg-gob-verde flex flex-col custom-scrollbar">

            <a th:href="@{/}" class="flex items-center px-6 h-[72px] border-b border-white/10 group mb-6">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-gob-oro to-yellow-600 flex items-center justify-center shadow-lg group-hover:shadow-gob-oro/50 transition-all duration-300">
                    <i class="fas fa-balance-scale text-white text-xl group-hover:scale-110 transition-transform duration-300"></i>
                </div>
                <div class="ms-3 flex flex-col">
                    <span class="text-xl font-bold whitespace-nowrap text-white font-headings tracking-wide leading-tight">
                        Agenda Legal
                    </span>
                    <span class="text-[10px] text-white/50 tracking-widest uppercase font-bold">Sistema Jurídico</span>
                </div>
            </a>

            <ul class="space-y-1.5 font-medium flex-1">
                
                <li class="px-6 mt-2 mb-3">
                    <span class="text-[10px] font-extrabold text-white/40 uppercase tracking-widest">Principal</span>
                </li>

                <li
                    sec:authorize="hasAnyAuthority('ADMIN','DIRECCION', 'SUBDIRECCION', 'GERENTE', 'JEFE_DEPTO', 'ABOGADO')">
                    <a th:href="@{/dashboard}"
                        class="flex items-center px-4 py-2.5 mx-3 transition-all duration-300 rounded-xl group"
                        th:classappend="${activePage == 'dashboard' ? 'bg-white/10 text-white font-bold shadow-sm' : 'text-white/60 hover:bg-white/5 hover:text-white'}">
                        <i class="fas fa-chart-pie w-5 text-center text-lg transition-transform duration-300 group-hover:scale-110"
                            th:classappend="${activePage == 'dashboard' ? 'text-gob-oro drop-shadow-md' : 'text-white/40 group-hover:text-white/80'}"></i>
                        <span class="ms-3 text-sm">Dashboard</span>
                    </a>
                </li>

                <li sec:authorize="hasAnyAuthority('ADMIN','DIRECCION', 'SUBDIRECCION', 'GERENTE', 'JEFE_DEPTO')">
                    <a th:href="@{/agenda}"
                        class="flex items-center px-4 py-2.5 mx-3 transition-all duration-300 rounded-xl group"
                        th:classappend="${activePage == 'agenda' ? 'bg-white/10 text-white font-bold shadow-sm' : 'text-white/60 hover:bg-white/5 hover:text-white'}">
                        <i class="fas fa-address-book w-5 text-center text-lg transition-transform duration-300 group-hover:scale-110"
                            th:classappend="${activePage == 'agenda' ? 'text-gob-oro drop-shadow-md' : 'text-white/40 group-hover:text-white/80'}"></i>
                        <span class="ms-3 text-sm">Agenda Historial</span>
                    </a>
                </li>

                <li>
                    <a th:href="@{/calendario}" 
                        class="flex items-center px-4 py-2.5 mx-3 transition-all duration-300 rounded-xl group"
                        th:classappend="${activePage == 'calendario' ? 'bg-white/10 text-white font-bold shadow-sm' : 'text-white/60 hover:bg-white/5 hover:text-white'}">
                        <i class="fas fa-calendar-alt w-5 text-center text-lg transition-transform duration-300 group-hover:scale-110"
                            th:classappend="${activePage == 'calendario' ? 'text-gob-oro drop-shadow-md' : 'text-white/40 group-hover:text-white/80'}"></i>
                        <span class="ms-3 text-sm">Calendario</span>
                    </a>
                </li>

                <li>
                    <a th:href="@{/tareas}"
                        class="flex items-center px-4 py-2.5 mx-3 transition-all duration-300 rounded-xl group"
                        th:classappend="${activePage == 'tareas' ? 'bg-white/10 text-white font-bold shadow-sm' : 'text-white/60 hover:bg-white/5 hover:text-white'}">
                        <i class="fas fa-tasks w-5 text-center text-lg transition-transform duration-300 group-hover:scale-110"
                            th:classappend="${activePage == 'tareas' ? 'text-gob-oro drop-shadow-md' : 'text-white/40 group-hover:text-white/80'}"></i>
                        <span class="ms-3 text-sm">Mis Tareas</span>
                    </a>
                </li>

                <li class="px-6 mt-8 mb-3">
                    <span class="text-[10px] font-extrabold text-white/40 uppercase tracking-widest">Gestión Jurídica</span>
                </li>

                <li>
                    <a th:href="@{/expedientes}"
                        class="flex items-center px-4 py-2.5 mx-3 transition-all duration-300 rounded-xl group"
                        th:classappend="${activePage == 'expedientes' ? 'bg-white/10 text-white font-bold shadow-sm' : 'text-white/60 hover:bg-white/5 hover:text-white'}">
                        <i class="fas fa-folder-open w-5 text-center text-lg transition-transform duration-300 group-hover:scale-110"
                            th:classappend="${activePage == 'expedientes' ? 'text-gob-oro drop-shadow-md' : 'text-white/40 group-hover:text-white/80'}"></i>
                        <span class="ms-3 text-sm">Expedientes</span>
                    </a>
                </li>

                <li>
                    <a th:href="@{/terminos}"
                        class="flex items-center px-4 py-2.5 mx-3 transition-all duration-300 rounded-xl group"
                        th:classappend="${activePage == 'terminos' ? 'bg-white/10 text-white font-bold shadow-sm' : 'text-white/60 hover:bg-white/5 hover:text-white'}">
                        <i class="fas fa-hourglass-half w-5 text-center text-lg transition-transform duration-300 group-hover:scale-110"
                            th:classappend="${activePage == 'terminos' ? 'text-gob-oro drop-shadow-md' : 'text-white/40 group-hover:text-white/80'}"></i>
                        <span class="ms-3 text-sm">Términos</span>
                    </a>
                </li>

                <li>
                    <a th:href="@{/audiencias}"
                        class="flex items-center px-4 py-2.5 mx-3 transition-all duration-300 rounded-xl group"
                        th:classappend="${activePage == 'audiencias' ? 'bg-white/10 text-white font-bold shadow-sm' : 'text-white/60 hover:bg-white/5 hover:text-white'}">
                        <i class="fas fa-gavel w-5 text-center text-lg transition-transform duration-300 group-hover:scale-110"
                            th:classappend="${activePage == 'audiencias' ? 'text-gob-oro drop-shadow-md' : 'text-white/40 group-hover:text-white/80'}"></i>
                        <span class="ms-3 text-sm">Audiencias</span>
                    </a>
                </li>

                <li sec:authorize="hasAnyAuthority('ADMIN', 'DIRECCION', 'SUBDIRECCION', 'GERENTE')" class="px-6 mt-8 mb-3">
                    <span class="text-[10px] font-extrabold text-white/40 uppercase tracking-widest">Administración</span>
                </li>

                <li sec:authorize="hasAnyAuthority('ADMIN', 'DIRECCION', 'SUBDIRECCION', 'GERENTE')">
                    <a th:href="@{/abogados}"
                        class="flex items-center px-4 py-2.5 mx-3 transition-all duration-300 rounded-xl group"
                        th:classappend="${activePage == 'abogados' ? 'bg-white/10 text-white font-bold shadow-sm' : 'text-white/60 hover:bg-white/5 hover:text-white'}">
                        <i class="fas fa-user-tie w-5 text-center text-lg transition-transform duration-300 group-hover:scale-110"
                            th:classappend="${activePage == 'abogados' ? 'text-gob-oro drop-shadow-md' : 'text-white/40 group-hover:text-white/80'}"></i>
                        <span class="ms-3 text-sm">Abogados</span>
                    </a>
                </li>

                <li sec:authorize="hasAnyAuthority('ADMIN', 'DIRECCION', 'SUBDIRECCION', 'GERENTE', 'JEFE_DEPTO')">
                    <a th:href="@{/catalogos}"
                        class="flex items-center px-4 py-2.5 mx-3 transition-all duration-300 rounded-xl group"
                        th:classappend="${activePage == 'catalogos' ? 'bg-white/10 text-white font-bold shadow-sm' : 'text-white/60 hover:bg-white/5 hover:text-white'}">
                        <i class="fas fa-clipboard-list w-5 text-center text-lg transition-transform duration-300 group-hover:scale-110"
                            th:classappend="${activePage == 'catalogos' ? 'text-gob-oro drop-shadow-md' : 'text-white/40 group-hover:text-white/80'}"></i>
                        <span class="ms-3 text-sm">Catálogos Generales</span>
                    </a>
                </li>

                <li sec:authorize="hasAuthority('ADMIN')">
                    <a th:href="@{/admin/importar}"
                        class="flex items-center px-4 py-2.5 mx-3 transition-all duration-300 rounded-xl group"
                        th:classappend="${activePage == 'importar' ? 'bg-white/10 text-white font-bold shadow-sm' : 'text-white/60 hover:bg-white/5 hover:text-white'}">
                        <i class="fas fa-file-import w-5 text-center text-lg transition-transform duration-300 group-hover:scale-110"
                            th:classappend="${activePage == 'importar' ? 'text-gob-oro drop-shadow-md' : 'text-white/40 group-hover:text-white/80'}"></i>
                        <span class="ms-3 text-sm">Migración Inteligente</span>
                    </a>
                </li>

            </ul>
        </div>
    </aside>

    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        .custom-scrollbar:hover::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>

</body>
</html>
