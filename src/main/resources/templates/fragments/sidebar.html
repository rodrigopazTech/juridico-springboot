<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    </head>
<body>

    <aside th:fragment="sidebar" id="logo-sidebar" 
           class="fixed top-0 left-0 z-40 w-64 h-screen transition-transform -translate-x-full sm:translate-x-0 bg-gob-verde border-r border-gob-oro shadow-2xl" 
           aria-label="Sidebar">
        
        <div class="h-full px-3 py-4 overflow-y-auto bg-gob-verde flex flex-col">
            
            <a th:href="@{/}" class="flex items-center ps-2.5 mb-8 group">
                <div class="p-2 bg-white/5 rounded-lg group-hover:bg-white/10 transition-colors">
                    <i class="fas fa-balance-scale text-gob-oro text-2xl group-hover:scale-110 transition-transform duration-300"></i>
                </div>
                <span class="self-center text-xl font-bold whitespace-nowrap text-white font-headings ms-3 tracking-wide">
                    Agenda Legal
                </span>
            </a>

          <ul class="space-y-2 font-medium flex-1">
                
            <li>
                    <a th:href="@{/dashboard}" 
                       class="flex items-center p-3 transition-all duration-200 border-l-4"
                       th:classappend="${activePage == 'dashboard' ? 'border-gob-oro bg-white/10 text-white' : 'border-transparent text-gray-400 hover:text-white hover:bg-white/5'}">
                        
                        <i class="fas fa-chart-pie w-6 h-6 transition duration-75"
                           th:classappend="${activePage == 'dashboard' ? 'text-gob-oro' : 'text-gray-500 group-hover:text-white'}"></i>
                        
                        <span class="ms-3">Panel Principal</span>
                        
                        <i th:if="${activePage == 'dashboard'}" class="fas fa-chevron-right ms-auto text-xs text-gob-oro"></i>
                    </a>
                </li>
            
            <li>
                    <a th:href="@{/expedientes}" 
                    class="flex items-center p-3 transition-all duration-200 border-l-4"
                    th:classappend="${activePage == 'expedientes' ? 'border-gob-oro bg-white/10 text-white' : 'border-transparent text-gray-400 hover:text-white hover:bg-white/5'}">
                        
                        <i class="fas fa-folder-open w-6 h-6 transition duration-75"
                        th:classappend="${activePage == 'expedientes' ? 'text-gob-oro' : 'text-gray-500 group-hover:text-white'}"></i>
                        
                        <span class="ms-3">Expedientes</span>
                        
                        <i th:if="${activePage == 'expedientes'}" class="fas fa-chevron-right ms-auto text-xs text-gob-oro"></i>
                    </a>
                </li>

                <li>
                    <a th:href="@{/terminos}" 
                    class="flex items-center p-3 transition-all duration-200 border-l-4"
                    th:classappend="${activePage == 'terminos' ? 'border-gob-oro bg-white/10 text-white' : 'border-transparent text-gray-400 hover:text-white hover:bg-white/5'}">
                        
                        <i class="fas fa-hourglass-end w-6 h-6 transition duration-75"
                        th:classappend="${activePage == 'terminos' ? 'text-gob-oro' : 'text-gray-500 group-hover:text-white'}"></i>
                        
                        <span class="ms-3">Términos</span>
                        
                        <i th:if="${activePage == 'terminos'}" class="fas fa-chevron-right ms-auto text-xs text-gob-oro"></i>
                    </a>
                </li>
            </ul>
            <div class="mt-auto pt-4 border-t border-white/10">
                <div class="flex items-center p-2 mb-2 bg-gob-guindaDark/20 rounded-lg border border-white/5">
                    <div class="flex-shrink-0">
                        <div class="w-10 h-10 rounded-full bg-gob-oro flex items-center justify-center text-gob-verde font-bold text-lg shadow-md border-2 border-gob-verde">
                            R
                        </div>
                    </div>
                    <div class="ms-3 overflow-hidden">
                        <p class="text-sm font-bold text-white truncate font-headings">Ricardo</p>
                        <p class="text-xs text-gray-400 truncate">Administrador</p>
                    </div>
                </div>

                <a th:href="@{/logout}" 
                   class="flex items-center p-2 text-red-300 rounded-lg hover:bg-red-900/30 hover:text-red-200 group transition-colors duration-200">
                    <i class="fas fa-sign-out-alt w-5 h-5 transition duration-75 group-hover:translate-x-1"></i>
                    <span class="ms-3 text-sm font-bold tracking-wider uppercase">Cerrar Sesión</span>
                </a>
            </div>
            
        </div>
    </aside>

</body>
</html>
