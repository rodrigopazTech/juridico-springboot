<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head></head>

<body>

    <th:block th:fragment="navbar">
    <nav
        class="bg-white/80 backdrop-blur-md border-b border-gray-200 px-3 sm:px-6 fixed top-0 left-0 sm:left-64 right-0 z-30 transition-all shadow-sm flex items-center h-[72px]">
        <div class="flex justify-between items-center w-full">

            <div class="flex items-center gap-2 sm:gap-0 min-w-0 flex-1">
                <!-- Botón Hamburguesa (solo visible en móvil) -->
                <button onclick="toggleSidebar()" class="sm:hidden p-2 rounded-lg text-gray-500 hover:bg-gray-100 hover:text-gob-guinda transition-all flex-shrink-0" aria-label="Abrir menú">
                    <i class="fas fa-bars text-xl"></i>
                </button>

                <h1 class="text-lg sm:text-xl md:text-2xl font-bold text-gray-800 font-headings flex items-center tracking-tight truncate">
                    <div class="p-2 bg-gob-oro/10 rounded-lg mr-2 sm:mr-3 text-gob-oro flex items-center justify-center flex-shrink-0">
                        <i th:if="${activePage == 'dashboard'}" class="fas fa-chart-pie"></i>
                        <i th:if="${activePage == 'agenda'}" class="fas fa-address-book"></i>
                        <i th:if="${activePage == 'calendario'}" class="fas fa-calendar-alt"></i>
                        <i th:if="${activePage == 'notificaciones'}" class="fas fa-bell"></i>
                        <i th:if="${activePage == 'expedientes'}" class="fas fa-folder-open"></i>
                        <i th:if="${activePage == 'terminos'}" class="fas fa-hourglass-half"></i>
                        <i th:if="${activePage == 'audiencias'}" class="fas fa-gavel"></i>
                        <i th:if="${activePage == 'perfil'}" class="fas fa-user-cog"></i>
                        <i th:if="${activePage == 'usuarios'}" class="fas fa-users-cog"></i>
                        <i th:if="${activePage == 'importar'}" class="fas fa-file-import"></i>
                        <i th:if="${activePage == 'tareas'}" class="fas fa-tasks"></i>
                        <i th:if="${activePage == null}" class="fas fa-balance-scale"></i>
                    </div>
                    <span class="truncate" th:text="${pageTitle != null ? pageTitle : 'Sistema Jurídico'}">Título de la Página</span>
                </h1>
            </div>

            <div class="flex items-center gap-1.5 sm:gap-3 flex-shrink-0">

                <!-- Campana de Notificaciones con Dropdown -->
                <div class="relative" id="notif-bell-wrapper">
                    <button id="notif-bell-btn" type="button" title="Centro de Notificaciones"
                        onclick="toggleNotifDropdown()"
                        class="relative p-2.5 rounded-full hover:bg-gray-100 transition-colors focus:outline-none">
                        <i class="fas fa-bell text-xl text-gray-400 hover:text-gob-guinda transition-colors"></i>

                        <span th:if="${notificacionesNoLeidas != null and notificacionesNoLeidas > 0}"
                            id="notif-badge-ping"
                            class="absolute -top-0.5 -right-0.5 flex h-5 w-5 items-center justify-center">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-5 w-5 bg-red-600 text-white text-[10px] font-black items-center justify-center border-2 border-white shadow-sm"
                                  th:text="${notificacionesNoLeidas}">0</span>
                        </span>
                        <span th:if="${notificacionesNoLeidas == null or notificacionesNoLeidas == 0}"
                            id="notif-badge-ping" class="absolute -top-0.5 -right-0.5 hidden">
                        </span>
                    </button>

                    <!-- Dropdown Panel (responsive: fixed fullwidth en móvil, absolute en desktop) -->
                    <div id="notif-dropdown"
                        class="hidden fixed sm:absolute inset-x-0 sm:inset-x-auto sm:right-0 top-[72px] sm:top-auto sm:mt-2 w-full sm:w-96 bg-white sm:rounded-2xl shadow-2xl border-t sm:border border-gray-100 z-50 overflow-hidden max-h-[calc(100vh-72px)] sm:max-h-none">

                        <!-- Header -->
                        <div class="flex items-center justify-between px-5 py-3 bg-gradient-to-r from-gob-guinda to-red-800 text-white">
                            <div class="flex items-center gap-2">
                                <i class="fas fa-bell text-sm"></i>
                                <span class="font-bold text-sm font-headings">Notificaciones</span>
                                <span id="notif-count-badge"
                                    class="bg-white/20 text-white text-xs font-bold px-2 py-0.5 rounded-full">
                                    ...
                                </span>
                            </div>
                            <a href="/notificaciones" class="text-xs text-white/80 hover:text-white transition-colors font-medium">
                                Ver todas <i class="fas fa-arrow-right ml-1 text-[10px]"></i>
                            </a>
                        </div>

                        <!-- Lista -->
                        <div id="notif-dropdown-list" class="divide-y divide-gray-100 max-h-80 overflow-y-auto">
                            <div class="flex flex-col items-center justify-center py-10 text-gray-400">
                                <i class="fas fa-spinner fa-spin text-2xl mb-2 text-gob-guinda/30"></i>
                                <p class="text-xs">Cargando...</p>
                            </div>
                        </div>

                        <!-- Footer -->
                        <div class="px-5 py-3 bg-gray-50 border-t border-gray-100 text-center">
                            <a href="/notificaciones" class="text-xs text-gob-guinda hover:underline font-semibold">
                                <i class="fas fa-list-ul mr-1"></i> Ir al Centro de Notificaciones
                            </a>
                        </div>
                    </div>
                </div>

                <div class="h-8 w-px bg-gray-200 mx-0.5 sm:mx-2 hidden sm:block"></div>

                <div class="relative group cursor-pointer" th:if="${usuarioGlobal != null}">

                    <div
                        class="flex items-center gap-1.5 sm:gap-3 hover:bg-gray-50 p-1.5 sm:pr-4 rounded-full border border-transparent hover:border-gray-200 transition-all duration-300">
                        <!-- Nombre y rol ocultos en móvil -->
                        <div class="text-right flex-col justify-center hidden md:flex">
                            <p class="text-sm font-bold text-gray-800 leading-none font-headings"
                                th:text="${usuarioGlobal.nombreCompleto}">Usuario</p>
                            <p class="text-[10px] text-gray-500 leading-none mt-1 uppercase tracking-widest font-bold"
                                th:text="${usuarioGlobal.rol}">Rol</p>
                        </div>

                        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-gradient-to-br from-gob-oro to-yellow-600 flex items-center justify-center text-white font-bold text-sm shadow-md border-2 border-white"
                            th:text="${#strings.substring(usuarioGlobal.nombreCompleto, 0, 1)}">U</div>
                        <i
                            class="fas fa-chevron-down text-xs text-gray-400 group-hover:text-gob-guinda transition-transform duration-300 group-hover:rotate-180 hidden sm:inline"></i>
                    </div>

                    <div
                        class="absolute right-0 mt-2 w-56 bg-white rounded-2xl shadow-xl border border-gray-100 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 transform origin-top-right translate-y-3 group-hover:translate-y-0 z-50 overflow-hidden">
                        <div class="p-2 space-y-1">
                            <!-- Nombre visible en el dropdown solo en pantallas donde está oculto en la barra -->
                            <div class="px-3 py-2 border-b border-gray-50 mb-2 block md:hidden">
                                <p class="text-sm font-bold text-gray-700 truncate"
                                    th:text="${usuarioGlobal.nombreCompleto}">Usuario</p>
                                <p class="text-[10px] text-gray-400 uppercase tracking-widest font-bold"
                                    th:text="${usuarioGlobal.rol}">Rol</p>
                            </div>

                            <div class="p-2 space-y-1">
                                <a th:href="@{/perfil}"
                                    class="flex items-center px-3 py-2.5 text-sm text-gray-600 hover:bg-gray-50 hover:text-gob-guinda rounded-xl transition-colors font-medium">
                                    <i class="fas fa-user-circle w-5 text-center text-gray-400 mr-2"></i> Gestionar mi
                                    Cuenta
                                </a>

                                <div class="border-t border-gray-50 my-1"></div>

                                <a th:href="@{/logout}"
                                    class="flex items-center px-3 py-2.5 text-sm text-red-600 hover:bg-red-50 rounded-xl transition-colors font-bold">
                                    <i class="fas fa-sign-out-alt w-5 text-center mr-2"></i> Cerrar Sesión
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

        </div>
    </nav>

    <!-- =====================================================================
         TOAST / POPUP GLOBAL DE NOTIFICACIONES NUEVAS (Fuera del nav)
         ===================================================================== -->
    <div id="notif-toast-container"
        class="fixed bottom-5 right-5 z-[9999] flex flex-col gap-3 items-end pointer-events-none">
    </div>

        <script th:inline="none">
        /* -----------------------------------------------------------------------
           Sistema de Popup de Notificaciones (Navbar Bell)
           ----------------------------------------------------------------------- */
        (function () {
            const API_URL        = '/notificaciones/api/recientes';
            const TOAST_DURATION = 5000;  // ms que dura el toast

            // ---- IDs ya vistos cuando se cargó la página (para no hacer toast de notifs viejas) ----
            let seenIds = new Set();
            // Snapshot de IDs al momento de conectar el WS (se pobla en pollInitialState)
            let initialIdsLoaded = false;

            // ---- Mapas de estilo por Tipo ----
            const TIPO_META = {
                AUDIENCIA:  { icon: 'fa-gavel',         color: 'from-blue-500 to-blue-700',   badge: 'bg-blue-100 text-blue-700 border-blue-200'   },
                TERMINO:    { icon: 'fa-hourglass-end',  color: 'from-red-500 to-red-700',     badge: 'bg-red-100 text-red-700 border-red-200'      },
                EXPEDIENTE: { icon: 'fa-folder-open',    color: 'from-green-500 to-green-700', badge: 'bg-green-100 text-green-700 border-green-200' },
                OBSERVACION:{ icon: 'fa-comment-dots',   color: 'from-amber-500 to-amber-700', badge: 'bg-amber-100 text-amber-800 border-amber-200' },
                ASIGNACION: { icon: 'fa-user-check',     color: 'from-purple-500 to-purple-700',badge:'bg-purple-100 text-purple-700 border-purple-200'},
                SISTEMA:    { icon: 'fa-bell',           color: 'from-gray-500 to-gray-700',   badge: 'bg-gray-100 text-gray-700 border-gray-200'   },
            };

            const PRIORIDAD_META = {
                ALTA:   { icon: 'fa-exclamation-triangle', color: 'text-red-600',    label: 'Alta'   },
                MEDIA:  { icon: 'fa-minus-circle',         color: 'text-yellow-600', label: 'Media'  },
                BAJA:   { icon: 'fa-arrow-circle-down',    color: 'text-green-600',  label: 'Baja'   },
            };

            function getMeta(tipo) {
                return TIPO_META[(tipo || '').toUpperCase()] || TIPO_META['SISTEMA'];
            }
            function getPriMeta(p) {
                return PRIORIDAD_META[(p || '').toUpperCase()] || null;
            }

            // ---- Fetch notificaciones ----
            async function fetchNotificaciones() {
                try {
                    const r = await fetch(API_URL, { credentials: 'same-origin' });
                    if (!r.ok) return null;
                    return await r.json();
                } catch(e) {
                    return null;
                }
            }

            // ---- Actualizar badge de campana ----
            function actualizarBadge(total) {
                const badge = document.getElementById('notif-badge-ping');
                if (!badge) return;
                if (total > 0) {
                    badge.classList.remove('hidden');
                    badge.innerHTML = `
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-5 w-5 bg-red-600 text-white text-[10px] font-black items-center justify-center border-2 border-white shadow-sm">
                            ${total}
                        </span>`;
                } else {
                    badge.classList.add('hidden');
                    badge.innerHTML = '';
                }
            }

            // ---- Renderizar lista del dropdown ----
            function renderDropdown(data) {
                const list    = document.getElementById('notif-dropdown-list');
                const counter = document.getElementById('notif-count-badge');
                if (!list) return;

                if (counter) counter.textContent = data.total > 0 ? data.total + ' no leída(s)' : 'Al día';

                if (!data.notificaciones || data.notificaciones.length === 0) {
                    list.innerHTML = `
                        <div class="flex flex-col items-center justify-center py-10 text-gray-400">
                            <i class="fas fa-check-circle text-3xl mb-2 text-green-300"></i>
                            <p class="text-xs font-medium">¡Estás al día!</p>
                        </div>`;
                    return;
                }

                list.innerHTML = data.notificaciones.map(n => {
                    const meta    = getMeta(n.tipo);
                    const priMeta = getPriMeta(n.prioridad);
                    const priHTML = priMeta
                        ? `<span class="flex items-center gap-1 ${priMeta.color} text-[10px] font-bold uppercase">
                               <i class="fas ${priMeta.icon}"></i> ${priMeta.label}
                           </span>`
                        : '';
                    return `
                    <a href="/notificaciones/leer/${n.id}" class="flex items-start gap-3 px-4 py-3 hover:bg-gray-50 transition-colors block">
                        <div class="flex-shrink-0 w-9 h-9 rounded-full bg-gradient-to-br ${meta.color} flex items-center justify-center text-white shadow-sm mt-0.5">
                            <i class="fas ${meta.icon} text-sm"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center justify-between gap-2">
                                <span class="text-xs font-bold text-gray-800 truncate">${escHtml(n.titulo)}</span>
                                <span class="text-[10px] text-gray-400 whitespace-nowrap">${escHtml(n.hora)}</span>
                            </div>
                            <p class="text-[11px] text-gray-500 mt-0.5 line-clamp-2">${escHtml(n.mensaje)}</p>
                            <div class="flex items-center gap-2 mt-1 flex-wrap">
                                <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-semibold border ${meta.badge}">
                                    <i class="fas ${meta.icon} text-[9px]"></i> ${escHtml(n.tipo)}
                                </span>
                                ${priHTML}
                                <span class="text-[10px] text-gray-400">${escHtml(n.fecha)}</span>
                            </div>
                        </div>
                    </a>`;
                }).join('');
            }

            // ---- Mostrar Toast ----
            function mostrarToast(n) {
                const meta    = getMeta(n.tipo);
                const priMeta = getPriMeta(n.prioridad);
                const priHTML = priMeta
                    ? `<span class="flex items-center gap-1 ${priMeta.color} text-[10px] font-bold uppercase mt-0.5">
                           <i class="fas ${priMeta.icon}"></i> Prioridad ${priMeta.label}
                       </span>`
                    : '';

                const toast = document.createElement('div');
                toast.className = [
                    'pointer-events-auto flex items-start gap-3 bg-white rounded-2xl shadow-2xl border border-gray-200',
                    'p-4 max-w-sm w-full transform transition-all duration-500 translate-x-full opacity-0'
                ].join(' ');

                toast.innerHTML = `
                    <div class="flex-shrink-0 w-10 h-10 rounded-full bg-gradient-to-br ${meta.color} flex items-center justify-center text-white shadow-md">
                        <i class="fas ${meta.icon}"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-start justify-between gap-2">
                            <div>
                                <p class="text-[11px] font-bold text-gray-400 uppercase tracking-widest">Nueva Notificación</p>
                                <p class="text-sm font-bold text-gray-800 leading-tight">${escHtml(n.titulo)}</p>
                            </div>
                            <button onclick="this.closest('[data-toast]').remove()" class="text-gray-300 hover:text-gray-500 flex-shrink-0 transition-colors mt-0.5">
                                <i class="fas fa-times text-xs"></i>
                            </button>
                        </div>
                        <p class="text-xs text-gray-500 mt-1 line-clamp-2">${escHtml(n.mensaje)}</p>
                        <div class="flex flex-wrap items-center gap-2 mt-2">
                            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-semibold border ${meta.badge}">
                                <i class="fas ${meta.icon} text-[9px]"></i> ${escHtml(n.tipo)}
                            </span>
                            ${priHTML}
                        </div>
                        <div class="flex items-center justify-between mt-2">
                            <span class="text-[10px] text-gray-400">
                                <i class="fas fa-calendar-alt mr-1"></i>${escHtml(n.fecha)}
                                <i class="fas fa-clock ml-2 mr-1"></i>${escHtml(n.hora)}
                            </span>
                            <a href="/notificaciones/leer/${n.id}" class="text-[10px] text-gob-guinda hover:underline font-bold">
                                Ver <i class="fas fa-arrow-right text-[9px]"></i>
                            </a>
                        </div>
                    </div>`;

                toast.setAttribute('data-toast', n.id);

                const container = document.getElementById('notif-toast-container');
                if (container) container.appendChild(toast);

                // Animación entrada
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        toast.classList.remove('translate-x-full', 'opacity-0');
                    });
                });

                // Auto-dismiss
                setTimeout(() => {
                    toast.classList.add('translate-x-full', 'opacity-0');
                    toast.addEventListener('transitionend', () => toast.remove(), { once: true });
                }, TOAST_DURATION);
            }

            // ---- Utilidad escape HTML ----
            function escHtml(str) {
                if (str == null) return '';
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            // ---- Cargar librerías WebSocket dinámicamente ----
            function loadScripts(urls, callback) {
                let loadedCount = 0;
                urls.forEach(url => {
                    if (url.includes('sockjs') && typeof SockJS !== 'undefined') {
                        loadedCount++;
                        if (loadedCount === urls.length) callback();
                        return;
                    }
                    if (url.includes('stomp') && typeof Stomp !== 'undefined') {
                        loadedCount++;
                        if (loadedCount === urls.length) callback();
                        return;
                    }
                    const script = document.createElement('script');
                    script.type = 'text/javascript';
                    script.src = url;
                    script.onload = () => {
                        loadedCount++;
                        if (loadedCount === urls.length) callback();
                    };
                    document.head.appendChild(script);
                });
            }

            // ---- Incrementar contador del Badge ----
            function incrementarContadorBadge() {
                const badge = document.getElementById('notif-badge-ping');
                if (!badge) return;
                
                let currentCount = 0;
                const textSpan = badge.querySelector('.relative.inline-flex');
                if (textSpan) {
                    currentCount = parseInt(textSpan.textContent.trim()) || 0;
                }
                actualizarBadge(currentCount + 1);
            }

            // ---- Refrescar Dropdown si está abierto ----
            async function actualizarListaDropdownSiAbierto() {
                const dropdown = document.getElementById('notif-dropdown');
                if (dropdown && !dropdown.classList.contains('hidden')) {
                    const data = await fetchNotificaciones();
                    if (data) {
                        actualizarBadge(data.total);
                        renderDropdown(data);
                    }
                }
            }

            // ---- Conexión WebSocket Realtime ----
            function iniciarWebSocket() {
                loadScripts([
                    'https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js',
                    'https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js'
                ], function() {
                    const socket = new SockJS('/ws-realtime');
                    const stompClient = Stomp.over(socket);
                    stompClient.debug = null; // Silenciar logs de debug en consola

                    stompClient.connect({}, function (frame) {
                        stompClient.subscribe('/user/queue/alertas', function (message) {
                            const payload = JSON.parse(message.body);
                            
                            // Validar que el evento sea de inserción en notificaciones
                            if (payload.tabla === 'notificaciones' && payload.operacion === 'INSERT') {
                                const notifId = String(payload.id); // Normalizar a string (el trigger envía el id como texto)
                                const nuevaNotif = {
                                    id: notifId,
                                    titulo: payload.titulo,
                                    mensaje: payload.mensaje,
                                    tipo: payload.etapa_procesal || 'SISTEMA',
                                    prioridad: payload.prioridad || 'MEDIA',
                                    fecha: new Date(payload.fecha).toLocaleDateString(),
                                    hora: new Date(payload.fecha).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                                };

                                // Mostrar toast solo si es un ID nuevo (no existía al cargar la página)
                                if (!seenIds.has(notifId)) {
                                    seenIds.add(notifId);
                                    if (initialIdsLoaded) {
                                        mostrarToast(nuevaNotif);
                                        incrementarContadorBadge();
                                        actualizarListaDropdownSiAbierto();
                                    }
                                }
                            }
                        });
                    }, function(error) {
                        // Reconexión automática con retraso de 5 segundos ante fallos de conexión
                        setTimeout(iniciarWebSocket, 5000);
                    });
                });
            }

            // ---- Carga Inicial del Estado (una sola llamada al inicio) ----
            async function pollInitialState() {
                const data = await fetchNotificaciones();
                if (!data) return;

                actualizarBadge(data.total);

                // Registrar los IDs ya existentes para que el WS no haga toast de notifs viejas
                if (data.notificaciones) {
                    data.notificaciones.forEach(n => seenIds.add(String(n.id))); // Normalizar a string
                }
                initialIdsLoaded = true; // El WS puede empezar a mostrar toasts de IDs nuevos
            }

            // ---- Toggle dropdown ----
            window.toggleNotifDropdown = async function () {
                const dropdown = document.getElementById('notif-dropdown');
                if (!dropdown) return;
                const isHidden = dropdown.classList.contains('hidden');
                dropdown.classList.toggle('hidden');

                if (isHidden) {
                    const data = await fetchNotificaciones();
                    if (data) {
                        actualizarBadge(data.total);
                        renderDropdown(data);
                        if (data.notificaciones) {
                            data.notificaciones.forEach(n => seenIds.add(n.id));
                        }
                    }
                }
            };

            // Cerrar al hacer click fuera
            document.addEventListener('click', function(e) {
                const wrapper  = document.getElementById('notif-bell-wrapper');
                const dropdown = document.getElementById('notif-dropdown');
                if (wrapper && dropdown && !wrapper.contains(e.target)) {
                    dropdown.classList.add('hidden');
                }
            });

            // Inicializar de manera híbrida y reactiva
            document.addEventListener('DOMContentLoaded', function () {
                pollInitialState();
                iniciarWebSocket();
            });
        })();
        </script>
        <script th:src="@{/js/webpush-client.js}" defer></script>
    </th:block>

</body>

</html>
