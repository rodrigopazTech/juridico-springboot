<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head></head>
<body>

    <nav th:fragment="navbar" class="bg-white border-b border-gray-200 px-6 py-3 fixed top-0 right-0 z-30 transition-all sm:ml-64" style="width: calc(100% - 16rem);">
        <div class="flex justify-between items-center w-full">
            
            <div class="flex justify-start items-center w-1/2">
                <h1 class="text-xl md:text-2xl font-bold text-gob-gris font-headings flex items-center">
                    
                    <i th:if="${activePage == 'dashboard'}" class="fas fa-chart-pie text-gob-oro mr-3"></i>
                    <i th:if="${activePage == 'agenda'}" class="fas fa-address-book text-gob-oro mr-3"></i>
                    <i th:if="${activePage == 'calendario'}" class="fas fa-calendar-alt text-gob-oro mr-3"></i>
                    <i th:if="${activePage == 'alertas'}" class="fas fa-bell text-gob-oro mr-3"></i>
                    <i th:if="${activePage == 'expedientes'}" class="fas fa-folder-open text-gob-oro mr-3"></i>
                    <i th:if="${activePage == 'terminos'}" class="fas fa-hourglass-half text-gob-oro mr-3"></i>
                    <i th:if="${activePage == 'audiencias'}" class="fas fa-gavel text-gob-oro mr-3"></i>
                    <i th:if="${activePage == 'perfil'}" class="fas fa-user-cog text-gob-oro mr-3"></i>
                    <i th:if="${activePage == 'usuarios'}" class="fas fa-users-cog text-gob-oro mr-3"></i>
                    <i th:if="${activePage == 'importar'}" class="fas fa-file-import text-gob-oro mr-3"></i>
                    
                    <i th:if="${activePage == null}" class="fas fa-balance-scale text-gob-oro mr-3"></i>

                    <span th:text="${pageTitle != null ? pageTitle : 'Sistema Jurídico'}">Título de la Página</span>
                </h1>
            </div>

            <div class="flex items-center gap-5">
                
                <a th:href="@{/notificaciones}" title="Centro de Notificaciones">
                    <i class="fas fa-bell text-xl"></i>
                </a>

                <div class="h-8 w-px bg-gray-200"></div>

                <div class="relative group cursor-pointer" th:if="${usuarioGlobal != null}">
                    
                    <div class="flex items-center gap-3">
                        <div class="text-right">
                            <p class="text-sm font-bold text-gray-700 leading-none font-headings" th:text="${usuarioGlobal.nombreCompleto}">Usuario</p>
                            <p class="text-xs text-gray-500 leading-none mt-1 uppercase tracking-wider font-bold" th:text="${usuarioGlobal.rol}">Rol</p>
                        </div>
                        <div class="w-9 h-9 rounded-full bg-gob-oro flex items-center justify-center text-gob-verde font-bold text-sm shadow-sm border border-white" th:text="${#strings.substring(usuarioGlobal.nombreCompleto, 0, 1)}">U</div>
                        <i class="fas fa-chevron-down text-xs text-gray-400 group-hover:text-gob-guinda transition-transform duration-200 group-hover:rotate-180"></i>
                    </div>

                    <div class="absolute right-0 mt-2 w-56 bg-white rounded-xl shadow-xl border border-gray-100 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 transform origin-top-right translate-y-2 group-hover:translate-y-0 z-50">
                        <div class="p-2 space-y-1">
                            <div class="px-3 py-2 border-b border-gray-100 mb-2 block md:hidden">
                                <p class="text-sm font-bold text-gray-700 truncate" th:text="${usuarioGlobal.nombreCompleto}">Usuario</p>
                            </div>
                            
                            <a th:href="@{/perfil}" class="flex items-center px-3 py-2 text-sm text-gray-600 hover:bg-gray-50 hover:text-gob-guinda rounded-lg transition-colors">
                                <i class="fas fa-id-badge w-5 text-center text-gray-400 mr-2"></i> Mi Perfil
                            </a>
                            <a th:href="@{/perfil/configuracion}" class="flex items-center px-3 py-2 text-sm text-gray-600 hover:bg-gray-50 hover:text-gob-guinda rounded-lg transition-colors">
                                <i class="fas fa-user-cog w-5 text-center text-gray-400 mr-2"></i> Configuración
                            </a>
                            <a th:href="@{/perfil/preferencias}" class="flex items-center px-3 py-2 text-sm text-gray-600 hover:bg-gray-50 hover:text-gob-guinda rounded-lg transition-colors">
                                <i class="fas fa-sliders-h w-5 text-center text-gray-400 mr-2"></i> Preferencias
                            </a>
                            
                            <div class="border-t border-gray-100 my-1"></div>
                            
                            <a th:href="@{/logout}" class="flex items-center px-3 py-2 text-sm text-red-600 hover:bg-red-50 rounded-lg transition-colors font-bold">
                                <i class="fas fa-sign-out-alt w-5 text-center mr-2"></i> Cerrar Sesión
                            </a>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </nav>

</body>
</html>
