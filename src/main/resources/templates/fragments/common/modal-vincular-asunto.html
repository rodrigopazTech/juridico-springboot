<div th:fragment="modalVincularAsunto(volver)" id="modal-vincular-asunto" class="fixed inset-0 z-[70] hidden" role="dialog" aria-modal="true">
    <div class="fixed inset-0 bg-gray-900/60" onclick="cerrarModalVincularAsunto()"></div>
    <div class="fixed inset-0 flex items-center justify-center p-4">
        <form th:action="@{/asuntos-independientes/vincular}" method="post" class="relative w-full max-w-lg rounded-2xl bg-white shadow-2xl overflow-hidden">
            <div class="bg-gob-guinda text-white px-6 py-4 flex items-center justify-between">
                <div><p class="text-xs uppercase tracking-widest text-white/70">Asunto Independiente</p><h3 class="text-lg font-bold">Vincular a expediente</h3></div>
                <button type="button" onclick="cerrarModalVincularAsunto()" aria-label="Cerrar"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div class="rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-900">
                    Se moverán al expediente todas las Audiencias y Términos de <strong id="folio-asunto-vincular"></strong>. Esta acción conserva la trazabilidad.
                </div>
                <input type="hidden" name="asuntoId" id="asunto-id-vincular">
                <input type="hidden" name="volver" th:value="${volver}">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Expediente destino *</label>
                    <select name="expedienteId" id="expediente-destino-asunto" required class="w-full rounded-lg border-gray-300 px-3 py-2.5">
                        <option value="">Selecciona un expediente...</option>
                        <option th:each="e : ${expedientesList}" th:value="${e.id}"
                            th:data-gerencia-id="${e.gerencia?.id}"
                            th:text="${e.numero + ' · ' + (e.materia != null ? e.materia.nombre : 'Sin materia')}"></option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Motivo</label>
                    <textarea name="motivo" rows="2" class="w-full rounded-lg border-gray-300 px-3 py-2.5" placeholder="Ej. Se recibió la radicación del expediente."></textarea>
                </div>
            </div>
            <div class="px-6 py-4 bg-gray-50 flex justify-end gap-3">
                <button type="button" onclick="cerrarModalVincularAsunto()" class="px-4 py-2 rounded-lg border border-gray-300 bg-white font-bold text-gray-700">Cancelar</button>
                <button type="button" onclick="confirmarVinculacionAsunto(this.form)" class="px-4 py-2 rounded-lg bg-gob-guinda text-white font-bold"><i class="fas fa-link mr-2"></i>Vincular</button>
            </div>
        </form>
    </div>
</div>
