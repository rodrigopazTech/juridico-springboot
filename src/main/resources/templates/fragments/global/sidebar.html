<aside th:fragment="sidebar" id="logo-sidebar" class="fixed top-0 left-0 z-40 w-64 h-screen transition-transform -translate-x-full sm:translate-x-0 bg-gob-verde border-r border-gob-verdeDark shadow-xl" aria-label="Sidebar">
    
    <div class="h-16 flex items-center px-6 border-b border-gob-verdeDark/50 bg-gob-verdeDark/30">
        <a href="/dashboard" class="flex items-center gap-3 group">
            <div class="text-gob-oro group-hover:text-white transition-colors">
                <i class="fas fa-balance-scale fa-lg"></i>
            </div>
            <div class="text-white font-headings font-bold text-lg tracking-wider leading-tight">
                AGENDA<span class="text-gob-oro">LEGAL</span>
            </div>
        </a>
    </div>

    <div class="h-[calc(100vh-8rem)] px-3 py-6 overflow-y-auto custom-scrollbar">
        
        <div class="px-3 mb-2 text-xs font-bold text-gob-oroLight uppercase tracking-wider font-heading opacity-80">
            Principal
        </div>
        <ul class="space-y-1 font-medium mb-6">
            <li>
                <a th:href="@{/dashboard}" 
                   class="flex items-center p-2 text-gray-300 rounded-lg hover:bg-gob-verdeDark hover:text-white group transition-all duration-200"
                   th:classappend="${activePage == 'dashboard'} ? 'bg-gob-verdeDark text-white border-r-4 border-gob-oro' : ''">
                    <i class="fas fa-chart-line w-5 h-5 text-center transition duration-75 group-hover:text-gob-oro" 
                       th:classappend="${activePage == 'dashboard'} ? 'text-gob-oro' : ''"></i>
                    <span class="ms-3">Dashboard</span>
                </a>
            </li>
            <li>
                <a th:href="@{/notificaciones}" 
                   class="flex items-center p-2 text-gray-300 rounded-lg hover:bg-gob-verdeDark hover:text-white group transition-all duration-200"
                   th:classappend="${activePage == 'notificaciones'} ? 'bg-gob-verdeDark text-white border-r-4 border-gob-oro' : ''">
                    <div class="relative">
                        <i class="fas fa-bell w-5 h-5 text-center transition duration-75 group-hover:text-gob-oro"></i>
                        <span class="absolute top-0 right-0 -mt-1 -mr-1 w-2 h-2 bg-gob-guinda rounded-full border border-gob-verde"></span>
                    </div>
                    <span class="ms-3">Notificaciones</span>
                </a>
            </li>
        </ul>

        <div class="px-3 mb-2 text-xs font-bold text-gob-oroLight uppercase tracking-wider font-heading opacity-80">
            Gestión Jurídica
        </div>
        <ul class="space-y-1 font-medium mb-6">
            <li>
                <a th:href="@{/expedientes}" 
                   class="flex items-center p-2 text-gray-300 rounded-lg hover:bg-gob-verdeDark hover:text-white group transition-all duration-200"
                   th:classappend="${activePage == 'expedientes'} ? 'bg-gob-verdeDark text-white border-r-4 border-gob-oro' : ''">
                    <i class="fas fa-folder-open w-5 h-5 text-center transition duration-75 group-hover:text-gob-oro"
                       th:classappend="${activePage == 'expedientes'} ? 'text-gob-oro' : ''"></i>
                    <span class="ms-3">Expedientes</span>
                </a>
            </li>
            <li>
                <a th:href="@{/audiencias}" 
                   class="flex items-center p-2 text-gray-300 rounded-lg hover:bg-gob-verdeDark hover:text-white group transition-all duration-200"
                   th:classappend="${activePage == 'audiencias'} ? 'bg-gob-verdeDark text-white border-r-4 border-gob-oro' : ''">
                    <i class="fas fa-gavel w-5 h-5 text-center transition duration-75 group-hover:text-gob-oro"></i>
                    <span class="ms-3">Audiencias</span>
                </a>
            </li>
            <li>
                <a th:href="@{/terminos}" 
                   class="flex items-center p-2 text-gray-300 rounded-lg hover:bg-gob-verdeDark hover:text-white group transition-all duration-200"
                   th:classappend="${activePage == 'terminos'} ? 'bg-gob-verdeDark text-white border-r-4 border-gob-oro' : ''">
                    <i class="fas fa-hourglass-half w-5 h-5 text-center transition duration-75 group-hover:text-gob-oro"></i>
                    <span class="ms-3">Términos</span>
                </a>
            </li>
        </ul>

        <div class="px-3 mb-2 text-xs font-bold text-gob-oroLight uppercase tracking-wider font-heading opacity-80">
            Organización
        </div>
        <ul class="space-y-1 font-medium">
            <li>
                <a th:href="@{/agenda}" 
                   class="flex items-center p-2 text-gray-300 rounded-lg hover:bg-gob-verdeDark hover:text-white group transition-all duration-200">
                    <i class="fas fa-calendar-alt w-5 h-5 text-center transition duration-75 group-hover:text-gob-oro"></i>
                    <span class="ms-3">Agenda General</span>
                </a>
            </li>
            <li>
                <a th:href="@{/recordatorios}" 
                   class="flex items-center p-2 text-gray-300 rounded-lg hover:bg-gob-verdeDark hover:text-white group transition-all duration-200">
                    <i class="fas fa-tasks w-5 h-5 text-center transition duration-75 group-hover:text-gob-oro"></i>
                    <span class="ms-3">Recordatorios</span>
                </a>
            </li>
            <li>
                <a th:href="@{/usuarios}" 
                   class="flex items-center p-2 text-gray-300 rounded-lg hover:bg-gob-verdeDark hover:text-white group transition-all duration-200">
                    <i class="fas fa-users w-5 h-5 text-center transition duration-75 group-hover:text-gob-oro"></i>
                    <span class="ms-3">Usuarios</span>
                </a>
            </li>
        </ul>
    </div>

    <div class="absolute bottom-0 left-0 w-full p-4 border-t border-gob-verdeDark bg-gob-verdeDark">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full border-2 border-gob-oro flex items-center justify-center bg-white text-gob-guinda font-bold text-xs shadow-sm">
                AB
            </div>
            <div class="font-medium text-white text-sm truncate">
                <div class="font-heading">Abogado User</div>
                <div class="text-xs text-gob-plata truncate">abogado@gob.mx</div>
            </div>
            <a href="/logout" class="ml-auto text-gray-400 hover:text-gob-oro transition-colors" title="Cerrar Sesión">
                <i class="fas fa-sign-out-alt"></i>
            </a>
        </div>
    </div>

</aside>
