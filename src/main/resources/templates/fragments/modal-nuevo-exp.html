<div th:fragment="modal" id="modal-nuevo-exp" class="fixed inset-0 z-50 hidden bg-gray-900 bg-opacity-50 backdrop-blur-sm flex items-center justify-center p-4">
    
    <div class="bg-white rounded-lg shadow-2xl w-full max-w-3xl border-t-4 border-gob-guinda transform transition-all">
        
        <div class="flex justify-between items-center p-4 border-b border-gray-100">
            <h3 class="text-xl font-bold text-gob-guinda flex items-center gap-2">
                <i class="fas fa-plus"></i> Nuevo Expediente
            </h3>
            <button onclick="document.getElementById('modal-nuevo-exp').classList.add('hidden')" class="text-gray-400 hover:text-gray-600">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>

        <form th:action="@{/expedientes/guardar}" method="post" class="p-6 space-y-4 text-sm">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block font-bold text-gray-600 mb-1">Número de Expediente*</label>
                    <input type="text" name="numero" placeholder="0000/2025" required
                           class="w-full border border-gray-300 rounded p-2 focus:border-gob-guinda focus:ring-1 focus:ring-gob-guinda outline-none">
                </div>
                <div>
                    <label class="block font-bold text-gray-600 mb-1">Prioridad*</label>
                    <select name="prioridad" class="w-full border border-gray-300 rounded p-2 focus:border-gob-guinda outline-none bg-white">
                        <option th:each="p : ${listaPrioridades}" 
                                th:value="${p}" 
                                th:text="${p}"></option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block font-bold text-gray-600 mb-1">Gerencia*</label>
                    <select name="gerencia.id" class="w-full border border-gray-300 rounded p-2 focus:border-gob-guinda outline-none bg-white" required>
                        <option value="">Selecciona...</option>
                        <option th:each="g : ${listaGerencias}" 
                                th:value="${g.id}" 
                                th:text="${g.nombre}"></option>
                    </select>
                </div>
                <div>
                    <label class="block font-bold text-gray-600 mb-1">Estado / Sede*</label>
                    <select name="sede" class="w-full border border-gray-300 rounded p-2 focus:border-gob-guinda outline-none bg-white" required>
                        <option value="">Seleccione estado...</option>
                        
                        <option th:each="est : ${listaEstados}" 
                                th:value="${est.nombre}" 
                                th:text="${est.nombre}"></option>
                    </select>
                </div>          
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block font-bold text-gray-600 mb-1">Materia*</label>
                    <select name="materia.id" class="w-full border border-gray-300 rounded p-2 focus:border-gob-guinda outline-none bg-white" required>
                        <option value="">Selecciona...</option>
                        <option th:each="m : ${listaMaterias}" 
                                th:value="${m.id}" 
                                th:text="${m.nombre}"></option>
                    </select>
                </div>
                <div>
                    <label class="block font-bold text-gray-600 mb-1">Tipo Expediente*</label>
                    <select name="tipoExpediente.id" class="w-full border border-gray-300 rounded p-2 focus:border-gob-guinda outline-none bg-white" required>
                        <option value="">Selecciona...</option>
                        <option th:each="t : ${listaTipos}" 
                                th:value="${t.id}" 
                                th:text="${t.nombre}"></option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block font-bold text-gray-600 mb-1">Abogado Responsable*</label>
                <select name="abogadoResponsable.id" class="w-full border border-gray-300 rounded p-2 focus:border-gob-guinda outline-none bg-white">
                    <option value="">Asignar abogado...</option>
                    <option th:each="a : ${listaAbogados}" 
                            th:value="${a.id}" 
                            th:text="${a.nombreCompleto}"></option>
                </select>
            </div>

            <div>
                <label class="block font-bold text-gray-600 mb-1">Partes Procesales</label>
                <input type="text" name="partes" placeholder="Ej: Juan Pérez vs Inmobiliaria S.A." 
                       class="w-full border border-gray-300 rounded p-2 focus:border-gob-guinda outline-none">
            </div>

            <div>
                <label class="block font-bold text-gray-600 mb-1">Órgano Jurisdiccional</label>
                <div class="flex">
                    <select name="organoJurisdiccional.id" class="w-full border border-gray-300 rounded-l p-2 focus:border-gob-guinda outline-none bg-white">
                        <option value="">Seleccione un órgano...</option>
                        <option th:each="o : ${listaOrganos}" 
                                th:value="${o.id}" 
                                th:text="${o.nombre}"></option>
                    </select>
                    <button type="button" class="bg-gray-100 border border-l-0 border-gray-300 px-3 rounded-r hover:bg-gray-200">
                        <i class="fas fa-cog text-gray-500"></i>
                    </button>
                </div>
            </div>
            
            <div class="col-span-1 md:col-span-2">
                <label class="block font-bold text-gray-600 mb-1">Descripción </label>
                <textarea name="descripcion" rows="4" required
                          placeholder="Escribe aquí todo el detalle del expediente. Esta información se verá en la vista detallada."
                          class="w-full border border-gray-300 rounded p-2 focus:border-gob-guinda outline-none resize-none"></textarea>
            </div>


            <div class="flex justify-end gap-3 pt-4 border-t border-gray-100 mt-4">
                <button type="button" onclick="document.getElementById('modal-nuevo-exp').classList.add('hidden')" 
                        class="px-4 py-2 border border-gray-300 text-gray-600 rounded hover:bg-gray-50 font-medium">
                    Cancelar
                </button>
                <button type="submit" class="px-6 py-2 bg-gob-guinda text-white rounded hover:bg-gob-guinda-claro font-bold shadow flex items-center gap-2">
                    <i class="fas fa-save"></i> Guardar
                </button>
            </div>

        </form>
    </div>
</div>
