<div th:fragment="lista" class="space-y-0">

    <!-- VISTA ESCRITORIO (tabla) -->
    <div class="hidden lg:block overflow-x-auto bg-white rounded-2xl shadow-sm border border-gray-100">
    <table class="w-full text-left border-collapse min-w-[800px] table-fixed">
        <thead class="bg-gray-50/80 text-gray-400 text-[10px] font-bold uppercase tracking-widest border-b border-gray-100">
            <tr>
                <th class="px-4 py-4 w-16 text-center">Check</th>
                <th class="px-4 py-4 w-1/3">Descripción de la Tarea</th>
                <th class="px-4 py-4 w-28">Fecha</th>
                <th class="px-4 py-4 w-24">Hora</th>
                <th class="px-4 py-4 w-24 text-center">Prioridad</th>
                <th class="px-4 py-4 w-28 text-center">Estado</th>
                <th class="px-4 py-4 w-28 text-center">Calendario</th>
                <th class="px-4 py-4 w-16 text-right"></th>
            </tr>
        </thead>
        <tbody class="divide-y divide-gray-50" id="body-tareas">
            
            <tr th:each="r : ${recordatoriosTodos}" 
                class="hover:bg-gray-50/80 transition-colors group fila-tarea h-16"
                th:data-estado="${r.completado ? 'completada' : 'pendiente'}"
                th:classappend="${r.completado ? 'opacity-60 bg-gray-50/50' : ''}">
                
                <td class="px-4 py-2 text-center align-middle">
                    <button th:onclick="'toggleTarea(' + ${r.id} + ')'" 
                            class="w-6 h-6 rounded-full border-2 flex items-center justify-center transition-all mx-auto focus:outline-none"
                            th:classappend="${r.completado ? 'bg-green-500 border-green-500 text-white shadow-inner' : 'border-gray-300 hover:border-gob-guinda text-transparent hover:text-gob-guinda/30'}">
                        <i class="fas fa-check text-[10px]"></i>
                    </button>
                </td>

                <td class="px-4 py-2 overflow-hidden">
                    <div class="flex flex-col justify-center">
                        <span th:text="${r.titulo}" 
                              class="font-bold text-gray-800 text-sm truncate block"
                              th:title="${r.titulo}"
                              th:classappend="${r.completado ? 'line-through text-gray-400' : ''}">
                        </span>
                        <span class="text-xs text-gray-500 truncate block mt-0.5" 
                              th:text="${r.detalles}" 
                              th:title="${r.detalles}">
                        </span>
                    </div>
                </td>

                <td class="px-4 py-2 whitespace-nowrap">
                    <div class="text-sm font-medium text-gray-700 flex items-center gap-2">
                        <i class="far fa-calendar-alt text-gray-300"></i>
                        <span th:text="${#temporals.format(r.fechaRecordatorio, 'dd/MM/yyyy')}"></span>
                    </div>
                </td>

                <td class="px-4 py-2 whitespace-nowrap">
                    <div class="text-xs font-bold text-gray-500 flex items-center gap-2 bg-gray-50 px-2 py-1 rounded w-fit">
                        <i class="far fa-clock text-gob-oro"></i>
                        <span th:text="${r.horaRecordatorio}"></span>
                    </div>
                </td>

                <td class="px-4 py-2 text-center whitespace-nowrap">
                    <span th:if="${r.prioridad != null}" th:text="${r.prioridad.nombre}" 
                          class="text-[9px] px-2 py-1 rounded font-extrabold tracking-wider border"
                          th:classappend="${r.prioridad.nombre == 'ALTA' ? 'bg-red-50 text-red-600 border-red-100' : 'bg-blue-50 text-blue-600 border-blue-100'}">
                    </span>
                    <span th:if="${r.prioridad == null}" class="text-[9px] px-2 py-1 rounded font-extrabold tracking-wider border bg-gray-50 text-gray-400 border-gray-100">—</span>
                </td>

                <td class="px-4 py-2 text-center whitespace-nowrap">
                    <span th:if="${!r.completado}" class="text-[10px] px-2.5 py-1 rounded-full font-bold bg-amber-50 text-amber-600 border border-amber-100">Pendiente</span>
                    <span th:if="${r.completado}" class="text-[10px] px-2.5 py-1 rounded-full font-bold bg-green-50 text-green-600 border border-green-100">Completada</span>
                </td>

                <td class="px-4 py-2 text-center whitespace-nowrap">
                    <span th:if="${r.outlookSyncStatus != null and r.outlookSyncStatus.name() == 'ERROR_SYNC'}"
                        class="inline-flex items-center gap-1 rounded-full border border-red-100 bg-red-50 px-2 py-1 text-[10px] font-bold text-red-600">
                        <i class="fas fa-triangle-exclamation"></i> Error
                    </span>
                    <span th:unless="${r.outlookSyncStatus != null and r.outlookSyncStatus.name() == 'ERROR_SYNC'}"
                        class="inline-flex items-center gap-1 rounded-full border px-2 py-1 text-[10px] font-bold"
                        th:classappend="${r.outlookLinked} ? 'border-blue-100 bg-blue-50 text-blue-700' : 'border-gray-100 bg-gray-50 text-gray-500'">
                        <i class="far fa-calendar"></i>
                        <span th:text="${r.outlookLinked} ? 'Outlook' : 'Solo SIAJ'">Solo SIAJ</span>
                    </span>
                </td>

                <td class="px-4 py-2 text-right whitespace-nowrap">
                    <button th:onclick="'confirmarEliminarTarea(' + ${r.id} + ', ' + ${r.outlookLinked} + ')'" 
                            class="text-gray-300 hover:text-red-600 opacity-0 group-hover:opacity-100 transition-all p-2 rounded hover:bg-red-50" title="Eliminar">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </td>
            </tr>

            <tr th:if="${recordatoriosTodos.empty}">
                <td colspan="8" class="text-center py-16">
                    <p class="text-gray-400 font-bold">No tienes tareas registradas</p>
                </td>
            </tr>
        </tbody>
    </table>
    </div><!-- /VISTA ESCRITORIO -->

    <!-- VISTA MÓVIL / TABLET (Tarjetas) -->
    <div class="block lg:hidden bg-gray-100 p-2 space-y-2" id="body-tareas-mobile">

        <!-- Sin tareas -->
        <div th:if="${recordatoriosTodos.empty}" class="bg-white rounded-2xl border border-gray-100 p-12 text-center">
            <p class="text-gray-400 font-bold">No tienes tareas registradas</p>
        </div>

        <!-- Tarjeta por tarea -->
        <div th:each="r : ${recordatoriosTodos}"
             class="bg-white rounded-2xl border border-gray-200 shadow-md overflow-hidden fila-tarea"
             th:data-estado="${r.completado ? 'completada' : 'pendiente'}"
             th:classappend="${r.completado ? 'opacity-60' : ''}">

            <!-- Encabezado: check + título -->
            <div class="flex items-start gap-3 p-4">
                <button th:onclick="'toggleTarea(' + ${r.id} + ')'"
                        class="w-7 h-7 rounded-full border-2 flex-shrink-0 flex items-center justify-center transition-all mt-0.5 focus:outline-none"
                        th:classappend="${r.completado ? 'bg-green-500 border-green-500 text-white' : 'border-gray-300 hover:border-gob-guinda text-transparent hover:text-gob-guinda/30'}">
                    <i class="fas fa-check text-[10px]"></i>
                </button>
                <div class="flex-1 min-w-0">
                    <p class="font-bold text-gray-800 text-sm"
                       th:text="${r.titulo}"
                       th:classappend="${r.completado ? 'line-through text-gray-400' : ''}">
                        Título de la tarea
                    </p>
                    <p class="text-xs text-gray-500 mt-0.5 truncate" th:text="${r.detalles}"></p>
                    <div class="mt-2">
                        <span th:if="${r.outlookSyncStatus != null and r.outlookSyncStatus.name() == 'ERROR_SYNC'}"
                            class="inline-flex items-center gap-1 rounded-full border border-red-100 bg-red-50 px-2 py-0.5 text-[9px] font-bold text-red-600">
                            <i class="fas fa-triangle-exclamation"></i> Error Outlook
                        </span>
                        <span th:unless="${r.outlookSyncStatus != null and r.outlookSyncStatus.name() == 'ERROR_SYNC'}"
                            class="inline-flex items-center gap-1 rounded-full border px-2 py-0.5 text-[9px] font-bold"
                            th:classappend="${r.outlookLinked} ? 'border-blue-100 bg-blue-50 text-blue-700' : 'border-gray-100 bg-gray-50 text-gray-500'">
                            <i class="far fa-calendar"></i>
                            <span th:text="${r.outlookLinked} ? 'Outlook' : 'Solo SIAJ'">Solo SIAJ</span>
                        </span>
                    </div>
                </div>
            </div>

            <!-- Pie: fecha/hora + prioridad + estado + eliminar -->
            <div class="flex items-center justify-between px-4 pb-3 gap-2 flex-wrap">
                <div class="flex items-center gap-3">
                    <!-- Fecha -->
                    <div class="flex items-center gap-1.5 text-xs text-gray-500">
                        <i class="far fa-calendar-alt text-gray-300"></i>
                        <span th:text="${#temporals.format(r.fechaRecordatorio, 'dd/MM/yyyy')}"></span>
                    </div>
                    <!-- Hora -->
                    <div class="flex items-center gap-1.5 text-xs font-bold text-gray-500 bg-gray-50 px-2 py-0.5 rounded">
                        <i class="far fa-clock text-gob-oro text-[10px]"></i>
                        <span th:text="${r.horaRecordatorio}"></span>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <!-- Prioridad -->
                    <span th:if="${r.prioridad != null}" th:text="${r.prioridad.nombre}"
                          class="text-[9px] px-2 py-0.5 rounded font-extrabold tracking-wider border"
                          th:classappend="${r.prioridad.nombre == 'ALTA' ? 'bg-red-50 text-red-600 border-red-100' : 'bg-blue-50 text-blue-600 border-blue-100'}">
                    </span>
                    <!-- Estado -->
                    <span th:if="${!r.completado}" class="text-[9px] px-2 py-0.5 rounded-full font-bold bg-amber-50 text-amber-600 border border-amber-100">Pendiente</span>
                    <span th:if="${r.completado}" class="text-[9px] px-2 py-0.5 rounded-full font-bold bg-green-50 text-green-600 border border-green-100">Completada</span>
                    <!-- Eliminar -->
                    <button th:onclick="'confirmarEliminarTarea(' + ${r.id} + ', ' + ${r.outlookLinked} + ')'"
                            class="p-1.5 text-gray-300 hover:text-red-500 hover:bg-red-50 rounded-lg transition-all" title="Eliminar">
                        <i class="fas fa-trash-alt text-xs"></i>
                    </button>
                </div>
            </div>
        </div>
    </div><!-- /VISTA MÓVIL -->

</div>
