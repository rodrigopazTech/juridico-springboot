<div th:fragment="modal" id="modal-recordatorio" class="fixed inset-0 z-50 hidden overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <div class="flex items-end justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
        <div class="fixed inset-0 transition-opacity bg-gray-500 bg-opacity-25" aria-hidden="true" onclick="cerrarModalTarea()"></div>

        <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

        <div class="inline-block overflow-hidden text-left align-bottom transition-all transform bg-white rounded-2xl shadow-xl sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
            
            <form th:action="@{/tareas/guardar}" method="POST" id="form-tarea">
                <div class="px-6 pt-6 pb-4 bg-white">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="text-2xl font-bold text-gob-guinda font-headings" id="modal-title">
                            <i class="fas fa-edit mr-2 text-gob-oro"></i> Nueva Tarea
                        </h3>
                        <button type="button" onclick="cerrarModalTarea()" class="text-gray-400 hover:text-gray-600 transition-colors">
                            <i class="fas fa-times text-lg"></i>
                        </button>
                    </div>
                    
                    <div class="space-y-4">
                        <div>
                            <label for="titulo" class="block text-sm font-medium text-gray-700">Título de la Tarea</label>
                            <input type="text" name="titulo" id="titulo" required
                                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-gob-oro focus:border-gob-oro sm:text-sm"
                                placeholder="Ej: Revisar Amparo Expediente 123/2023">
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label for="fechaRecordatorio" class="block text-sm font-medium text-gray-700">Fecha Límite</label>
                                <input type="date" name="fechaRecordatorio" id="fechaRecordatorio" required
                                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-gob-oro focus:border-gob-oro sm:text-sm">
                            </div>
                            <div>
                                <label for="horaRecordatorio" class="block text-sm font-medium text-gray-700">Hora</label>
                                <input type="time" name="horaRecordatorio" id="horaRecordatorio" required
                                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-gob-oro focus:border-gob-oro sm:text-sm">
                            </div>
                        </div>

                        <div>
                            <label for="prioridad" class="block text-sm font-medium text-gray-700">Prioridad</label>
                            <select name="prioridad" id="prioridad" required
                                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-gob-oro focus:border-gob-oro sm:text-sm">
                                <option value="MEDIA">Media</option>
                                <option value="ALTA">Alta</option>
                                <option value="BAJA">Baja</option>
                            </select>
                        </div>

                        <div>
                            <label for="detalles" class="block text-sm font-medium text-gray-700">Detalles adicionales (Opcional)</label>
                            <textarea name="detalles" id="detalles" rows="3"
                                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-gob-oro focus:border-gob-oro sm:text-sm"
                                placeholder="Añade notas sobre la tarea..."></textarea>
                        </div>
                    </div>
                </div>

                <div class="px-6 py-4 bg-gray-50 text-right space-x-3 rounded-b-2xl">
                    <button type="button" onclick="cerrarModalTarea()"
                        class="px-4 py-2 text-sm font-bold text-gray-600 bg-white border border-gray-300 rounded-lg hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500">
                        Cancelar
                    </button>
                    <button type="submit"
                        class="px-4 py-2 text-sm font-bold text-white bg-gob-guinda rounded-lg shadow hover:bg-gob-guinda-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gob-guinda transition-colors">
                        Crear Tarea
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
