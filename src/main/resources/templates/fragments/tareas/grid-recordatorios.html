<div th:fragment="grid">
    <div th:if="${recordatorios.empty}" class="text-center py-12 bg-white rounded-2xl border border-dashed border-gray-300">
        <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-3">
            <i class="fas fa-mug-hot text-2xl text-gray-300"></i>
        </div>
        <p class="text-gray-500 font-bold">No tienes tareas próximas urgentes.</p>
        <button onclick="abrirModalTarea()" class="text-gob-guinda font-bold hover:underline mt-1 text-sm">Crear una nueva tarea</button>
    </div>

    <div id="grid-recordatorios-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        
        <div th:each="r : ${recordatorios}" 
             class="relative bg-white p-5 rounded-2xl shadow-sm border border-gray-100 hover:shadow-lg transition-all group overflow-hidden flex flex-col justify-between min-h-52">
            
            <div class="absolute left-0 top-0 bottom-0 w-1.5"
                 th:classappend="${r.prioridad != null and r.prioridad.nombre == 'ALTA' ? 'bg-red-500' : 'bg-gob-oro'}"></div>

            <div class="flex justify-between items-start pl-2">
                <h4 class="font-bold text-gray-800 text-lg leading-tight pr-4 line-clamp-2" th:text="${r.titulo}">Título de la Tarea</h4>
                
                <div class="p-2.5 rounded-xl bg-gray-50 text-gray-400 group-hover:text-gob-guinda transition-colors flex-shrink-0">
                    <i class="fas" th:classappend="${r.prioridad != null and r.prioridad.nombre == 'ALTA' ? 'fa-exclamation-circle text-red-400' : 'fa-clipboard-list'}"></i>
                </div>
            </div>

            <div class="pl-2 mt-1 mb-auto">
                <p class="text-sm text-gray-500 line-clamp-1" th:text="${r.detalles}">Detalles o descripción corta...</p>
            </div>

            <div class="pl-2 flex items-center justify-between mt-4 pt-4 border-t border-gray-50">
                
                <div class="text-sm font-extrabold tracking-wide" 
                     th:classappend="${r.fechaRecordatorio.isBefore(T(java.time.LocalDate).now()) ? 'text-red-600' : 'text-gob-guinda'}">
                    <span th:text="${#temporals.format(r.fechaRecordatorio, 'dd MMM')}">Fecha</span>,
                    <span th:text="${r.horaRecordatorio}">Hora</span>
                </div>
                
                <button th:onclick="'toggleTarea(' + ${r.id} + ')'" 
                        class="text-gray-200 hover:text-green-500 transform hover:scale-110 transition-all" 
                        title="Marcar como completada">
                    <i class="fas fa-check-circle text-2xl shadow-sm rounded-full bg-white"></i>
                </button>

            </div>
        </div>
    </div>
</div>
