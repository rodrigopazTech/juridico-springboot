<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <th:block th:fragment="tablaSesiones(pageData)">
        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead class="bg-gray-50 text-xs text-gray-500 uppercase">
                    <tr>
                        <th class="text-left px-4 py-3">Usuario</th>
                        <th class="text-left px-4 py-3">IP</th>
                        <th class="text-left px-4 py-3">Estado</th>
                        <th class="text-left px-4 py-3">Inicio</th>
                        <th class="text-left px-4 py-3">Ultima actividad</th>
                        <th class="text-left px-4 py-3">Cierre</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                    <tr th:each="s : ${pageData.content}">
                        <td class="px-4 py-3">
                            <div class="font-semibold text-gray-800" th:text="${s.email ?: 'Sin usuario'}">usuario</div>
                            <div class="text-xs text-gray-500" th:text="${s.rol ?: '-'}">rol</div>
                        </td>
                        <td class="px-4 py-3 text-gray-600" th:text="${s.ip ?: '-'}">ip</td>
                        <td class="px-4 py-3">
                            <span class="px-2 py-1 rounded text-xs font-bold"
                                  th:classappend="${s.estado == 'ACTIVA'} ? 'bg-green-50 text-green-700' : 'bg-gray-100 text-gray-600'"
                                  th:text="${s.estado}">ACTIVA</span>
                            <div class="text-xs text-gray-400" th:text="${s.motivoCierre ?: ''}"></div>
                        </td>
                        <td class="px-4 py-3 text-gray-600" th:text="${#temporals.format(s.fechaInicio, 'dd/MM/yyyy HH:mm')}">-</td>
                        <td class="px-4 py-3 text-gray-600" th:text="${#temporals.format(s.fechaUltimaActividad, 'dd/MM/yyyy HH:mm')}">-</td>
                        <td class="px-4 py-3 text-gray-600" th:text="${s.fechaCierre != null ? #temporals.format(s.fechaCierre, 'dd/MM/yyyy HH:mm') : '-'}">-</td>
                    </tr>
                    <tr th:if="${pageData.empty}">
                        <td colspan="6" class="px-4 py-8 text-center text-gray-400">Sin sesiones registradas.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </th:block>

    <th:block th:fragment="tablaEventos(pageData)">
        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead class="bg-gray-50 text-xs text-gray-500 uppercase">
                    <tr>
                        <th class="text-left px-4 py-3">Fecha</th>
                        <th class="text-left px-4 py-3">Usuario</th>
                        <th class="text-left px-4 py-3">Evento</th>
                        <th class="text-left px-4 py-3">Resultado</th>
                        <th class="text-left px-4 py-3">Diagnostico</th>
                        <th class="text-left px-4 py-3">Contexto tecnico</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                    <tr th:each="e : ${pageData.content}">
                        <td class="px-4 py-3 text-gray-600 whitespace-nowrap" th:text="${#temporals.format(e.fecha, 'dd/MM/yyyy HH:mm')}">-</td>
                        <td class="px-4 py-3">
                            <div class="font-semibold text-gray-800" th:text="${e.actorLegible}">usuario</div>
                            <div class="text-xs text-gray-500" th:text="${e.rol ?: '-'}">rol</div>
                        </td>
                        <td class="px-4 py-3">
                            <div class="font-semibold text-gray-800" th:text="${e.accionLegible}">evento</div>
                            <div class="text-xs text-gray-500" th:text="${e.modulo ?: '-'}">modulo</div>
                        </td>
                        <td class="px-4 py-3">
                            <span class="px-2 py-1 rounded text-xs font-bold"
                                  th:classappend="${e.resultado == 'EXITOSO'} ? 'bg-green-50 text-green-700' : (${e.resultado == 'ERROR'} ? 'bg-red-50 text-red-700' : 'bg-amber-50 text-amber-700')"
                                  th:text="${e.resultadoLegible}">resultado</span>
                            <div class="text-xs text-gray-400 mt-1" th:if="${e.codigoHttp != null}" th:text="${'HTTP ' + e.codigoHttp}">HTTP</div>
                        </td>
                        <td class="px-4 py-3 text-gray-700 min-w-[260px] max-w-xl">
                            <div class="leading-5" th:text="${e.diagnosticoAdmin}">diagnostico</div>
                        </td>
                        <td class="px-4 py-3 text-xs text-gray-500 min-w-[220px]">
                            <div th:text="${e.ubicacionLegible}">ruta</div>
                            <div th:if="${e.ip != null}" th:text="${'IP: ' + e.ip}">IP</div>
                            <div class="truncate max-w-xs" th:if="${e.userAgent != null}" th:title="${e.userAgent}" th:text="${e.userAgent}">navegador</div>
                        </td>
                    </tr>
                    <tr th:if="${pageData.empty}">
                        <td colspan="6" class="px-4 py-8 text-center text-gray-400">Sin eventos registrados.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </th:block>
</body>
</html>
