<div th:fragment="form">

    <!-- ═══════════════════════════════════════════════
         RECUADRO DE REGLAS DE SEGURIDAD
    ═══════════════════════════════════════════════ -->
    <div class="bg-gray-50 border border-gray-200 rounded-xl p-4 text-xs text-gray-600 space-y-1 mb-5 max-w-md mx-auto">
        <p class="font-bold text-gray-700 mb-2">
            <i class="fas fa-shield-alt text-gob-guinda mr-1"></i> Reglas de la nueva contraseña:
        </p>
        <p><i class="fas fa-check text-green-500 mr-1.5"></i> Mínimo 6 caracteres</p>
        <p><i class="fas fa-check text-green-500 mr-1.5"></i> Puedes usar letras, números y símbolos</p>
        <p><i class="fas fa-info-circle text-blue-400 mr-1.5"></i> Se recomienda cambiarla cada 3 meses</p>
    </div>

    <!-- ═══════════════════════════════════════════════
         FORMULARIO
    ═══════════════════════════════════════════════ -->
    <form th:action="@{/perfil/password/actualizar}" method="post" class="max-w-md mx-auto" id="formSeguridad">
        <div class="space-y-5">

            <!-- Contraseña Actual -->
            <div class="relative group">
                <label class="block text-sm font-bold text-gray-700 mb-1">Contraseña Actual</label>
                <div class="relative">
                    <div
                        class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400 group-focus-within:text-gob-guinda transition-colors">
                        <i class="fas fa-lock text-sm"></i>
                    </div>
                    <input id="passwordActual" type="password" name="passwordActual" required
                        class="w-full pl-10 pr-10 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-gob-oro focus:border-gob-oro outline-none transition-all">
                    <button type="button" onclick="toggleVis('passwordActual','eyeActual')"
                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 transition-colors">
                        <i id="eyeActual" class="fas fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Nueva Contraseña -->
            <div class="relative group">
                <label class="block text-sm font-bold text-gray-700 mb-1">Nueva Contraseña</label>
                <div class="relative">
                    <div
                        class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400 group-focus-within:text-gob-guinda transition-colors">
                        <i class="fas fa-key text-sm"></i>
                    </div>
                    <input id="nuevoPassword" type="password" name="nuevoPassword" required minlength="6"
                        class="w-full pl-10 pr-10 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-gob-oro focus:border-gob-oro outline-none transition-all">
                    <button type="button" onclick="toggleVis('nuevoPassword','eyeNuevo')"
                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 transition-colors">
                        <i id="eyeNuevo" class="fas fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Confirmar Nueva Contraseña -->
            <div class="relative group">
                <label class="block text-sm font-bold text-gray-700 mb-1">Confirmar Nueva Contraseña</label>
                <div class="relative">
                    <div
                        class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400 group-focus-within:text-gob-guinda transition-colors">
                        <i class="fas fa-check text-sm"></i>
                    </div>
                    <input id="confirmarPassword" type="password" name="confirmarPassword" required minlength="6"
                        class="w-full pl-10 pr-10 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-gob-oro focus:border-gob-oro outline-none transition-all">
                    <button type="button" onclick="toggleVis('confirmarPassword','eyeConfirmar')"
                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 transition-colors">
                        <i id="eyeConfirmar" class="fas fa-eye text-sm"></i>
                    </button>
                </div>
                <!-- Indicador en tiempo real -->
                <span id="mensajePassword" class="text-xs mt-1.5 hidden block"></span>
            </div>

        </div>

        <div class="mt-8 flex justify-center">
            <button id="btnSubmitPassword" type="submit"
                class="w-full bg-gob-guinda text-white px-8 py-3 rounded-xl hover:bg-gob-guindaDark font-bold shadow-xl transition-all flex items-center justify-center gap-2">
                <i class="fas fa-key"></i> Actualizar Credenciales
            </button>
        </div>
    </form>

    <!-- ═══════════════════════════════════════════════
         Script 1: Toggle de visibilidad
    ═══════════════════════════════════════════════ -->
    <script>
        function toggleVis(inputId, eyeId) {
            const input = document.getElementById(inputId);
            const eye = document.getElementById(eyeId);
            if (input.type === 'password') {
                input.type = 'text';
                eye.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                eye.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>

    <!-- ═══════════════════════════════════════════════
         Script 2: Validación en Tiempo Real
    ═══════════════════════════════════════════════ -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const nuevoPassword = document.getElementById('nuevoPassword');
            const confirmarPassword = document.getElementById('confirmarPassword');
            const mensajePassword = document.getElementById('mensajePassword');
            const btnSubmit = document.getElementById('btnSubmitPassword');

            if (!nuevoPassword || !confirmarPassword) return;

            function validarCoincidencia() {
                // Ambos vacíos → ocultar mensaje
                if (nuevoPassword.value === '' && confirmarPassword.value === '') {
                    mensajePassword.classList.add('hidden');
                    desbloquearBoton();
                    return;
                }

                mensajePassword.classList.remove('hidden');

                // Mínimo 6 caracteres
                if (nuevoPassword.value.length < 6) {
                    setMensaje('La contraseña debe tener al menos 6 caracteres', 'red');
                    bloquearBoton();
                    return;
                }

                // Confirmación aún vacía
                if (confirmarPassword.value === '') {
                    setMensaje('Ingresa la confirmación de la contraseña', 'gray');
                    bloquearBoton();
                    return;
                }

                // Comparación
                if (nuevoPassword.value !== confirmarPassword.value) {
                    setMensaje('✗ Las contraseñas nuevas no coinciden', 'red');
                    bloquearBoton();
                } else {
                    setMensaje('✓ Las contraseñas coinciden', 'green');
                    desbloquearBoton();
                }
            }

            function setMensaje(texto, color) {
                const baseClass = 'text-xs mt-1.5 block font-bold';
                const colorMap = { red: 'text-red-600', green: 'text-green-600', gray: 'text-gray-500' };
                mensajePassword.textContent = texto;
                mensajePassword.className = baseClass + ' ' + (colorMap[color] || 'text-gray-500');
            }

            function bloquearBoton() {
                btnSubmit.disabled = true;
                btnSubmit.classList.add('opacity-50', 'cursor-not-allowed');
            }

            function desbloquearBoton() {
                btnSubmit.disabled = false;
                btnSubmit.classList.remove('opacity-50', 'cursor-not-allowed');
            }

            nuevoPassword.addEventListener('input', validarCoincidencia);
            confirmarPassword.addEventListener('input', validarCoincidencia);
        });
    </script>

    <!-- ═══════════════════════════════════════════════
         Script 3: Alertas Emergentes (Backend Feedback)
    ═══════════════════════════════════════════════ -->
    <script th:if="${mensaje != null}" th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function () {
            const mensaje = /*[[${mensaje}]]*/ '';
            const tipo = /*[[${tipo}]]*/ '';

            if (tipo === 'error') {
                /* ── Contraseña actual incorrecta ── */
                Swal.fire({
                    title: '¡Contraseña incorrecta!',
                    text: mensaje,
                    icon: 'error',
                    confirmButtonText: 'Intentar de nuevo',
                    confirmButtonColor: '#691228',
                    background: '#fff5f5',
                    customClass: { confirmButton: 'font-bold rounded-xl px-6 py-2.5' }
                });
            } else if (tipo === 'success') {
                /* ── Actualización exitosa → redirigir al login tras 4s ── */
                Swal.fire({
                    title: '¡Contraseña Actualizada!',
                    html: 'Tu contraseña se cambió correctamente.<br><br>Serás redirigido al inicio de sesión en unos segundos para que accedas con tu nueva contraseña.',
                    icon: 'success',
                    showConfirmButton: false,
                    timer: 5000,
                    timerProgressBar: true,
                    background: '#f0fdf4',
                    customClass: { timerProgressBar: 'bg-green-500' },
                    willClose: () => {
                        window.location.href = '/logout';
                    }
                });
            } else if (tipo === 'warning') {
                Swal.fire({
                    title: 'Atención',
                    text: mensaje,
                    icon: 'warning',
                    confirmButtonText: 'Entendido',
                    confirmButtonColor: '#bc955c',
                    background: '#fffbeb',
                    customClass: { confirmButton: 'font-bold rounded-xl px-6 py-2.5' }
                });
            } else {
                Swal.fire({ title: 'Aviso', text: mensaje, icon: tipo });
            }
        });
    </script>

</div>
