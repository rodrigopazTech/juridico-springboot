<div th:fragment="form">

    <!-- ═══════════════════════════════════════════════
         RECUADRO DE REGLAS DE SEGURIDAD
    ═══════════════════════════════════════════════ -->
    <div id="password-policy-perfil" class="mb-5 max-w-md mx-auto"></div>

    <!-- ═══════════════════════════════════════════════
         FORMULARIO
    ═══════════════════════════════════════════════ -->
    <form th:action="@{/perfil/password/actualizar}" method="post" class="max-w-md mx-auto" id="formSeguridad">
        <div class="space-y-5">

            <!-- Contraseña Actual -->
            <div class="relative group">
                <label class="block text-sm font-bold text-gray-700 mb-1">Contraseña Actual</label>
                <div class="relative">
                    <div
                        class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400 group-focus-within:text-gob-guinda transition-colors">
                        <i class="fas fa-lock text-sm"></i>
                    </div>
                    <input id="passwordActual" type="password" name="passwordActual" required
                        class="w-full pl-10 pr-10 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-gob-oro focus:border-gob-oro outline-none transition-all">
                    <button type="button" onclick="toggleVis('passwordActual','eyeActual')"
                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 transition-colors">
                        <i id="eyeActual" class="fas fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Nueva Contraseña -->
            <div class="relative group">
                <label class="block text-sm font-bold text-gray-700 mb-1">Nueva Contraseña</label>
                <div class="relative">
                    <div
                        class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400 group-focus-within:text-gob-guinda transition-colors">
                        <i class="fas fa-key text-sm"></i>
                    </div>
                    <input id="nuevoPassword" type="password" name="nuevoPassword" required minlength="8"
                        class="w-full pl-10 pr-10 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-gob-oro focus:border-gob-oro outline-none transition-all">
                    <button type="button" onclick="toggleVis('nuevoPassword','eyeNuevo')"
                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 transition-colors">
                        <i id="eyeNuevo" class="fas fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Confirmar Nueva Contraseña -->
            <div class="relative group">
                <label class="block text-sm font-bold text-gray-700 mb-1">Confirmar Nueva Contraseña</label>
                <div class="relative">
                    <div
                        class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400 group-focus-within:text-gob-guinda transition-colors">
                        <i class="fas fa-check text-sm"></i>
                    </div>
                    <input id="confirmarPassword" type="password" name="confirmarPassword" required minlength="8"
                        class="w-full pl-10 pr-10 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-gob-oro focus:border-gob-oro outline-none transition-all">
                    <button type="button" onclick="toggleVis('confirmarPassword','eyeConfirmar')"
                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 transition-colors">
                        <i id="eyeConfirmar" class="fas fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

        </div>

        <div class="mt-8 flex justify-center">
            <button id="btnSubmitPassword" type="submit"
                class="w-full bg-gob-guinda text-white px-8 py-3 rounded-xl hover:bg-gob-guindaDark font-bold shadow-xl transition-all flex items-center justify-center gap-2">
                <i class="fas fa-key"></i> Actualizar Credenciales
            </button>
        </div>
    </form>

    <!-- ═══════════════════════════════════════════════
         Script 1: Toggle de visibilidad
    ═══════════════════════════════════════════════ -->
    <script>
        function toggleVis(inputId, eyeId) {
            const input = document.getElementById(inputId);
            const eye = document.getElementById(eyeId);
            if (input.type === 'password') {
                input.type = 'text';
                eye.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                eye.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>

    <script th:src="@{/js/password-policy-validator.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            attachPasswordPolicyValidator({
                passwordInputId: 'nuevoPassword',
                confirmInputId: 'confirmarPassword',
                submitButtonId: 'btnSubmitPassword',
                containerId: 'password-policy-perfil'
            });
        });
    </script>

    <!-- ═══════════════════════════════════════════════
         Script 3: Alertas Emergentes (Backend Feedback)
    ═══════════════════════════════════════════════ -->
    <script th:if="${mensaje != null and origenMensaje == 'password'}" th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function () {
            const mensaje = /*[[${mensaje}]]*/ '';
            const tipo = /*[[${tipo}]]*/ '';

            if (tipo === 'error') {
                /* ── Contraseña actual incorrecta ── */
                Swal.fire({
                    title: '¡Contraseña incorrecta!',
                    text: mensaje,
                    icon: 'error',
                    confirmButtonText: 'Intentar de nuevo',
                    confirmButtonColor: '#691228',
                    background: '#fff5f5',
                    customClass: { confirmButton: 'font-bold rounded-xl px-6 py-2.5' }
                });
            } else if (tipo === 'success') {
                /* ── Actualización exitosa → redirigir al login tras 4s ── */
                Swal.fire({
                    title: '¡Contraseña Actualizada!',
                    html: 'Tu contraseña se cambió correctamente.<br><br>Serás redirigido al inicio de sesión en unos segundos para que accedas con tu nueva contraseña.',
                    icon: 'success',
                    showConfirmButton: false,
                    timer: 5000,
                    timerProgressBar: true,
                    background: '#f0fdf4',
                    customClass: { timerProgressBar: 'bg-green-500' },
                    willClose: () => {
                        window.location.href = '/logout';
                    }
                });
            } else if (tipo === 'warning') {
                Swal.fire({
                    title: 'Atención',
                    text: mensaje,
                    icon: 'warning',
                    confirmButtonText: 'Entendido',
                    confirmButtonColor: '#bc955c',
                    background: '#fffbeb',
                    customClass: { confirmButton: 'font-bold rounded-xl px-6 py-2.5' }
                });
            } else {
                Swal.fire({ title: 'Aviso', text: mensaje, icon: tipo });
            }
        });
    </script>

</div>
