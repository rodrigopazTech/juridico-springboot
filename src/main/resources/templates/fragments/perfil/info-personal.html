<div th:fragment="info" class="space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="space-y-1">
            <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Nombre Completo</label>
            <div class="flex items-center gap-2 p-3 bg-gray-50 border border-gray-100 rounded-xl text-gray-700 font-medium">
                <i class="fas fa-user text-gray-300"></i>
                <span th:text="${usuario.nombreCompleto}">Nombre del Usuario</span>
            </div>
        </div>

        <div class="space-y-1">
            <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Correo Institucional</label>
            <div class="flex items-center gap-2 p-3 bg-gray-50 border border-gray-100 rounded-xl text-gray-700 font-medium">
                <i class="fas fa-envelope text-gray-300"></i>
                <span th:text="${usuario.email}">correo@ejemplo.com</span>
            </div>
        </div>

        <div class="space-y-1">
            <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Gerencia / Unidad</label>
            <div class="flex items-center gap-2 p-3 bg-gray-50 border border-gray-100 rounded-xl text-gray-700 font-medium">
                <i class="fas fa-building text-gray-300"></i>
                <span th:text="${usuario.gerencia != null ? usuario.gerencia.nombre : 'Sin Gerencia'}">Nombre Gerencia</span>
            </div>
        </div>

        <div class="space-y-1">
            <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Miembro desde</label>
            <div class="flex items-center gap-2 p-3 bg-gray-50 border border-gray-100 rounded-xl text-gray-700 font-medium">
                <i class="fas fa-calendar-check text-gray-300"></i>
                <span th:text="${#temporals.format(usuario.createdAt, 'dd MMMM, yyyy')}">01 Enero, 2026</span>
            </div>
        </div>
    </div>

    <div class="mt-8 pt-6 border-t border-gray-50">
        <label class="text-xs font-bold text-gray-400 uppercase tracking-wider block mb-3">Materias bajo mi responsabilidad</label>
        <div class="flex flex-wrap gap-2">
            <div th:each="materia : ${usuario.materias}" 
                 class="flex items-center gap-2 px-4 py-2 bg-gob-oro/10 border border-gob-oro/20 rounded-full text-gob-oro text-xs font-extrabold uppercase tracking-tight">
                <i class="fas fa-balance-scale"></i>
                <span th:text="${materia.nombre}">Materia</span>
            </div>
            <p th:if="${usuario.materias.empty}" class="text-sm text-gray-400 italic">No tienes materias asignadas actualmente.</p>
        </div>
    </div>
</div>
