<div th:fragment="modal" id="modal-recordatorio" class="fixed inset-0 z-50 hidden" aria-labelledby="modal-titulo-recordatorio" role="dialog" aria-modal="true">
    <div class="fixed inset-0 bg-gray-900 bg-opacity-60 backdrop-blur-sm transition-opacity"></div>

    <div class="fixed inset-0 z-10 overflow-y-auto">
        <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
            <div class="relative transform overflow-hidden rounded-xl bg-white text-left shadow-2xl transition-all sm:my-8 sm:w-full sm:max-w-lg border border-gray-200">
                
                <div class="bg-white px-6 py-4 border-b border-gray-200 flex items-center justify-between bg-gradient-to-r from-gray-50 to-white">
                    <h3 class="text-lg font-bold text-gob-guinda flex items-center gap-2 font-headings">
                        <i class="fas fa-sticky-note"></i> Nuevo Recordatorio
                    </h3>
                    <button type="button" onclick="cerrarModalRecordatorio()" 
                            class="text-gray-400 hover:text-gob-guinda transition-colors p-2 rounded-full hover:bg-gray-100">
                        <span class="sr-only">Cerrar</span>
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
                
                <div class="p-6">
                    <form id="form-recordatorio" th:action="@{/alertas/recordatorios/guardar}" method="post" class="space-y-5">
                        
                        <div>
                            <label class="block text-sm font-bold text-gob-gris mb-1">Título *</label>
                            <div class="relative">
                                <input type="text" name="titulo" required 
                                       class="block w-full pl-10 pr-3 py-2.5 text-sm border-gray-300 focus:outline-none focus:ring-gob-oro focus:border-gob-oro rounded-md shadow-sm placeholder-gray-400" 
                                       placeholder="Ej: Llamar al cliente...">
                                <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center px-3 text-gray-400">
                                    <i class="fas fa-pen"></i>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-bold text-gob-gris mb-1">Fecha *</label>
                                <div class="relative">
                                    <input type="date" name="fechaRecordatorio" required 
                                           class="block w-full pl-10 pr-3 py-2.5 text-sm border-gray-300 focus:outline-none focus:ring-gob-oro focus:border-gob-oro rounded-md shadow-sm">
                                    <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center px-3 text-gray-400">
                                        <i class="far fa-calendar-alt"></i>
                                    </div>
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-gob-gris mb-1">Hora *</label>
                                <div class="relative">
                                    <input type="time" name="horaRecordatorio" value="09:00" required 
                                           class="block w-full pl-10 pr-3 py-2.5 text-sm border-gray-300 focus:outline-none focus:ring-gob-oro focus:border-gob-oro rounded-md shadow-sm">
                                    <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center px-3 text-gray-400">
                                        <i class="far fa-clock"></i>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-gob-gris mb-1">Prioridad</label>
                            <div class="relative">
                                <select name="prioridad" class="block w-full pl-10 pr-10 py-2.5 text-sm border-gray-300 focus:outline-none focus:ring-gob-oro focus:border-gob-oro rounded-md shadow-sm appearance-none bg-white">
                                    <option value="MEDIA">Normal</option>
                                    <option value="ALTA">Alta (Urgente)</option>
                                    <option value="BAJA">Baja</option>
                                </select>
                                <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center px-3 text-gray-400">
                                    <i class="fas fa-flag"></i>
                                </div>
                                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-400">
                                    <i class="fas fa-chevron-down text-xs"></i>
                                </div>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-gob-gris mb-1">Detalles</label>
                            <textarea name="detalles" rows="3" 
                                      class="block w-full px-3 py-2.5 text-sm border-gray-300 focus:outline-none focus:ring-gob-oro focus:border-gob-oro rounded-md shadow-sm placeholder-gray-400" 
                                      placeholder="Notas adicionales..."></textarea>
                        </div>
                    </form>
                </div>

                <div class="mt-4 flex flex-col-reverse sm:flex-row sm:justify-end gap-3 p-6 pt-0">
                    <button type="button" onclick="cerrarModalRecordatorio()" 
                            class="w-full sm:w-auto inline-flex justify-center items-center px-4 py-2.5 border border-gray-300 shadow-sm text-sm font-bold rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gob-oro transition-colors">
                        Cancelar
                    </button>
                    <button type="submit" form="form-recordatorio" 
                            class="w-full sm:w-auto inline-flex justify-center items-center px-4 py-2.5 border border-transparent shadow-sm text-sm font-bold rounded-md text-white bg-gob-guinda hover:bg-gob-guinda-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gob-guinda transition-colors">
                        <i class="fas fa-save mr-2"></i> Guardar Recordatorio
                    </button>
                </div>

            </div>
        </div>
    </div>
</div>
