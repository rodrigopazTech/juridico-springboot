<div th:fragment="tabla" id="contenedor-tabla-audiencias" class="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden mt-6">

    <!-- VISTA ESCRITORIO (Tabla clásica) -->
    <div class="max-lg:hidden overflow-x-auto">
        <table class="w-full text-sm text-left text-gob-gris" id="tabla-audiencias-desahogadas">
            <thead class="text-xs text-gob-gris uppercase bg-gray-50 border-b border-gray-200 font-headings">
                <tr>
                    <th class="px-6 py-3 font-bold">Fecha Desahogo</th>
                    <th class="px-6 py-3 font-bold">Expediente</th>
                    <th class="px-6 py-3 font-bold w-[150px]">Tipo Audiencia</th>
                    <th class="px-6 py-3 font-bold">Partes</th>
                    <th class="px-6 py-3 font-bold text-center">Acciones</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200" id="audiencias-desahogadas-body">
                <tr th:if="${audiencias.empty}">
                    <td colspan="5" class="px-6 py-8 text-center text-gray-500">
                        No hay audiencias desahogadas en este periodo.
                    </td>
                </tr>
                <tr th:each="a : ${audiencias}" class="bg-white hover:bg-gray-50 transition-colors">
                    <td class="px-6 py-4 font-bold text-gray-700"
                        th:text="${#temporals.format(a.fechaDesahogo, 'dd/MM/yyyy')}">01/01/2026</td>
                    <td class="px-6 py-4 text-gob-guinda font-bold" th:text="${a.numeroReferencia}">EXP-001</td>
                    <td class="px-6 py-4">
                        <div class="w-[150px] truncate">
                            <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded inline-block max-w-full truncate"
                                th:text="${a.tipoAudiencia != null ? a.tipoAudiencia.nombre : 'Sin tipo'}"
                                th:title="${a.tipoAudiencia != null ? a.tipoAudiencia.nombre : 'Sin tipo'}">Tipo</span>
                        </div>
                    </td>
                    <td class="px-6 py-4 w-56">
                        <div class="line-clamp-2 whitespace-normal break-words text-sm" th:text="${a.partesReferencia}"
                            th:title="${a.partesReferencia}">
                            Partes
                        </div>
                    </td>
                    <td class="px-6 py-4 text-center">
                        <div class="flex justify-center gap-3">
                            <a th:if="${a.actaDocumento != null}"
                                th:href="${#strings.startsWith(a.actaDocumento, 'http')} ? ${a.actaDocumento} : @{/audiencias/preview-acta/{id}(id=${a.id})}"
                                target="_blank"
                                class="text-red-600 hover:text-red-800 transition-colors" title="Ver acta">
                                <i class="fas fa-file-pdf fa-lg"></i>
                            </a>
                            <button type="button" th:data-id="${a.id}" th:data-expediente="${a.numeroReferencia}"
                                th:data-obs="${a.observaciones}"
                                onclick="window.verObservaciones(this.getAttribute('data-id'), 'audiencia', this.getAttribute('data-expediente'), this.getAttribute('data-obs'))"
                                class="text-gray-500 hover:text-blue-600 transition-colors" title="Ver Observaciones">
                                <i class="fas fa-eye fa-lg"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- VISTA MÓVIL (Tarjetas Adaptativas) -->
    <div class="lg:hidden bg-gray-50 p-4 space-y-3">
        <div th:if="${audiencias.empty}" class="bg-white p-8 rounded-xl text-center border border-dashed border-gray-200">
            <i class="fas fa-calendar-times text-3xl text-gray-200 mb-2"></i>
            <p class="text-gray-400 text-sm">No hay audiencias desahogadas en este periodo.</p>
        </div>

        <div th:each="a : ${audiencias}" class="bg-white rounded-xl border border-gray-200 p-4 shadow-sm space-y-3 relative">
            <!-- Encabezado de la Tarjeta (Fecha + Tipo Audiencia) -->
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="text-xs font-bold text-gray-400" th:text="'#' + ${a.id}">#1</span>
                    <div class="flex flex-col">
                        <span class="text-xs font-bold text-gray-900"
                            th:text="${#temporals.format(a.fechaDesahogo, 'dd/MM/yyyy')}">01/01/2026</span>
                        <span class="text-[10px] text-gray-400">Fecha Desahogo</span>
                    </div>
                </div>

                <div class="max-w-[150px] truncate">
                    <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded inline-block max-w-full truncate"
                        th:text="${a.tipoAudiencia != null ? a.tipoAudiencia.nombre : 'Sin tipo'}"
                        th:title="${a.tipoAudiencia != null ? a.tipoAudiencia.nombre : 'Sin tipo'}">Tipo</span>
                </div>
            </div>

            <!-- Cuerpo de la Tarjeta: Expediente / Partes -->
            <div class="space-y-1">
                <div>
                    <span class="text-xs font-bold text-gray-400 block">Expediente</span>
                    <span class="text-xs font-bold text-gob-guinda" th:text="${a.numeroReferencia}">EXP-001</span>
                </div>
                <div>
                    <span class="text-xs font-bold text-gray-400 block">Partes</span>
                    <p class="text-xs text-gray-700 whitespace-normal break-words" th:text="${a.partesReferencia}">Partes</p>
                </div>
            </div>

            <!-- Pie de Tarjeta (Acciones) -->
            <div class="pt-3 border-t border-gray-100 flex items-center justify-end gap-2">
                <a th:if="${a.actaDocumento != null}"
                    th:href="${#strings.startsWith(a.actaDocumento, 'http')} ? ${a.actaDocumento} : @{/audiencias/preview-acta/{id}(id=${a.id})}"
                    target="_blank"
                    class="p-2 text-red-600 hover:text-red-800 hover:bg-red-50 rounded-lg transition-colors" title="Ver acta">
                    <i class="fas fa-file-pdf fa-lg"></i>
                </a>

                <button type="button" th:data-id="${a.id}" th:data-expediente="${a.numeroReferencia}"
                    th:data-obs="${a.observaciones}"
                    onclick="window.verObservaciones(this.getAttribute('data-id'), 'audiencia', this.getAttribute('data-expediente'), this.getAttribute('data-obs'))"
                    class="p-2 text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors" title="Ver Observaciones">
                    <i class="fas fa-eye fa-lg"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Paginación común -->
    <div class="p-4 border-t border-gray-200 flex justify-between items-center bg-gray-50" th:if="${!audiencias.empty}">
        <span class="text-sm text-gray-600">
            Página <span th:text="${audiencias.number + 1}">1</span> de <span
                th:text="${audiencias.totalPages}">1</span>
        </span>
        <div class="flex gap-2">
            <a th:if="${audiencias.hasPrevious()}"
                th:href="@{/agenda(page=${audiencias.number - 1}, tab='audiencias', keyword=${paramKeyword}, fechaInicio=${paramFechaInicio}, fechaFin=${paramFechaFin}, rangoFecha=${paramRangoFecha}, gerenciaId=${paramGerenciaId}, materiaId=${paramMateriaId}, abogadoId=${paramAbogadoId}, tipoAudienciaId=${paramTipoAudienciaId}, prioridadId=${paramPrioridadId}, documento=${paramDocumento})}"
                class="px-3 py-1 border border-gray-300 rounded hover:bg-white text-sm bg-white text-gray-600 transition-colors">
                <i class="fas fa-chevron-left mr-1"></i> Anterior
            </a>

            <a th:if="${audiencias.hasNext()}"
                th:href="@{/agenda(page=${audiencias.number + 1}, tab='audiencias', keyword=${paramKeyword}, fechaInicio=${paramFechaInicio}, fechaFin=${paramFechaFin}, rangoFecha=${paramRangoFecha}, gerenciaId=${paramGerenciaId}, materiaId=${paramMateriaId}, abogadoId=${paramAbogadoId}, tipoAudienciaId=${paramTipoAudienciaId}, prioridadId=${paramPrioridadId}, documento=${paramDocumento})}"
                class="px-3 py-1 border border-gray-300 rounded hover:bg-white text-sm bg-white text-gray-600 transition-colors">
                Siguiente <i class="fas fa-chevron-right ml-1"></i>
            </a>
        </div>
    </div>
</div>
