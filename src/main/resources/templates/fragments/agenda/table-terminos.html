<div th:fragment="tabla" class="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden">
    <div class="bg-gray-50 p-4 border-b border-gray-200">
        <h3 class="text-lg font-heading font-semibold text-gob-gris flex items-center">
            <i class="fas fa-clock text-gob-guinda mr-2"></i> Términos Presentados
        </h3>
    </div>
    
    <div class="overflow-x-auto">
        <table class="w-full text-sm text-left text-gob-gris" id="tabla-terminos-presentados">
            <thead class="text-xs text-gob-gris uppercase bg-gray-100 border-b border-gray-200 font-heading">
                <tr>
                    <th scope="col" class="px-6 py-3 font-bold">F. Vencimiento</th>
                    <th scope="col" class="px-6 py-3 font-bold">Expediente</th>
                    <th scope="col" class="px-6 py-3 font-bold">Actuación</th>
                    <th scope="col" class="px-6 py-3 font-bold">Estatus</th>
                    <th scope="col" class="px-6 py-3 font-bold">Abogado</th>
                    <th scope="col" class="px-6 py-3 font-bold text-center">Acciones</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200" id="terminos-presentados-body">
                
                <tr th:if="${terminos.empty}">
                    <td colspan="6" class="px-6 py-8 text-center text-gray-500">
                        No hay términos presentados o concluidos en este periodo.
                    </td>
                </tr>

                <tr th:each="t : ${terminos}" class="bg-white hover:bg-gray-50">
                    
                    <td class="px-6 py-4 font-bold text-gray-700" 
                        th:text="${#temporals.format(t.fechaVencimiento, 'dd/MM/yyyy')}">01/01/2026</td>
                    
                    <td class="px-6 py-4">
                        <span class="text-gob-guinda font-bold" 
                              th:text="${t.expediente != null ? t.expediente.numero : 'S/N'}">EXP-001</span>
                        <div class="text-xs text-gray-400 mt-1 truncate max-w-[150px]" 
                             th:text="${t.expediente != null ? t.expediente.partes : ''}">Actor vs Demandado</div>
                    </td>
                    
                    <td class="px-6 py-4 max-w-xs truncate" th:text="${t.actuacion}" th:title="${t.actuacion}">
                        Contestación de demanda
                    </td>
                    
                    <td class="px-6 py-4">
                        <span class="text-xs font-semibold px-2.5 py-0.5 rounded border"
                              th:classappend="${t.estatusTermino == 'Presentado' ? 'bg-green-100 text-green-800 border-green-200' : 
                                              (t.estatusTermino == 'Concluido' ? 'bg-blue-100 text-blue-800 border-blue-200' : 'bg-gray-100 text-gray-800')}"
                              th:text="${t.estatusTermino}">Presentado</span>
                    </td>
                    
                    <td class="px-6 py-4 text-sm" 
                        th:text="${t.abogadoResponsable != null ? t.abogadoResponsable.nombreCompleto : 'Sin Asignar'}">
                        Lic. Pérez
                    </td>
                    
                    <td class="px-6 py-4 text-center">
                        <div class="flex justify-center gap-2">
                            <a th:if="${t.archivoWord != null}" 
                               th:href="@{/terminos/descargar/{id}(id=${t.id})}" 
                               class="text-gray-500 hover:text-gob-guinda transition-colors" 
                               title="Descargar Documento/Acuse">
                                <i class="fas fa-file-download fa-lg"></i>
                            </a>
                            
                            <button type="button"
                                    th:data-id="${t.id}"
                                    th:data-expediente="${t.expediente != null ? t.expediente.numero : ''}"
                                    th:data-obs="${t.observaciones}"
                                    onclick="window.verObservaciones(this.getAttribute('data-id'), 'termino', this.getAttribute('data-expediente'), this.getAttribute('data-obs'))" 
                                    class="text-gray-500 hover:text-blue-600 transition-colors" 
                                    title="Ver Observaciones">
                                <i class="fas fa-eye fa-lg"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
