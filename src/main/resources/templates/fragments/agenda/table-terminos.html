<div th:fragment="tabla" class="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden">
    <div class="bg-gray-50 p-4 border-b border-gray-200">
        <h3 class="text-lg font-heading font-semibold text-gob-gris flex items-center">
            <i class="fas fa-clock text-gob-guinda mr-2"></i> Términos Concluidos
        </h3>
    </div>

    <div class="overflow-x-auto">
        <table class="w-full text-sm text-left text-gob-gris" id="tabla-terminos-presentados">
            <thead class="text-xs text-gob-gris uppercase bg-gray-100 border-b border-gray-200 font-heading">
                <tr>
                    <th scope="col" class="px-6 py-3 font-bold text-gob-guinda">F. Presentación</th>
                    <th scope="col" class="px-6 py-3 font-bold">F. Vencimiento</th>

                    <th scope="col" class="px-6 py-3 font-bold">Expediente</th>
                    <th scope="col" class="px-6 py-3 font-bold">Actuación</th>
                    <th scope="col" class="px-6 py-3 font-bold">Estatus</th>
                    <th scope="col" class="px-6 py-3 font-bold">Abogado</th>
                    <th scope="col" class="px-6 py-3 font-bold text-center">Acciones</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200" id="terminos-presentados-body">

                <tr th:if="${terminos.empty}">
                    <td colspan="7" class="px-6 py-8 text-center text-gray-500"> No hay términos presentados o
                        concluidos en este periodo.
                    </td>
                </tr>

                <tr th:each="t : ${terminos}" class="bg-white hover:bg-gray-50">

                    <td class="px-6 py-4">
                        <div class="flex items-center gap-2">
                            <i class="fas fa-check-circle text-green-600"></i>
                            <span class="font-bold text-gray-800"
                                th:text="${t.fechaPresentacion != null ? #temporals.format(t.fechaPresentacion, 'dd/MM/yyyy') : 'Pendiente'}">
                                01/02/2026
                            </span>
                        </div>
                    </td>

                    <td class="px-6 py-4 text-gray-500 text-xs">
                        <span class="block uppercase text-[10px]">Vencía el:</span>
                        <span class="font-medium"
                            th:text="${#temporals.format(t.fechaVencimiento, 'dd/MM/yyyy')}">01/01/2026</span>
                    </td>

                    <td class="px-6 py-4">
                        <div class="flex items-center gap-2">
                            <span class="text-gob-guinda font-bold"
                                th:text="${t.expediente != null ? t.expediente.numero : 'S/N'}">EXP-001</span>

                            <span th:if="${t.expediente != null}"
                                class="text-[10px] px-1.5 py-0.5 rounded-full font-bold uppercase tracking-wider shadow-sm border"
                                th:classappend="${t.expediente.prioridad.name() == 'ALTA' ? 'bg-gob-guinda text-gob-oro border-gob-oro' : 
                                                  (t.expediente.prioridad.name() == 'BAJA' ? 'bg-gray-100 text-gray-500 border-gray-200' : 
                                                  'bg-gob-oro text-gob-guinda border-transparent')}"
                                th:text="${t.expediente.prioridad}">MEDIA</span>
                        </div>
                    </td>

                    <td class="px-6 py-4 max-w-xs truncate" th:text="${t.actuacion}" th:title="${t.actuacion}">
                        Contestación
                    </td>

                    <td class="px-6 py-4">
                        <span class="text-xs font-semibold px-2.5 py-0.5 rounded border"
                            th:classappend="${t.estatusTermino.name() == 'PRESENTADO' ? 'bg-green-100 text-green-800 border-green-200' : 
                                              (t.estatusTermino.name() == 'CONCLUIDO' ? 'bg-blue-100 text-blue-800 border-blue-200' : 'bg-gray-100 text-gray-800')}"
                            th:text="${t.estatusTermino.nombre}">Presentado</span>
                    </td>

                    <td class="px-6 py-4 text-sm"
                        th:text="${t.abogadoResponsable != null ? t.abogadoResponsable.nombreCompleto : 'Sin Asignar'}">
                        Lic. Pérez
                    </td>

                    <td class="px-6 py-4 text-center">
                        <div class="flex justify-center gap-2">
                            <a th:if="${t.archivoWord != null}" th:href="@{/terminos/descargar/{id}(id=${t.id})}"
                                class="text-gray-500 hover:text-gob-guinda transition-colors" title="Descargar Acuse">
                                <i class="fas fa-file-download fa-lg"></i>
                            </a>

                            <button type="button" th:data-id="${t.id}"
                                th:data-expediente="${t.expediente != null ? t.expediente.numero : ''}"
                                th:data-obs="${t.observaciones}"
                                onclick="window.verObservaciones(this.getAttribute('data-id'), 'termino', this.getAttribute('data-expediente'), this.getAttribute('data-obs'))"
                                class="text-gray-500 hover:text-blue-600 transition-colors" title="Ver Observaciones">
                                <i class="fas fa-eye fa-lg"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="p-4 border-t border-gray-200 flex justify-between items-center bg-gray-50" th:if="${!terminos.empty}">
        <span class="text-sm text-gray-600">
            Página <span th:text="${terminos.number + 1}">1</span> de <span th:text="${terminos.totalPages}">1</span>
        </span>
        <div class="flex gap-2">
            <a th:if="${terminos.hasPrevious()}"
                th:href="@{/agenda(page=${terminos.number - 1}, tab='terminos', filtro=${filtroActual}, mes=${mesActual}, anio=${anioActual})}"
                class="px-3 py-1 border border-gray-300 rounded hover:bg-white text-sm bg-white text-gray-600 transition-colors">
                <i class="fas fa-chevron-left mr-1"></i> Anterior
            </a>

            <a th:if="${terminos.hasNext()}"
                th:href="@{/agenda(page=${terminos.number + 1}, tab='terminos', filtro=${filtroActual}, mes=${mesActual}, anio=${anioActual})}"
                class="px-3 py-1 border border-gray-300 rounded hover:bg-white text-sm bg-white text-gray-600 transition-colors">
                Siguiente <i class="fas fa-chevron-right ml-1"></i>
            </a>
        </div>
    </div>
</div>
