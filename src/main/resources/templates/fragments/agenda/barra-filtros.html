<div th:fragment="filtros" class="bg-white border border-gray-200 rounded-lg shadow-sm px-3 py-3">
    <form id="form-filtros" th:action="@{/agenda}" method="get"
        class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-[minmax(150px,0.8fr)_minmax(150px,0.8fr)_minmax(180px,1fr)_minmax(180px,1fr)_auto] gap-3 items-end">
        <input type="hidden" name="tab" th:value="${activeTab}">
        <input type="hidden" name="keyword" id="historial-keyword" th:value="${paramKeyword}">

        <div class="space-y-1">
            <label class="text-[10px] font-bold text-gray-500 uppercase tracking-wide">Desde</label>
            <input type="date" name="fechaInicio" th:value="${paramFechaInicio}" onchange="actualizarAgendaAsincrono()"
                class="w-full h-9 bg-gray-50 border border-gray-200 rounded-md px-2 text-xs text-gray-700 outline-none focus:bg-white focus:border-gob-guinda focus:ring-2 focus:ring-gob-guinda/10 transition-all"
                title="Fecha inicio">
        </div>

        <div class="space-y-1">
            <label class="text-[10px] font-bold text-gray-500 uppercase tracking-wide">Hasta</label>
            <input type="date" name="fechaFin" th:value="${paramFechaFin}" onchange="actualizarAgendaAsincrono()"
                class="w-full h-9 bg-gray-50 border border-gray-200 rounded-md px-2 text-xs text-gray-700 outline-none focus:bg-white focus:border-gob-guinda focus:ring-2 focus:ring-gob-guinda/10 transition-all"
                title="Fecha fin">
        </div>

        <div sec:authorize="hasAnyAuthority('ADMIN', 'DIRECTOR_PRINCIPAL', 'DIRECTOR', 'SUBDIRECTOR')" class="space-y-1">
            <label class="text-[10px] font-bold text-gray-500 uppercase tracking-wide">Gerencia</label>
            <select name="gerenciaId" onchange="actualizarAgendaAsincrono()"
                class="w-full h-9 bg-gray-50 border border-gray-200 rounded-md px-2 text-xs text-gray-700 outline-none focus:bg-white focus:border-gob-guinda focus:ring-2 focus:ring-gob-guinda/10 transition-all">
                <option value="">Todas</option>
                <option th:each="g : ${listaGerencias}" th:value="${g.id}" th:text="${g.nombre}"
                    th:selected="${paramGerenciaId != null and paramGerenciaId.toString() == g.id.toString()}"></option>
            </select>
        </div>

        <div sec:authorize="hasAnyAuthority('ADMIN', 'DIRECTOR_PRINCIPAL', 'DIRECTOR', 'SUBDIRECTOR', 'GERENTE', 'JEFE_DEPTO')"
            class="space-y-1">
            <label class="text-[10px] font-bold text-gray-500 uppercase tracking-wide">Materia</label>
            <select name="materiaId" onchange="actualizarAgendaAsincrono()"
                class="w-full h-9 bg-gray-50 border border-gray-200 rounded-md px-2 text-xs text-gray-700 outline-none focus:bg-white focus:border-gob-guinda focus:ring-2 focus:ring-gob-guinda/10 transition-all">
                <option value="">Todas</option>
                <option th:each="m : ${listaMaterias}" th:value="${m.id}" th:text="${m.nombre}"
                    th:selected="${paramMateriaId != null and paramMateriaId.toString() == m.id.toString()}"></option>
            </select>
        </div>

        <div class="col-span-2 md:col-span-4 xl:col-span-1 flex justify-end">
            <a th:href="@{/agenda(tab=${activeTab})}"
                class="inline-flex items-center justify-center gap-2 h-9 px-3 rounded-md border border-gray-200 bg-white text-xs font-bold text-gray-600 hover:text-gob-guinda hover:border-gob-guinda/40 hover:bg-gob-guinda/5 transition-all">
                <i class="fas fa-rotate-left text-[11px]"></i>
                Limpiar
            </a>
        </div>
    </form>
</div>
