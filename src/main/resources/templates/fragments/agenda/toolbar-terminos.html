<div th:fragment="toolbar" class="mb-6 flex flex-col gap-4">
    <div class="flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="relative w-full md:w-96">
            <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                <i class="fas fa-search text-gray-400"></i>
            </div>
            <input type="text" th:value="${paramKeyword}" id="search-agenda-terminos"
                class="bg-white border border-gray-200 text-gob-gris text-sm rounded-lg focus:border-gob-oro focus:ring-2 focus:ring-gob-oro/10 block w-full ps-10 p-2.5 outline-none transition-all font-medium"
                placeholder="Buscar en el servidor...">
        </div>
    </div>

    <!-- Banner Transparencia de Semáforos Procesales -->
    <div class="flex flex-wrap items-center justify-between gap-3 bg-white border border-gray-200 rounded-xl px-4 py-3 text-xs shadow-sm">
        <div class="flex items-center gap-2 font-bold text-gray-700">
            <i class="fas fa-traffic-light text-gob-guinda text-sm"></i>
            <span>Semáforo de Vencimiento Procesal:</span>
        </div>
        <div class="flex flex-wrap items-center gap-3 text-[11px] font-semibold">
            <span class="inline-flex items-center gap-1.5 bg-green-50 text-green-700 border border-green-200 px-2.5 py-1 rounded-md">
                <span class="w-2.5 h-2.5 rounded-full bg-green-500 shadow-sm"></span> A tiempo (&gt; 7 días)
            </span>
            <span class="inline-flex items-center gap-1.5 bg-yellow-50 text-yellow-800 border border-yellow-200 px-2.5 py-1 rounded-md">
                <span class="w-2.5 h-2.5 rounded-full bg-yellow-400 shadow-sm"></span> En advertencia (4 a 7 días)
            </span>
            <span class="inline-flex items-center gap-1.5 bg-red-50 text-red-700 border border-red-200 px-2.5 py-1 rounded-md">
                <span class="w-2.5 h-2.5 rounded-full bg-red-500 shadow-sm"></span> Crítico (≤ 3 días)
            </span>
            <span class="inline-flex items-center gap-1.5 bg-rose-100 text-rose-900 border border-rose-300 px-2.5 py-1 rounded-md">
                <span class="w-2.5 h-2.5 rounded-full bg-red-800 shadow-sm"></span> Vencido (&lt; 0 días)
            </span>
            <span class="inline-flex items-center gap-1.5 bg-gray-100 text-gray-700 border border-gray-200 px-2.5 py-1 rounded-md">
                <span class="w-2.5 h-2.5 rounded-full bg-gray-400 shadow-sm"></span> Concluido / Presentado
            </span>
        </div>
    </div>
</div>
