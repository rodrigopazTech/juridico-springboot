<div th:fragment="toolbar" class="mb-6 flex flex-col gap-4">

        <div class="relative w-full md:w-96">
            <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                <i class="fas fa-search text-gray-400"></i>
            </div>
            <input type="text" th:value="${paramKeyword}" id="search-agenda-terminos"
                class="bg-white border border-gray-200 text-gob-gris text-sm rounded-lg focus:border-gob-oro focus:ring-2 focus:ring-gob-oro/10 block w-full ps-10 p-2.5 outline-none transition-all font-medium"
                placeholder="Buscar en el servidor...">
        </div>
    </div>
</div>
