<div th:fragment="tabla" id="tabla-audiencias-container" class="space-y-4">
    <div th:fragment="gridResultados" id="grid-resultados-audiencias">
        <!-- Encabezado de la Tabla (Invisible en mobile, pero útil para estructura) -->
        <div
            class="hidden lg:grid grid-cols-12 gap-4 px-4 py-3 text-[10px] font-bold text-gray-400 uppercase tracking-widest border-b border-gray-50">
            <div class="col-span-2">Fecha y Hora</div>
            <div class="col-span-3">Asunto / Expediente</div>
            <div class="col-span-2">Tipo</div>
            <div class="col-span-2">Abogado</div>
            <div class="col-span-2 text-center">Estado</div>
            <div class="col-span-1 text-right"></div>
        </div>

        <!-- Filas de la Tabla -->
        <div th:if="${audiencias.empty}" class="bg-white p-12 rounded-2xl text-center border border-dashed border-gray-200">
            <i class="fas fa-calendar-times text-4xl text-gray-200 mb-4"></i>
            <p class="text-gray-400 text-sm">No se encontraron audiencias registradas.</p>
        </div>

        <div id="tabla-audiencias-body">
            <div th:each="a : ${audiencias}"
                class="relative bg-white hover:bg-gray-50/80 transition-all border border-gray-100 rounded-2xl p-4 lg:p-0 lg:grid lg:grid-cols-12 lg:items-center lg:gap-4 shadow-sm group mb-4 last:mb-0">

                <!-- Fecha y Hora -->
                <div class="col-span-2 lg:px-4 lg:py-6 border-b lg:border-b-0 lg:border-r border-gray-50">
                    <div class="flex items-center lg:flex-col lg:items-start gap-3 lg:gap-1">
                        <div
                            class="w-10 lg:w-auto h-10 lg:h-auto rounded-xl bg-gray-50 lg:bg-transparent flex items-center justify-center lg:block">
                            <span class="text-sm font-bold text-gray-900 leading-none"
                                th:text="${#temporals.format(a.fechaAudiencia, 'yyyy-MM-dd')}">2024-10-14</span>
                        </div>
                        <span class="text-[10px] font-medium text-gray-400" th:text="${a.horaAudiencia}">10:00 AM</span>
                    </div>
                </div>

                <!-- Asunto / Expediente -->
                <div class="col-span-3 py-4 lg:px-4 border-b lg:border-b-0 lg:border-r border-gray-50 min-w-0">
                    <div class="flex flex-col min-w-0">
                        <span class="text-sm font-bold text-gray-800 mb-1 truncate block"
                            th:title="${a.tipoAudiencia?.nombre ?: 'Audiencia General'}"
                            th:text="${a.tipoAudiencia?.nombre ?: 'Audiencia General'}">Revisión de Contrato</span>
                        <a th:href="@{/expedientes/{id}(id=${a.expediente?.id})}"
                            class="text-xs font-semibold text-gob-guinda hover:underline inline-flex items-center gap-1"
                            th:title="${'Ver expediente: ' + a.expediente?.numero}">
                            <i class="fas fa-folder-open text-[10px] opacity-70"></i>
                            <span th:text="${a.expediente?.numero}">EXP-2024-001</span>
                        </a>
                    </div>
                </div>

                <!-- Tipo / Ubicación -->
                <div
                    class="col-span-2 py-4 lg:px-4 border-b lg:border-b-0 lg:border-r border-gray-50 flex items-center gap-2 min-w-0">
                    <div class="flex flex-col min-w-0">
                        <span class="text-xs font-bold text-gray-600 truncate block"
                            th:title="${a.tipoAudiencia?.nombre ?: 'General'}"
                            th:text="${a.tipoAudiencia?.nombre ?: 'General'}">Conciliación</span>
                        <div class="flex items-center gap-1.5 mt-1">
                            <i th:if="${a.esVirtual}" class="fas fa-video text-[10px] text-blue-500"></i>
                            <i th:unless="${a.esVirtual}" class="fas fa-map-marker-alt text-[10px] text-gray-400"></i>
                            <span class="text-[10px] font-medium text-gray-400 truncate block max-w-[120px]"
                                th:title="${a.esVirtual ? 'Virtual' : (a.salaLugar ?: 'Presencial')}"
                                th:text="${a.esVirtual ? 'Virtual' : (a.salaLugar ?: 'Presencial')}">Virtual</span>
                        </div>
                    </div>
                </div>

                <!-- Abogado -->
                <div class="col-span-2 py-4 lg:px-4 border-b lg:border-b-0 lg:border-r border-gray-50 min-w-0">
                    <div class="flex flex-col min-w-0">
                        <span class="text-xs font-bold text-gray-700 truncate block"
                            th:title="${a.abogadoComparece?.nombreCompleto ?: (a.expediente?.abogadoResponsable?.nombreCompleto ?: 'Sin asignar')}"
                            th:text="${a.abogadoComparece?.nombreCompleto ?: (a.expediente?.abogadoResponsable?.nombreCompleto ?: 'Sin asignar')}">Ana
                            Gómez</span>
                        <span class="text-[10px] text-gray-400 font-medium"
                            th:text="${a.abogadoComparece != null ? 'Asistente' : 'Responsable'}">Asistente</span>
                    </div>
                </div>

                <!-- Estado -->
                <div
                    class="col-span-2 py-4 lg:px-4 flex justify-center border-b lg:border-b-0 border-gray-50 lg:border-r border-gray-50">
                    <span
                        class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-[10px] font-bold border whitespace-nowrap"
                        th:classappend="${a.estatusAudiencia?.name() == 'CONCLUIDA' ? 'bg-green-50 text-green-700 border-green-100' : 
                                        (a.estatusAudiencia?.name() == 'CON_ACTA' ? 'bg-blue-50 text-blue-700 border-blue-100' : 
                                        'bg-orange-50 text-orange-700 border-orange-100')}"
                        th:text="${a.estatusAudiencia != null ? a.estatusAudiencia.descripcion : 'Pendiente'}">
                        <span class="w-1.5 h-1.5 rounded-full"
                            th:classappend="${a.estatusAudiencia?.name() == 'CONCLUIDA' ? 'bg-green-600' : 
                                              (a.estatusAudiencia?.name() == 'CON_ACTA' ? 'bg-blue-600' : 'bg-orange-600')}"></span>
                        PENDIENTE
                    </span>
                </div>

                <!-- Acciones -->
                <div class="col-span-1 py-4 lg:px-6 flex justify-end gap-2">
                    <button th:if="${a.estatusAudiencia?.name() == 'PENDIENTE'}" type="button"
                        class="p-2 text-gray-400 hover:text-gob-oro hover:bg-gray-100 rounded-lg transition-all" th:onclick="abrirModalEditar(
                                [[${a.id}]], 
                                [[${a.expediente?.id}]], 
                                [[${a.tipoAudiencia?.id ?: ''}]], 
                                [[${a.fechaAudiencia}]], 
                                [[${a.horaAudiencia}]], 
                                [[${a.esVirtual}]], 
                                [[${a.salaLugar}]], 
                                [[${a.urlReunion}]],
                                [[${a.abogadoComparece?.id ?: ''}]],
                                [[${a.observaciones != null ? #strings.escapeJavaScript(a.observaciones) : ''}]]
                            )">
                        <i class="fas fa-edit"></i>
                    </button>
                    <button type="button" th:data-audiencia-id="${a.id}" onclick="toggleMenu(this.dataset.audienciaId)"
                        class="p-2 text-gray-400 hover:text-gob-guinda hover:bg-gray-100 rounded-lg transition-all">
                        <i class="fas fa-ellipsis-h"></i>
                    </button>
                </div>

                <!-- Menú Contextual (Flota fuera del grid) -->
                <div th:id="'menu-' + ${a.id}"
                    class="hidden absolute right-4 mt-12 w-64 bg-white rounded-xl shadow-2xl z-50 border border-gray-50 text-left overflow-hidden ring-1 ring-black ring-opacity-5">
                    <!-- Items del menú (conservados del original) -->
                    <button th:unless="${a.estatusAudiencia?.name() == 'CONCLUIDA'}" th:data-audiencia-id="${a.id}"
                        onclick="activarSubidaActa(this.dataset.audienciaId)"
                        class="w-full text-left px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 flex items-center transition-colors">
                        <i class="fas fa-cloud-upload-alt mr-3 w-4 text-center text-gray-400"></i>
                        <span th:text="${a.actaDocumento != null ? 'Reemplazar Acta' : 'Subir Acta'}">Subir Acta</span>
                    </button>
                    <a th:if="${a.actaDocumento != null}" 
                        th:href="${#strings.startsWith(a.actaDocumento, 'http')} ? ${a.actaDocumento} : @{/audiencias/descargar-acta/{id}(id=${a.id})}"
                        th:target="${#strings.startsWith(a.actaDocumento, 'http')} ? '_blank' : '_self'"
                        class="w-full text-left px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 flex items-center transition-colors">
                        <i class="fas fa-file-pdf mr-3 w-4 text-center text-red-500"></i> Ver Acta
                    </a>
                    <!-- Lógica de validación -->
                    <div class="border-t border-gray-50"></div>
                    <button th:if="${a.estatusAudiencia?.name() == 'CON_ACTA'}"
                        sec:authorize="hasAnyAuthority('DIRECCION', 'SUBDIRECCION', 'GERENTE', 'JEFE_DEPTO', 'ADMIN')"
                        th:data-audiencia-id="${a.id}" onclick="abrirModalConcluir(this.dataset.audienciaId)"
                        class="w-full text-left px-4 py-3 text-sm text-green-700 hover:bg-green-50 flex items-center font-bold transition-colors">
                        <i class="fas fa-check-circle mr-3 w-4 text-center"></i> Validar y Concluir
                    </button>
                    <a th:unless="${a.estatusAudiencia?.name() == 'CONCLUIDA'}"
                        sec:authorize="hasAnyAuthority('ADMIN', 'DIRECCION', 'SUBDIRECCION')" href="javascript:void(0)"
                        th:onclick="'confirmarEliminarAudiencia(' + ${a.id} + ')'"
                        class="w-full text-left px-4 py-3 text-sm text-red-600 hover:bg-red-50 flex items-center transition-colors">
                        <i class="fas fa-trash-alt mr-3 w-4 text-center opacity-70"></i> Eliminar
                    </a>
                </div>
            </div>
        </div>

        <!-- PAGINACIÓN (Sincronización Total con Términos) -->
        <div th:if="${!audiencias.empty}" 
             class="mt-4 flex flex-col sm:flex-row justify-between items-center text-sm text-gray-500">
            <span class="mb-2 sm:mb-0">
                Mostrando página <span class="font-bold text-gray-700" th:text="${audiencias.number + 1}">1</span> de 
                <span class="font-bold text-gray-700" th:text="${audiencias.totalPages}">10</span>
            </span>
            <div class="flex gap-2">
                <a th:if="${audiencias.hasPrevious()}"
                   th:href="@{/audiencias(page=${audiencias.number - 1}, keyword=${keyword}, tipo=${paramTipo}, gerencia=${paramGerencia}, materia=${paramMateria}, estatus=${paramEstatus}, periodo=${paramPeriodo}, abogadoId=${paramAbogadoId}, mes=${param.mes}, anio=${param.anio})}"
                   class="pagina-link-aud px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 bg-white shadow-sm transition-all flex items-center gap-1">
                   <i class="fas fa-chevron-left text-xs"></i> Anterior
                </a>

                <a th:if="${audiencias.hasNext()}"
                   th:href="@{/audiencias(page=${audiencias.number + 1}, keyword=${keyword}, tipo=${paramTipo}, gerencia=${paramGerencia}, materia=${paramMateria}, estatus=${paramEstatus}, periodo=${paramPeriodo}, abogadoId=${paramAbogadoId}, mes=${param.mes}, anio=${param.anio})}"
                   class="pagina-link-aud px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 bg-white shadow-sm transition-all flex items-center gap-1">
                   Siguiente <i class="fas fa-chevron-right text-xs"></i>
                </a>
            </div>
        </div>
    </div>
</div>
