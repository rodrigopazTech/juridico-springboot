<div th:fragment="tabla" class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
    <div class="overflow-x-auto min-h-[400px]">
        <table class="w-full text-sm text-left text-gob-gris">
            <thead class="text-xs text-gob-gris uppercase bg-gray-50 border-b border-gray-200 font-headings">
                <tr>
                    <th class="px-4 py-3">Fecha / Hora</th>
                    <th class="px-4 py-3">Expediente</th>
                    <th class="px-4 py-3">Tipo / Ubicación</th>
                    <th class="px-4 py-3">Estatus</th>
                    <th class="px-4 py-3 text-right">Acciones</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200">
                <tr th:if="${audiencias.empty}">
                    <td colspan="5" class="px-4 py-8 text-center text-gray-400">No se encontraron audiencias.</td>
                </tr>

                <tr th:each="a : ${audiencias}" class="bg-white hover:bg-gray-50 transition-colors group">
                    
                    <td class="px-4 py-3 whitespace-nowrap">
                        <div class="flex items-center" th:title="${a.textoDiasRestantes}">
                            <div class="w-3 h-3 rounded-full mr-3 shadow-sm"
                                 th:classappend="${a.semaforoColor}"></div>
                            <div class="flex flex-col">
                                <span class="text-sm font-bold text-gray-900" 
                                      th:text="${#temporals.format(a.fechaAudiencia, 'dd/MM/yyyy')}">01/01/2026</span>
                                <span class="text-xs text-gray-500" th:text="${a.horaAudiencia}">10:00</span>
                            </div>
                        </div>
                    </td>

                    <td class="px-4 py-3">
                        <div class="flex flex-col">
                            <a th:href="@{/expedientes/{id}(id=${a.expediente.id})}" 
                               class="text-sm font-bold text-gob-guinda hover:underline"
                               th:text="${a.expediente.numero}">EXP-001</a>
                            <span class="text-[10px] text-gray-500 truncate max-w-[150px]" 
                                  th:text="${a.expediente.partes}">Actor vs Demandado</span>
                        </div>
                    </td>

                    <td class="px-4 py-3">
                        <span class="text-[10px] bg-gray-100 text-gray-600 px-1.5 py-0.5 rounded font-semibold border border-gray-200"
                              th:text="${a.tipoAudiencia != null ? a.tipoAudiencia.nombre : 'General'}">Inicial</span>
                        
                        <div class="flex items-center gap-1 mt-1 text-xs text-gray-700">
                            <i th:if="${a.esVirtual}" class="fas fa-video text-blue-600"></i>
                            <i th:unless="${a.esVirtual}" class="fas fa-map-marker-alt text-gray-500"></i>
                            <span th:text="${a.esVirtual ? 'En Línea' : 'Presencial'}">Ubicación</span>
                        </div>
                    </td>

                    <td class="px-4 py-3">
                        <span th:if="${a.estatusAudiencia == 'PENDIENTE'}" class="inline-flex items-center bg-yellow-100 text-yellow-800 text-xs font-bold px-2.5 py-0.5 rounded border border-yellow-200">
                            <i class="fas fa-clock mr-1"></i> Pendiente
                        </span>
                        <span th:if="${a.estatusAudiencia == 'CONCLUIDA'}" class="inline-flex items-center bg-gray-800 text-white text-xs font-bold px-2.5 py-0.5 rounded border border-gray-600">
                            <i class="fas fa-flag-checkered mr-1"></i> Concluida
                        </span>
                    </td>

                    <td class="px-4 py-3 text-right relative">
                        <button th:if="${a.estatusAudiencia != 'CONCLUIDA'}"
                                th:onclick="'abrirModalConcluir(' + ${a.id} + ')'"
                                class="text-green-600 hover:text-green-800 mr-2" title="Concluir y Subir Acta">
                            <i class="fas fa-check-circle"></i>
                        </button>

                        <button th:onclick="'toggleMenu(' + ${a.id} + ')'" class="text-gray-400 hover:text-gob-guinda px-2">
                            <i class="fas fa-ellipsis-v"></i>
                        </button>

                        <div th:id="'menu-' + ${a.id}" class="hidden absolute right-0 mt-2 w-56 bg-white rounded-md shadow-xl z-50 border border-gray-100 text-left overflow-hidden ring-1 ring-black ring-opacity-5">
                            
                            <a th:href="@{/expedientes/{id}(id=${a.expediente.id})}" class="block px-4 py-3 text-sm text-gray-700 hover:bg-gray-50">
                                <i class="fas fa-folder-open mr-2 text-gray-400"></i> Ir al Expediente
                            </a>
                            
                            <a th:if="${a.esVirtual && a.urlReunion != null}" 
                               th:href="${a.urlReunion}" target="_blank"
                               class="block px-4 py-3 text-sm text-blue-700 bg-blue-50 hover:bg-blue-100 border-l-4 border-blue-500">
                                <i class="fas fa-video mr-2"></i> Unirse a Reunión
                            </a>

                            <a th:if="${a.actaDocumento != null}" href="#" class="block px-4 py-3 text-sm text-purple-700 hover:bg-purple-50">
                                <i class="fas fa-file-pdf mr-2"></i> Descargar Acta
                            </a>

                            <div class="border-t border-gray-100"></div>
                            
                            <a th:href="@{/audiencias/eliminar/{id}(id=${a.id})}" class="block px-4 py-3 text-sm text-red-600 hover:bg-red-50">
                                <i class="fas fa-trash-alt mr-2"></i> Eliminar
                            </a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <div class="p-4 border-t border-gray-200 flex justify-between items-center" th:if="${!audiencias.empty}">
        <span class="text-sm text-gray-600">Página <span th:text="${audiencias.number + 1}">1</span> de <span th:text="${audiencias.totalPages}">10</span></span>
        <div class="flex gap-2">
            <a th:if="${audiencias.hasPrevious()}" th:href="@{/audiencias(page=${audiencias.number - 1}, keyword=${keyword})}" class="px-3 py-1 border rounded hover:bg-gray-50 text-sm">Anterior</a>
            <a th:if="${audiencias.hasNext()}" th:href="@{/audiencias(page=${audiencias.number + 1}, keyword=${keyword})}" class="px-3 py-1 border rounded hover:bg-gray-50 text-sm">Siguiente</a>
        </div>
    </div>
</div>
