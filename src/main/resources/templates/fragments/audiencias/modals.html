<div th:fragment="modals">

    <div id="modal-audiencia" class="fixed inset-0 z-50 hidden" aria-labelledby="modal-titulo-audiencia" role="dialog"
        aria-modal="true">
        <div class="fixed inset-0 bg-gray-900 bg-opacity-60 backdrop-blur-sm transition-opacity"></div>

        <div class="fixed inset-0 z-10 overflow-y-auto">
            <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
                <div
                    class="relative transform overflow-hidden rounded-xl bg-white text-left shadow-2xl transition-all sm:my-8 sm:w-full sm:max-w-2xl border border-gray-200">

                    <div
                        class="flex justify-between items-center px-6 py-4 border-b border-gob-guinda bg-gob-guinda text-white rounded-t-xl shadow-sm">
                        <h3 class="text-lg font-bold flex items-center gap-2 font-headings" id="modal-titulo-audiencia">
                            <i class="fas fa-gavel"></i> Nueva Audiencia
                        </h3>
                        <button type="button"
                            onclick="document.getElementById('modal-audiencia').classList.add('hidden')"
                            class="text-white/80 hover:text-white transition-colors p-1.5 rounded-full hover:bg-white/10 focus:outline-none">
                            <span class="sr-only">Cerrar</span>
                            <i class="fas fa-times text-xl"></i>
                        </button>
                    </div>

                    <form id="form-audiencia" th:action="@{/audiencias/guardar}" method="post"
                        class="p-6 bg-gray-50/50">
                        <input type="hidden" id="input-audiencia-id" name="id" />
                        <input type="hidden" id="current-user-id"
                            th:value="${usuarioActual != null ? usuarioActual.id : ''}" />

                        <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-2">

                            <div class="col-span-1 sm:col-span-2">
                                <label for="input-expediente" class="block text-sm font-bold text-gray-700">Expediente
                                    *</label>
                                <div class="mt-1 flex rounded-md shadow-sm">
                                    <span
                                        class="inline-flex items-center rounded-l-md border border-r-0 border-gray-300 bg-gray-50 px-3 text-gray-500">
                                        <i class="fas fa-folder-open"></i>
                                    </span>
                                    <select id="input-expediente" name="expediente.id" required
                                        onchange="cargarAbogadosPosibles()"
                                        class="block w-full min-w-0 flex-1 rounded-none rounded-r-md border-gray-300 focus:border-gob-oro focus:ring-gob-oro sm:text-sm py-2 px-3">
                                        <option value="">Buscar expediente...</option>
                                        <option th:each="e : ${expedientesList}" th:value="${e.id}"
                                            th:data-gerencia-id="${e.materia != null && e.materia.gerencia != null ? e.materia.gerencia.id : ''}"
                                            th:text="${e.numero + ' - ' + (e.materia != null ? e.materia.nombre : '')}">
                                        </option>
                                    </select>
                                </div>
                            </div>

                            <div class="col-span-1 sm:col-span-2">
                                <label for="input-tipo" class="block text-sm font-bold text-gray-700">Tipo de Audiencia
                                    *</label>
                                <select id="input-tipo" name="tipoAudiencia.id" required
                                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-gob-oro focus:ring-gob-oro sm:text-sm py-2 px-3">
                                    <option value="" disabled selected>Seleccione tipo de audiencia...</option>
                                    <option th:each="t : ${tipos}" th:value="${t.id}" th:text="${t.nombre}"
                                            th:data-gerencia-id="${t.gerencia != null ? t.gerencia.id : ''}"></option>
                                </select>
                            </div>

                            <div>
                                <label for="input-fecha" class="block text-sm font-bold text-gray-700">Fecha *</label>
                                <input type="date" name="fechaAudiencia" id="input-fecha" required
                                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-gob-oro focus:ring-gob-oro sm:text-sm px-3 py-2">
                            </div>

                            <div>
                                <label for="input-hora" class="block text-sm font-bold text-gray-700">Hora *</label>
                                <input type="time" name="horaAudiencia" id="input-hora" required
                                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-gob-oro focus:ring-gob-oro sm:text-sm px-3 py-2">
                            </div>

                            <div class="col-span-1 sm:col-span-2">
                                <span class="block text-sm font-bold text-gray-700 mb-2">Modalidad</span>
                                <div class="flex items-center space-x-4">
                                    <div class="flex items-center">
                                        <input id="mod-presencial" name="esVirtual" type="radio" value="false" checked
                                            onclick="toggleUbicacion(false)"
                                            class="h-4 w-4 border-gray-300 text-gob-guinda focus:ring-gob-oro">
                                        <label for="mod-presencial"
                                            class="ml-2 block text-sm font-medium text-gray-700">
                                            <i class="fas fa-building text-gray-400 mr-1"></i> Presencial
                                        </label>
                                    </div>
                                    <div class="flex items-center">
                                        <input id="mod-virtual" name="esVirtual" type="radio" value="true"
                                            onclick="toggleUbicacion(true)"
                                            class="h-4 w-4 border-gray-300 text-gob-guinda focus:ring-gob-oro">
                                        <label for="mod-virtual" class="ml-2 block text-sm font-medium text-gray-700">
                                            <i class="fas fa-video text-gray-400 mr-1"></i> Virtual
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <div id="campo-sala" class="col-span-1 sm:col-span-2">
                                <label for="input-sala" class="block text-sm font-bold text-gray-700">Órgano Jurisdiccional
                                    *</label>
                                <select name="salaLugar" id="input-sala"
                                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-gob-oro focus:ring-gob-oro sm:text-sm px-3 py-2">
                                    <option value="" disabled selected>Seleccione órgano jurisdiccional...</option>
                                    <option th:each="o : ${listaOrganos}" th:value="${o.nombre}" th:text="${o.nombre}"
                                            th:data-gerencia-id="${o.gerencia != null ? o.gerencia.id : ''}"></option>
                                </select>
                            </div>

                            <div id="campo-url" class="col-span-1 sm:col-span-2 hidden">
                                <label for="input-url" class="block text-sm font-bold text-gray-700">Enlace de Reunión
                                    (URL) *</label>
                                <input type="text" name="urlReunion" id="input-url"
                                    placeholder="Pegar enlace de Zoom, Meet o Teams aquí..."
                                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-gob-oro focus:ring-gob-oro sm:text-sm px-3 py-2">
                            </div>

                            <div
                                class="col-span-1 sm:col-span-2 bg-yellow-50 p-3 rounded-lg border border-yellow-200 mt-2">
                                <label for="input-abogado" class="block text-sm font-bold text-gray-700 mb-1">
                                    <i class="fas fa-user-shield text-gob-oro mr-1"></i> Abogado que Comparece
                                </label>
                                <p class="text-[11px] text-gray-500 mb-2 italic">
                                    Selecciona al responsable de asistir. Por defecto se sugiere al titular, pero puedes
                                    asignar un sustituto de la misma área.
                                </p>

                                <select id="input-abogado" name="abogadoComparece.id"
                                    class="block w-full rounded-md border-gray-300 shadow-sm focus:border-gob-oro focus:ring-gob-oro sm:text-sm px-3 py-2">
                                    <option value="">Seleccione expediente primero...</option>
                                </select>
                            </div>

                            <div class="col-span-1 sm:col-span-2 mt-2">
                                <label for="input-observaciones-aud" class="block text-sm font-bold text-gray-700">Notas / Observaciones</label>
                                <textarea name="observaciones" id="input-observaciones-aud" rows="3"
                                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-gob-oro focus:ring-gob-oro sm:text-sm px-3 py-2 resize-none"
                                    placeholder="Agregue comentarios internos o notas preliminares..."></textarea>
                            </div>

                        </div>

                        <div
                            class="mt-8 flex flex-col-reverse sm:flex-row sm:justify-end gap-3 pt-4 border-t border-gray-200">
                            <button type="button"
                                onclick="document.getElementById('modal-audiencia').classList.add('hidden')"
                                class="w-full sm:w-auto inline-flex justify-center items-center px-4 py-2.5 border border-gray-300 shadow-sm text-sm font-bold rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gob-oro transition-colors">
                                Cancelar
                            </button>
                            <button type="submit"
                                class="w-full sm:w-auto inline-flex justify-center items-center px-4 py-2.5 border border-transparent shadow-sm text-sm font-bold rounded-md text-white bg-gob-guinda hover:bg-gob-guindaDark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gob-guinda transition-colors">
                                <i class="fas fa-save mr-2"></i> Guardar Audiencia
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-concluir" class="fixed inset-0 z-50 hidden" aria-labelledby="modal-title" role="dialog"
        aria-modal="true">
        <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity"></div>

        <div class="fixed inset-0 z-10 overflow-y-auto">
            <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
                <div
                    class="relative transform overflow-hidden rounded-lg bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-lg border border-gray-200">

                    <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                        <div class="sm:flex sm:items-start">
                            <div
                                class="mx-auto flex h-12 w-12 flex-shrink-0 items-center justify-center rounded-full bg-green-100 sm:mx-0 sm:h-10 sm:w-10">
                                <i class="fas fa-check text-green-600 text-lg"></i>
                            </div>
                            <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
                                <h3 class="text-lg font-bold leading-6 text-gray-900" id="modal-title">Concluir
                                    Audiencia</h3>
                                <div class="mt-2">
                                    <p class="text-sm text-gray-500 mb-4">
                                        ¿Confirmas que la audiencia se ha desahogado? Esto la moverá al historial.
                                    </p>

                                    <form id="form-concluir" th:action="@{/audiencias/concluir}" method="post">
                                        <input type="hidden" name="id" id="concluir-audiencia-id">

                                        <label class="block text-sm font-bold text-gray-700 mb-1">Resultado /
                                            Observaciones *</label>
                                        <textarea name="observaciones" required rows="3"
                                            class="w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500 sm:text-sm p-3"
                                            placeholder="Describe brevemente el resultado de la audiencia..."></textarea>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
                        <button type="submit" form="form-concluir"
                            class="inline-flex w-full justify-center rounded-md border border-transparent bg-green-600 px-4 py-2 text-base font-bold text-white shadow-sm hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 sm:ml-3 sm:w-auto sm:text-sm transition-colors">
                            <i class="fas fa-save mr-2"></i> Confirmar Conclusión
                        </button>
                        <button type="button"
                            onclick="document.getElementById('modal-concluir').classList.add('hidden')"
                            class="mt-3 inline-flex w-full justify-center rounded-md border border-gray-300 bg-white px-4 py-2 text-base font-bold text-gray-700 shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gob-oro focus:ring-offset-2 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm transition-colors">
                            Cancelar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
