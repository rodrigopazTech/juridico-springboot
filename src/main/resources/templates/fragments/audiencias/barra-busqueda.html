<div th:fragment="barra" class="flex flex-col lg:flex-row gap-4 items-center flex-1 justify-start w-full">
    <form id="form-search-audiencias" th:action="@{/audiencias}" method="get"
        class="relative w-full lg:flex-1 lg:max-w-xl">
        <input type="hidden" name="tipo" th:value="${paramTipo}">
        <input type="hidden" name="gerencia" th:value="${paramGerencia}">
        <input type="hidden" name="materia" th:value="${paramMateria}">
        <input type="hidden" name="estatus" th:value="${paramEstatus}">
        <input type="hidden" name="periodo" th:value="${paramPeriodo}">
        <input type="hidden" name="fecha" th:value="${paramFecha}">
        <input type="hidden" name="abogadoId" th:value="${paramAbogadoId}">
        <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
            <i class="fas fa-search text-gray-400"></i>
        </div>
        <input type="text" id="input-search-audiencias" name="keyword" th:value="${keyword}"
            class="bg-white border border-gray-200 text-gray-900 text-sm rounded-lg focus:border-gob-oro focus:ring-2 focus:ring-gob-oro/10 block w-full ps-10 pe-10 p-2.5 outline-none transition-all font-medium"
            placeholder="Buscar por audiencia, expediente...">

        <!-- Botón para limpiar (Solo visible si hay texto) -->
        <button type="button" id="btn-clear-search" th:classappend="${keyword == null || keyword == '' ? 'hidden' : ''}"
            class="absolute inset-y-0 end-0 flex items-center pe-3 text-gray-400 hover:text-gray-600">
            <i class="fas fa-times-circle"></i>
        </button>
    </form>

    <div id="acciones-barra-audiencias"
        class="flex flex-wrap items-center gap-2 w-full lg:w-auto lg:ml-auto justify-end">
        <a th:href="@{/audiencias}"
            class="text-xs px-3 py-2 rounded-lg transition-all flex items-center gap-1.5 no-underline border"
            th:classappend="${#strings.isEmpty(keyword) && #strings.isEmpty(param.tipo) && #strings.isEmpty(param.gerencia) && #strings.isEmpty(param.materia) && #strings.isEmpty(param.estatus) && #strings.isEmpty(param.periodo) && #strings.isEmpty(param.fecha) && #strings.isEmpty(param.abogadoId) && #strings.isEmpty(param.mes) ? 
           'text-gray-400 border-transparent hover:bg-gray-100' : 
           'bg-gob-guinda text-white border-gob-guinda shadow-md font-bold hover:bg-gob-guinda/90'}">
            <i class="fas fa-list-ul"></i> Ver Todos
        </a>

        <a th:href="@{/audiencias/exportar-excel(
             keyword=${keyword},
             tipo=${paramTipo},
             gerencia=${paramGerencia},
             materia=${paramMateria},
             estatus=${paramEstatus},
             periodo=${paramPeriodo},
             fecha=${paramFecha},
             abogadoId=${paramAbogadoId}
        )}" class="text-gob-gris bg-white border border-gray-300 hover:bg-gray-50 font-bold rounded-lg text-xs sm:text-sm px-3 sm:px-4 py-2 sm:py-2.5 shadow-sm transition-colors flex items-center decoration-0"
             title="Descargar Reporte Excel">
            <i class="fas fa-file-excel text-green-600 mr-1.5"></i> Exportar
        </a>

        <button onclick="abrirModalAudiencia()"
            class="text-white bg-gob-guinda hover:bg-gob-guindaDark font-bold rounded-lg text-xs sm:text-sm px-3 sm:px-5 py-2 sm:py-2.5 shadow-sm transition-colors flex items-center gap-1.5 whitespace-nowrap">
            <i class="fas fa-plus"></i> Nueva Audiencia
        </button>
    </div>
</div>
