<div th:fragment="barra" class="flex flex-col md:flex-row gap-4 justify-between items-center w-full">

    <form id="form-search-audiencias" th:action="@{/audiencias}" method="get" class="relative w-full md:w-96">
        <input type="hidden" name="tipo" th:value="${paramTipo}">
        <input type="hidden" name="gerencia" th:value="${paramGerencia}">
        <input type="hidden" name="materia" th:value="${paramMateria}">
        <input type="hidden" name="estatus" th:value="${paramEstatus}">
        <input type="hidden" name="periodo" th:value="${paramPeriodo}">
        <input type="hidden" name="abogadoId" th:value="${paramAbogadoId}">
        <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
            <i class="fas fa-search text-gray-400"></i>
        </div>
        <input type="text" id="input-search-audiencias" name="keyword" th:value="${keyword}"
            class="bg-white border border-gray-200 text-gray-900 text-sm rounded-lg focus:border-gob-oro focus:ring-2 focus:ring-gob-oro/10 block w-full ps-10 pe-10 p-2.5 outline-none transition-all font-medium"
            placeholder="Buscar audiencia, expediente, sala...">

        <!-- Botón para limpiar (Solo visible si hay texto) -->
        <button type="button" id="btn-clear-search" th:classappend="${keyword == null || keyword == '' ? 'hidden' : ''}"
            class="absolute inset-y-0 end-0 flex items-center pe-3 text-gray-400 hover:text-gray-600">
            <i class="fas fa-times-circle"></i>
        </button>
    </form>

    <div class="flex gap-2 w-full md:w-auto">
        <a th:href="@{/audiencias/exportar-excel(
                keyword=${keyword},
                tipo=${paramTipo},
                gerencia=${paramGerencia},
                materia=${paramMateria},
                estatus=${paramEstatus},
                periodo=${paramPeriodo},
                abogadoId=${paramAbogadoId}
           )}"
            class="flex-1 md:flex-none text-gob-gris bg-white border border-gray-300 hover:bg-gray-50 font-medium rounded-lg text-sm px-4 py-2.5 shadow-sm transition-colors flex items-center justify-center decoration-0"
            title="Descargar Reporte Excel">
            <i class="fas fa-file-excel text-green-600 mr-2"></i> Exportar
        </a>

        <button onclick="abrirModalAudiencia()"
            class="flex-1 md:flex-none text-white bg-gob-guinda hover:bg-gob-guindaDark font-bold rounded-lg text-sm px-5 py-2.5 shadow-md transition-colors flex items-center justify-center gap-2">
            <i class="fas fa-plus"></i> Nueva Audiencia
        </button>
    </div>
</div>
