<div th:fragment="lista"
    class="w-full lg:w-1/3 flex flex-col bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
    <div class="p-4 border-b border-gray-100 bg-gray-50/50 flex-shrink-0 space-y-3">
        <button onclick="abrirModalUsuario()"
            class="w-full bg-gob-guinda text-white py-2.5 rounded-xl text-sm font-bold hover:bg-opacity-90 transition-colors shadow-sm flex justify-center items-center gap-2">
            <i class="fas fa-plus"></i> Agregar Usuario
        </button>
        <!-- Búsqueda en servidor: al presionar Enter o hacer clic en la lupa se envía el formulario -->
        <form method="get" th:action="@{/usuarios-admin}" class="relative flex items-center gap-2">
            <div class="relative flex-1">
                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"></i>
                <input type="text" name="q" id="input-search-usuarios"
                    th:value="${q}"
                    placeholder="Buscar usuario..."
                    autocomplete="off"
                    class="w-full pl-9 pr-4 py-2 bg-white border border-gray-200 rounded-xl text-sm outline-none focus:border-gob-oro focus:ring-2 focus:ring-gob-oro/10 transition-all font-medium">
            </div>
            <button type="submit"
                class="px-3 py-2 bg-gob-guinda text-white rounded-xl text-sm font-bold hover:bg-opacity-90 transition-colors flex-shrink-0"
                title="Buscar">
                <i class="fas fa-search"></i>
            </button>
            <a th:if="${q != null and !#strings.isEmpty(q)}" th:href="@{/usuarios-admin}"
                class="px-3 py-2 bg-gray-200 text-gray-600 rounded-xl text-sm font-bold hover:bg-gray-300 transition-colors flex-shrink-0"
                title="Limpiar búsqueda">
                <i class="fas fa-times"></i>
            </a>
        </form>
        <!-- Indicador de búsqueda activa -->
        <div th:if="${q != null and !#strings.isEmpty(q)}" class="text-xs text-gob-guinda font-semibold flex items-center gap-1">
            <i class="fas fa-filter"></i>
            Mostrando resultados para: "<span th:text="${q}"></span>"
            &nbsp;·&nbsp; [[${listaUsuarios.totalElements}]] encontrado(s)
        </div>
    </div>

    <div class="flex-1 overflow-y-auto thin-scrollbar p-2 space-y-1" id="lista-abogados">
        <!-- Mensaje cuando no hay resultados -->
        <div th:if="${listaUsuarios.empty}" class="flex flex-col items-center justify-center h-full py-12 text-gray-400">
            <i class="fas fa-users text-4xl mb-3 opacity-30"></i>
            <p class="text-sm font-semibold">Sin resultados</p>
            <p th:if="${q != null and !#strings.isEmpty(q)}" class="text-xs mt-1">
                No se encontraron usuarios para "<span th:text="${q}"></span>"
            </p>
        </div>

        <button th:each="u : ${listaUsuarios.content}" th:data-id="${u.id}" th:data-nombre="${u.nombreCompleto}"
            th:data-email="${u.email}" th:data-rol="${u.rol}"
            th:data-gerencias-ids="${#strings.listJoin(u.gerencias.![id], ',')}"
            th:data-gerencia-nombre="${u.gerencia != null ? u.gerencia.nombre : 'Sin Gerencia'}"
            th:data-activo="${u.activo}" th:data-materias-ids="${#strings.listJoin(u.materias.![id], ',')}"
            th:data-materias-nombres="${#strings.listJoin(u.materias.![nombre], '|')}"
            onclick="seleccionarAbogado(this)"
            class="abogado-card w-full text-left p-3 rounded-xl hover:bg-red-50 border border-transparent hover:border-red-100 transition-all flex gap-3 group focus:outline-none">

            <div
                class="w-12 h-12 rounded-full bg-gradient-to-br from-gob-oro to-yellow-600 flex-shrink-0 flex items-center justify-center text-white font-bold text-lg shadow-sm border-2 border-white relative">
                <span th:text="${#strings.substring(u.nombreCompleto, 0, 1)}">U</span>
                <span th:classappend="${u.activo ? 'bg-green-500' : 'bg-red-500'}"
                    class="absolute bottom-0 right-0 w-3 h-3 border-2 border-white rounded-full"></span>
            </div>

            <div class="flex-1 min-w-0">
                <p class="text-sm font-bold text-gray-800 truncate group-hover:text-gob-guinda transition-colors"
                    th:text="${u.nombreCompleto}">Nombre</p>
                <p class="text-xs text-gray-500 truncate mb-1" th:text="${u.email}">email</p>

                <div class="flex flex-wrap gap-1">
                    <span
                        class="bg-gray-100 text-gray-600 text-[9px] font-extrabold px-1.5 py-0.5 rounded border border-gray-200"
                        th:text="${u.rol}">ROL</span>

                    <th:block th:each="materia, iter : ${u.materias}" th:if="${iter.index < 2}">
                        <span
                            class="bg-yellow-50 text-yellow-700 border border-yellow-200 text-[9px] font-extrabold px-1.5 py-0.5 rounded inline-block truncate max-w-[80px]"
                            th:text="${materia.nombre}">Materia</span>
                    </th:block>

                    <span th:if="${u.materias.size() > 2}"
                        class="bg-gray-100 text-gray-600 text-[9px] font-bold px-1.5 py-0.5 rounded border border-gray-200">+[[${u.materias.size()
                        - 2}]] MÁS</span>
                </div>
            </div>
        </button>
    </div>

    <!-- Paginación — incluye el parámetro q para conservar la búsqueda al paginar -->
    <div class="p-3 border-t border-gray-100 bg-white flex justify-between items-center text-xs text-gray-500 flex-shrink-0"
        th:if="${!listaUsuarios.empty}">
        <a th:if="${listaUsuarios.hasPrevious()}"
            th:href="@{/usuarios-admin(page=${listaUsuarios.number - 1}, q=${q})}"
            class="hover:text-gob-guinda"><i class="fas fa-chevron-left mr-1"></i> Ant</a>
        <span th:unless="${listaUsuarios.hasPrevious()}"></span>
        <span>Pág. [[${listaUsuarios.number + 1}]] / [[${listaUsuarios.totalPages}]]</span>
        <a th:if="${listaUsuarios.hasNext()}"
            th:href="@{/usuarios-admin(page=${listaUsuarios.number + 1}, q=${q})}"
            class="hover:text-gob-guinda">Sig <i class="fas fa-chevron-right ml-1"></i></a>
        <span th:unless="${listaUsuarios.hasNext()}"></span>
    </div>

</div>
