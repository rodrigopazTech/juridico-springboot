<div th:fragment="modal" id="modal-tipo-audiencia"
    class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4">
    <div
        class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all border border-gray-100">
        <!-- Header -->
        <div
            class="bg-gob-guinda px-6 py-4 flex justify-between items-center border-b border-gob-oro border-opacity-20 shadow-sm">
            <h3 id="titulo-modal-tipo-audiencia" class="text-white text-xl font-bold font-headings tracking-wide">
                <i class="fas fa-calendar-alt mr-2 text-gob-oro"></i> Nuevo Tipo de Audiencia
            </h3>
            <button onclick="document.getElementById('modal-tipo-audiencia').classList.add('hidden')"
                class="text-white hover:text-gob-oro transition-colors">
                <i class="fas fa-times fa-lg"></i>
            </button>
        </div>

        <form th:action="@{/usuarios/tipos-audiencia/guardar}" method="POST" class="p-6 space-y-4 bg-white">
            <input type="hidden" name="id" id="input-tipo-audiencia-id">

            <div class="space-y-1">
                <label class="block font-bold text-gob-gris text-sm">Descripción / Nombre*</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-tag"></i>
                    </span>
                    <input type="text" name="nombre" id="input-tipo-audiencia-nombre" required
                        class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gob-oro focus:border-gob-oro outline-none text-sm transition-all"
                        placeholder="Ej. Conciliación y Arbitraje">
                </div>
            </div>

            <div class="flex items-center space-x-2 pt-2">
                <input type="checkbox" name="activo" id="check-tipo-audiencia-activo" value="true" checked
                    class="rounded text-gob-guinda focus:ring-gob-oro h-4 w-4 border-gray-300">
                <label class="text-sm font-medium text-gray-700 cursor-pointer select-none"
                    for="check-tipo-audiencia-activo">Estatus Activo</label>
            </div>

            <div class="flex justify-end gap-3 pt-6 border-t border-gray-100">
                <button type="button" onclick="document.getElementById('modal-tipo-audiencia').classList.add('hidden')"
                    class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 text-sm hover:bg-gray-50 font-medium transition-colors">
                    Cancelar
                </button>
                <button type="submit"
                    class="bg-gob-guinda text-white px-6 py-2 rounded-lg text-sm hover:bg-opacity-90 font-bold shadow-md hover:shadow-lg transform active:scale-95 transition-all">
                    Guardar
                </button>
            </div>
        </form>
    </div>
</div>
