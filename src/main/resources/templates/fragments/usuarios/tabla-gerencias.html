<div th:fragment="tabla" class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
    <div class="flex justify-between mb-4">
        <h3 class="text-lg font-bold text-gob-gris">Catálogo de Gerencias</h3>
        <div class="flex gap-2">
             <input type="text" id="input-search-gerencias" placeholder="Buscar gerencia..." class="border border-gray-300 rounded p-2 text-sm w-48 focus:ring-gob-oro focus:border-gob-oro outline-none">
             <button onclick="abrirModalGerencia()" class="bg-gob-guinda text-white px-4 py-2 rounded text-sm hover:bg-opacity-90 shadow-sm transition-colors">
                <i class="fas fa-plus mr-2"></i> Nueva
            </button>
        </div>
    </div>

    <table class="w-full text-sm text-left text-gray-500">
        <thead class="text-xs text-gray-700 uppercase bg-gray-50 border-b border-gray-200">
            <tr>
                <th class="px-6 py-3 font-bold">Nombre</th>
                <th class="px-6 py-3 font-bold">Descripción</th>
                <th class="px-6 py-3 font-bold">Estatus</th>
                <th class="px-6 py-3 font-bold text-center">Acciones</th>
            </tr>
        </thead>
        <tbody id="tabla-gerencias-body">
            <tr th:each="g : ${listaGerencias}" class="border-b hover:bg-gray-50 transition-colors">
                <td class="px-6 py-4 font-bold text-gray-800" th:text="${g.nombre}">Nombre</td>
                <td class="px-6 py-4 truncate max-w-xs" th:text="${g.descripcion}">Desc</td>
                <td class="px-6 py-4">
                    <span th:if="${g.activo}" class="bg-green-100 text-green-800 text-xs px-2 py-0.5 rounded">Activo</span>
                    <span th:unless="${g.activo}" class="bg-red-100 text-red-800 text-xs px-2 py-0.5 rounded">Inactivo</span>
                </td>
                <td class="px-6 py-4 text-center">
                    <button th:onclick="editarGerencia([[${g.id}]], [[${g.nombre}]], [[${g.descripcion}]], [[${g.activo}]])" 
                            class="text-gob-oro hover:text-gob-guinda transition-colors mx-1">
                        <i class="fas fa-edit fa-lg"></i>
                    </button>
                    
                    <button th:onclick="verMaterias([[${g.id}]], [[${g.nombre}]])" 
                            class="text-blue-600 hover:text-blue-800 transition-colors mx-1" title="Gestionar Materias">
                        <i class="fas fa-list-ul fa-lg"></i>
                    </button>
                    <button type="button" 
                            th:onclick="confirmarCambioEstatus([[${g.id}]], 'gerencia')"
                            class="hover:scale-110 transition-transform mx-1" 
                            th:title="${g.activo ? 'Desactivar Gerencia' : 'Activar Gerencia'}"
                            th:classappend="${g.activo ? 'text-red-500 hover:text-red-700' : 'text-green-500 hover:text-green-700'}">
                        
                        <i class="fas" th:classappend="${g.activo ? 'fa-ban' : 'fa-check-circle'}"></i>
                    </button>
                </td>
            </tr>
        </tbody>
    </table>
</div>
