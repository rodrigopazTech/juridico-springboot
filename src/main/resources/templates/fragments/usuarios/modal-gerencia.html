<div th:fragment="modal" id="modal-gerencia" class="modal fixed inset-0 bg-gray-900/50 z-50 hidden items-center justify-center backdrop-blur-sm">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md mx-4 animate-fade-in-down">
        
        <div class="flex justify-between items-center p-4 border-b bg-gob-guinda text-white rounded-t-lg">
            <h3 class="font-bold text-lg" id="titulo-modal-gerencia">
                <i class="fas fa-building mr-2"></i> Nueva Gerencia
            </h3>
            <button onclick="document.getElementById('modal-gerencia').classList.add('hidden')" class="hover:text-gray-200 transition-colors">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>
        
        <form th:action="@{/usuarios/gerencias/guardar}" th:object="${nuevaGerencia}" method="post" class="p-6 space-y-4">
            <input type="hidden" th:field="*{id}" id="input-gerencia-id">
            
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Nombre de la Gerencia *</label>
                <input type="text" th:field="*{nombre}" id="input-gerencia-nombre" required 
                       class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-gob-oro focus:border-gob-oro outline-none">
            </div>
            
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Descripción</label>
                <textarea th:field="*{descripcion}" id="input-gerencia-desc" rows="3"
                          class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-gob-oro focus:border-gob-oro outline-none"></textarea>
            </div>

            <div class="flex items-center">
                <input type="checkbox" th:field="*{activo}" id="input-gerencia-activo" class="w-4 h-4 text-gob-guinda bg-gray-100 border-gray-300 rounded focus:ring-gob-oro">
                <label for="input-gerencia-activo" class="ms-2 text-sm font-medium text-gray-900">Gerencia Activa</label>
            </div>

            <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-gray-100">
                <button type="button" onclick="document.getElementById('modal-gerencia').classList.add('hidden')" 
                        class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors">
                    Cancelar
                </button>
                <button type="submit" class="px-4 py-2 bg-gob-guinda text-white rounded-lg hover:bg-opacity-90 transition-colors shadow-md">
                    Guardar Gerencia
                </button>
            </div>
        </form>
    </div>
</div>
