<div th:fragment="contenido" xmlns:th="http://www.thymeleaf.org">
  <div th:if="${pasoActual == 2}">
    <div class="flex justify-between items-center mb-6">
      <div>
        <h2 class="text-2xl font-bold text-gob-guinda mb-1">
          <i class="fas fa-folder-open mr-2"></i> Etapa 2: Validación de
          Expedientes
        </h2>
        <p class="text-gray-600">
          El sistema creará o actualizará los siguientes expedientes con la
          información recibida.
        </p>
      </div>
      <div
        class="bg-blue-50 text-blue-700 px-4 py-2 rounded-lg border border-blue-200 font-bold text-sm"
      >
        <i class="fas fa-info-circle mr-1"></i>
        <span th:text="${#lists.size(expedientesResumen)}"></span> expedientes
        detectados
      </div>
    </div>

    <div
      class="overflow-hidden rounded-xl border border-gray-200 shadow-sm mb-8"
    >
      <table class="min-w-full divide-y divide-gray-200 text-sm text-left">
        <thead
          class="bg-gray-100 text-gray-700 uppercase font-bold text-xs tracking-wider"
        >
          <tr>
            <th scope="col" class="px-6 py-4">Expediente</th>
            <th scope="col" class="px-6 py-4 text-center">Nuevos Términos</th>
            <th scope="col" class="px-6 py-4 text-center">Nuevas Audiencias</th>
            <th scope="col" class="px-6 py-4 text-center">Total de Carga</th>
            <th scope="col" class="px-6 py-4 text-right">Estado</th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          <tr
            th:each="exp : ${expedientesResumen}"
            class="hover:bg-gray-50 transition"
          >
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="flex items-center">
                <i class="fas fa-folder text-gob-oro text-lg mr-3"></i>
                <span
                  class="font-bold text-gray-900"
                  th:text="${exp.numeroExpediente}"
                ></span>
              </div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-center">
              <span
                class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-purple-100 text-purple-800"
                th:if="${exp.totalTerminos > 0}"
              >
                <i class="fas fa-hourglass-half mr-1"></i>
                <span th:text="${exp.totalTerminos}"></span>
              </span>
              <span class="text-gray-400" th:if="${exp.totalTerminos == 0}"
                >-</span
              >
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-center">
              <span
                class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-orange-100 text-orange-800"
                th:if="${exp.totalAudiencias > 0}"
              >
                <i class="fas fa-gavel mr-1"></i>
                <span th:text="${exp.totalAudiencias}"></span>
              </span>
              <span class="text-gray-400" th:if="${exp.totalAudiencias == 0}"
                >-</span
              >
            </td>
            <td
              class="px-6 py-4 whitespace-nowrap text-center font-bold text-gray-600"
            >
              <span th:text="${exp.totalRegistros}"></span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-right">
              <span class="text-gob-verde font-bold text-xs uppercase"
                ><i class="fas fa-check-circle"></i> Listo para inyectar</span
              >
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <form th:action="@{/admin/importar/validar-expedientes}" method="post">
      <input type="hidden" name="loteId" th:value="${lote.id}" />
      <div class="flex justify-end border-t border-gray-200 pt-5">
        <button
          type="submit"
          class="bg-gob-oro text-white px-8 py-3 rounded-xl font-bold shadow hover:bg-[#a37e46] transition"
        >
          Aprobar Expedientes y Continuar
          <i class="fas fa-arrow-right ml-2"></i>
        </button>
      </div>
    </form>
  </div>
</div>
