<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Sistema Jurídico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/js/tailwind.config.js}"></script>
    <script th:src="@{/lib/sweetalert2.all.min.js}"></script>
    <script th:src="@{/lib/chart.umd.min.js}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">

    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #e5e7eb;
            border-radius: 10px;
        }

        .custom-scrollbar:hover::-webkit-scrollbar-thumb {
            background: #d1d5db;
        }

        .line-clamp-1 {
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        /* Filter Chips Styles */
        .filter-chip {
            @apply flex items-center gap-2 px-3 py-1.5 bg-white border border-gray-200 rounded-full text-[11px] font-bold text-gray-500 hover:border-gob-guinda/30 transition-all cursor-pointer relative shadow-sm;
        }

        .filter-chip select {
            @apply bg-transparent outline-none appearance-none pr-6 cursor-pointer text-gray-700;
        }

        .filter-chip .chip-icon {
            @apply absolute right-3 text-[9px] text-gray-400 pointer-events-none transition-transform;
        }

        .filter-chip:hover .chip-icon {
            @apply text-gob-guinda;
        }
    </style>
</head>

<!-- Sidebar Fragment -->
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="sm:ml-64 flex flex-col min-h-screen">

    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Main Content with padding to avoid overlapping -->
    <main class="p-6 md:p-10 flex-1 animate-fade-in" style="padding-top: 100px !important;">



        <!-- ===== FILTERS (Pill Fragment) ===== -->
        <div th:replace="~{fragments/expedientes/filtros-expedientes :: filtros}"></div>

        <!-- ===== TABLE SECTION ===== -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-6">
            <div class="p-6 border-b border-gray-50 flex flex-col md:flex-row md:items-center justify-start gap-12">
                <h2 class="text-gray-400 font-bold uppercase tracking-tighter text-[10px] leading-none flex flex-col">
                    <span>Listado de</span>
                    <span class="text-xl text-gray-800 font-black">Expedientes</span>
                </h2>
                <div th:replace="~{fragments/expedientes/barra-busqueda :: barra}" class="flex-1"></div>
            </div>
            <div id="grid-resultados" th:fragment="gridResultados">
                <div class="overflow-x-auto custom-scrollbar">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr
                                class="bg-gray-50/50 text-[11px] font-bold text-gray-400 uppercase tracking-widest border-b border-gray-100">
                                <th class="px-8 py-5">Nº Expediente</th>
                                <th class="px-6 py-5">Partes Procesales</th>
                                <th class="px-6 py-5">Abogado</th>
                                <th class="px-6 py-5">Estado Procesal</th>
                                <th class="px-8 py-5 text-right w-32">Gestión</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-expedientes-body" class="divide-y divide-gray-50">
                            <!-- Loop Start -->
                            <tr th:each="exp : ${expedientes.content}"
                                class="group hover:bg-[#fdfbf9] transition-all duration-200">

                                <!-- Nº Expediente & Prioridad -->
                                <td class="px-8 py-6">
                                    <div class="flex items-center gap-4">
                                        <div
                                            class="w-10 h-10 rounded-xl bg-gob-guinda/10 flex items-center justify-center text-gob-guinda group-hover:bg-gob-guinda group-hover:text-white transition-all shadow-sm">
                                            <i class="fas fa-file-invoice text-lg"></i>
                                        </div>
                                        <div class="flex flex-col gap-1.5">
                                            <div class="font-extrabold text-gray-900 group-hover:text-gob-guinda transition-colors text-sm"
                                                th:text="${exp.numero}"></div>
                                            <div class="flex">
                                                <span
                                                    class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-extrabold border shadow-sm"
                                                    th:classappend="${exp.prioridad != null ? exp.prioridad.color : 'text-gray-500 bg-gray-100 border-gray-200'}"
                                                    th:text="${exp.prioridad != null ? exp.prioridad.nombre : 'S/N'}">
                                                    PRIORIDAD
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                </td>

                                <!-- Partes Procesales -->
                                <td class="px-6 py-6">
                                    <div class="flex items-center gap-4 max-w-xs">
                                        <div
                                            class="w-10 h-10 rounded-xl bg-gob-oro/10 flex items-center justify-center text-gob-oro shrink-0 shadow-sm">
                                            <i class="fas fa-users text-lg"></i>
                                        </div>
                                        <div class="flex flex-col gap-1">
                                            <p class="text-xs font-semibold text-gray-700 line-clamp-2 leading-relaxed"
                                                th:text="${exp.partes != null and !#strings.isEmpty(exp.partes) ? exp.partes : 'SIN PARTES REGISTRADAS'}">
                                                Partes Procesales
                                            </p>
                                        </div>
                                    </div>
                                </td>

                                <!-- Abogado Responsable, Gerencia & Materia -->
                                <td class="px-6 py-6">
                                    <div class="flex flex-col gap-2">
                                        <!-- Abogado info -->
                                        <div class="flex items-center gap-2.5">
                                            <div class="w-8 h-8 rounded-full bg-gob-oro text-white text-[10px] font-bold flex items-center justify-center shrink-0 border-2 border-white shadow-sm"
                                                th:text="${exp.abogadoResponsable != null and exp.abogadoResponsable.nombreCompleto != null and #strings.length(exp.abogadoResponsable.nombreCompleto) > 0 ? #strings.substring(exp.abogadoResponsable.nombreCompleto, 0, 1).toUpperCase() : '?'}">
                                                X
                                            </div>
                                            <span class="text-xs font-semibold text-gray-750 truncate max-w-[150px]"
                                                th:text="${exp.abogadoResponsable != null ? exp.abogadoResponsable.nombreCompleto : 'SIN ASIGNAR'}">Nombre</span>
                                        </div>
                                        <!-- Estructura debajo del Abogado -->
                                        <div class="flex flex-col gap-1 pl-1">

                                            <!-- Materia  -->
                                            <div class="flex items-center gap-1.5">
                                                <span class="w-1.5 h-1.5 rounded-full bg-gob-guinda shadow-sm"></span>
                                                <span
                                                    class="text-[10px] text-gray-500 font-extrabold uppercase tracking-wider"
                                                    th:text="${exp.materia != null ? exp.materia.nombre : 'S/N'}">MATERIA</span>
                                            </div>
                                        </div>
                                    </div>
                                </td>

                                <!-- Etapa Procesal -->
                                <td class="px-6 py-6">
                                    <span
                                        class="px-3 py-1.5 rounded-lg text-[10px] font-extrabold uppercase tracking-widest border"
                                        th:classappend="${exp.etapaProcesal != null and exp.etapaProcesal.name() == 'CONCLUIDO' ? 'bg-green-100 text-green-700 border-green-200' : 'bg-gob-oro/10 text-gob-oro border-gob-oro/20'}"
                                        th:text="${exp.etapaProcesal != null ? exp.etapaProcesal.name() : 'DESCONOCIDO'}">
                                        TRAMITE
                                    </span>
                                </td>

                                <!-- Actions -->
                                <td class="px-8 py-6 text-right">
                                    <a th:href="@{/expedientes/{id}(id=${exp.id})}"
                                        class="inline-flex items-center justify-center w-9 h-9 border border-gray-200 text-gray-400 rounded-xl hover:bg-gob-guinda hover:text-white hover:border-gob-guinda hover:shadow-lg transition-all transform hover:scale-110 active:scale-95">
                                        <i class="fas fa-eye text-sm transition-transform group-hover:scale-110"></i>
                                    </a>
                                </td>
                            </tr>
                            <!-- No Results -->
                            <tr th:if="${expedientes.empty}">
                                <td colspan="5" class="px-8 py-20 text-center">
                                    <div class="flex flex-col items-center gap-3 opacity-30">
                                        <i class="fas fa-search text-5xl"></i>
                                        <p class="text-lg font-bold italic">No se encontraron expedientes</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- ===== PAGINATION ===== -->
                <div class="mt-4 p-4 flex flex-col sm:flex-row justify-between items-center text-sm text-gray-500"
                    th:if="${!expedientes.empty}">
                    <span class="mb-2 sm:mb-0">
                        Mostrando página <span th:text="${expedientes.number + 1}"
                            class="font-bold text-gray-700"></span> de <span th:text="${expedientes.totalPages}"
                            class="font-bold text-gray-700"></span>
                    </span>

                    <div class="flex gap-2">
                        <a th:if="${expedientes.hasPrevious()}"
                            th:href="@{/expedientes(page=${expedientes.number - 1}, keyword=${keyword}, gerenciaId=${param.gerenciaId}, materiaId=${param.materiaId}, abogadoId=${param.abogadoId}, etapa=${param.etapa}, etiquetaId=${param.etiquetaId}, prioridadId=${param.prioridadId}, tipoId=${param.tipoId})}"
                            class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 bg-white shadow-sm transition-all flex items-center gap-1 pagina-link">
                            <i class="fas fa-chevron-left text-xs"></i> Anterior
                        </a>

                        <a th:if="${expedientes.hasNext()}"
                            th:href="@{/expedientes(page=${expedientes.number + 1}, keyword=${keyword}, gerenciaId=${param.gerenciaId}, materiaId=${param.materiaId}, abogadoId=${param.abogadoId}, etapa=${param.etapa}, etiquetaId=${param.etiquetaId}, prioridadId=${param.prioridadId}, tipoId=${param.tipoId})}"
                            class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 bg-white shadow-sm transition-all flex items-center gap-1 pagina-link">
                            Siguiente <i class="fas fa-chevron-right text-xs"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <div th:replace="~{fragments/expedientes/modal-nuevo-exp :: modal}"></div>
    <script th:src="@{/js/main-EXP.js}"></script>
    <script th:src="@{/js/realtime-search.js}"></script>
</div>
<div th:replace="~{fragments/common/notifications :: notificaciones}"></div>
</body>

</html>

</html>
