<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Sistema Jurídico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/js/tailwind.config.js}"></script>
    <script th:src="@{/lib/sweetalert2.all.min.js}"></script>
    <script th:src="@{/lib/chart.umd.min.js}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/semantic-badges.css}">
</head>

<body class="bg-gray-100 text-gray-800 font-sans pb-10">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="p-4 sm:ml-64 bg-slate-50 min-h-screen">

        <div class="mb-8 flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-black text-gob-guinda font-headings tracking-tight">
                    Expedientes <span class="text-gob-oro font-light">| Workstation</span>
                </h1>
                <p class="text-gray-500 text-sm mt-1 font-medium">Gestión integral de asuntos jurídicos y seguimiento
                    procesal.</p>
            </div>
            <button onclick="document.getElementById('modal-nuevo-exp').classList.remove('hidden')"
                class="px-4 py-2 bg-gob-guinda text-white rounded-lg hover:bg-gob-guinda-claro text-sm font-bold transition shadow-md flex items-center gap-2">
                <i class="fas fa-plus"></i> Nuevo Expediente
            </button>
        </div>

        <main class="container mx-auto px-0 py-4">

            <div th:if="${success}"
                class="mb-6 p-4 bg-emerald-50 text-emerald-700 rounded-xl border border-emerald-100 flex items-center gap-3 animate-fade-in-down">
                <i class="fas fa-check-circle"></i>
                <span class="font-bold text-sm" th:text="${success}"></span>
            </div>

            <!-- Dashboard de Resumen -->
            <div th:replace="~{fragments/expedientes/summary-cards :: cards}"></div>

            <!-- Filtros y Búsqueda Modernizados -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-6">
                <div th:replace="~{fragments/expedientes/barra-busqueda-exp :: barra}"></div>
                <div th:replace="~{fragments/expedientes/filtros-expedientes :: filtros}"></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

                <a th:each="exp : ${expedientes.content}" th:href="@{/expedientes/{id}(id=${exp.id})}"
                    class="block group">

                    <div class="bg-white rounded-lg shadow group-hover:shadow-lg transition duration-300 border-l-4 p-5 relative cursor-pointer h-full"
                        th:classappend="${exp.prioridad.name() == 'ALTA' ? 'border-red-600' : (exp.prioridad.name() == 'MEDIA' ? 'border-yellow-500' : 'border-green-500')}">

                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <h4 class="text-lg font-bold text-gob-guinda group-hover:underline"
                                    th:text="${exp.numero}">EXP-0000</h4>
                                <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wide"
                                    th:text="${exp.materia != null ? exp.materia.nombre : 'S/N'}">MATERIA</span>
                            </div>

                            <div class="flex flex-col items-end gap-2">
                                <span th:text="${exp.etapaProcesal}" th:class="${exp.etapaProcesal.name() == 'FIRME' ? 'badge-stage-firme' : 
                                                    (exp.etapaProcesal.name() == 'LAUDO' ? 'badge-stage-laudo' : 
                                                    (exp.etapaProcesal.name() == 'CONCLUIDO' ? 'badge-stage-concluido' : 
                                                    'badge-stage-tramite'))}">TRAMITE</span>

                                <span th:text="${exp.prioridad}" th:class="${exp.prioridad.name() == 'ALTA' ? 'badge-priority-alta' : 
                                                    (exp.prioridad.name() == 'MEDIA' ? 'badge-priority-media' : 
                                                    'badge-priority-baja')}">
                                    PRIORIDAD
                                </span>
                            </div>
                        </div>

                        <p class="text-gray-600 text-sm mb-4 line-clamp-2 h-10 font-medium"
                            th:text="${exp.partes != null ? exp.partes : exp.descripcion}">
                            Descripción...
                        </p>

                        <div
                            class="border-t border-gray-100 pt-3 flex justify-between items-center text-xs text-gray-500">
                            <div class="flex items-center gap-1">
                                <i class="fas fa-user-tie"></i>
                                <span
                                    th:text="${exp.abogadoResponsable != null ? exp.abogadoResponsable.nombreCompleto : 'Sin Asignar'}">Lic.
                                    Nombre</span>
                            </div>
                            <div class="flex items-center gap-1">
                                <i class="fas fa-university"></i>
                                <span
                                    th:text="${exp.organoJurisdiccional != null ? exp.organoJurisdiccional.nombre : 'Sin Órgano'}"
                                    class="truncate max-w-[100px]">Órgano</span>
                            </div>
                        </div>
                    </div>
                </a>

                <div th:if="${expedientes.totalElements == 0}"
                    class="col-span-1 md:col-span-2 lg:col-span-3 text-center py-20 bg-white rounded-xl border border-dashed border-gray-300">
                    <div
                        class="w-20 h-20 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-4 text-gray-300">
                        <i class="fas fa-search text-3xl"></i>
                    </div>
                    <h3 class="text-lg font-bold text-gray-600">No se encontraron resultados</h3>
                    <p class="text-gray-400 text-sm">Intenta ajustar los filtros o el término de búsqueda.</p>
                </div>
            </div>

            <!-- Pagina -->
            <div class="mt-8 flex justify-between items-center bg-white p-4 rounded-lg shadow-sm border-t border-gray-100"
                th:if="${expedientes.totalPages > 0}">
                <span class="text-xs text-gray-500 font-medium">
                    Página <span th:text="${expedientes.number + 1}">1</span> de <span
                        th:text="${expedientes.totalPages}">1</span>
                </span>

                <div class="flex gap-2">
                    <a th:if="${expedientes.hasPrevious()}"
                        th:href="@{/expedientes(page=${expedientes.number - 1}, keyword=${keyword})}"
                        class="px-3 py-1.5 bg-gray-100 text-gray-600 rounded hover:bg-gray-200 text-sm font-medium transition">
                        <i class="fas fa-chevron-left mr-1"></i> Anterior
                    </a>

                    <a th:if="${expedientes.hasNext()}"
                        th:href="@{/expedientes(page=${expedientes.number + 1}, keyword=${keyword})}"
                        class="px-3 py-1.5 bg-gob-guinda text-white rounded hover:bg-gob-guinda-claro text-sm font-medium transition shadow-sm">
                        Siguiente <i class="fas fa-chevron-right ml-1"></i>
                    </a>
                </div>
            </div>

        </main>

        <div th:replace="~{fragments/expedientes/modal-nuevo-exp :: modal}"></div>
        <script th:src="@{/js/main-EXP.js}"></script>
    </div>
    <script>
        document.onkeydown = function (evt) {
            evt = evt || window.event;
            if (evt.keyCode == 27) {
                document.getElementById('modal-nuevo-exp').classList.add('hidden');
            }
        };
    </script>
    <script th:if="${mensaje != null}">
        document.addEventListener('DOMContentLoaded', function () {
            // Obtenemos los valores enviados desde el Controller
            const mensaje = "[[${mensaje}]]";
            const tipo = "[[${tipo}]]"; // 'success' o 'error'

            // Configuramos el título y el icono según el tipo
            let titulo = "¡Éxito!";
            let icono = "success";

            if (tipo === 'error') {
                titulo = "Atención";
                icono = "error";
            }

            // Mostramos la alerta bonita
            Swal.fire({
                title: titulo,
                text: mensaje,
                icon: icono,
                confirmButtonText: 'Entendido',
                confirmButtonColor: '#bc955c', // Color gob-oro
                background: '#f9fafb',
                customClass: {
                    confirmButton: 'font-bold'
                }
            });
        });
    </script>
</body>

</html>
