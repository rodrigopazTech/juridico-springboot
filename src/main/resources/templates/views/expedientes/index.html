<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Sistema Jurídico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'gob-guinda': '#621132',
                        'gob-guinda-claro': '#95224e',
                        'gob-oro': '#D4C19C',
                        'gob-verde': '#10312B',
                        'gob-gris': '#F6F6F6'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gob-gris text-gray-800 font-sans">

    <nav class="bg-white border-b-4 border-gob-oro shadow-sm px-6 py-3 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <i class="fas fa-folder-open text-gob-guinda text-2xl"></i>
            <h1 class="text-xl font-bold text-gray-700">Gestión de Expedientes</h1>
        </div>
        <div class="flex items-center gap-2 text-sm">
            <span class="text-gob-guinda font-bold">Lic. Usuario</span>
            <i class="fas fa-user-circle text-gray-400 text-2xl"></i>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8">
        
        <div class="bg-white p-4 rounded-lg shadow-sm mb-6 flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="relative w-full md:w-2/3">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                    <i class="fas fa-search"></i>
                </span>
                <input type="text" 
                       class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-gob-oro focus:border-transparent text-sm" 
                       placeholder="Buscar expediente, materia, abogado...">
            </div>

            <button onclick="document.getElementById('modal-nuevo-exp').classList.remove('hidden')" 
                    class="w-full md:w-auto bg-gob-guinda hover:bg-gob-guinda-claro text-white font-bold py-2 px-6 rounded shadow transition duration-300 flex items-center justify-center gap-2">
                <i class="fas fa-plus"></i> Nuevo Expediente
            </button>
        </div>

        <div class="bg-white p-4 rounded-lg shadow-sm mb-8 border-t border-gob-oro">
            <h3 class="text-xs font-bold text-gob-oro uppercase mb-3"><i class="fas fa-filter mr-1"></i> Filtros de Expedientes</h3>
            <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
                <select class="border border-gray-300 rounded p-2 text-sm focus:border-gob-guinda"><option>Gerencia: Todas</option></select>
                <select class="border border-gray-300 rounded p-2 text-sm focus:border-gob-guinda"><option>Materia: Todas</option></select>
                <select class="border border-gray-300 rounded p-2 text-sm focus:border-gob-guinda"><option>Etapa: Todas</option></select>
                <select class="border border-gray-300 rounded p-2 text-sm focus:border-gob-guinda"><option>Prioridad: Todas</option></select>
                <select class="border border-gray-300 rounded p-2 text-sm focus:border-gob-guinda"><option>Abogado: Todos</option></select>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            
            <div th:each="exp : ${expedientes}" 
                 class="bg-white rounded-lg shadow hover:shadow-md transition duration-300 border-l-4 p-5 relative"
                 th:classappend="${exp.prioridad.name() == 'ALTA' ? 'border-red-600' : (exp.prioridad.name() == 'MEDIA' ? 'border-yellow-500' : 'border-green-500')}">
                
                <div class="flex justify-between items-start mb-2">
                    <div>
                        <h4 class="text-lg font-bold text-gob-guinda" th:text="${exp.numero}">EXP-0000</h4>
                        <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wide" 
                              th:text="${exp.materia != null ? exp.materia.nombre : 'S/N'}">MATERIA</span>
                    </div>
                    
                    <div class="flex flex-col items-end gap-1">
                        <span class="text-[10px] border border-blue-500 text-blue-600 px-2 py-0.5 rounded font-bold" 
                              th:text="${exp.etapaProcesal}">TRAMITE</span>
                        
                        <span class="text-[10px] px-2 py-0.5 rounded font-bold border"
                              th:text="${exp.prioridad}"
                              th:classappend="${exp.prioridad.name() == 'ALTA' ? 'bg-red-100 text-red-700 border-red-200' : 'bg-yellow-100 text-yellow-800 border-yellow-200'}">
                            PRIORIDAD
                        </span>
                    </div>
                </div>
                
                <p class="text-gray-600 text-sm mb-4 line-clamp-2 h-10" 
                th:text="${exp.partes != null ? exp.partes : exp.descripcion}">
                 Juan vs Pedro...
                </p>                
                <div class="border-t border-gray-100 pt-3 flex justify-between items-center text-xs text-gray-500">
                    <div class="flex items-center gap-1">
                        <i class="fas fa-user-tie"></i> 
                        <span th:text="${exp.abogadoResponsable != null ? exp.abogadoResponsable.nombreCompleto : 'Sin Asignar'}">Lic. Nombre</span>
                    </div>
                    <div class="flex items-center gap-1">
                        <i class="far fa-calendar-alt"></i> 
                        <span th:text="${exp.createdAt != null ? #temporals.format(exp.createdAt, 'dd MMM yyyy') : '-'}">01 Ene 2025</span>
                    </div>
                </div>
            </div>
            <div th:if="${expedientes.empty}" class="col-span-3 text-center py-10 text-gray-400">
                <i class="fas fa-folder-open text-4xl mb-2"></i>
                <p class="mt-2 text-sm">No hay expedientes registrados en el sistema.</p>
            </div>

        </div> 
    </main>

    <div th:replace="~{fragments/modal-nuevo-exp :: modal}"></div>

    <script>
        document.onkeydown = function(evt) {
            evt = evt || window.event;
            if (evt.keyCode == 27) { // ESC key
                document.getElementById('modal-nuevo-exp').classList.add('hidden');
            }
        };
    </script>
</body>
</html>
