<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>Detalle Expediente | Sistema Jurídico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/js/tailwind.config.js}"></script>
    <script th:src="@{/lib/sweetalert2.all.min.js}"></script>
    <script th:src="@{/lib/chart.umd.min.js}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/semantic-badges.css}">
</head>

<body class="bg-gob-fondo text-gray-800 font-sans pb-10">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="p-4 sm:ml-64">

        <div class="mb-6 container mx-auto">
            <h1 class="text-3xl font-bold text-gob-guinda font-headings">
                <i class="fas fa-folder-open text-gob-oro mr-2"></i> Detalle del Expediente
            </h1>
            <hr class="h-1 w-20 bg-gob-oro border-0 mt-2 mb-4" />
        </div>

        <div class="container mx-auto px-4">
            <div th:replace="~{fragments/expedientes/encabezado-detalle :: encabezado(${expediente})}"></div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

                <div class="lg:col-span-2">
                    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">

                        <h3
                            class="font-bold text-gob-guinda mb-4 text-sm uppercase tracking-wide border-b pb-2 flex items-center gap-2">
                            <i class="fas fa-info-circle"></i> Información General
                        </h3>

                        <div class="grid grid-cols-2 md:grid-cols-3 gap-y-4 gap-x-6 text-sm mb-6">
                            <div class="col-span-2 md:col-span-1">
                                <p class="text-gray-400 text-[10px] uppercase font-bold tracking-wider">Gerencia</p>
                                <p class="font-semibold text-gray-800 leading-tight"
                                    th:text="${expediente.gerencia.nombre}">Gerencia</p>
                            </div>
                            <div>
                                <p class="text-gray-400 text-[10px] uppercase font-bold tracking-wider">Materia</p>
                                <p class="font-semibold text-gray-800" th:text="${expediente.materia.nombre}">Materia
                                </p>
                            </div>


                            <div>
                                <p class="text-gray-400 text-[10px] uppercase font-bold tracking-wider">Órgano
                                    Jurisdiccional</p>
                                <p class="font-semibold text-gray-800 truncate"
                                    th:title="${expediente.organoJurisdiccional != null ? expediente.organoJurisdiccional.nombre : ''}"
                                    th:text="${expediente.organoJurisdiccional != null ? expediente.organoJurisdiccional.nombre : 'Sin asignar'}">
                                    Juzgado</p>
                            </div>
                            <div>
                                <p class="text-gray-400 text-[10px] uppercase font-bold tracking-wider">Ubicación</p>
                                <p class="font-semibold text-gray-800 flex items-center gap-1">
                                    <i class="fas fa-map-marker-alt text-gray-400 text-xs"></i>
                                    <span th:text="${expediente.sede}">Sede</span>
                                </p>
                            </div>
                            <div>
                                <p class="text-gray-400 text-[10px] uppercase font-bold tracking-wider mb-1">Prioridad
                                </p>
                                <span th:text="${expediente.prioridad != null ? expediente.prioridad.nombre : 'S/N'}"
                                    th:classappend="${expediente.prioridad != null ? expediente.prioridad.color : 'bg-gray-100 text-gray-500 border-gray-200'}"
                                    class="px-2 py-0.5 rounded font-bold border inline-block text-[11px]">
                                    ALTA
                                </span>
                            </div>
                        </div>

                        <hr class="border-gray-100 my-6">

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div class="md:col-span-2">
                                <h3
                                    class="font-bold text-gob-guinda mb-3 text-sm uppercase tracking-wide border-b pb-2 flex items-center gap-2">
                                    <i class="fas fa-file-alt"></i> Detalle del Asunto
                                </h3>

                                <div class="mb-4">
                                    <p class="text-gray-400 text-[10px] uppercase font-bold tracking-wider mb-1">Partes
                                        Procesales</p>
                                    <div
                                        class="bg-gray-50 p-2.5 rounded border border-gray-200 font-medium text-gray-800 text-sm flex items-start gap-2">
                                        <i class="fas fa-users text-gob-oro mt-0.5"></i>
                                        <span
                                            th:text="${expediente.partes != null ? expediente.partes : 'Sin partes registradas'}">Actor
                                            vs Demandado</span>
                                    </div>
                                </div>

                                <div>
                                    <p class="text-gray-400 text-[10px] uppercase font-bold tracking-wider mb-1">
                                        Procedimiento</p>
                                    <div class="text-gray-700 leading-relaxed text-sm whitespace-pre-wrap"
                                        th:text="${expediente.descripcion}">Descripción...</div>
                                </div>
                            </div>

                            <div
                                class="md:col-span-1 border-l border-gray-100 pl-0 md:pl-6 pt-6 md:pt-0 border-t md:border-t-0 mt-2 md:mt-0">
                                <h3
                                    class="font-bold text-gob-guinda mb-3 text-sm uppercase tracking-wide border-b pb-2 flex items-center gap-2">
                                    <i class="fas fa-user-tie"></i> Responsable
                                </h3>

                                <div class="flex flex-col gap-3">
                                    <div class="flex items-center gap-3">
                                        <div
                                            class="w-10 h-10 bg-gob-guinda text-white rounded-full flex items-center justify-center text-sm shadow">
                                            <i class="fas fa-user"></i>
                                        </div>
                                        <div>
                                            <p class="text-[10px] text-gray-400 uppercase font-bold">Abogado Asignado
                                            </p>
                                            <p class="font-bold text-sm text-gray-800 leading-tight"
                                                th:text="${expediente.abogadoResponsable != null ? expediente.abogadoResponsable.nombreCompleto : 'Sin Asignar'}">
                                                Nombre</p>
                                        </div>
                                    </div>

                                    <div th:if="${expediente.abogadoResponsable != null}"
                                        class="text-xs text-gray-500 bg-gray-50 p-2 rounded border border-gray-100">
                                        <p class="flex items-center gap-2 mb-1">
                                            <i class="fas fa-envelope text-gray-400"></i>
                                            <span class="truncate"
                                                th:text="${expediente.abogadoResponsable.email}">email</span>
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="lg:col-span-1">
                    <div th:replace="~{fragments/expedientes/historial-lateral :: historial}"></div>
                </div>

            </div>

            <!-- Se eliminó sección de Archivos Recientes por requerimiento de limpieza UI (ROD-134) -->

        </div>
    </div>

    <!-- Modales -->
    <div
        th:replace="~{fragments/expedientes/modales-detalle :: modales(${expediente}, ${gerencias}, ${materias}, ${usuarios}, ${organos}, ${prioridades}, ${estados}, ${etapas}, ${tipos})}">
    </div>

    <!-- Gestor Documental -->
    <div th:replace="~{fragments/expedientes/gestor-documental :: gestor-documental}"></div>

    <!-- Scripts de Acciones -->
    <script th:src="@{/js/main-EXP.js}"></script>
    <script th:src="@{/js/expedientes/detalle-acciones.js}"></script>
    <script th:src="@{/js/expedientes/gestor-documental.js}"></script>
    <script th:src="@{/js/main-EXP.js}"></script>
</body>

</html>
