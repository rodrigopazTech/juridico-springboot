<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="stylesheet" th:href="@{/css/transitions.css}" />
    <link rel="manifest" th:href="@{/manifest.json}" />
    <link rel="icon" th:href="@{/favicon.ico}" sizes="any" />
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
    <link rel="apple-touch-icon" th:href="@{/img/apple-touch-icon.png}" />
    <meta name="theme-color" content="#691228" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Cuenta | Sistema Jurídico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/js/tailwind.config.js}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script th:src="@{/lib/sweetalert2.all.min.js}"></script>
    <style>
        input[type="password"]::-ms-reveal,
        input[type="password"]::-ms-clear {
            display: none;
        }
    </style>

    <!-- Script global de navegación de pestañas -->
    <script th:inline="javascript">
        window.showTab = function (tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            const tabActual = document.getElementById('tab-' + tabId);
            if (tabActual) tabActual.classList.remove('hidden');

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('border-gob-guinda', 'bg-gray-50', 'text-gob-guinda');
                btn.classList.add('border-transparent', 'text-gray-500');
            });

            const activeBtn = document.getElementById('btn-' + tabId);
            if (activeBtn) {
                activeBtn.classList.add('border-gob-guinda', 'bg-gray-50', 'text-gob-guinda');
                activeBtn.classList.remove('border-transparent', 'text-gray-500');
            }
        };

        // Abrir el tab indicado por el servidor (soporte para ?tab=seguridad)
        document.addEventListener('DOMContentLoaded', function () {
            const tabInicial = /*[[${tabInicial}]]*/ 'datos';
            showTab(tabInicial);
        });
    </script>
</head>

<body class="bg-gray-50 text-gray-800 font-sans">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="p-4 sm:p-6 sm:ml-64 pt-[116px] sm:pt-[116px] md:pt-[116px] lg:pt-[116px]">

        <div class="max-w-5xl mx-auto">
            <div class="mb-8">
                <h1 class="text-4xl font-extrabold text-gob-guinda font-headings">Mi Cuenta</h1>
                <p class="text-gray-500 mt-1">Gestiona tu información personal, seguridad y avisos del sistema.</p>
            </div>

            <div class="flex flex-col md:flex-row gap-8 md:items-start">

                <div class="w-full md:w-1/3 md:sticky md:top-24 md:self-start">
                    <div class="space-y-6">
                        <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 text-center">
                            <div class="w-24 h-24 rounded-full bg-gradient-to-br from-gob-oro to-yellow-600 mx-auto mb-4 flex items-center justify-center text-white text-3xl font-bold shadow-lg border-4 border-white"
                                th:text="${#strings.substring(usuario.nombreCompleto, 0, 1)}">U</div>
                            <h2 class="text-xl font-bold text-gray-800" th:text="${usuario.nombreCompleto}">Nombre Usuario
                            </h2>
                            <p class="text-sm text-gob-oro font-bold uppercase tracking-widest mt-1"
                                th:text="${usuario.rol}">Rol</p>
                             <div class="mt-4 pt-4 border-t border-gray-50 flex flex-wrap justify-center gap-2">
                                <th:block th:if="${usuario.rol.name() == 'ADMIN' || usuario.rol.name() == 'DIRECTOR_PRINCIPAL' || usuario.rol.name() == 'DIRECTOR' || usuario.rol.name() == 'SUBDIRECTOR'}">
                                    <span class="text-[10px] bg-gob-oro/10 text-gob-oro px-2 py-1 rounded-md font-bold uppercase">Todas (Acceso Global)</span>
                                </th:block>
                                <th:block th:unless="${usuario.rol.name() == 'ADMIN' || usuario.rol.name() == 'DIRECTOR_PRINCIPAL' || usuario.rol.name() == 'DIRECTOR' || usuario.rol.name() == 'SUBDIRECTOR'}">
                                    <span th:each="materia : ${usuario.materias}"
                                        class="text-[10px] bg-gray-100 text-gray-600 px-2 py-1 rounded-md font-bold"
                                        th:text="${materia.nombre}">Materia</span>
                                </th:block>
                            </div>
                        </div>

                        <nav class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                            <button onclick="showTab('datos')"
                                class="tab-btn w-full flex items-center gap-3 px-6 py-4 text-sm font-bold transition-all border-l-4 border-gob-guinda bg-gray-50 text-gob-guinda"
                                id="btn-datos">
                                <i class="fas fa-user-circle"></i> Datos Personales
                            </button>
                            <button onclick="showTab('notif')"
                                class="tab-btn w-full flex items-center gap-3 px-6 py-4 text-sm font-bold transition-all border-l-4 border-transparent text-gray-500 hover:bg-gray-50"
                                id="btn-notif">
                                <i class="fas fa-bell"></i> Notificaciones
                            </button>
                            <button onclick="showTab('seguridad')"
                                class="tab-btn w-full flex items-center gap-3 px-6 py-4 text-sm font-bold transition-all border-l-4 border-transparent text-gray-500 hover:bg-gray-50"
                                id="btn-seguridad">
                                <i class="fas fa-shield-alt"></i> Seguridad
                            </button>

                            <div class="border-t border-gray-100 px-4 py-4">
                                <button id="btnGuardarPreferencias"
                                    type="submit"
                                    form="formPreferenciasNotificaciones"
                                    disabled
                                    class="w-full inline-flex items-center justify-center gap-2 rounded-xl bg-gob-guinda px-4 py-3 text-sm font-bold text-white shadow-lg shadow-gob-guinda/15 transition-all disabled:cursor-not-allowed disabled:bg-gray-200 disabled:text-gray-400 disabled:shadow-none">
                                    <i class="fas fa-save"></i> Guardar Cambios
                                </button>
                            </div>
                        </nav>
                    </div>
                </div>

                <div class="w-full md:w-2/3 md:max-h-[calc(100vh-9rem)] md:overflow-y-auto md:pr-2">

                    <div id="tab-datos" class="tab-content block animate-fade-in">
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
                            <h3 class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2">
                                <i class="fas fa-id-card text-gob-oro"></i> Información General
                            </h3>
                            <div th:replace="~{fragments/perfil/info-personal :: info}"></div>
                        </div>
                    </div>

                    <div id="tab-notif" class="tab-content hidden animate-fade-in">
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
                            <h3 class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2">
                                <i class="fas fa-bell text-gob-oro"></i> Ajustes de Alertas
                            </h3>
                            <div th:replace="~{fragments/perfil/notificaciones :: form}"></div>
                        </div>
                    </div>

                    <div id="tab-seguridad" class="tab-content hidden animate-fade-in">
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
                            <h3 class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2 justify-center">
                                <i class="fas fa-lock text-gob-oro"></i> Seguridad
                            </h3>
                            <div th:replace="~{fragments/perfil/seguridad :: form}"></div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        function showTab(tabId) {
            // Ocultar contenidos
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');

            // Resetear botones
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('border-gob-guinda', 'bg-gray-50', 'text-gob-guinda');
                btn.classList.add('border-transparent', 'text-gray-500');
            });

            // Activar botón actual
            const activeBtn = document.getElementById('btn-' + tabId);
            activeBtn.classList.add('border-gob-guinda', 'bg-gray-50', 'text-gob-guinda');
            activeBtn.classList.remove('border-transparent', 'text-gray-500');
        }

        document.addEventListener('DOMContentLoaded', function () {
            const formPreferencias = document.getElementById('formPreferenciasNotificaciones');
            const btnGuardarPreferencias = document.getElementById('btnGuardarPreferencias');

            if (!formPreferencias || !btnGuardarPreferencias) {
                return;
            }

            const checkboxes = Array.from(formPreferencias.querySelectorAll('input[type="checkbox"][name="eventos"]'));

            function actualizarEstadoGuardado() {
                const hayCambios = checkboxes.some((checkbox) => checkbox.checked !== checkbox.defaultChecked);
                btnGuardarPreferencias.disabled = !hayCambios;
            }

            checkboxes.forEach((checkbox) => {
                checkbox.addEventListener('change', actualizarEstadoGuardado);
            });

            formPreferencias.addEventListener('submit', function () {
                btnGuardarPreferencias.disabled = true;
            });

            actualizarEstadoGuardado();
        });
    </script>
</body>

</html>
