<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>Mi Cuenta | Sistema Jurídico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/js/tailwind.config.js}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body class="bg-gray-50 text-gray-800 font-sans">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="p-6 sm:ml-64" style="padding-top: 100px !important;">

        <div class="max-w-5xl mx-auto">
            <div class="mb-8">
                <h1 class="text-4xl font-extrabold text-gob-guinda font-headings">Mi Cuenta</h1>
                <p class="text-gray-500 mt-1">Gestiona tu información personal, seguridad y avisos del sistema.</p>
            </div>

            <div class="flex flex-col md:flex-row gap-8">

                <div class="w-full md:w-1/3 space-y-6">
                    <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 text-center">
                        <div class="w-24 h-24 rounded-full bg-gradient-to-br from-gob-oro to-yellow-600 mx-auto mb-4 flex items-center justify-center text-white text-3xl font-bold shadow-lg border-4 border-white"
                            th:text="${#strings.substring(usuario.nombreCompleto, 0, 1)}">U</div>
                        <h2 class="text-xl font-bold text-gray-800" th:text="${usuario.nombreCompleto}">Nombre Usuario
                        </h2>
                        <p class="text-sm text-gob-oro font-bold uppercase tracking-widest mt-1"
                            th:text="${usuario.rol}">Rol</p>
                        <div class="mt-4 pt-4 border-t border-gray-50 flex flex-wrap justify-center gap-2">
                            <span th:each="materia : ${usuario.materias}"
                                class="text-[10px] bg-gray-100 text-gray-600 px-2 py-1 rounded-md font-bold"
                                th:text="${materia.nombre}">Materia</span>
                        </div>
                    </div>

                    <nav class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                        <button onclick="showTab('datos')"
                            class="tab-btn w-full flex items-center gap-3 px-6 py-4 text-sm font-bold transition-all border-l-4 border-gob-guinda bg-gray-50 text-gob-guinda"
                            id="btn-datos">
                            <i class="fas fa-user-circle"></i> Datos Personales
                        </button>
                        <button onclick="showTab('notif')"
                            class="tab-btn w-full flex items-center gap-3 px-6 py-4 text-sm font-bold transition-all border-l-4 border-transparent text-gray-500 hover:bg-gray-50"
                            id="btn-notif">
                            <i class="fas fa-bell"></i> Notificaciones
                        </button>
                        <button onclick="showTab('seguridad')"
                            class="tab-btn w-full flex items-center gap-3 px-6 py-4 text-sm font-bold transition-all border-l-4 border-transparent text-gray-500 hover:bg-gray-50"
                            id="btn-seguridad">
                            <i class="fas fa-shield-alt"></i> Seguridad
                        </button>
                    </nav>
                </div>

                <div class="w-full md:w-2/3">

                    <div id="tab-datos" class="tab-content block animate-fade-in">
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
                            <h3 class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2">
                                <i class="fas fa-id-card text-gob-oro"></i> Información General
                            </h3>
                            <div th:replace="~{fragments/perfil/info-personal :: info}"></div>
                        </div>
                    </div>

                    <div id="tab-notif" class="tab-content hidden animate-fade-in">
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
                            <h3 class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2">
                                <i class="fas fa-bell text-gob-oro"></i> Ajustes de Alertas
                            </h3>
                            <div th:replace="~{fragments/perfil/notificaciones :: form}"></div>
                        </div>
                    </div>

                    <div id="tab-seguridad" class="tab-content hidden animate-fade-in">
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
                            <h3 class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2">
                                <i class="fas fa-lock text-gob-oro"></i> Cambio de Contraseña
                            </h3>
                            <div th:replace="~{fragments/perfil/seguridad :: form}"></div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        function showTab(tabId) {
            // Ocultar contenidos
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');

            // Resetear botones
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('border-gob-guinda', 'bg-gray-50', 'text-gob-guinda');
                btn.classList.add('border-transparent', 'text-gray-500');
            });

            // Activar botón actual
            const activeBtn = document.getElementById('btn-' + tabId);
            activeBtn.classList.add('border-gob-guinda', 'bg-gray-50', 'text-gob-guinda');
            activeBtn.classList.remove('border-transparent', 'text-gray-500');
        }
    </script>
</body>

</html>
