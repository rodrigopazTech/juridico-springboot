<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="manifest" th:href="@{/manifest.json}" />
    <meta name="theme-color" content="#691228" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abogados | Sistema Jurídico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/js/tailwind.config.js}"></script>
    <script th:src="@{/lib/sweetalert2.all.min.js}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
    <style>
        .thin-scrollbar::-webkit-scrollbar { width: 4px; }
        .thin-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .thin-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans h-screen overflow-hidden">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="p-4 sm:p-6 sm:ml-64 pt-[116px] sm:pt-[116px] md:pt-[116px] lg:pt-[116px] h-full flex flex-col">
       <div class="flex flex-col lg:flex-row gap-6 flex-1 min-h-0 overflow-hidden">
            
            <div th:replace="~{fragments/abogados/lista :: lista}"></div>

            <div th:replace="~{fragments/abogados/detalle :: detalle}"></div>

        </div>
    </div>

    <div th:replace="~{fragments/abogados/modal-usuario :: modal}"></div>

    <!-- MODAL CONFIRMACIÓN GENÉRICO PARA ABOGADOS -->
    <div id="modal-confirmar-generico"
        class="fixed inset-0 z-[70] hidden items-center justify-center bg-gray-900/50 backdrop-blur-sm p-4">
        <div id="modal-confirmar-border" class="relative w-full max-w-sm bg-white rounded-lg shadow-2xl border-t-4 border-red-600">
            <div class="p-6 text-center">
                <div id="modal-confirmar-icon-bg" class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i id="modal-confirmar-icon" class="fas fa-exclamation-triangle text-red-600 text-2xl"></i>
                </div>
                <h3 id="modal-confirmar-titulo" class="text-lg font-bold text-gray-900 mb-2">¿Confirmar acción?</h3>
                <p id="modal-confirmar-texto" class="text-sm text-gray-600 mb-4">¿Desea continuar con esta operación?</p>
                <div id="modal-confirmar-advertencia-box" class="text-xs text-red-600 bg-red-50 rounded p-2 hidden">
                    <i class="fas fa-warning mr-1"></i><span id="modal-confirmar-advertencia"></span>
                </div>
            </div>
            <div class="flex gap-3 p-4 border-t">
                <button onclick="cerrarModalConfirmarGenerico()"
                    class="flex-1 px-4 py-2 text-sm font-medium text-gray-600 bg-white border border-gray-300 rounded hover:bg-gray-100">
                    Cancelar
                </button>
                <button onclick="ejecutarAccionConfirmada()" id="btn-modal-confirmar-accion"
                    class="flex-1 px-4 py-2 text-sm font-bold text-white bg-red-600 rounded hover:bg-red-700 shadow-md">
                    Confirmar
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
    <script th:src="@{/js/custom-selects.js}"></script>
    <script th:inline="javascript">
        window.usuarioActual = {
            id: [[${usuarioActual.id}]],
            rol: [[${usuarioActual.rol.name()}]],
            gerenciaId: [[${usuarioActual.gerencia != null ? usuarioActual.gerencia.id : null}]]
        };
    </script>
    <script th:src="@{/js/abogados.js}"></script>
    <div th:replace="~{fragments/common/notifications :: notificaciones}"></div>
</body>
</html>
