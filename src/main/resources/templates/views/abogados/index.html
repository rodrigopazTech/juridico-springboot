<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>Abogados | Sistema Jurídico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/js/tailwind.config.js}"></script>
    <script th:src="@{/lib/sweetalert2.all.min.js}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body class="bg-gray-50 text-gray-800 font-sans overflow-x-hidden">

    <!-- Sidebar Fragment -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="sm:ml-64 flex flex-col min-h-screen">
        
        <!-- Navbar Fragment -->
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <!-- Main Content with padding to avoid overlapping -->
        <main class="p-4 md:p-6 flex-1 animate-fade-in pt-24">
        <div class="mb-8">
            <h1 class="text-4xl font-extrabold text-gob-guinda font-headings">Gestión de Abogados</h1>
            <p class="text-gray-500 mt-1">Administra el personal legal, sus roles y accesos al sistema.</p>
        </div>

        <div th:replace="~{fragments/usuarios/tabla-usuarios :: tabla}"></div>
        </main>
    </div>

    <div th:replace="~{fragments/usuarios/modal-usuario :: modal}"></div>

    <script th:src="@{/js/abogados.js}"></script>
    <div th:replace="~{fragments/common/notifications :: notificaciones}"></div>
</body>

</html>
