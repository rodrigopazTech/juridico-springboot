<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>Gestión de Audiencias - Agenda Legal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/js/tailwind.config.js}"></script>
    <script th:src="@{/lib/sweetalert2.all.min.js}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body class="bg-gray-100 text-gray-800 font-sans">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="p-4 sm:ml-64">
        <div class="mb-6">
            <h1 class="text-3xl font-bold text-gob-gris font-headings">
                <i class="fas fa-gavel text-gob-oro mr-2"></i> Gestión de Audiencias
            </h1>
            <hr class="h-1 w-20 bg-gob-guinda border-0 mt-2 mb-4" />
        </div>

        <!-- Tarjetas de KPIs (Nuevo) -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="bg-white p-4 rounded shadow border-l-4 border-gob-guinda flex items-center">
                <div class="p-3 bg-red-100 rounded-full mr-4">
                    <i class="fas fa-list-check text-gob-guinda"></i>
                </div>
                <div>
                    <p class="text-xs uppercase text-gray-500 font-bold">Total</p>
                    <h3 class="text-2xl font-bold" th:text="${totalAudiencias}">0</h3>
                </div>
            </div>
            <div class="bg-white p-4 rounded shadow border-l-4 border-blue-500 flex items-center">
                <div class="p-3 bg-blue-100 rounded-full mr-4">
                    <i class="fas fa-calendar-alt text-blue-500"></i>
                </div>
                <div>
                    <p class="text-xs uppercase text-gray-500 font-bold">Pendientes</p>
                    <h3 class="text-2xl font-bold"
                        th:text="${kpisAudiencias[T(com.juridico.sistema_juridico.Entity.enums.EstatusAudiencia).PENDIENTE]}">
                        0</h3>
                </div>
            </div>
            <div class="bg-white p-4 rounded shadow border-l-4 border-gob-oro flex items-center">
                <div class="p-3 bg-yellow-100 rounded-full mr-4">
                    <i class="fas fa-file-signature text-gob-oro"></i>
                </div>
                <div>
                    <p class="text-xs uppercase text-gray-500 font-bold">Con Acta</p>
                    <h3 class="text-2xl font-bold"
                        th:text="${kpisAudiencias[T(com.juridico.sistema_juridico.Entity.enums.EstatusAudiencia).CON_ACTA]}">
                        0</h3>
                </div>
            </div>
            <div class="bg-white p-4 rounded shadow border-l-4 border-green-600 flex items-center">
                <div class="p-3 bg-green-100 rounded-full mr-4">
                    <i class="fas fa-check-circle text-green-600"></i>
                </div>
                <div>
                    <p class="text-xs uppercase text-gray-500 font-bold">Concluidas</p>
                    <h3 class="text-2xl font-bold"
                        th:text="${kpisAudiencias[T(com.juridico.sistema_juridico.Entity.enums.EstatusAudiencia).CONCLUIDA]}">
                        0</h3>
                </div>
            </div>
        </div>

        <div th:replace="~{fragments/audiencias/barra-busqueda :: barra}"></div>
        <div th:replace="~{fragments/audiencias/barra-filtros :: filtros}"></div>
        <div th:replace="~{fragments/audiencias/tabla :: tabla}"></div>
    </div>

    <div th:replace="~{fragments/audiencias/modals :: modals}"></div>
    <form id="form-subir-acta" th:action="@{/audiencias/subir-acta}" method="post" enctype="multipart/form-data"
        class="hidden">
        <input type="hidden" name="id" id="input-acta-id">
        <input type="file" name="archivo" id="input-acta-file"
            onchange="document.getElementById('form-subir-acta').submit()">
    </form>

    <script th:src="@{/js/audiencias.js(v=4)}"></script>

    <div th:replace="~{fragments/common/notifications :: notificaciones}"></div>
</body>

</html>
