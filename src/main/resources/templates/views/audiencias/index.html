<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Gestión de Audiencias - Agenda Legal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/js/tailwind.config.js}"></script>
    <script th:src="@{/lib/sweetalert2.all.min.js}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="p-4 sm:ml-64">
        <div class="mb-6">
            <h1 class="text-3xl font-bold text-gob-gris font-headings">
                <i class="fas fa-gavel text-gob-oro mr-2"></i> Gestión de Audiencias
            </h1>
            <hr class="h-1 w-20 bg-gob-guinda border-0 mt-2 mb-4" />
        </div>

        <div th:replace="~{fragments/audiencias/barra-busqueda :: barra}"></div>
        <div th:replace="~{fragments/audiencias/barra-filtros :: filtros}"></div>
        <div th:replace="~{fragments/audiencias/tabla :: tabla}"></div>
    </div>

    <div th:replace="~{fragments/audiencias/modals :: modals}"></div>
    <form id="form-subir-acta" th:action="@{/audiencias/subir-acta}" method="post" enctype="multipart/form-data" class="hidden">
        <input type="hidden" name="id" id="input-acta-id">
        <input type="file" name="archivo" id="input-acta-file" onchange="document.getElementById('form-subir-acta').submit()">
    </form>

    <script th:src="@{/js/audiencias.js(v=2)}"></script>
    
    <script th:if="${mensaje != null}">
        document.addEventListener("DOMContentLoaded", function () {
            Swal.fire({
                title: "[[${tipo == 'success' ? '¡Éxito!' : 'Error'}]]",
                text: "[[${mensaje}]]",
                icon: "[[${tipo}]]",
                confirmButtonColor: "#bc955c",
            });
        });
    </script>

</body>
</html>
