<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="manifest" th:href="@{/manifest.json}" />
    <meta name="theme-color" content="#691228" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Audiencias - Agenda Legal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/js/tailwind.config.js}"></script>
    <script th:src="@{/lib/sweetalert2.all.min.js}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" th:href="@{/css/calendario.css}">
    <style>
        /* Scrollbar estilizado para contenedores con scroll horizontal */
        .scrollbar-thin::-webkit-scrollbar {
            height: 6px;
        }
        .scrollbar-thin::-webkit-scrollbar-track {
            background: #f3f4f6;
            border-radius: 4px;
        }
        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .scrollbar-thin::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body class="bg-gray-100 text-gray-800 font-sans overflow-x-hidden">

    <!-- Sidebar Fragment -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="sm:ml-64 flex flex-col min-h-screen">

        <!-- Navbar Fragment -->
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <!-- Main Content with padding to avoid overlapping -->
        <main class="p-4 md:p-6 flex-1 pt-[116px] sm:pt-[116px] md:pt-[116px] lg:pt-[116px]">



            <div class="grid grid-cols-12 gap-8">
                <!-- Sidebar Columna Izquierda: Calendario / Filtros (Tabbed) -->
                <aside class="col-span-12 xl:col-span-3 space-y-4 xl:sticky xl:top-24 xl:self-start z-20">
                    
                    <!-- Selector de Vista Horizontal -->
                    <div class="bg-white p-1.5 rounded-2xl shadow-sm border border-gray-100 flex gap-1 items-center">
                        <button id="btn-ver-calendario" onclick="toggleSidebarView('calendario')"
                            class="flex-1 inline-flex items-center justify-center gap-2 py-2.5 text-[11px] font-extrabold uppercase tracking-widest rounded-xl transition-all duration-300 bg-gob-guinda text-white shadow-md shadow-gob-guinda/20">
                            <i class="fas fa-calendar-alt"></i> Calendario
                        </button>
                        <button id="btn-ver-filtros" onclick="toggleSidebarView('filtros')"
                            class="flex-1 relative inline-flex items-center justify-center gap-2 py-2.5 text-[11px] font-extrabold uppercase tracking-widest rounded-xl transition-all duration-300 text-gray-400 hover:bg-gray-50 hover:text-gray-600">
                            <i class="fas fa-filter"></i> Filtros
                            <span id="badge-filtros-aud" class="hidden ml-1 px-1.5 py-0.5 text-[10px] bg-gob-oro text-white rounded-full shadow-sm animate-pulse border border-white">0</span>
                        </button>
                    </div>

                    <!-- Contenedores de Contenido -->
                    <div id="cont-calendario" class="block animate-fade-in transition-all">
                        <div th:replace="~{fragments/audiencias/mini-calendar :: mini-calendar}"></div>
                    </div>

                    <div id="cont-filtros" class="hidden animate-fade-in transition-all">
                        <div class="bg-gob-guinda text-white p-6 rounded-2xl shadow-lg shadow-gob-guinda/10 relative overflow-hidden flex flex-col gap-6">
                            <div class="relative z-10">
                                <div th:replace="~{fragments/audiencias/barra-filtros :: filtros}"></div>
                            </div>
                            <i class="fas fa-gavel absolute -right-4 -bottom-4 text-white/10 text-7xl rotate-12"></i>
                        </div>
                    </div>

                </aside>

                    <!-- SECCIÓN DINÁMICA: KPIs + Listado -->
                    <div id="grid-maestro-audiencias" th:fragment="gridMaestro" class="col-span-12 xl:col-span-9 space-y-6">
                                              <!-- Tarjetas de KPIs Compactas (ROD-186: Ahora son botones de filtrado) -->
                        <div id="contenedor-kpis-audiencias" class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                            <!-- Total -->
                            <div id="kpi-card-total" onclick="filtrarPorEstatus('')"
                                th:classappend="${paramEstatus == null or paramEstatus == '' ? 'ring-2 ring-gob-oro border-gob-oro scale-105 z-10 bg-white' : 'bg-white opacity-80 hover:opacity-100 hover:shadow-md cursor-pointer border-gray-50'}"
                                class="p-4 rounded-2xl shadow-sm border flex items-center gap-4 transition-all duration-500">
                                <div
                                    class="w-10 h-10 rounded-xl bg-red-50 flex items-center justify-center text-gob-guinda">
                                    <i class="fas fa-list-ul"></i>
                                </div>
                                <div class="flex-1">
                                    <p class="text-[10px] uppercase text-gray-400 font-bold mb-0.5">Total</p>
                                    <h3 class="text-xl font-bold text-gray-800" th:text="${totalAudiencias}">0</h3>
                                </div>
                            </div>

                            <!-- Pendientes -->
                            <div id="kpi-card-pendiente" onclick="filtrarPorEstatus('PENDIENTE')"
                                th:classappend="${paramEstatus == 'PENDIENTE' ? 'ring-2 ring-gob-oro border-gob-oro scale-105 z-10 bg-white' : 'bg-white opacity-80 hover:opacity-100 hover:shadow-md cursor-pointer border-gray-50'}"
                                class="p-4 rounded-2xl shadow-sm border flex items-center gap-4 transition-all duration-500">
                                <div
                                    class="w-10 h-10 rounded-xl bg-orange-50 flex items-center justify-center text-gob-oro">
                                    <i class="fas fa-clock"></i>
                                </div>
                                <div class="flex-1">
                                    <p class="text-[10px] uppercase text-gray-400 font-bold mb-0.5">Pendientes</p>
                                    <h3 class="text-xl font-bold text-gray-800"
                                        th:text="${kpisAudiencias[T(com.juridico.sistema_juridico.Entity.enums.EstatusAudiencia).PENDIENTE]}">
                                        0</h3>
                                </div>
                            </div>

                            <!-- Con Acta -->
                            <div id="kpi-card-con-acta" onclick="filtrarPorEstatus('CON_ACTA')"
                                th:classappend="${paramEstatus == 'CON_ACTA' ? 'ring-2 ring-gob-oro border-gob-oro scale-105 z-10 bg-white' : 'bg-white opacity-80 hover:opacity-100 hover:shadow-md cursor-pointer border-gray-50'}"
                                class="p-4 rounded-2xl shadow-sm border flex items-center gap-4 transition-all duration-500">
                                <div class="w-10 h-10 rounded-xl bg-blue-50 flex items-center justify-center text-blue-500">
                                    <i class="fas fa-file-contract"></i>
                                </div>
                                <div class="flex-1">
                                    <p class="text-[10px] uppercase text-gray-400 font-bold mb-0.5">Con Acta</p>
                                    <h3 class="text-xl font-bold text-gray-800"
                                        th:text="${kpisAudiencias[T(com.juridico.sistema_juridico.Entity.enums.EstatusAudiencia).CON_ACTA]}">
                                        0</h3>
                                </div>
                            </div>

                            <!-- Concluidas -->
                            <div id="kpi-card-concluida" onclick="filtrarPorEstatus('CONCLUIDA')"
                                th:classappend="${paramEstatus == 'CONCLUIDA' ? 'ring-2 ring-gob-oro border-gob-oro scale-105 z-10 bg-white' : 'bg-white opacity-80 hover:opacity-100 hover:shadow-md cursor-pointer border-gray-50'}"
                                class="p-4 rounded-2xl shadow-sm border flex items-center gap-4 transition-all duration-500">
                                <div
                                    class="w-10 h-10 rounded-xl bg-green-50 flex items-center justify-center text-green-600">
                                    <i class="fas fa-check-double"></i>
                                </div>
                                <div class="flex-1">
                                    <p class="text-[10px] uppercase text-gray-400 font-bold mb-0.5">Concluidas</p>
                                    <h3 class="text-xl font-bold text-gray-800"
                                        th:text="${kpisAudiencias[T(com.juridico.sistema_juridico.Entity.enums.EstatusAudiencia).CONCLUIDA]}">
                                        0</h3>
                                </div>
                            </div>
                        </div>

                        <!-- Contenedor de Listado -->
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-100">
                            <div
                                class="p-6 border-b border-gray-50 flex flex-col lg:flex-row lg:items-center justify-start gap-4 lg:gap-8">
                                <h2 class="text-gray-400 font-bold uppercase tracking-tighter text-[10px] leading-none flex flex-col">
                                    <span>Listado de</span>
                                    <span class="text-xl text-gray-800 font-black">Audiencias</span>
                                </h2>
                                <div th:replace="~{fragments/audiencias/barra-busqueda :: barra}" class="flex-1"></div>
                            </div>
                            <div class="p-6 pt-0">
                                <div class="mt-0">
                                    <div th:replace="~{fragments/audiencias/tabla :: tabla}"></div>
                                </div>
                            </div>
                        </div>
                    </div> <!-- /grid-maestro -->

            </div>
        </main>
    </div>

    <div th:replace="~{fragments/audiencias/modals :: modals}"></div>
    <form id="form-subir-acta" th:action="@{/audiencias/subir-acta}" method="post" enctype="multipart/form-data"
        class="hidden">
        <input type="hidden" name="id" id="input-acta-id">
        <input type="file" name="archivo" id="input-acta-file">
    </form>

    <script th:src="@{/js/audiencias.js(v=4)}"></script>
    <script th:src="@{/js/realtime-search.js}"></script>

    <div th:replace="~{fragments/common/notifications :: notificaciones}"></div>
    <!-- Estado del Mini-Calendario para JS -->
    <input type="hidden" id="hdnMesActual" th:value="${mesActual}">
    <input type="hidden" id="hdnAnioActual" th:value="${anioActual}">
</body>

</html>
