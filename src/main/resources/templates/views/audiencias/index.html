<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>Gestión de Audiencias - Agenda Legal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/js/tailwind.config.js}"></script>
    <script th:src="@{/lib/sweetalert2.all.min.js}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" th:href="@{/css/calendario.css}">
</head>

<body class="bg-gray-100 text-gray-800 font-sans overflow-x-hidden">

    <!-- Sidebar Fragment -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="sm:ml-64 flex flex-col min-h-screen">

        <!-- Navbar Fragment -->
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <!-- Main Content with padding to avoid overlapping -->
        <main class="p-4 md:p-6 flex-1 animate-fade-in" style="padding-top: 100px !important;">



            <div class="grid grid-cols-12 gap-8">
                <!-- Columna Izquierda: Mini-Calendario y Accesos Rápidos -->
                <aside class="col-span-12 lg:col-span-3 space-y-6">
                    <div th:replace="~{fragments/audiencias/mini-calendar :: mini-calendar}"></div>

                    <!-- Tarjeta de Filtros -->
                    <div
                        class="bg-gob-guinda text-white p-6 rounded-2xl shadow-lg shadow-gob-guinda/10 relative overflow-hidden flex flex-col gap-6">

                        <!-- SECCIÓN DE FILTROS -->
                        <div class="relative z-10">
                            <div th:replace="~{fragments/audiencias/barra-filtros :: filtros}"></div>
                        </div>

                        <i class="fas fa-gavel absolute -right-4 -bottom-4 text-white/10 text-7xl rotate-12"></i>
                    </div>
                </aside>

                    <!-- SECCIÓN DINÁMICA: KPIs + Listado -->
                    <div id="grid-maestro-audiencias" th:fragment="gridMaestro" class="col-span-12 lg:col-span-9 space-y-6">
                        
                        <!-- Tarjetas de KPIs Compactas -->
                        <div id="contenedor-kpis-audiencias" class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-50 flex items-center gap-4">
                                <div
                                    class="w-10 h-10 rounded-xl bg-red-50 flex items-center justify-center text-gob-guinda">
                                    <i class="fas fa-list-ul"></i>
                                </div>
                                <div>
                                    <p class="text-[10px] uppercase text-gray-400 font-bold mb-0.5">Total</p>
                                    <h3 class="text-xl font-bold text-gray-800" th:text="${totalAudiencias}">0</h3>
                                </div>
                            </div>
                            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-50 flex items-center gap-4">
                                <div
                                    class="w-10 h-10 rounded-xl bg-orange-50 flex items-center justify-center text-gob-oro">
                                    <i class="fas fa-clock"></i>
                                </div>
                                <div>
                                    <p class="text-[10px] uppercase text-gray-400 font-bold mb-0.5">Pendientes</p>
                                    <h3 class="text-xl font-bold text-gray-800"
                                        th:text="${kpisAudiencias[T(com.juridico.sistema_juridico.Entity.enums.EstatusAudiencia).PENDIENTE]}">
                                        0</h3>
                                </div>
                            </div>
                            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-50 flex items-center gap-4">
                                <div class="w-10 h-10 rounded-xl bg-blue-50 flex items-center justify-center text-blue-500">
                                    <i class="fas fa-file-contract"></i>
                                </div>
                                <div>
                                    <p class="text-[10px] uppercase text-gray-400 font-bold mb-0.5">Con Acta</p>
                                    <h3 class="text-xl font-bold text-gray-800"
                                        th:text="${kpisAudiencias[T(com.juridico.sistema_juridico.Entity.enums.EstatusAudiencia).CON_ACTA]}">
                                        0</h3>
                                </div>
                            </div>
                            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-50 flex items-center gap-4">
                                <div
                                    class="w-10 h-10 rounded-xl bg-green-50 flex items-center justify-center text-green-600">
                                    <i class="fas fa-check-double"></i>
                                </div>
                                <div>
                                    <p class="text-[10px] uppercase text-gray-400 font-bold mb-0.5">Concluidas</p>
                                    <h3 class="text-xl font-bold text-gray-800"
                                        th:text="${kpisAudiencias[T(com.juridico.sistema_juridico.Entity.enums.EstatusAudiencia).CONCLUIDA]}">
                                        0</h3>
                                </div>
                            </div>
                        </div>

                        <!-- Contenedor de Listado -->
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                            <div
                                class="p-6 border-b border-gray-50 flex flex-col md:flex-row md:items-center justify-between gap-4">
                                <h2 class="text-lg font-bold text-gray-800">Listado de Audiencias</h2>
                                <div th:replace="~{fragments/audiencias/barra-busqueda :: barra}"></div>
                            </div>
                            <div class="p-6 pt-0">
                                <div class="mt-0">
                                    <div th:replace="~{fragments/audiencias/tabla :: tabla}"></div>
                                </div>
                            </div>
                        </div>
                    </div> <!-- /grid-maestro -->

            </div>
        </main>
    </div>

    <div th:replace="~{fragments/audiencias/modals :: modals}"></div>
    <form id="form-subir-acta" th:action="@{/audiencias/subir-acta}" method="post" enctype="multipart/form-data"
        class="hidden">
        <input type="hidden" name="id" id="input-acta-id">
        <input type="file" name="archivo" id="input-acta-file"
            onchange="document.getElementById('form-subir-acta').submit()">
    </form>

    <script th:src="@{/js/audiencias.js(v=4)}"></script>
    <script th:src="@{/js/realtime-search.js}"></script>

    <div th:replace="~{fragments/common/notifications :: notificaciones}"></div>
    <!-- Estado del Mini-Calendario para JS -->
    <input type="hidden" id="hdnMesActual" th:value="${mesActual}">
    <input type="hidden" id="hdnAnioActual" th:value="${anioActual}">
</body>

</html>
