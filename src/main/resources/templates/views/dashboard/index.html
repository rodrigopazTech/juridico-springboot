<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Dashboard - Sistema Jurídico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/js/tailwind.config.js}"></script>
    <script th:src="@{/lib/sweetalert2.all.min.js}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <script th:src="@{/lib/chart.umd.min.js}"></script>
    <style> .chart-container { position: relative; height: 20rem; } </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="p-4 sm:ml-64">
    <div class="flex flex-col md:flex-row md:items-center justify-between mb-6">
        <div>
            <h1 class="text-3xl font-bold text-gob-guinda">
                <i class="fas fa-chart-line text-gob-oro mr-2"></i> Dashboard
            </h1>
            <p class="text-sm text-gray-500">Resumen general del sistema</p>
            <hr class="h-1 w-20 bg-gob-oro border-0 mt-2"/>
        </div>

        <div class="mt-4 md:mt-0 flex items-center bg-white p-2 rounded shadow border border-gray-200">
            <label for="filtroGerencia" class="mr-2 text-sm font-semibold text-gray-600">Filtrar por Gerencia:</label>
            <select id="filtroGerencia" class="border-gray-300 rounded text-sm p-1 focus:ring-gob-guinda focus:border-gob-guinda">
                <option value="">Todas las Gerencias</option>
                <option th:each="g : ${gerencias}" 
                        th:value="${g.id}" 
                        th:text="${g.nombre}"
                        th:selected="${g.id == gerenciaSeleccionada}"></option>
            </select>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8" id="kpiContainer">
        <div class="bg-white p-5 rounded shadow border-l-4 border-gob-guinda">
            <p class="text-xs uppercase text-gray-500">Total Expedientes</p>
            <h3 class="text-3xl font-bold" id="kpiTotalExp" th:text="${kpis.totalExpedientes}">0</h3>
        </div>
        <div class="bg-white p-5 rounded shadow border-l-4 border-blue-500">
            <p class="text-xs uppercase text-gray-500">En Trámite</p>
            <h3 class="text-3xl font-bold" id="kpiActivos" th:text="${kpis.expedientesActivos}">0</h3>
        </div>
        <div class="bg-white p-5 rounded shadow border-l-4 border-gob-oro">
            <p class="text-xs uppercase text-gray-500">Audiencias</p>
            <h3 class="text-3xl font-bold" id="kpiAudiencias" th:text="${kpis.audienciasProgramadas}">0</h3>
        </div>
        <div class="bg-white p-5 rounded shadow border-l-4 border-green-600">
            <p class="text-xs uppercase text-gray-500">Términos</p>
            <h3 class="text-3xl font-bold" id="kpiTerminos" th:text="${kpis.terminosActivos}">0</h3>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
        <div class="bg-white p-6 rounded shadow">
            <h3 class="font-bold mb-4">Estatus de Expedientes</h3>
            <div class="chart-container"><canvas id="chartEstatusExpedientes"></canvas></div>
        </div>
        <div class="bg-white p-6 rounded shadow">
            <h3 class="font-bold mb-4">Carga de Trabajo por Usuario</h3>
            <div class="chart-container"><canvas id="chartCargaTrabajoUsuarios"></canvas></div>
        </div>
        <div class="bg-white p-6 rounded shadow">
            <h3 class="font-bold mb-4">Distribución por Gerencia</h3>
            <div class="chart-container"><canvas id="chartDistribucionGerencias"></canvas></div>
        </div>
        <div class="bg-white p-6 rounded shadow">
            <h3 class="font-bold mb-4">Trabajo Completado (Tendencia Mensual)</h3>
            <div class="chart-container"><canvas id="chartTrabajoCompletado"></canvas></div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    window.dashboardData = /*[[${dashboardData}]]*/ {};
    /*]]>*/
</script>
<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
