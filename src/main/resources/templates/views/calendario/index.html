<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="stylesheet" th:href="@{/css/transitions.css}" />
    <link rel="manifest" th:href="@{/manifest.json}" />
    <link rel="icon" th:href="@{/favicon.ico}" sizes="any" />
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
    <link rel="apple-touch-icon" th:href="@{/img/apple-touch-icon.png}" />
    <meta name="theme-color" content="#691228" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendario Jurídico | Sistema Legal</title>

    <!-- Tailwind CSS CDN -->
    <link rel="stylesheet" th:href="@{/css/output.css}" />

    <!-- Estilos específicos del calendario -->
    <link th:href="@{/css/calendario.css}" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script th:src="@{/lib/sweetalert2.all.min.js}"></script>
    <link rel="stylesheet" th:href="@{/lib/driver.css}">
    <link rel="stylesheet" th:href="@{/css/tours-onboarding.css}">
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Noto+Sans:wght@400;600&display=swap"
        rel="stylesheet" />

    <style>
        .calendar-view.hidden {
            display: none;
        }
    </style>
</head>

<body class="bg-gray-50 font-sans text-gob-gris">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="calendar-page-shell p-3 sm:p-4 sm:ml-64 pt-[116px] sm:pt-[116px] md:pt-[116px] lg:pt-[116px]">

        <div th:replace="~{fragments/calendario/calendar-header :: header}"></div>

        <div id="calendarContainer"
            class="bg-white rounded-xl shadow-md border border-gray-200 overflow-hidden">

            <div id="calendarDayView" class="calendar-view hidden h-full">
                <div th:replace="~{fragments/calendario/calendar-day-view :: dayView}"></div>
            </div>

            <div id="calendarWeekView" class="calendar-view hidden h-full">
                <div th:replace="~{fragments/calendario/calendar-week-view :: weekView}"></div>
            </div>

            <div id="calendarMonthView" class="calendar-view h-full">
                <div th:replace="~{fragments/calendario/calendar-month-view :: monthView}"></div>
            </div>

        </div>
    </div>

    <div th:replace="~{fragments/calendario/event-detail-modal :: detailModal}"></div>
    <div th:replace="~{fragments/common/notifications :: notificaciones}"></div>

    <script th:src="@{/lib/driver.js}"></script>
    <script th:src="@{/js/tours/tour-calendario.js}"></script>

    <script type="module">
        // Agrega el parámetro de versión para evitar caché vieja
        import { CalendarioModule } from '/js/calendario-module.js?v=1.0';

        document.addEventListener('DOMContentLoaded', () => {
            window.calendarioModule = new CalendarioModule();
            window.calendarioModule.init();
        });
    </script>
</body>

</html>
