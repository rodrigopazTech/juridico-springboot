<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/transitions.css}" />
    <link rel="manifest" th:href="@{/manifest.json}" />
    <link rel="icon" th:href="@{/favicon.ico}" sizes="any" />
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
    <link rel="apple-touch-icon" th:href="@{/img/apple-touch-icon.png}" />
    <meta name="theme-color" content="#691228" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usuarios | Sistema Jurídico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/js/tailwind.config.js}"></script>
    <script th:src="@{/lib/sweetalert2.all.min.js}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
    <style>
        .thin-scrollbar::-webkit-scrollbar { width: 4px; }
        .thin-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .thin-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans h-screen overflow-hidden">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="p-4 sm:p-6 sm:ml-64 pt-[116px] sm:pt-[116px] md:pt-[116px] lg:pt-[116px] h-full flex flex-col">
       <div class="flex flex-col lg:flex-row gap-6 flex-1 min-h-0 overflow-hidden">

            <div th:replace="~{fragments/usuarios/lista :: lista}"></div>

            <div th:replace="~{fragments/usuarios/detalle :: detalle}"></div>

        </div>
    </div>

    <div id="modal-confirmar-generico"
         class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/50 px-4"
         role="dialog" aria-modal="true" aria-labelledby="modal-confirmar-titulo">
        <div id="modal-confirmar-border"
             class="relative w-full max-w-sm rounded-lg border-t-4 border-amber-500 bg-white shadow-2xl">
            <div class="p-6 text-center">
                <div id="modal-confirmar-icon-bg"
                     class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-amber-100">
                    <i id="modal-confirmar-icon" class="fas fa-exclamation-triangle text-2xl text-amber-600"></i>
                </div>
                <h3 id="modal-confirmar-titulo" class="mb-2 text-lg font-bold text-gray-900">Confirmar accion</h3>
                <p id="modal-confirmar-texto" class="mb-4 text-sm text-gray-600"></p>
                <div id="modal-confirmar-advertencia-box"
                     class="mb-5 hidden rounded border border-amber-200 bg-amber-50 p-3 text-left">
                    <p id="modal-confirmar-advertencia" class="text-xs text-amber-900"></p>
                </div>
                <div class="flex gap-3">
                    <button type="button" onclick="cerrarModalConfirmarGenerico()"
                            class="flex-1 rounded border border-gray-300 px-4 py-2 text-sm font-bold text-gray-700 hover:bg-gray-50">
                        Cancelar
                    </button>
                    <button type="button" onclick="ejecutarAccionConfirmada()" id="btn-modal-confirmar-accion"
                            class="flex-1 rounded bg-gob-guinda px-4 py-2 text-sm font-bold text-white shadow-md hover:bg-opacity-95">
                        Aceptar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
    <script th:inline="javascript">
        window.emailMaintenance = /*[[${emailMaintenance}]]*/ false;
        window.emailMaintenanceMessage = /*[[${emailMaintenanceMessage}]]*/ 'El servicio de correo esta en mantenimiento.';
        window.usuarioActual = {
            rol: /*[[${usuarioActual.rol.name()}]]*/ '',
            gerenciaId: /*[[${usuarioActual.gerencia != null ? usuarioActual.gerencia.id : null}]]*/ null
        };
    </script>
    <script th:src="@{/js/custom-selects.js}"></script>
    <script th:src="@{/js/email-submit-loading.js}"></script>
    <script th:src="@{/js/usuarios.js}"></script>
    <div th:replace="~{fragments/common/notifications :: notificaciones}"></div>
</body>
</html>
