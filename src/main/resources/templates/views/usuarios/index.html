<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="manifest" th:href="@{/manifest.json}" />
    <meta name="theme-color" content="#691228" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Usuarios - Sistema Legal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/js/tailwind.config.js}"></script>
    <script th:src="@{/lib/sweetalert2.all.min.js}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" th:href="@{/css/agenda-general.css}">
</head>

<body class="bg-gray-100 text-gray-800 font-sans">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="p-4 sm:ml-64 pt-[116px] sm:pt-[116px] md:pt-[116px] lg:pt-[116px]">

        <div class="mb-4 flex justify-end">
            <a href="/usuarios/permisos"
                class="inline-flex items-center gap-2 rounded-xl bg-gob-guinda px-4 py-3 text-sm font-bold text-white shadow-md transition-colors hover:bg-gob-guindaDark">
                <i class="fas fa-user-shield"></i> Panel de Permisos
            </a>
        </div>

        <div class="bg-white rounded-lg shadow-sm border border-gray-200 mb-6">
            <div class="flex overflow-x-auto px-6">
                <button onclick="cambiarTab('usuarios')" id="btn-tab-usuarios"
                    class="tab-btn active flex items-center gap-2 py-3 px-4 border-b-2 border-gob-guinda text-gob-guinda font-bold">
                    <i class="fas fa-user"></i> Usuarios
                </button>
                <button onclick="cambiarTab('gerencias')" id="btn-tab-gerencias"
                    class="tab-btn flex items-center gap-2 py-3 px-4 border-b-2 border-transparent text-gray-500 hover:text-gob-gris">
                    <i class="fas fa-building"></i> Gerencias
                </button>
                <button onclick="cambiarTab('organos')" id="btn-tab-organos"
                    class="tab-btn flex items-center gap-2 py-3 px-4 border-b-2 border-transparent text-gray-500 hover:text-gob-gris">
                    <i class="fas fa-gavel"></i> Órganos
                </button>
                <button onclick="cambiarTab('tipos-audiencia')" id="btn-tab-tipos-audiencia"
                    class="tab-btn flex items-center gap-2 py-3 px-4 border-b-2 border-transparent text-gray-500 hover:text-gob-gris">
                    <i class="fas fa-calendar-alt"></i> Tipos Audiencia
                </button>
            </div>
        </div>

        <div id="tab-usuarios" class="tab-content block">
            <div th:replace="~{fragments/usuarios/tabla-usuarios :: tabla}"></div>
        </div>

        <div id="tab-gerencias" class="tab-content hidden">
            <div th:replace="~{fragments/usuarios/tabla-gerencias :: tabla}"></div>
        </div>

        <div id="tab-organos" class="tab-content hidden">
            <div th:replace="~{fragments/usuarios/tabla-organos :: tabla}"></div>
        </div>

        <div id="tab-tipos-audiencia" class="tab-content hidden">
            <div th:replace="~{fragments/usuarios/tabla-tipos-audiencia :: tabla}"></div>
        </div>

    </div>
    <div th:replace="~{fragments/usuarios/modal-usuario :: modal}"></div>
    <div th:replace="~{fragments/usuarios/modal-gerencia :: modal}"></div>
    <div th:replace="~{fragments/usuarios/modal-materias :: modal}"></div>
    <div th:replace="~{fragments/usuarios/modal-organo :: modal}"></div>
    <div th:replace="~{fragments/usuarios/modal-tipo-audiencia :: modal}"></div>

    <!-- MODAL CONFIRMACIÓN GENÉRICO PARA USUARIOS -->
    <div id="modal-confirmar-generico"
        class="fixed inset-0 z-[70] hidden items-center justify-center bg-gray-900/50 backdrop-blur-sm p-4">
        <div id="modal-confirmar-border" class="relative w-full max-w-sm bg-white rounded-lg shadow-2xl border-t-4 border-red-600">
            <div class="p-6 text-center">
                <div id="modal-confirmar-icon-bg" class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i id="modal-confirmar-icon" class="fas fa-exclamation-triangle text-red-600 text-2xl"></i>
                </div>
                <h3 id="modal-confirmar-titulo" class="text-lg font-bold text-gray-900 mb-2">¿Confirmar acción?</h3>
                <p id="modal-confirmar-texto" class="text-sm text-gray-600 mb-4">¿Desea continuar con esta operación?</p>
                <div id="modal-confirmar-advertencia-box" class="text-xs text-red-600 bg-red-50 rounded p-2 hidden">
                    <i class="fas fa-warning mr-1"></i><span id="modal-confirmar-advertencia"></span>
                </div>
            </div>
            <div class="flex gap-3 p-4 border-t">
                <button onclick="cerrarModalConfirmarGenerico()"
                    class="flex-1 px-4 py-2 text-sm font-medium text-gray-600 bg-white border border-gray-300 rounded hover:bg-gray-100">
                    Cancelar
                </button>
                <button onclick="ejecutarAccionConfirmada()" id="btn-modal-confirmar-accion"
                    class="flex-1 px-4 py-2 text-sm font-bold text-white bg-red-600 rounded hover:bg-red-700 shadow-md">
                    Confirmar
                </button>
            </div>
        </div>
    </div>

    <script th:src="@{/js/usuarios.js}"></script>
    <script th:src="@{/js/realtime-search.js}"></script>

    <div th:replace="~{fragments/common/notifications :: notificaciones}"></div>
</body>

</html>
