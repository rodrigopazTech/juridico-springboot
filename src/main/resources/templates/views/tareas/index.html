<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Mis Tareas | Sistema Jurídico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/js/tailwind.config.js}"></script>
    <script th:src="@{/lib/sweetalert2.all.min.js}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="p-6 sm:ml-64 pt-24">
        
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-4xl font-extrabold text-gob-guinda font-headings">Mis Tareas</h1>
                <p class="text-gray-500 mt-1">Gestiona tus actividades y recordatorios personales.</p>
            </div>
            <button onclick="abrirModalRecordatorio()" 
                    class="bg-gob-guinda text-white px-6 py-3 rounded-full font-bold shadow-lg hover:bg-gob-guinda-dark transition-all transform hover:scale-105 flex items-center gap-2">
                <i class="fas fa-plus-circle"></i> Nueva tarea
            </button>
        </div>

        <div class="mb-12">
            <h2 class="text-lg font-bold text-gray-700 mb-4 flex items-center gap-2 uppercase tracking-wider">
                <i class="fas fa-clock text-gob-oro"></i> Recordatorios Próximos
            </h2>
            <div th:replace="~{fragments/tareas/grid-recordatorios :: grid}"></div>
        </div>

        <div>
            <h2 class="text-lg font-bold text-gray-700 mb-4 flex items-center gap-2 uppercase tracking-wider">
                <i class="fas fa-list-check text-gob-oro"></i> Todas las Tareas
            </h2>
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <div th:replace="~{fragments/tareas/lista-tareas-completa :: lista}"></div>
            </div>
        </div>

    </div>

    <div th:replace="~{fragments/tareas/modal-recordatorio :: modal}"></div>

    <script>
        function abrirModalRecordatorio() { document.getElementById('modal-recordatorio').classList.remove('hidden'); }
        function cerrarModalRecordatorio() { document.getElementById('modal-recordatorio').classList.add('hidden'); }
    </script>
</body>
</html>
