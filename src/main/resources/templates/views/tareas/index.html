<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="stylesheet" th:href="@{/css/transitions.css}" />
    <link rel="manifest" th:href="@{/manifest.json}" />
    <link rel="icon" th:href="@{/favicon.ico}" sizes="any" />
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
    <link rel="apple-touch-icon" th:href="@{/img/apple-touch-icon.png}" />
    <meta name="theme-color" content="#691228" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis Tareas | Sistema Jurídico</title>
    <link rel="stylesheet" th:href="@{/css/output.css}" />
    <script th:src="@{/lib/sweetalert2.all.min.js}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body class="bg-gray-50 text-gray-800 font-sans overflow-x-hidden">

    <!-- Sidebar Fragment -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="sm:ml-64 flex flex-col min-h-screen">

        <!-- Navbar Fragment -->
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <!-- Main Content with padding to avoid overlapping -->
        <!-- Main Content with padding to avoid overlapping -->
        <main class="p-4 md:p-6 flex-1 animate-fade-in pt-[116px] sm:pt-[116px] md:pt-[116px] lg:pt-[116px]">
            <div class="flex justify-between items-center mb-8">
                <h1 class="text-4xl font-extrabold text-gob-guinda font-headings">Mis Tareas</h1>
                <button onclick="abrirModalTarea()"
                    class="bg-gob-guinda text-white px-5 py-2.5 rounded-full font-bold shadow-lg hover:bg-gob-guindaDark transition-all flex items-center gap-2">
                    <i class="fas fa-plus-circle"></i> Nueva tarea
                </button>
            </div>

            <section class="mb-8 overflow-hidden rounded-2xl border border-gob-oro/25 bg-white shadow-sm" aria-labelledby="como-funcionan-recordatorios">
                <div class="flex flex-col gap-4 p-5 md:flex-row md:items-center md:justify-between">
                    <div class="flex items-start gap-4">
                        <div class="flex h-11 w-11 flex-shrink-0 items-center justify-center rounded-xl bg-gob-guinda text-white shadow-md">
                            <i class="fas fa-bell"></i>
                        </div>
                        <div>
                            <h2 id="como-funcionan-recordatorios" class="font-headings text-base font-extrabold text-gray-800">¿Cuándo recibiré el aviso?</h2>
                            <p class="mt-1 max-w-3xl text-sm leading-relaxed text-gray-600">
                                Recibirás un solo aviso,
                                <strong th:text="${minutosAnticipacion + ' minutos antes'}">15 minutos antes</strong>
                                de la hora programada. La prioridad solo cambia el color del aviso.
                            </p>
                        </div>
                    </div>
                    <a th:href="@{/perfil(tab='notif')}"
                       class="inline-flex flex-shrink-0 items-center justify-center gap-2 rounded-xl border border-gob-guinda/20 px-4 py-2.5 text-xs font-bold text-gob-guinda transition hover:bg-gob-guinda hover:text-white">
                        <i class="fas fa-sliders-h"></i> Preferencias de notificación
                    </a>
                </div>
            </section>

            <div>
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-gray-700 flex items-center gap-2 uppercase tracking-wider">
                        <i class="fas fa-check-double text-gob-oro"></i> Pendientes de Trabajo
                    </h2>
                    <div class="flex gap-2 bg-gray-100 p-1 rounded-lg text-xs font-bold text-gray-500">
                        <button onclick="filtrarTareas('todas', this)"
                            class="filtro-btn px-3 py-1 bg-white rounded shadow-sm text-gob-guinda transition-colors">Todas</button>
                        <button onclick="filtrarTareas('pendiente', this)"
                            class="filtro-btn px-3 py-1 hover:text-gob-guinda transition-colors">Pendientes</button>
                        <button onclick="filtrarTareas('completada', this)"
                            class="filtro-btn px-3 py-1 hover:text-gob-guinda transition-colors">Completadas</button>
                    </div>
                </div>

                <div th:replace="~{fragments/tareas/lista-tareas-completa :: lista}"></div>
            </div>
        </main>
    </div>
    <script th:src="@{/js/tareas.js}"></script>
    <div th:replace="~{fragments/tareas/modal-recordatorio :: modal}"></div>

    <div th:replace="~{fragments/common/notifications :: notificaciones}"></div>
</body>

</html>
