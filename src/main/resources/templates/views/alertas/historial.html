<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Centro de Notificaciones | Sistema Jurídico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/js/tailwind.config.js}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body class="bg-gray-50 text-gray-800 font-sans">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="p-4 sm:p-6 sm:ml-64 pt-[116px] sm:pt-[116px] md:pt-[116px] lg:pt-[116px]">

        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div>
                <h1 class="text-2xl sm:text-4xl font-extrabold text-gob-guinda font-headings" 
                    th:text="${esPapelera ? 'Notificaciones ya leídas' : 'Notificaciones'}">Notificaciones</h1>
                <p class="text-gray-500 mt-1 text-sm sm:text-base" 
                   th:text="${esPapelera ? 'Notificaciones que pueden ser eliminadas o restauradas.' : 'Avisos automáticos sobre expedientes, términos y audiencias.'}">
                    Avisos automáticos sobre expedientes, términos y audiencias.
                </p>
            </div>

            <!-- Botones de navegación / Acción -->
            <div class="flex flex-wrap items-center gap-2 bg-white p-1.5 rounded-xl shadow-sm border border-gray-100">
                <a th:href="@{/notificaciones}" 
                   class="px-3 sm:px-5 py-2 sm:py-2.5 rounded-lg text-xs sm:text-sm font-bold transition-all flex items-center gap-2"
                   th:classappend="${!esPapelera ? 'bg-gob-guinda text-white shadow-md' : 'text-gray-500 hover:bg-gray-50'}">
                   <i class="fas fa-inbox"></i> Recientes </a>
                <a th:href="@{/notificaciones/papelera}" 
                   class="px-3 sm:px-5 py-2 sm:py-2.5 rounded-lg text-xs sm:text-sm font-bold transition-all flex items-center gap-2"
                   th:classappend="${esPapelera ? 'bg-gob-guinda text-white shadow-md' : 'text-gray-500 hover:bg-gray-50'}">
                   <i class="fas fa-eye"></i> Vistos</a>

                <div th:if="${esPapelera and !notificaciones.empty}" class="ml-2 sm:ml-4 pl-2 sm:pl-4 border-l border-gray-100">
                    <a th:href="@{/notificaciones/vaciar}" 
                       onclick="return confirm('¿Estás seguro de que deseas vaciar la papelera? Esta acción no se puede deshacer.')"
                       class="px-3 sm:px-5 py-2 sm:py-2.5 bg-red-50 text-red-600 rounded-lg text-xs sm:text-sm font-bold hover:bg-red-600 hover:text-white transition-all flex items-center gap-2">
                        <i class="fas fa-broom"></i> <span class="hidden sm:inline">Vaciar</span> Papelera
                    </a>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead
                        class="bg-gray-50 text-white text-xs font-bold uppercase tracking-widest border-b border-gray-100">
                        <tr class="bg-gob-guinda  rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                            <th class="px-6 py-4">Evento</th>
                            <th class="px-6 py-4">Tipo</th>
                            <th class="px-6 py-4">Detalles</th>
                            <th class="px-6 py-4 text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-50">
                        <tr th:if="${notificaciones.empty}">
                            <td colspan="4" class="px-6 py-12 text-center text-gray-400">
                                <i class="fas text-4xl mb-3 block opacity-20"
                                   th:classappend="${esPapelera ? 'fa-trash-restore' : 'fa-bell-slash'}"></i>
                                <p class="font-bold" th:text="${esPapelera ? 'Tu papelera está vacía.' : 'No hay notificaciones nuevas.'}"></p>
                            </td>
                        </tr>

                        <tr th:each="n : ${notificaciones.content}" 
                            class="transition-all duration-300 group border-l-4"
                            th:classappend="${!n.leida ? 'bg-gob-verde border-gob-oro hover:bg-gob-verde/80' : 'bg-white border-transparent hover:bg-gob-oro/50 hover:border-gray-200'}">

                            <td class="px-6 py-5 whitespace-nowrap">
                                <div class="text-sm font-bold"
                                    th:classappend="${!n.leida ? 'text-yellow-50' : 'text-gray-900'}"
                                    th:text="${#temporals.format(n.createdAt, 'dd MMM, yyyy')}">Fecha</div>
                                <div class="flex items-center gap-1">
                                    <span class="text-xs" 
                                          th:classappend="${!n.leida ? 'text-yellow-100/70' : 'text-gray-500'}"
                                          th:text="${#temporals.format(n.createdAt, 'HH:mm')}">Hora</span>


                                    <!-- Icono Visto tipo WhatsApp
                                    <i th:if="${n.leida}" class="fas fa-check-double text-blue-500 text-[10px]" title="Leída"></i>
                                    <i th:if="${!n.leida}" class="fas fa-check text-gray-300 text-[10px]" title="Entregada"></i> -->
                                                                    
                                    
                                    <!-- Etiqueta de Leída Azul Eléctrico -->
                                    <span th:if="${n.leida}"
                                        class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[10px] font-extrabold border bg-orange-50 text-orangee-600 border-orange-500">
                                        <i class="fas fa-check-double"></i> LEÍDA
                                    </span> <!--ORIGINAL class="fas fa-eye"> -->
                                
                                </div>
                            </td>

                            <td class="px-6 py-5 whitespace-nowrap">
                                <div class="flex flex-col gap-2">
                                    <span
                                        class="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg text-[12px] font-extrabold border"
                                        th:classappend="${n.tipo == 'AUDIENCIA' ? 'bg-blue-50 text-blue-700 border-blue-100' :
                                       (n.tipo == 'TERMINO' ? 'bg-red-50 text-red-700 border-red-100' : 'bg-gob-oro/15 text-gob-oro border-gob-oro/50')}"> <!--ORIGINAL (n.tipo == 'TERMINO' ? 'bg-red-50 text-red-700 border-red-100' : 'bg-gob-oro/10 text-gob-oro border-gob-oro/20')}"-->
                                        <i class="fas"
                                            th:classappend="${n.tipo == 'AUDIENCIA' ? 'fa-gavel' : (n.tipo == 'TERMINO' ? 'fa-hourglass-end' : 'fa-info-circle')}"></i>
                                        <span th:text="${n.tipo}">TIPO</span>
                                    </span>

                                </div>
                            </td>

                            <td class="px-6 py-5 w-1/2">
                                <div class="max-w-md">
                                    <p class="text-sm font-bold" 
                                       th:classappend="${!n.leida ? 'text-yellow-50' : 'text-gray-800'}"
                                       th:text="${n.titulo}">Título de la Notificación</p>
                                    <p class="text-xs mt-0.5 line-clamp-2" 
                                       th:classappend="${!n.leida ? 'text-yellow-100/80' : 'text-gray-500'}"
                                       th:text="${n.mensaje}">Mensaje...</p>
                                </div>
                            </td>

                            <td class="px-6 py-5 text-right whitespace-nowrap">
                                <div class="flex justify-end gap-3 items-center">
                                    
                                    <!-- Acciones para Recientes -->
                                    <th:block th:if="${!esPapelera}">
                                        <a th:href="@{/notificaciones/leer/{id}(id=${n.id})}"
                                            class="flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-semibold border transition-all"
                                            th:classappend="${!n.leida ? 'border-yellow-400/30 text-yellow-400 hover:bg-white/10' : 'border-gob-guinda/20 text-gob-guinda hover:bg-gob-guinda/5'}"
                                            title="Ir al origen">
                                            <i class="fas fa-external-link-alt text-[10px]"></i>
                                            <span>Ver</span>
                                        </a>

                                        <!--BOTON PARA MARCAR COMO LEIDA UNA NOTIFICACION-->
                                        <a th:href="@{/notificaciones/archivar/{id}(id=${n.id})}"
                                            class="flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-semibold border transition-all"
                                            th:classappend="${!n.leida ? 'border-yellow-100/20 text-yellow-100 hover:bg-white/20' : 'border-gray-200 text-gray-600 hover:bg-red-50 hover:text-red-500 hover:border-red-200'}"
                                            title="Marcar como leída">
                                            <i class="fas fa-eye"></i>
                                            <span>Marcar como leída</span>
                                        </a> 
                                    </th:block>

                                    <!-- Acciones para Papelera -->
                                    <th:block th:if="${esPapelera}">
                                        <a th:href="@{/notificaciones/restaurar/{id}(id=${n.id})}"
                                            class="text-xs font-bold text-gob-oro hover:underline flex items-center gap-1"
                                            title="Restaurar a recientes">
                                            <i class="fas fa-undo"></i> Restaurar
                                        </a>

                                        <a th:href="@{/notificaciones/eliminar/{id}(id=${n.id})}"
                                            class="text-gray-300 hover:text-red-600 transition-colors p-2 rounded hover:bg-red-100"
                                            title="Eliminar permanentemente"
                                            onclick="return confirm('¿Eliminar esta notificación permanentemente?')">
                                            <i class="fas fa-times-circle"></i>
                                        </a>
                                    </th:block>

                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/common/notifications :: notificaciones}"></div>
</body>

</html>
