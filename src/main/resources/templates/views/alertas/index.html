<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Centro de Alertas - Sistema Legal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/js/tailwind.config.js}"></script>
    <script th:src="@{/lib/sweetalert2.all.min.js}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="stylesheet" th:href="@{/css/agenda-general.css}">
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="p-4 sm:ml-64">
        
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 mb-6">
            <div class="p-6 border-b border-gray-200 flex flex-col md:flex-row justify-between items-center gap-4">
                <div>
                    <h1 class="text-3xl font-bold text-gob-gris font-headings">
                        <i class="fas fa-bell text-gob-oro mr-2"></i> Centro de Alertas
                    </h1>
                    <p class="text-sm text-gray-500 mt-1">Gestiona tus avisos del sistema y recordatorios personales.</p>
                </div>
                
                <div class="flex gap-2">
                    <button onclick="abrirModalRecordatorio()" class="bg-gob-guinda text-white px-4 py-2 rounded-lg hover:bg-opacity-90 shadow-md transition-transform hover:scale-105">
                        <i class="fas fa-sticky-note mr-2"></i> Nuevo Recordatorio
                    </button>
                </div>
            </div>
            
            <div class="flex overflow-x-auto px-6">
                <button onclick="cambiarTab('notificaciones')" id="btn-tab-notificaciones" class="tab-btn active flex items-center gap-2 py-3 px-4 border-b-2 border-gob-guinda text-gob-guinda font-bold transition-colors">
                    <i class="fas fa-inbox"></i> Notificaciones
                    <span class="bg-red-100 text-red-800 text-xs font-medium px-2 py-0.5 rounded-full" th:text="${notificaciones.size()}">0</span>
                </button>
                <button onclick="cambiarTab('recordatorios')" id="btn-tab-recordatorios" class="tab-btn flex items-center gap-2 py-3 px-4 border-b-2 border-transparent text-gray-500 hover:text-gob-gris transition-colors">
                    <i class="fas fa-thumbtack"></i> Mis Recordatorios
                    <span class="bg-gray-100 text-gray-600 text-xs font-medium px-2 py-0.5 rounded-full" th:text="${recordatorios.size()}">0</span>
                </button>
            </div>
        </div>

        <div id="tab-notificaciones" class="tab-content block animate-fade-in-down">
            <div th:replace="~{fragments/alertas/lista-notificaciones :: lista}"></div>
        </div>

        <div id="tab-recordatorios" class="tab-content hidden animate-fade-in-down">
            <div th:replace="~{fragments/alertas/grid-recordatorios :: grid}"></div>
        </div>

    </div>

    <div th:replace="~{fragments/alertas/modal-recordatorio :: modal}"></div>

    <script th:src="@{/js/centro-alertas.js}"></script>

    <script th:if="${mensaje != null}">
        document.addEventListener("DOMContentLoaded", function () {
            Swal.fire({
                title: "[[${tipo == 'success' ? '¡Éxito!' : 'Error'}]]",
                text: "[[${mensaje}]]",
                icon: "[[${tipo}]]",
                confirmButtonColor: "#bc955c",
            });
        });
    </script>
</body>
</html>
