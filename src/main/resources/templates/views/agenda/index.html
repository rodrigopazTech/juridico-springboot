<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>Agenda General - Sistema Legal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/js/tailwind.config.js}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <link rel="stylesheet" th:href="@{/css/agenda-general.css}">

    <script th:src="@{/js/agenda.js}"></script>
</head>

<body class="bg-gray-100 text-gray-800 font-sans">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="p-4 sm:ml-64">

        <div class="bg-white rounded-lg shadow-sm border border-gray-200 mb-6">
            <div class="p-6 border-b border-gray-200">
                <h1 class="text-3xl font-bold text-gob-gris font-headings">
                    <i class="fas fa-calendar-check text-gob-oro mr-2"></i> Agenda General
                </h1>
                <p class="text-sm text-gray-500 mt-1">Histórico y seguimiento de actividades desahogadas y términos
                    presentados.</p>
            </div>

            <div class="flex overflow-x-auto px-6">
                <button onclick="window.cambiarTab('audiencias')" id="btn-tab-audiencias"
                    class="tab-btn flex items-center gap-2 whitespace-nowrap py-3 px-4 border-b-2 border-transparent text-gray-500 hover:text-gob-gris transition-colors"
                    th:classappend="${activeTab == 'audiencias' ? 'active' : ''}">
                    <i class="fas fa-gavel"></i>
                    <span>Audiencias Concluidas</span>
                </button>

                <button onclick="window.cambiarTab('terminos')" id="btn-tab-terminos"
                    class="tab-btn flex items-center gap-2 whitespace-nowrap py-3 px-4 border-b-2 border-transparent text-gray-500 hover:text-gob-gris transition-colors"
                    th:classappend="${activeTab == 'terminos' ? 'active' : ''}">
                    <i class="fas fa-clock"></i>
                    <span>Términos Concluidos</span>
                </button>
            </div>
        </div>

        <div>
            <div id="tab-audiencias" class="tab-content" th:classappend="${activeTab == 'audiencias' ? 'active' : ''}">
                <div th:replace="~{fragments/agenda/toolbar-audiencias :: toolbar}"></div>
                <div th:replace="~{fragments/agenda/table-audiencias :: tabla}"></div>
            </div>

            <div id="tab-terminos" class="tab-content" th:classappend="${activeTab == 'terminos' ? 'active' : ''}">
                <div th:replace="~{fragments/agenda/toolbar-terminos :: toolbar}"></div>
                <div th:replace="~{fragments/agenda/table-terminos :: tabla}"></div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/agenda/modal-observaciones :: modal-observaciones}"></div>

</body>

</html>
