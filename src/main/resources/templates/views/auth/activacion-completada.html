<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuenta activada | SIAJ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center px-6">
    <main class="w-full max-w-lg bg-white border border-gray-200 rounded-xl shadow-lg p-8 text-center">
        <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-green-100 text-green-700">
            <i class="fas fa-check-circle text-3xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-[#4e0c1d]">Cuenta activada correctamente</h1>
        <p class="mt-4 text-gray-700">Ya puedes acceder a SIAJ utilizando:</p>
        <p class="mt-2 font-bold text-gray-900">Usuario + Contraseña</p>
        <p class="mt-5 text-sm text-gray-600">Opcionalmente puedes vincular tu cuenta Microsoft para utilizar el acceso institucional.</p>
        <div class="mt-7 space-y-3">
            <a th:if="${microsoftConfigured}" th:href="@{/auth/microsoft/vincular-activacion}"
               class="flex w-full items-center justify-center gap-2 rounded-lg bg-[#691228] px-4 py-3 text-sm font-bold text-white hover:bg-[#4e0c1d]">
                <i class="fab fa-microsoft"></i> Vincular cuenta Microsoft
            </a>
            <a th:href="@{/}" class="flex w-full items-center justify-center rounded-lg border border-[#691228] px-4 py-3 text-sm font-bold text-[#691228] hover:bg-red-50">
                Continuar
            </a>
        </div>
    </main>
</body>
</html>
