<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="manifest" th:href="@{/manifest.json}" />
    <link rel="icon" th:href="@{/favicon.ico}" sizes="any" />
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
    <link rel="apple-touch-icon" th:href="@{/img/apple-touch-icon.png}" />
    <meta name="theme-color" content="#691228" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contrasena | Sistema Juridico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'gob-guinda': '#691228',
                        'gob-guindaDark': '#4e0c1d',
                        'gob-oro': '#D4C19C',
                        'gob-gris': '#545454',
                        'gob-fondo': '#F5F5F5'
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gob-fondo min-h-screen flex items-center justify-center px-6">
    <main class="w-full max-w-md bg-white border border-gray-200 rounded-lg shadow-lg p-8">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gob-guinda/10 mb-4">
                <i class="fas fa-key text-3xl text-gob-guinda"></i>
            </div>
            <h1 class="text-2xl font-bold text-gob-guindaDark">Crear nueva contrasena</h1>
            <p class="mt-2 text-sm text-gob-gris">Usa una contrasena segura para recuperar tu acceso.</p>
        </div>

        <div th:if="${error}" class="mb-4 p-4 text-sm text-red-800 border-l-4 border-red-700 bg-red-50 rounded">
            <span th:text="${error}">Error.</span>
        </div>

        <div th:if="${!tokenValido}" class="space-y-5 text-center">
            <div class="p-4 text-sm text-red-800 border-l-4 border-red-700 bg-red-50 rounded text-left">
                Este enlace ya no es válido. Solicita uno nuevo para restablecer tu contraseña.
            </div>
            <a th:href="@{/auth/solicitar-reset}"
                class="inline-flex justify-center items-center gap-2 py-3 px-4 rounded-lg text-sm font-bold text-white bg-gob-guinda hover:bg-gob-guindaDark">
                <i class="fas fa-paper-plane"></i>
                Solicitar otro enlace
            </a>
        </div>

        <form th:if="${tokenValido}" th:action="@{/auth/reset-password}" method="POST" class="space-y-5">
            <input type="hidden" name="token" th:value="${token}">

            <div>
                <label for="nuevaContrasena" class="block text-xs font-bold text-gray-500 uppercase mb-1">Nueva contrasena</label>
                <input id="nuevaContrasena" name="nuevaContrasena" type="password" required minlength="8"
                    class="block w-full px-3 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gob-guinda">
            </div>

            <div>
                <label for="confirmacionContrasena" class="block text-xs font-bold text-gray-500 uppercase mb-1">Confirmar contrasena</label>
                <input id="confirmacionContrasena" name="confirmacionContrasena" type="password" required minlength="8"
                    class="block w-full px-3 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gob-guinda">
            </div>

            <div id="password-policy-reset"></div>

            <button id="btnSubmitResetPassword" type="submit"
                class="w-full flex justify-center items-center gap-2 py-3 px-4 rounded-lg text-sm font-bold text-white bg-gob-guinda hover:bg-gob-guindaDark">
                <i class="fas fa-save"></i>
                Actualizar contrasena
            </button>
        </form>
    </main>
    <script th:src="@{/js/password-policy-validator.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            attachPasswordPolicyValidator({
                passwordInputId: 'nuevaContrasena',
                confirmInputId: 'confirmacionContrasena',
                submitButtonId: 'btnSubmitResetPassword',
                containerId: 'password-policy-reset'
            });
        });
    </script>
</body>

</html>
