<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Sistema Jurídico</title>
    
    <link th:href="@{/css/output.css}" rel="stylesheet" />
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center font-sans">

    <div class="max-w-md w-full bg-white rounded-lg shadow-xl overflow-hidden border-t-4 border-gob-guinda">
        
        <div class="p-8 text-center border-b border-gray-100">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gob-guinda/10 mb-4">
                <i class="fas fa-balance-scale text-3xl text-gob-guinda"></i>
            </div>
            <h1 class="text-2xl font-bold text-gob-gris font-headings">Sistema Jurídico</h1>
            <p class="text-sm text-gray-500 mt-2">Ingrese sus credenciales para continuar</p>
        </div>

        <div class="px-8 pt-6">
            <div th:if="${param.error}" class="flex items-center p-4 mb-4 text-sm text-red-800 border border-red-300 rounded-lg bg-red-50" role="alert">
                <i class="fas fa-exclamation-circle mr-2"></i>
                <div>
                    <span class="font-bold">Error:</span> Usuario o contraseña incorrectos.
                </div>
            </div>

            <div th:if="${param.logout}" class="flex items-center p-4 mb-4 text-sm text-green-800 border border-green-300 rounded-lg bg-green-50" role="alert">
                <i class="fas fa-check-circle mr-2"></i>
                <div>Has cerrado sesión correctamente.</div>
            </div>
        </div>

        <form th:action="@{/login}" method="post" class="p-8 pt-2">
            
            <div class="mb-5">
                <label for="username" class="block mb-2 text-sm font-bold text-gob-gris">Usuario</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                        <i class="fas fa-user text-gray-400"></i>
                    </div>
                    <input type="text" id="username" name="username" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-gob-oro focus:border-gob-oro block w-full pl-10 p-2.5" placeholder="nombre.apellido" required autofocus>
                </div>
            </div>

            <div class="mb-6">
                <label for="password" class="block mb-2 text-sm font-bold text-gob-gris">Contraseña</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                        <i class="fas fa-lock text-gray-400"></i>
                    </div>
                    <input type="password" id="password" name="password" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-gob-oro focus:border-gob-oro block w-full pl-10 p-2.5" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="w-full text-white bg-gob-guinda hover:bg-gob-guindaDark focus:ring-4 focus:outline-none focus:ring-gob-guinda/30 font-bold rounded-lg text-sm px-5 py-3 text-center transition-colors shadow-md">
                Iniciar Sesión
            </button>
            
            <div class="mt-6 text-center">
                <a href="#" class="text-sm text-gob-oro hover:text-yellow-700 hover:underline">¿Olvidaste tu contraseña?</a>
            </div>
        </form>
        
        <div class="bg-gray-50 px-8 py-4 border-t border-gray-100 text-center">
            <p class="text-xs text-gray-400">&copy; 2025 Gobierno de México. Todos los derechos reservados.</p>
        </div>
    </div>

</body>
</html>
