<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/transitions.css}" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vincular cuenta Microsoft | SIAJ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center px-6">
    <main class="w-full max-w-lg rounded-xl border border-gray-200 bg-white p-8 text-center shadow-lg">
        <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-gray-100 text-[#691228]">
            <i class="fab fa-microsoft text-3xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-[#4e0c1d]">Vincular cuenta Microsoft</h1>
        <p class="mt-4 text-gray-700">Se encontró una cuenta SIAJ asociada a este correo.</p>
        <p class="mt-2 break-all font-bold text-gray-900" th:text="${correoMicrosoft}">usuario@institucion.gob.mx</p>
        <p class="mt-4 text-gray-700">
            ¿Desea vincular su cuenta Microsoft para utilizar este método de acceso en el futuro?
        </p>
        <form th:action="@{/auth/microsoft/vincular-confirmacion}" method="post"
              class="mt-7 grid grid-cols-1 gap-3 sm:grid-cols-2">
            <button type="submit" name="vincular" value="false"
                    class="rounded-lg border border-[#691228] px-4 py-3 text-sm font-bold text-[#691228] hover:bg-red-50">
                Cancelar
            </button>
            <button type="submit" name="vincular" value="true"
                    class="flex items-center justify-center gap-2 rounded-lg bg-[#691228] px-4 py-3 text-sm font-bold text-white hover:bg-[#4e0c1d]">
                <i class="fas fa-link"></i> Vincular
            </button>
        </form>
    </main>
</body>
</html>
