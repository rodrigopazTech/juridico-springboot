<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>Gestión de Términos - Agenda Legal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/js/tailwind.config.js}"></script>
    <script th:src="@{/lib/sweetalert2.all.min.js}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        .table-responsive {
            overflow-x: visible;
        }

        /* Asegura que los modales estén por encima de todo */
        .z-50 {
            z-index: 50;
        }
    </style>
</head>

<body class="bg-gray-100 text-gray-800 font-sans">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="p-4 sm:ml-64">

        <div class="mb-6">
            <h1 class="text-3xl font-bold text-gob-guinda font-headings">
                <i class="fas fa-hourglass-end text-gob-oro mr-2"></i> Gestión de Términos
            </h1>
            <hr class="h-1 w-20 bg-gob-oro border-0 mt-2 mb-4" />
        </div>

        <!-- Tarjetas de KPIs (Nuevo) -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="bg-white p-4 rounded shadow border-l-4 border-gob-guinda flex items-center">
                <div class="p-3 bg-red-100 rounded-full mr-4">
                    <i class="fas fa-list-check text-gob-guinda"></i>
                </div>
                <div>
                    <p class="text-xs uppercase text-gray-500 font-bold">Total</p>
                    <h3 class="text-2xl font-bold" th:text="${totalTerminos}">0</h3>
                </div>
            </div>
            <div class="bg-white p-4 rounded shadow border-l-4 border-blue-500 flex items-center">
                <div class="p-3 bg-blue-100 rounded-full mr-4">
                    <i class="fas fa-clock text-blue-500"></i>
                </div>
                <div>
                    <p class="text-xs uppercase text-gray-500 font-bold">En Proceso</p>
                    <h3 class="text-2xl font-bold" th:text="${kpiEnProceso}">0</h3>
                </div>
            </div>
            <div class="bg-white p-4 rounded shadow border-l-4 border-gob-oro flex items-center">
                <div class="p-3 bg-yellow-100 rounded-full mr-4">
                    <i class="fas fa-file-export text-gob-oro"></i>
                </div>
                <div>
                    <p class="text-xs uppercase text-gray-500 font-bold">Liberados</p>
                    <h3 class="text-2xl font-bold" th:text="${kpiLiberados}">0</h3>
                </div>
            </div>
            <div class="bg-white p-4 rounded shadow border-l-4 border-green-600 flex items-center">
                <div class="p-3 bg-green-100 rounded-full mr-4">
                    <i class="fas fa-check-double text-green-600"></i>
                </div>
                <div>
                    <p class="text-xs uppercase text-gray-500 font-bold">Completados</p>
                    <h3 class="text-2xl font-bold" th:text="${kpiCompletados}">0</h3>
                </div>
            </div>
        </div>

        <div th:replace="~{fragments/terminos/barra-busqueda :: barra}"></div>
        <div th:replace="~{fragments/terminos/barra-filtros :: filtros}"></div>

        <!-- Línea de Tiempo Global (Nueva Ubicación) -->
        <div th:replace="~{fragments/terminos/linea-tiempo :: linea}"></div>

        <div th:replace="~{fragments/terminos/tabla :: tabla-resultados}"></div>

    </div>

    <div th:replace="~{fragments/terminos/modal-nuevo-termino :: modal}"></div>
    <div th:replace="~{fragments/terminos/modal-subir-acuse :: modal}"></div>
    <div th:replace="~{fragments/terminos/modal-concluir :: modal}"></div>

    <form id="form-upload" th:action="@{/terminos/subir-archivo}" method="post" enctype="multipart/form-data"
        class="hidden">
        <input type="hidden" name="id" id="upload-termino-id">
        <input type="file" name="archivo" id="upload-file-input"
            onchange="document.getElementById('form-upload').submit()">
    </form>
    <script th:src="@{/js/terminos.js(v=4)}"></script>

    <div th:replace="~{fragments/common/notifications :: notificaciones}"></div>
</body>

</html>
