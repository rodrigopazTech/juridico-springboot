<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Catálogos - Configuración</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/js/tailwind.config.js}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Noto+Sans:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body class="bg-gray-100 text-gray-800 font-sans">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="p-4 sm:ml-64">
        <div class="flex flex-col md:flex-row md:items-center justify-between mb-6 border-b pb-4">
            <div>
                <h1 class="text-3xl font-bold text-gob-guinda font-headings uppercase tracking-tight">
                    <span th:text="${titulo}">Lista</span>
                </h1>
                <hr class="h-1 w-20 bg-gob-oro border-0 mt-2 mb-2" />
                <a th:href="@{/configuracion}"
                    class="text-sm text-gob-oro hover:text-gob-guinda font-medium transition-colors">
                    <i class="fas fa-arrow-left mr-1"></i> Volver a Configuración
                </a>
            </div>
            <div class="mt-4 md:mt-0">
                <a th:href="@{'/configuracion/catalogos/' + ${tipo} + '/crear'}"
                    class="bg-gob-guinda text-white px-4 py-2 rounded hover:bg-gob-guindaDark shadow-sm font-medium text-sm uppercase tracking-wider transition-colors">
                    <i class="fas fa-plus mr-2"></i> Nuevo Registro
                </a>
            </div>
        </div>

        <!-- Alertas -->
        <div th:if="${success}" class="bg-green-100 border-l-4 border-green-500 text-green-700 p-4 mb-4" role="alert">
            <p th:text="${success}"></p>
        </div>

        <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full leading-normal">
                    <thead>
                        <tr>
                            <th
                                class="px-5 py-3 border-b-2 border-gray-200 bg-gray-50 text-left text-xs font-bold text-gob-guinda uppercase tracking-wider font-headings">
                                ID
                            </th>
                            <th
                                class="px-5 py-3 border-b-2 border-gray-200 bg-gray-50 text-left text-xs font-bold text-gob-guinda uppercase tracking-wider font-headings">
                                Nombre
                            </th>
                            <th th:if="${tipo == 'materias'}"
                                class="px-5 py-3 border-b-2 border-gray-200 bg-gray-50 text-left text-xs font-bold text-gob-guinda uppercase tracking-wider font-headings">
                                Gerencia
                            </th>
                            <th th:if="${tipo == 'organos'}"
                                class="px-5 py-3 border-b-2 border-gray-200 bg-gray-50 text-left text-xs font-bold text-gob-guinda uppercase tracking-wider font-headings">
                                Tipo
                            </th>
                            <th
                                class="px-5 py-3 border-b-2 border-gray-200 bg-gray-50 text-left text-xs font-bold text-gob-guinda uppercase tracking-wider font-headings">
                                Estatus
                            </th>
                            <th
                                class="px-5 py-3 border-b-2 border-gray-200 bg-gray-50 text-left text-xs font-bold text-gob-guinda uppercase tracking-wider font-headings">
                                Acciones
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${lista}">
                            <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
                                <span class="text-gray-900 whitespace-no-wrap font-mono" th:text="${item.id}">1</span>
                            </td>
                            <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
                                <p class="text-gray-900 whitespace-no-wrap font-semibold" th:text="${item.nombre}">
                                    Nombre</p>
                            </td>

                            <!-- Campos específicos -->
                            <td th:if="${tipo == 'materias'}"
                                class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
                                <span class="text-gray-900"
                                    th:text="${item.gerencia != null ? item.gerencia.nombre : '-'}">Gerencia</span>
                            </td>
                            <td th:if="${tipo == 'organos'}"
                                class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
                                <span class="text-gray-900" th:text="${item.tipo}">Tipo</span>
                            </td>

                            <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
                                <span th:if="${item.activo}"
                                    class="relative inline-block px-3 py-1 font-semibold text-green-900 leading-tight">
                                    <span aria-hidden="true"
                                        class="absolute inset-0 bg-green-200 opacity-50 rounded-full"></span>
                                    <span class="relative">Activo</span>
                                </span>
                                <span th:unless="${item.activo}"
                                    class="relative inline-block px-3 py-1 font-semibold text-red-900 leading-tight">
                                    <span aria-hidden="true"
                                        class="absolute inset-0 bg-red-200 opacity-50 rounded-full"></span>
                                    <span class="relative">Inactivo</span>
                                </span>
                            </td>
                            <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
                                <a th:href="@{'/configuracion/catalogos/' + ${tipo} + '/editar/' + ${item.id}}"
                                    class="text-gob-oro hover:text-gob-guinda mr-3 font-medium transition-colors">
                                    <i class="fas fa-edit"></i> Editar
                                </a>
                                <button th:if="${tipo == 'gerencias'}"
                                    th:onclick="verMaterias([[${item.id}]], [[${item.nombre}]])"
                                    class="text-gob-verde hover:text-gob-verdeDark font-medium transition-colors">
                                    <i class="fas fa-list"></i> Materias
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:if="${tipo == 'gerencias'}" th:replace="~{fragments/configuracion/modal-materias :: modal}"></div>
    <script th:src="@{/js/configuracion.js}"></script>

</body>

</html>
