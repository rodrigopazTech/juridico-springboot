spring.application.name=sistema-juridico

# Configuración de Base de Datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/sistema_juridico_db
spring.datasource.username=juridico_user
spring.datasource.password=juridico_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Configuración de Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html

# Configuración de servidor
server.port=8080
server.servlet.context-path=/

# Logging
logging.level.com.juridico.sistema_juridico=DEBUG
logging.level.org.springframework.security=DEBUG
