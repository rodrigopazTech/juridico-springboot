spring.application.name=sistema-juridico
spring.config.import=optional:file:./config/siaj-mail.properties,optional:file:./config/siaj-microsoft.properties

# Configuración de Base de Datos PostgreSQL 

spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT_EXT:5433}/${DB_NAME:sistema_juridico}?sslmode=disable
spring.datasource.username=${SIAJ_DB_USER:${DB_USER:agendajuridicodbdev}}
spring.datasource.password=${SIAJ_DB_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Migraciones Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# Configuración del Pool HikariCP para Alta Concurrencia
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# Configuración de Thymeleaf (Cache activada para producción)
spring.thymeleaf.cache=true
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html

# Configuración de servidor
server.port=8080
server.forward-headers-strategy=FRAMEWORK
server.servlet.context-path=/
server.servlet.session.timeout=30m
app.server.nio2=${APP_SERVER_NIO2:false}


# Configuración SSL/HTTPS (Puerto 8080) - Comentado: usando ngrok como túnel HTTPS
# server.ssl.key-store=classpath:keystore.p12
# server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:}
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=tomcat


# Logging
logging.level.com.juridico.sistema_juridico=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate=WARN


# Usa una clave larga y segura de al menos 64 caracteres
app.jwt.secret=${JWT_SECRET:}
# Expiración: 3600000 ms = 1 hora
app.jwt.expiration=3600000
# 604800000 ms = 7 días
app.jwt.refreshExpiration=604800000

# Configuración de archivos
spring.servlet.multipart.max-file-size=1300MB
spring.servlet.multipart.max-request-size=1320MB
spring.servlet.multipart.enabled=true
server.tomcat.max-swallow-size=-1

# Directorio de almacenamiento de documentos
app.upload.dir=uploads

migration.api.key=${MIGRATION_API_KEY:}
app.seed.enabled=false

# Alta controlada para una base nueva. Se habilita una sola vez durante el despliegue
# mediante SIAJ_BOOTSTRAP_ENABLED=true; nunca debe quedar activa posteriormente.
app.bootstrap.production.enabled=${SIAJ_BOOTSTRAP_ENABLED:false}
app.bootstrap.production.admin-temp-password=${SIAJ_BOOTSTRAP_ADMIN_TEMP_PASSWORD:}

# Configuración Web Push VAPID
app.webpush.public-key=${VAPID_PUBLIC_KEY:}
app.webpush.private-key=${VAPID_PRIVATE_KEY:}
app.webpush.subject=${VAPID_SUBJECT:mailto:siaj@finabien.gob.mx}

# Recuperacion de contrasena por correo
app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}
app.password-reset.base-url=${PASSWORD_RESET_BASE_URL:http://localhost:8080}
app.password-reset.rate-limit.user-max-requests=${PASSWORD_RESET_USER_MAX_REQUESTS:5}
app.password-reset.rate-limit.user-window-minutes=${PASSWORD_RESET_USER_WINDOW_MINUTES:60}
app.password-reset.rate-limit.ip-max-requests=${PASSWORD_RESET_IP_MAX_REQUESTS:10}
app.password-reset.rate-limit.ip-window-minutes=${PASSWORD_RESET_IP_WINDOW_MINUTES:60}
app.password-reset.cleanup.cron=${PASSWORD_RESET_CLEANUP_CRON:0 0/30 * * * *}

app.email.from=${APP_EMAIL_FROM:siaj@finabien.gob.mx}
app.email.app-name=${APP_EMAIL_APP_NAME:SIAJ}
app.email.maintenance=${APP_EMAIL_MAINTENANCE:false}
app.email.maintenance-message=${APP_EMAIL_MAINTENANCE_MESSAGE:El servicio de correo esta en mantenimiento. Por ahora no es posible enviar enlaces de recuperacion, activacion o recordatorio de usuario. Si no puedes entrar, solicita apoyo al administrador.}
app.email.credential-encryption-key=${MAIL_CREDENTIAL_ENCRYPTION_KEY:}
app.email.dynamic.refresh-ms=${MAIL_DYNAMIC_REFRESH_MS:10000}
app.users.report-missing-email=${REPORT_USERS_WITHOUT_EMAIL:true}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_READ_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:10000}

# SMTP OAuth2 suspendido temporalmente. El envio activo usa JavaMail y las
# credenciales tradicionales spring.mail.* mientras el entorno lo permita.
app.email.oauth2.enabled=${MAIL_OAUTH2_ENABLED:false}
app.email.oauth2.tenant-id=${MAIL_OAUTH2_TENANT_ID:${MICROSOFT_TENANT_ID:}}
app.email.oauth2.client-id=${MAIL_OAUTH2_CLIENT_ID:${MICROSOFT_CLIENT_ID:}}
app.email.oauth2.client-secret=${MAIL_OAUTH2_CLIENT_SECRET:${MICROSOFT_CLIENT_SECRET:}}
app.email.oauth2.token-uri=${MAIL_OAUTH2_TOKEN_URI:https://login.microsoftonline.com/{tenant}/oauth2/v2.0/token}
app.email.oauth2.scope=${MAIL_OAUTH2_SCOPE:https://outlook.office365.com/.default}

# Microsoft Entra ID / Graph - inicio de sesion secundario
app.microsoft.enabled=${MICROSOFT_LOGIN_ENABLED:false}
app.microsoft.ui-visible=${MICROSOFT_LOGIN_UI_VISIBLE:false}
app.microsoft.base-uri=${MICROSOFT_BASE_URI:https://login.microsoftonline.com}
app.microsoft.tenant-id=${MICROSOFT_TENANT_ID:}
app.microsoft.client-id=${MICROSOFT_CLIENT_ID:}
app.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:}
app.microsoft.redirect-uri=${MICROSOFT_REDIRECT_URI:http://localhost:8080/auth/microsoft/callback}
app.microsoft.scopes[0]=openid
app.microsoft.scopes[1]=profile
app.microsoft.scopes[2]=email
app.microsoft.scopes[3]=https://graph.microsoft.com/User.Read
