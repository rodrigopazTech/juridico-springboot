spring.application.name=sistema-juridico

# Configuración de Base de Datos PostgreSQL 

spring.datasource.url=jdbc:postgresql://localhost:5432/sistema_juridico
spring.datasource.username=villalobos_admin
spring.datasource.password=password123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Configuración de Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html

# Configuración de servidor
server.port=8080
server.servlet.context-path=/

# Logging
logging.level.com.juridico.sistema_juridico=DEBUG
logging.level.org.springframework.security=DEBUG


# Usa una clave larga y segura de al menos 64 caracteres
app.jwt.secret=FraseSuperSecretaYUltraLargaParaElSistemaJuridico2026ConMasDe64CaracteresDeLongitud
# Expiración: 3600000 ms = 1 hora
app.jwt.expiration=3600000

# 604800000 ms = 7 días
app.jwt.refreshExpiration=604800000