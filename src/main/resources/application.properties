spring.application.name=sistema-juridico

# Configuración de Base de Datos PostgreSQL 

spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT_EXT:5433}/${DB_NAME:sistema_juridico}
spring.datasource.username=${DB_USER:villalobos_admin}
spring.datasource.password=${DB_PASSWORD:password123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Configuración de Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html

# Configuración de servidor
server.port=8080
server.servlet.context-path=/
server.servlet.session.timeout=30m


# Configuración SSL/HTTPS (Puerto 8080) - Comentado: usando ngrok como túnel HTTPS
# server.ssl.key-store=classpath:keystore.p12
# server.ssl.key-store-password=password123
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=tomcat


# Logging
logging.level.com.juridico.sistema_juridico=DEBUG
logging.level.org.springframework.security=DEBUG


# Usa una clave larga y segura de al menos 64 caracteres
app.jwt.secret=${JWT_SECRET:FraseSuperSecretaYUltraLargaParaElSistemaJuridico2026ConMasDe64CaracteresDeLongitud}
# Expiración: 3600000 ms = 1 hora
app.jwt.expiration=3600000

# 604800000 ms = 7 días
app.jwt.refreshExpiration=604800000

# Configuración de archivos
spring.servlet.multipart.max-file-size=1300MB
spring.servlet.multipart.max-request-size=1320MB
spring.servlet.multipart.enabled=true
server.tomcat.max-swallow-size=-1

# Directorio de almacenamiento de documentos
app.upload.dir=uploads

migration.api.key=${MIGRATION_API_KEY:n8nAgendaLegalF1N4813NGDSA6D54}
app.seed.enabled=false

