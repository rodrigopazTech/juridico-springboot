spring.application.name=sistema-juridico
spring.config.import=optional:file:./config/siaj-mail.properties,optional:file:./config/siaj-microsoft.properties

# Configuración de Base de Datos PostgreSQL 

spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT_EXT:5433}/${DB_NAME:sistema_juridico}?sslmode=disable
spring.datasource.username=${DB_USER:villalobos_admin}
spring.datasource.password=${DB_PASSWORD:password123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Configuración de Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html

# Configuración de servidor
server.port=8080
server.forward-headers-strategy=FRAMEWORK
server.servlet.context-path=/
server.servlet.session.timeout=30m


# Configuración SSL/HTTPS (Puerto 8080) - Comentado: usando ngrok como túnel HTTPS
# server.ssl.key-store=classpath:keystore.p12
# server.ssl.key-store-password=password123
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=tomcat


# Logging
logging.level.com.juridico.sistema_juridico=DEBUG
logging.level.org.springframework.security=DEBUG


# Usa una clave larga y segura de al menos 64 caracteres
app.jwt.secret=${JWT_SECRET:FraseSuperSecretaYUltraLargaParaElSistemaJuridico2026ConMasDe64CaracteresDeLongitud}
# Expiración: 3600000 ms = 1 hora
app.jwt.expiration=3600000

# 604800000 ms = 7 días
app.jwt.refreshExpiration=604800000

# Configuración de archivos
spring.servlet.multipart.max-file-size=1300MB
spring.servlet.multipart.max-request-size=1320MB
spring.servlet.multipart.enabled=true
server.tomcat.max-swallow-size=-1

# Directorio de almacenamiento de documentos
app.upload.dir=uploads

migration.api.key=${MIGRATION_API_KEY:n8nAgendaLegalF1N4813NGDSA6D54}
app.seed.enabled=false

# Configuración Web Push VAPID
app.webpush.public-key=${VAPID_PUBLIC_KEY:BI64zp-EABSMNx2692_GNdP70TZVVRe8Q3iL2WJYGUQvezDBJwEDjLr310TWyNcktaCqTxNYXwXbsAMJ2PGH-KU}
app.webpush.private-key=${VAPID_PRIVATE_KEY:iDttC07TJ2wq677fomN3FIGvpqwDorDM1hLafCxrdxM}
app.webpush.subject=${VAPID_SUBJECT:mailto:siaj@finabien.gob.mx}

# Recuperacion de contrasena por correo
app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}
app.password-reset.base-url=${PASSWORD_RESET_BASE_URL:http://localhost:8080}
app.password-reset.rate-limit.user-max-requests=${PASSWORD_RESET_USER_MAX_REQUESTS:5}
app.password-reset.rate-limit.user-window-minutes=${PASSWORD_RESET_USER_WINDOW_MINUTES:60}
app.password-reset.rate-limit.ip-max-requests=${PASSWORD_RESET_IP_MAX_REQUESTS:10}
app.password-reset.rate-limit.ip-window-minutes=${PASSWORD_RESET_IP_WINDOW_MINUTES:60}
app.password-reset.cleanup.cron=${PASSWORD_RESET_CLEANUP_CRON:0 0/30 * * * *}

app.email.from=${APP_EMAIL_FROM:siaj@finabien.gob.mx}
app.email.app-name=${APP_EMAIL_APP_NAME:SIAJ}
app.email.maintenance=${APP_EMAIL_MAINTENANCE:false}
app.email.maintenance-message=${APP_EMAIL_MAINTENANCE_MESSAGE:El servicio de correo esta en mantenimiento. Por ahora no es posible enviar enlaces de recuperacion, activacion o recordatorio de usuario. Si no puedes entrar, solicita apoyo al administrador.}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# Microsoft Entra ID / Graph - inicio de sesion secundario
app.microsoft.enabled=${MICROSOFT_LOGIN_ENABLED:false}
app.microsoft.base-uri=${MICROSOFT_BASE_URI:https://login.microsoftonline.com}
app.microsoft.tenant-id=${MICROSOFT_TENANT_ID:}
app.microsoft.client-id=${MICROSOFT_CLIENT_ID:}
app.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:}
app.microsoft.redirect-uri=${MICROSOFT_REDIRECT_URI:http://localhost:8080/auth/microsoft/callback}
app.microsoft.calendar-redirect-uri=${MICROSOFT_CALENDAR_REDIRECT_URI:http://localhost:8080/perfil/outlook/callback}
app.microsoft.token-encryption-secret=${MICROSOFT_TOKEN_ENCRYPTION_SECRET:}
app.microsoft.scopes[0]=openid
app.microsoft.scopes[1]=profile
app.microsoft.scopes[2]=email
app.microsoft.scopes[3]=https://graph.microsoft.com/User.Read
app.microsoft.calendar-scopes[0]=offline_access
app.microsoft.calendar-scopes[1]=https://graph.microsoft.com/Calendars.ReadWrite
