<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Sistema Jurídico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'gob-guinda': '#621132',
                        'gob-guinda-claro': '#95224e',
                        'gob-oro': '#D4C19C',
                        'gob-verde': '#10312B',
                        'gob-gris': '#F6F6F6'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gob-gris flex items-center justify-center h-screen font-sans">

    <div class="fixed top-0 w-full h-1 bg-gob-oro z-50"></div>

    <div class="bg-white p-10 rounded-lg shadow-xl w-full max-w-md border-t-4 border-gob-guinda">
        
        <div class="text-center mb-8">
            <div class="mb-4">
                <i class="fas fa-balance-scale text-gob-guinda text-5xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-gob-verde uppercase tracking-wider">Sistema Jurídico</h2>
            <div class="w-16 h-1 bg-gob-oro mx-auto mt-2"></div>
        </div>
        
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-6">
            <div>
                <label class="block text-gob-verde text-sm font-bold mb-2 uppercase" for="email">
                    Correo Institucional
                </label>
                <input class="w-full py-2.5 px-4 bg-white border-b-2 border-gray-300 focus:outline-none focus:border-gob-guinda transition duration-300 text-gray-700" 
                       id="email" type="email" placeholder="usuario@gob.mx" required>
            </div>

            <div>
                <label class="block text-gob-verde text-sm font-bold mb-2 uppercase" for="password">
                    Contraseña
                </label>
                <input class="w-full py-2.5 px-4 bg-white border-b-2 border-gray-300 focus:outline-none focus:border-gob-guinda transition duration-300 text-gray-700" 
                       id="password" type="password" placeholder="••••••••••••" required>
            </div>

            <button class="w-full bg-gob-guinda hover:bg-gob-guinda-claro text-white font-bold py-3 px-4 rounded shadow-md hover:shadow-lg transition duration-300 uppercase tracking-widest text-sm" 
                    type="submit">
                Entrar al Sistema
            </button>
            
            <div id="loading" class="hidden flex justify-center py-2">
                <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-gob-guinda"></div>
            </div>

            <p id="errorMessage" class="text-red-700 text-xs font-bold text-center hidden p-3 bg-red-50 border border-red-200 rounded"></p>
        </form>

        <div class="mt-10 text-center border-t border-gray-100 pt-6">
            <p class="text-[10px] text-gray-400 uppercase leading-tight">
                Secretaría de Desarrollo Jurídico<br>Gobierno de México
            </p>
        </div>
    </div>

    <script>
        // Lógica de handleLogin (se mantiene igual, solo cambia el estilo visual)
        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');
            const loader = document.getElementById('loading');

            errorMsg.classList.add('hidden');
            loader.classList.remove('hidden');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: email, password: password })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('jwt_token', data.accessToken || data.token);
                    window.location.href = 'dashboard/dashboard.html';
                } else {
                    errorMsg.innerText = "ACCESO DENEGADO: Credenciales incorrectas";
                    errorMsg.classList.remove('hidden');
                }
            } catch (error) {
                errorMsg.innerText = "ERROR: No hay conexión con el servidor";
                errorMsg.classList.remove('hidden');
            } finally {
                loader.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
