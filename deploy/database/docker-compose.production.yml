services:
  postgres:
    image: docker.io/postgres:15-alpine
    container_name: juridico-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER requerido}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD requerido}
      POSTGRES_DB: ${POSTGRES_DB_NAME:-siaj}
      PGDATA: /var/lib/postgresql/data/pgdata
      SIAJ_DB_USER: ${SIAJ_DB_USER:?SIAJ_DB_USER requerido}
      SIAJ_DB_PASSWORD: ${SIAJ_DB_PASSWORD:?SIAJ_DB_PASSWORD requerido}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data:Z
      - ./backups:/backups:Z
      - ./init/00-create-siaj-db-user.sh:/docker-entrypoint-initdb.d/00-create-siaj-db-user.sh:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  pgadmin:
    image: docker.io/dpage/pgadmin4:latest
    container_name: juridico-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?PGADMIN_EMAIL requerido}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD requerido}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - ./pgadmin-data:/var/lib/pgadmin:Z
    depends_on:
      postgres:
        condition: service_healthy
