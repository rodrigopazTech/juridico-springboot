server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name siaj.finabien siaj.finabien.gob.mx;

    # ==========================================================================
    # Rutas de Certificados SSL/TLS Institucionales (STIC FINABIEN)
    # ==========================================================================
    ssl_certificate /etc/pki/tls/certs/siaj-cert.pem;
    ssl_certificate_key /etc/pki/tls/private/siaj.key;

    # Protocolos y Cifrados Seguros (Perfil Moderno Mozilla TLS 1.2 y 1.3)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # Optimizacion de Sesiones TLS
    ssl_session_cache shared:SIAJ_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Cabeceras de Seguridad HTTP (Security Hardening)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Limite maximo de carga (archivos, acuerdos y anexos SIAJ)
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Cabeceras de proxy inverso
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        # Soporte WebSocket para notificaciones en tiempo real
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts de proxy
        proxy_connect_timeout 60s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
