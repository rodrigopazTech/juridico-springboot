# Copia este archivo como config/siaj-microsoft.properties para configurar Microsoft Entra ID.
# Importante: no subir client-secret ni token-encryption-secret reales al repositorio.

MICROSOFT_LOGIN_ENABLED=true
MICROSOFT_BASE_URI=https://login.microsoftonline.com
MICROSOFT_TENANT_ID=
MICROSOFT_CLIENT_ID=
MICROSOFT_CLIENT_SECRET=
MICROSOFT_REDIRECT_URI=http://localhost:8080/auth/microsoft/callback
MICROSOFT_CALENDAR_REDIRECT_URI=http://localhost:8080/perfil/outlook/callback
MICROSOFT_TOKEN_ENCRYPTION_SECRET=CAMBIAR_POR_SECRETO_LARGO_DE_AL_MENOS_16_CARACTERES
